<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2; --soft:#F1F6FF;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707; --hero1:#FF7BAC; --hero2:#E5487F; --heroS:#A82A58;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --ord:"Andika","Baloo 2",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 var(--heroS);margin:6px 0 16px}
.hero svg{flex:none;width:130px;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.hero h1{margin:0;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05}
.hero p{margin:6px 0 0;font-weight:600;opacity:.95}
.niv{display:grid;gap:10px}
.niv button{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.niv button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.niv .nr{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:#fff}
.niv b{display:block;font-size:1.12rem;line-height:1.15}
.niv small{display:block;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.25}
.niv .st{margin-left:auto;flex:none;color:var(--gold);font-size:1.15rem;letter-spacing:1px}
.niv .st .off{color:var(--line)}
.info{color:var(--muted);font-size:.9rem;margin:14px 2px 0}
.topp{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.f{background:var(--bad)}.dots i.nu{background:var(--gold)}
.niva-t{font-weight:800;color:var(--muted);font-size:.9rem}
.pet{flex:none;width:48px;height:52px;pointer-events:none}.pet svg{width:100%;height:100%}
.pet.hopp{animation:hopp .55s ease}
@keyframes hopp{40%{transform:translateY(-18px)}}
.kort{background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:16px}
.fb{text-align:center;font-weight:700;margin:12px 0 0;min-height:2.6em;font-size:1.05rem}
.fb.ratt{color:var(--good-dark)}.fb.fel{color:#B4232A}
.knapp{display:inline-block;background:var(--good);color:#fff;border-radius:16px;padding:12px 26px;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 var(--good-dark);margin:6px}
.knapp.vit{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.knapp.bla{background:var(--accent);box-shadow:0 5px 0 #2A3FB8}
.knapp:disabled{opacity:.4;pointer-events:none}
.knapp:active{transform:translateY(3px)}
.lyssna{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem;box-shadow:0 2px 0 var(--line)}
.res{text-align:center}
.res .stj{font-size:3rem;letter-spacing:6px;color:var(--gold);margin:8px 0}
.res .stj .off{color:var(--line)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:420px){.hero svg{width:96px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.steg{display:flex;gap:8px;justify-content:center;margin:2px 0 10px}
.steg i{font-style:normal;font-weight:800;font-size:.85rem;padding:3px 12px;border-radius:999px;background:var(--line);color:var(--muted)}
.steg i.nu{background:var(--accent);color:#fff}.steg i.klar{background:var(--good);color:#fff}
.rubr{text-align:center;font-weight:800;font-size:1.35rem;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.grid button{display:grid;justify-items:center;gap:2px;background:var(--card);border-radius:18px;padding:10px 6px 8px;box-shadow:0 4px 0 var(--line);font-weight:800;color:var(--ink)}
.grid button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.grid button img{width:72px;height:72px;object-fit:contain}
.grid button .bgk{width:100%;height:70px;border-radius:12px;object-fit:cover;object-position:bottom;background:linear-gradient(#9AD7FF,#E4F4FF);mix-blend-mode:normal}
.grid.pl{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.tm{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.grid button.tema{padding:0;overflow:hidden;text-align:center;gap:0}
.tema .tb{position:relative;display:block;width:100%;height:112px;background-size:cover;background-position:bottom;background-color:#9AD7FF}
.tema .tb img{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);height:92px;width:auto;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.tema b{font-size:1.15rem;margin-top:8px}.tema small{color:var(--muted);font-weight:700;font-size:.85rem;padding:2px 10px 10px;line-height:1.3}
.grid button .bgk.ny{height:70px}
.guide{text-align:center;color:var(--muted);font-weight:700;font-size:.95rem;margin:2px 4px 8px;line-height:1.35}
.insp{margin-top:12px;background:#FFF8DC;border:3px solid var(--gold);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--gold)}
.insp .iq{font-weight:800;line-height:1.4}.insp .iq b{color:#8A6A00;margin-right:6px}
.insp .ord{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.insp .ord button,.insp .ord span{background:#fff;border:2px solid var(--gold);border-radius:999px;padding:3px 12px;font-weight:700;font-family:var(--ord);font-size:.95rem;color:var(--ink)}
.insp .ord span{border-style:dashed;background:transparent}
.insp .ordt{font-size:.8rem;font-weight:800;color:#8A6A00;margin-top:8px}
.insp .ir{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.insp .mini{background:var(--card);border:2px solid var(--gold);border-radius:999px;padding:4px 14px;font-weight:800;font-size:.9rem;color:var(--ink)}
.insp .idea{margin-top:8px;background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;border:2px dashed var(--gold);line-height:1.4}

/* scenen */
.scen{position:relative;aspect-ratio:3/2;border-radius:22px;overflow:hidden;box-shadow:0 4px 0 var(--line);background:linear-gradient(#8FD0FF,#DDF1FF 70%)}
.scen .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:bottom;mix-blend-mode:multiply}
.scen .bgimg.ny{mix-blend-mode:normal}
.scen .sp{position:absolute;bottom:12%;height:calc(var(--h,36) * var(--k,1) * 1%);width:auto;max-width:44%;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18));animation:sPop .5s ease-out both}
.scen .hjalte{left:10%}.scen .ev{right:9%;left:auto}
.scen.s1 .hjalte{left:34%;--k:1.1}
.scen.s2 .hjalte{left:9%}.scen.s2 .ev{right:8%;animation-delay:.25s}
.scen.s3 .hjalte{left:18%;--k:1.15}.scen.s3 .ev{right:12%;--k:.9;animation-delay:.1s}
.scen.s4 .hjalte{left:24%;--k:1.1}.scen.s4 .ev{right:14%;--k:.9}
.scen .dek{position:absolute;width:11%;aspect-ratio:1;object-fit:contain;animation:flyt 2.6s ease-in-out infinite}
.scen .sky{position:absolute;top:8%;width:9%}
@keyframes sPop{from{transform:scale(.4) translateY(14px);opacity:0}}
@keyframes flyt{50%{transform:translateY(-8px)}}
.sida{font-weight:800;color:var(--muted);text-align:center;margin:10px 0 6px}
.hittills{font-family:var(--ord);font-size:1.05rem;line-height:1.55;background:var(--soft);border-radius:16px;padding:10px 14px;margin:10px 0;color:var(--ink)}
.hittills:empty{display:none}
.alt{display:grid;gap:8px;margin-top:10px}
.alt button{font-family:var(--ord);font-size:1.12rem;font-weight:700;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 var(--line);color:var(--ink);line-height:1.4}
.alt button.v{background:#E3EAFF;border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.alt button.skriv{background:#FFF8DC;border-color:var(--gold);box-shadow:0 4px 0 var(--gold)}
.skrivruta{margin-top:10px}
.skrivruta textarea{width:100%;min-height:96px;font-family:var(--ord);font-size:1.2rem;font-weight:700;border:3px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--card);color:var(--ink);resize:vertical;line-height:1.45}
.skrivruta textarea:focus{border-color:var(--accent);outline:none}
.start{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.start button{background:#FFF8DC;border:2px solid var(--gold);border-radius:999px;padding:4px 14px;font-weight:700;font-family:var(--ord);font-size:.95rem}
.nav{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.nav .knapp{margin:0}
.bok{display:grid;gap:14px}
.bok h2{margin:2px 0 0;text-align:center;font-size:1.6rem}
.bok .sidk{background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:10px 10px 14px}
.bok .sidk .scen{box-shadow:none}
.bok .sidk .saga{margin:12px 8px 4px}.bok .sidk p{font-family:var(--ord);font-size:1.45rem;font-weight:700;line-height:1.65;margin:0 0 .5em}
.rubin{display:block;font-weight:800;color:var(--muted);margin:0 0 10px}.rubin input{display:block;width:100%;margin-top:4px;font:inherit;font-family:var(--ord);font-size:1.2rem;color:var(--ink);padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:#fff}
.mina{display:grid;gap:10px}
.mina .m{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:10px 12px;text-align:left;width:100%}
.mina .m .scen{flex:none;width:96px;border-radius:12px;box-shadow:none}
.mina .m b{display:block;font-size:1.05rem;line-height:1.2}.mina .m small{color:var(--muted);font-weight:600}
.mina .m .x{margin-left:auto;font-size:1.1rem;padding:6px}
.stjtoast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 22px;font-weight:800;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:sPop .4s both}
@media print{@page{margin:14mm}.bok h2{font-size:26pt}.bok .sidk{box-shadow:none;padding:0}.bok .sidk p{font-size:17pt;line-height:1.6}.insp,.guide{display:none}body *{visibility:hidden}.bok,.bok *{visibility:visible}.bok{position:absolute;left:0;top:0;width:100%}.nav{display:none}.scen .sp,.scen .dek{animation:none}}


/* Bilder: befintliga färger, knappar och hårda kortskuggor. */
.wrap{max-width:1080px}.story-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
.story-choice{background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:12px;text-align:left}.story-choice:active{transform:translateY(3px);box-shadow:0 1px var(--line)}.story-choice b{display:block;font-size:1.15rem;margin:10px 3px 3px}.story-choice small{display:block;color:var(--muted);margin:0 3px 5px}.story-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.story-strip .picture{border-radius:8px}
.picture{aspect-ratio:4/3;position:relative;overflow:hidden;border-radius:15px;background:#D4E9F2;isolation:isolate}.picture .backdrop{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.picture .figure{position:absolute;object-fit:contain;max-width:55%;filter:drop-shadow(0 3px 1px #22334430)}
.story-pages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0}.story-page{padding:14px;background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--line)}.story-page h2{font-size:1.2rem;margin:0 0 10px}.story-page label{display:block;font-weight:700;margin:12px 0 7px}.story-page textarea{display:block;width:100%;resize:vertical;min-height:160px;padding:12px;border:2px solid var(--line);border-radius:14px;font:1.05rem/1.6 var(--ord);background:var(--soft);color:var(--ink)}.story-page textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.story-top{justify-content:space-between}#saveState{color:var(--muted);font-size:.85rem}.story-title{font-size:1.7rem;margin:16px 0 0}#helpText{padding:14px;background:var(--card);border-radius:14px}
.story-door{position:absolute;left:64%;bottom:17%;width:22%;height:52%;border:7px solid #6B4932;border-radius:50% 50% 3px 3px;background:#8F653F;box-shadow:0 2px 3px #0003}.story-door:after{content:'';position:absolute;right:12%;top:65%;width:12%;aspect-ratio:1;border-radius:50%;background:#F7CE61}.story-door.open{background:#FFF1B4;box-shadow:0 0 25px #FFF0A5}.story-door.open:before{content:'';position:absolute;inset:0;background:#8F653F;transform-origin:left center;transform:scaleX(.3)}
.story-book-page{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);break-inside:avoid}.story-book-page p{white-space:pre-wrap;font:1.05rem/1.7 var(--ord);margin:0}.bok{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 4px 0 var(--line)}.bok h2{margin:0 0 14px}.saved-story{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px;box-shadow:0 4px var(--line);margin-bottom:12px}.saved-story>button:first-child{flex:1;text-align:left;font-weight:700;min-height:48px}.saved-story small{display:block;color:var(--muted)}
@media(max-width:720px){.story-choices,.story-pages{grid-template-columns:1fr}.story-choice{display:grid;grid-template-columns:45% 1fr;gap:12px;align-items:center}.story-choice .story-strip{grid-row:span 2}.story-choice b{margin:0;align-self:end}.story-choice small{align-self:start}.story-page{display:grid;grid-template-columns:36% 1fr;column-gap:12px}.story-page h2{grid-column:1/-1}.story-page .picture{grid-row:span 2}.story-page label{margin-top:0}.story-page textarea{min-height:130px}.story-book-page{grid-template-columns:100px 1fr;gap:12px}.hero svg{width:90px}.bok{padding:16px}}
@media print{.wrap{max-width:none}.bok{box-shadow:none;padding:0}.story-book-page{grid-template-columns:140px 1fr}.story-book-page p{font-size:13pt}.picture{print-color-adjust:exact;-webkit-print-color-adjust:exact}}

.story-art{aspect-ratio:1;background:#E4EAF2}.story-art .story-painting{position:absolute;top:0;width:300%;height:100%;max-width:none;object-fit:fill;pointer-events:none}
.story-cover{display:block}.story-cover .picture{border-radius:14px}.story-choice{padding:12px}.story-choice b{margin-top:13px}.story-choice small{margin-top:6px;line-height:1.4}.story-choices{row-gap:22px}
@media(max-width:720px){.story-choice{grid-template-columns:38% 1fr}.story-cover{grid-row:span 2}.story-choice b{margin-top:0}.story-page{display:block}.story-page .picture{max-width:400px;margin:auto}.story-page label{margin-top:12px}.story-page textarea{min-height:120px}}
@media print{.story-art .story-painting{max-width:none!important}.story-book-page{grid-template-columns:150px 1fr}.story-art{break-inside:avoid}}
.hero-art{width:130px;aspect-ratio:1;position:relative;overflow:hidden;border-radius:17px;flex:none}.hero-art img{height:100%;width:300%;max-width:none;position:absolute;left:0;top:0}@media(max-width:720px){.hero-art{width:80px}}
.series-heading{grid-column:1/-1;margin:12px 0 0;font-size:1.5rem}.story-pages.four-pages{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:720px){.story-pages.four-pages{grid-template-columns:1fr}}
#worksheet,.print-footer{display:none}
@media print{
 @page{size:A4 portrait;margin:14mm}
 body.worksheet-print{margin:0!important;padding:0!important;background:#fff!important;color:#18284b!important}
 body.worksheet-print>*{display:none!important}
 body.worksheet-print>#worksheet{display:block!important;position:static!important;width:100%;visibility:visible}
 #worksheet,#worksheet *{visibility:visible!important}
 #worksheet h1{font:700 21pt/1.15 var(--font);margin:0 0 4mm;color:#18284b}
 .worksheet-name{font:11pt var(--ord);margin:0 0 4mm;color:#39455b}
 .worksheet-row{display:grid;grid-template-columns:44mm minmax(0,1fr);gap:7mm;align-items:center;height:56mm;break-inside:avoid}
 .worksheet-row .picture{width:44mm;height:44mm;aspect-ratio:1;border:1.5pt solid #8896ad;border-radius:4mm;box-sizing:border-box;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .worksheet-lines{height:50mm;display:grid;grid-template-rows:repeat(5,1fr)}
 .worksheet-lines span{display:block;border-bottom:.6pt solid #8b96a8}
 body>.print-footer,body.worksheet-print>.print-footer{display:block!important;visibility:visible!important;position:fixed;bottom:0;left:0;right:0;text-align:center;font:700 10pt var(--font);color:#39455b}
}
</style>
</head>
<body>
<script src="../ljud.js"></script>
<script src="../djur.js"></script>
<script src="../huvud.js" data-titel="Sagobyggaren" data-ikon="📖"></script>
<main class="wrap">
<section class="screen" id="home">
  <div class="hero">
    <div class="hero-art" aria-hidden="true"><img src="bilder/sagor/moon.jpg" alt=""></div>
    <div><h1>Sagobyggaren</h1><p>Vardag, fabler, fantasi och mysterier. Välj bland tjugofem bildserier och skriv din egen berättelse.</p></div>
  </div>
<div class="nav"><button class="knapp vit" id="resumeOld" hidden>Fortsätt din påbörjade saga</button></div><div class="story-choices" id="series"></div>
<div class="nav"><button class="knapp vit" id="mine">📖 Mina sagor</button></div>
</section>
<section class="screen" id="game" hidden>
<button type="button" data-home hidden tabindex="-1" aria-hidden="true" onclick="hem()"></button>
<div class="nav story-top"><button class="knapp vit" id="back">◀ Bildserier</button><button class="knapp vit" id="worksheetPrint">Skriv ut skrivblad</button><span id="saveState" role="status"></span></div>
<h1 id="storyTitle" class="story-title"></h1>
<p class="info">Berätta med hjälp av bilderna. Vad händer, och hur känner sig de som är med? En mening per bild räcker, men du får gärna skriva mer.</p>
<div class="story-pages" id="pages"></div>
<div class="nav"><button class="knapp vit" id="help">💡 Hjälp mig börja</button><button class="knapp bla" id="finish" disabled>Visa min saga ▶</button></div>
<p id="helpText" class="info" role="status" hidden></p>
</section>
<section class="screen" id="book" hidden>
<label class="rubin">Vad heter din saga?<input id="title" maxlength="60" placeholder="Min saga"></label>
<div class="bok" id="bok"></div>
<div class="nav"><button class="knapp vit" id="edit">✏️ Ändra texten</button><button class="knapp vit" id="read">🔊 Läs upp</button><button class="knapp vit" id="print">🖨️ Skriv ut</button><button class="knapp" id="new">Ny saga</button><button class="knapp vit" id="library">Mina sagor</button></div>
</section>
<section class="screen" id="saved" hidden><h1>Mina sagor</h1><div id="stories" class="mina"></div><div class="nav"><button class="knapp vit" id="homeButton">◀ Bildserier</button></div></section>
</main>
<section id="worksheet" aria-hidden="true"></section>
<footer class="print-footer">Pluggparken.se</footer>
<script src="sagor.js?v=6"></script>
</body>
</html>
