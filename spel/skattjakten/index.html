<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<script src="../../tema.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skattjakten – Pluggparken</title>
<meta name="description" content="Skattjakten: hitta skatter i en labyrint genom att lösa matteuppgifter, handla i affären och ta dig ut med nyckeln.">

<meta property="og:description" content="Skattjakten: hitta skatter i en labyrint genom att lösa matteuppgifter, handla i affären och ta dig ut med nyckeln.">
<meta property="og:url" content="https://pluggparken.se/spel/skattjakten/">
<meta property="og:image" content="https://pluggparken.se/og.jpg">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.35;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none !important}
.wrap{max-width:620px;margin:0 auto;padding:12px 16px 40px}
.back{display:inline-block;color:var(--muted);font-weight:700;text-decoration:none;padding:6px 0;font-size:1rem}
h1{font-size:2.5rem;line-height:1;margin:0;font-weight:800}
h2{font-size:1.25rem;margin:18px 0 8px;font-weight:800}
.lead{margin:6px 0 0;color:var(--muted);font-size:1.05rem}
.party{display:flex;align-items:center;gap:12px;margin-top:6px}
.ppet{width:84px;flex:none}
.pet svg{width:100%;height:auto;display:block}
.world{display:inline-block;font-size:.95rem;vertical-align:middle;background:#17AFC4;color:#fff;border-radius:999px;padding:2px 10px;margin-left:4px;transform:rotate(-3deg)}

/* Teman och nivåer */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme{background:var(--card);border-radius:18px;padding:8px 6px 8px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;border:3px solid transparent}
.theme canvas{width:100%;max-width:120px;aspect-ratio:1;border-radius:10px;image-rendering:pixelated}
.theme[aria-pressed="true"]{border-color:var(--accent);background:var(--info-bg,#EEF1FF)}
.levels{display:grid;gap:10px}
.lvl{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--line);text-align:left;border:3px solid transparent}
.lvl .num{width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.4rem;flex:none}
.lvl b{display:block;font-size:1.15rem;line-height:1.1}
.lvl small{color:var(--muted);font-size:.9rem}
.lvl .st{margin-left:auto;color:var(--gold);letter-spacing:1px;white-space:nowrap}
.lvl .st .off{color:#D5DDEC}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--info-bg,#EEF1FF)}
.go{display:block;width:100%;margin-top:16px;padding:14px;border-radius:18px;background:var(--good);color:#fff;font-size:1.4rem;font-weight:800;box-shadow:0 5px 0 var(--good-dark)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--good-dark)}
.chamber{margin-top:18px;background:linear-gradient(135deg,var(--warn-bg,#FFF4CC),#FFE58A);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 #E2C252;text-align:center}
.chamber b{font-size:1.15rem}
.loot{display:flex;justify-content:center;gap:18px;margin-top:6px;font-size:1.5rem;font-weight:800}
.chamber small{display:block;color:var(--warn-ink,#7A5B00);font-size:.9rem;margin-top:4px}

/* Spelet */
#game{position:fixed;inset:0;display:flex;flex-direction:column;background:#1D2B53;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.hud{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#fff;font-weight:800;flex-wrap:wrap}
.hud .quit{color:#C6D6F2;font-weight:700}
.hud .lv{background:rgba(255,255,255,.12);border-radius:999px;padding:1px 10px;font-size:.95rem}
.hud .hl{margin-left:auto;display:flex;gap:12px;font-size:1.1rem;align-items:center}
.hud .hl small{font-size:.85rem;color:#C6D6F2}
.stage{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--wa-92,rgba(255,255,255,.92));color:var(--ink);border-radius:12px;padding:4px 12px;font-weight:700;font-size:.95rem;max-width:92%;text-align:center;pointer-events:none;transition:opacity .4s}
.pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;padding:8px 0 10px}
.pad button{background:rgba(255,255,255,.14);color:#fff;border-radius:14px;font-size:1.6rem;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.pad button:active,.pad button.on{background:rgba(255,255,255,.3);transform:translateY(2px)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
@media (min-width:900px) and (pointer:fine){.pad{display:none}}
/* liggande mobil: pilknapparna ligger i hörnet ovanpå spelplanen, så att labyrinten får hela höjden */
@media (orientation:landscape) and (max-height:520px){.pad{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));padding:0;z-index:3}.pad button{background:rgba(255,255,255,.2);backdrop-filter:blur(2px)}.toast{bottom:16px}}

/* Hindrets pratbubbla med uppgiften */
.dlg{position:fixed;inset:0;background:rgba(14,24,56,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:10px}
.dcard{background:var(--card);border-radius:22px;max-width:520px;width:100%;padding:12px 14px 14px;box-shadow:0 6px 0 var(--line);max-height:100%;overflow:auto}
.who{display:flex;align-items:flex-start;gap:10px}
.who canvas{width:64px;height:64px;flex:none;image-rendering:pixelated;background:var(--info-bg,#EEF2FA);border-radius:14px}
.bubble{position:relative;background:var(--info-bg,#EEF1FF);border-radius:16px;padding:8px 12px;flex:1}
.bubble::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:var(--lc-EEF1FF,#EEF1FF);border-left:0}
.bubble .nm{font-weight:800;color:var(--accent);font-size:.95rem}
.bubble .say{color:var(--muted);font-weight:700;font-size:.95rem}
.bubble .q{font-weight:700;font-size:1.15rem;line-height:1.35;margin-top:4px}
.spk{flex:none;width:44px;height:44px;border-radius:50%;background:var(--bg);font-size:1.3rem;box-shadow:0 3px 0 var(--line)}
.ansrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 6px}
.ans{min-width:3.2em;text-align:center;font-size:2rem;font-weight:800;border:3px solid var(--accent);border-radius:14px;color:var(--accent);background:var(--info-bg,#EEF1FF);line-height:1.25}
.ans.empty{color:#B7C3DA}
.fb{min-height:1.3em;text-align:center;font-weight:800}
.fb.ok{color:var(--good)}.fb.bad{color:#B86E00}
.tip{background:var(--warn-bg,#FFF4CC);border-radius:12px;padding:6px 10px;margin:6px 0;font-size:1rem}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{height:44px;border-radius:12px;background:var(--bg);font-size:1.4rem;font-weight:800;box-shadow:0 3px 0 var(--line)}
.keys .ok{background:var(--good);color:#fff;box-shadow:0 3px 0 var(--good-dark);font-size:1.2rem}
.keys .del{font-size:1.2rem}
@media (orientation:landscape) and (max-height:520px){.keys{grid-template-columns:repeat(6,1fr)}.keys button{height:40px}}
.backbtn{display:block;margin:10px auto 0;color:var(--muted);font-weight:700;text-decoration:underline}

/* Vinst */
.result{text-align:center;padding-top:16px}
.rbig{font-size:3rem;color:var(--gold);letter-spacing:4px;margin:4px 0}
.rbig .off{color:#D5DDEC}
.rsub{color:var(--muted);font-size:1.1rem;margin:4px 0 0}
.big{display:block;width:100%;padding:12px 16px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.2rem;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--warn-bg,#FFF4CC);color:var(--ink);padding:8px 16px;border-radius:14px;font-weight:800;z-index:12;max-width:90vw;text-align:center;box-shadow:0 4px 0 #E2C252}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
/* skatterna: rutor ur skatter.png (Kenney, CC0), 24 px per ruta */
.spr{display:inline-block;width:var(--s,32px);height:var(--s,32px);background:url(bilder/skatter.png) no-repeat;background-size:calc(24*var(--s,32px)) var(--s,32px);background-position:calc(-1*var(--i)*var(--s,32px)) 0;image-rendering:pixelated;vertical-align:middle}
.snd{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);font-size:1.15rem}
.lootbar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#0E1735;color:#C6D6F2;min-height:52px;overflow-x:auto}
.lootbar .lbl{font-weight:800;font-size:.85rem;flex:none}
.slots{display:flex;gap:6px;align-items:center}
.slot{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.1);border-radius:12px;padding:2px 8px 2px 4px;font-weight:800;color:#fff;--s:36px}
.slot.bump{animation:bump .4s ease-out}
@keyframes bump{40%{transform:scale(1.3);background:#FFC93C}}
.slots .empty{font-size:.85rem;font-weight:700;opacity:.7}
@media (min-width:900px){.lootbar{min-height:78px;justify-content:center;gap:14px}.lootbar .lbl{font-size:1rem}.slot{--s:54px;font-size:1.3rem;padding:4px 12px 4px 6px}}
/* skatt som flyger ur kistan, svävar och landar i skattraden */
.flyer{position:fixed;left:0;top:0;z-index:15;pointer-events:none;--s:48px;transition:transform .7s cubic-bezier(.4,.1,.3,1),opacity .3s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.flyer .shine{position:absolute;inset:-30%;background:radial-gradient(circle,rgba(255,236,150,.85),rgba(255,236,150,0) 65%);animation:shine 1s ease-in-out infinite alternate;z-index:-1}
@keyframes shine{from{transform:scale(.8);opacity:.6}to{transform:scale(1.15);opacity:1}}
@keyframes hover{0%,100%{translate:0 0}50%{translate:0 -10px}}
.flyer.hov .spr{animation:hover .9s ease-in-out infinite}
.flyer .cap{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;background:var(--warn-bg,#FFF4CC);color:var(--ink);font-weight:800;border-radius:10px;padding:1px 8px;font-size:.85rem;margin-top:6px}
.bag{display:flex;gap:5px;align-items:center}
.bag .slot{min-width:44px;justify-content:center}
.bag .slot.tom{background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.25);min-height:40px}
.wallet{display:flex;align-items:center;gap:4px;background:#FFC93C;color:#1D2B53;border-radius:999px;padding:2px 12px;font-weight:800;font-size:1.1rem;flex:none}
.wallet.bump{animation:bump .5s ease-out}
.owned{display:flex;gap:2px;font-size:1.3rem;flex:none}
@media (min-width:900px){.bag .slot{min-width:66px}.bag .slot.tom{min-height:62px}.wallet{font-size:1.3rem;padding:4px 16px}.owned{font-size:1.7rem}}
/* affären */
.shopsec{background:var(--lc-F6F8FC,#F6F8FC);border-radius:16px;padding:8px 10px;margin-top:10px}
.shopsec h3{margin:0 0 4px;font-size:1.05rem}
.ptag{display:flex;flex-direction:column;align-items:center;background:var(--card,#fff);border-radius:12px;padding:2px 8px 4px;box-shadow:0 2px 0 var(--line);--s:40px}
.ptag b{background:#FFC93C;border-radius:999px;padding:0 8px;font-size:.95rem;line-height:1.4}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod{display:flex;align-items:center;gap:8px;text-align:left;background:var(--card,#fff);border-radius:14px;padding:6px 8px;box-shadow:0 3px 0 var(--line);min-height:56px}
.prod .pi{font-size:1.8rem;flex:none}
.prod b{display:block;font-size:1rem;line-height:1.1}
.prod small{display:block;color:var(--muted);font-size:.8rem;line-height:1.2}
.prod .pr{margin-left:auto;background:#FFC93C;border-radius:999px;padding:0 8px;font-weight:800;white-space:nowrap;flex:none}
.prod.kopt{opacity:.6;box-shadow:none}
.prod.kopt .pr{background:var(--lc-C9F0D9,#C9F0D9)}
.prod.viktig{outline:3px solid #FFC93C}
.sellbtn{display:block;width:100%;margin-top:8px;padding:8px;border-radius:14px;background:var(--good);color:#fff;font-weight:800;box-shadow:0 3px 0 var(--good-dark)}
.tags{display:flex;flex-wrap:wrap;gap:6px}.q .tags{margin-top:6px}
@media (max-width:420px){.prods{grid-template-columns:1fr}}
.chest-loot{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:8px}
.chest-loot span{display:flex;align-items:center;gap:2px;font-weight:800;font-size:1.25rem;--s:40px}

@media (prefers-reduced-motion:reduce){*{transition:none !important}}
#game{background:#1f3c38}.hud{background:#183d37;padding:10px 16px;border-bottom:1px solid #accab22c}.hud .lv{background:#3c5c4c}.quest-progress{margin:0;padding:10px 16px;background:#f0e5c7;color:#234f43;display:flex;align-items:center;gap:12px;box-shadow:0 3px 12px #102d3030;z-index:1}.quest-progress button{font:800 .95rem var(--font);text-align:left;flex:1;min-height:36px}.quest-progress small{font-size:.7rem;letter-spacing:.08em;font-weight:800}.hint{top:auto;bottom:16px;background:#fff7dfed;border:1px solid #d2c39d;box-shadow:0 3px 12px #102d3030;max-width:min(92%,600px)}#cv{image-rendering:auto}.lootbar{background:#17362f;border-top:1px solid #afccaa30}.pad{background:#183d37}.pad button{background:#446859}.dcard{border:1px solid #c8b890;box-shadow:0 14px 70px #061b2760;max-width:610px;padding:20px}.dlg{align-items:center;background:#102c3677;backdrop-filter:blur(4px)}.quest-journal{display:grid;gap:10px;margin:15px 0}.quest-journal>div{display:grid;grid-template-columns:38px 1fr;gap:1px 10px;background:#eff3e5;padding:12px;border-radius:12px}.quest-journal span{grid-row:span 2;align-self:center;text-align:center;font-weight:800;color:#386f51}.quest-journal small{font-weight:700;color:#63785e}.quest-route{display:block;width:100%;min-height:48px;background:#24614d;color:white;border-radius:12px;font-weight:800;padding:10px}#home .world{color:#49765d;background:#e8efdc}.levels button{border-radius:17px}.party{border-radius:20px;background:#edf2e3;padding:22px}.lootbar .wallet{background:#f7d67c;color:#3a4529}.quest-seals{display:flex;gap:12px;justify-content:center;font-size:2rem}
@media(max-width:600px){.hud{gap:5px;padding:7px 10px}.hud .hl{font-size:.85rem}.hud .lv{font-size:.8rem}.quest-progress{padding:5px 10px;gap:5px}.quest-progress button{font-size:.78rem}.quest-progress small{display:none}.dcard{padding:13px}.who canvas{width:44px;height:44px}.quest-progress button{min-height:40px}.hint{font-size:.8rem}.pad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,44px);gap:5px;padding:6px}.lootbar{min-height:55px}}

.mechanism{padding:14px;margin:12px 0;background:#eaf0e2;border:1px solid #c8d7ba;border-radius:14px}.mechanism-picture{text-align:center;font:800 1.8rem ui-monospace,monospace;color:#637f65}.mechanism p{font-size:.9rem;font-weight:700;margin:7px 0}.mechanism-options{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.mechanism-options button{min-height:48px;background:white;border:1px solid #acc3a4;border-radius:10px;font-weight:800;color:#315e44}.seal-code{display:flex;align-items:center;justify-content:center;gap:12px}.seal-code span{padding:10px 18px;border-radius:12px;background:#ffefbc;text-align:center}.seal-code small{display:block;font-size:.65rem}.seal-code b{font-size:1.5rem}.quest-route.explore{margin-top:8px;background:#ede5cb;color:#42634a}.quest-finale{flex-basis:100%;margin:12px 0;padding:20px;background:#e5efd8;border-radius:18px}.quest-seals span{display:block;color:#b68935;background:#ffefba;width:65px;height:65px;border-radius:50%;line-height:65px;box-shadow:0 3px 0 #cabc8a}
</style>
</head>
<body>
<div class="wrap" id="home">
  <a class="back" href="../">← Spelhörnan</a>
  <div class="party"><div class="ppet pet" id="homePet" aria-hidden="true"></div>
    <div><h1>Skattjakten <span class="world">🗝️ Labyrint</span></h1><p class="lead" id="homeLead">Ett äventyr väntar! Hjälp till vid tre platser, samla delarna till det sista låset och hitta skatter att sälja. Välj din väg och rädda världen bakom porten.</p></div></div>
  <h2>Välj tema</h2>
  <div class="themes" id="themes"></div>
  <h2>Välj nivå</h2>
  <div class="levels" id="levels"></div>
  <button class="go" id="start">Starta skattjakten</button>
  <div class="chamber" id="chamber"></div>
</div>

<section id="game" hidden>
  <div class="hud"><button class="quit" id="quit">← Avsluta</button><span class="lv" id="hudLv"></span>
    <span class="hl"><span id="hudChest"></span><button class="snd" id="snd" aria-label="Ljud av eller på">🔊</button></span></div>
  <div class="quest-progress"><small>DITT ÄVENTYR</small><button id="questProgress" type="button">Visa uppdrag</button></div><div class="stage" id="stage"><canvas id="cv"></canvas><div class="hint" id="hint"></div></div>
  <div class="lootbar" id="lootbar" aria-label="Ryggsäcken och dina mynt"><span class="lbl">🎒</span><span class="bag" id="slots"></span><span class="wallet" id="wallet">🪙 0</span><span class="owned" id="owned"></span></div>
  <div class="pad" id="pad" aria-label="Pilknappar">
    <button class="u" data-d="0,-1" aria-label="Upp">▲</button><button class="l" data-d="-1,0" aria-label="Vänster">◀</button>
    <button class="d" data-d="0,1" aria-label="Ner">▼</button><button class="r" data-d="1,0" aria-label="Höger">▶</button>
  </div>
</section>

<div class="dlg" id="dlg" hidden>
  <div class="dcard" role="dialog" aria-modal="true" aria-labelledby="dName">
    <div class="who"><canvas id="dPic" width="64" height="64"></canvas>
      <div class="bubble"><div class="nm" id="dName"></div><div class="say" id="dSay"></div><div class="q" id="dQ"></div></div>
      <button class="spk" id="dSpk" aria-label="Läs upp">🔊</button></div>
    <div id="shopMenu" hidden></div>
    <div class="ansrow"><span class="ans empty" id="dAns">?</span><b id="dUnit"></b></div>
    <div class="fb" id="dFb" aria-live="polite"></div>
    <div class="tip" id="dTip" hidden></div>
    <div class="keys" id="dKeys">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del" aria-label="Sudda">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">OK</button>
    </div>
    <button class="backbtn" id="dBack">Gå tillbaka och ta en annan väg</button>
  </div>
</div>

<div class="wrap result" id="win" hidden>
  <h1 id="wTitle">Du hittade utgången!</h1>
  <div class="rbig" id="wStars"></div>
  <p class="rsub" id="wSub"></p>
  <div class="chest-loot" id="wLoot"></div>

/* ---------- Textuppgifter: nivå 1 (upp till 20), nivå 2 (upp till 100, två steg), nivå 3 (upp till 1000, gånger och delat) ---------- */
const NAMES=["Moa","Elias","Saga","Noah","Alva","Liam","Ella","Omar","Maja","Ali","Ines","Leo","Selma","Hugo","Nora","Adam","Wilma","Sami"];
const KIN=["sin syster","sin bror","sin kompis","sin kusin","sin granne"];
const ITEMS=[{p:"godisar",v:"äter"},{p:"äpplen",v:"äter"},{p:"kulor",v:"tappar"},{p:"klistermärken",v:"tappar"},{p:"pärlor",v:"tappar"},{p:"pennor",v:"tappar"},{p:"bullar",v:"äter"},{p:"jordgubbar",v:"äter"},{p:"kort",v:"tappar"}];
const SHOP=[["glass","glassar"],["bulle","bullar"],["serietidning","serietidningar"],["boll","bollar"],["penna","pennor"]];
function two(){const a=pick(NAMES);let b;do{b=pick(NAMES);}while(b===a);return[a,b];}
function problem(lv){
  const[A,B]=two(),it=pick(ITEMS),k=pick(KIN);
  const T=[];
  if(lv===1){
    T.push(()=>{const a=rnd(3,12),b=rnd(2,8);return{q:`${A} har ${a} ${it.p}. ${A} får ${b} till av ${k}. Hur många ${it.p} har ${A} nu?`,a:a+b,tip:`Lägg ihop: ${a} + ${b}.`,sol:`${a} + ${b} = ${a+b}`};});
    T.push(()=>{const a=rnd(8,20),b=rnd(2,a-2);return{q:`${A} har ${a} ${it.p}. ${A} ger ${b} till ${k}. Hur många ${it.p} har ${A} kvar?`,a:a-b,tip:`Ta bort det som ${A} ger bort: ${a} − ${b}.`,sol:`${a} − ${b} = ${a-b}`};});
    T.push(()=>{const a=rnd(7,18),b=rnd(2,a-2);return{q:`${A} har ${a} ${it.p} och ${B} har ${b}. Hur många fler ${it.p} har ${A} än ${B}?`,a:a-b,tip:`Skillnaden: hur långt är det från ${b} upp till ${a}?`,sol:`${a} − ${b} = ${a-b}`};});
    T.push(()=>{const a=rnd(3,10),b=rnd(3,10);return{q:`${A} har ${a} ${it.p} och ${B} har ${b}. Hur många ${it.p} har de tillsammans?`,a:a+b,tip:`Tillsammans betyder att du lägger ihop: ${a} + ${b}.`,sol:`${a} + ${b} = ${a+b}`};});
  }else if(lv===2){
    T.push(()=>{const a=rnd(30,90),b=rnd(3,12),c=rnd(3,12);return{q:`${A} har ${a} ${it.p}. ${A} ger ${b} till ${k} och ${it.v} själv ${c}. Hur många ${it.p} har ${A} kvar?`,a:a-b-c,
      tip:`Två steg: först ${a} − ${b}, sedan minus ${c} till.`,sol:`${a} − ${b} = ${a-b}, och ${a-b} − ${c} = ${a-b-c}`};});
    T.push(()=>{const a=rnd(20,60),b=rnd(5,25),c=rnd(3,15);return{q:`I en låda finns ${a} ${it.p}. ${A} lägger dit ${b} till och tar sedan ${c}. Hur många ${it.p} finns i lådan nu?`,a:a+b-c,
      tip:`Först plus ${b}, sedan minus ${c}.`,sol:`${a} + ${b} = ${a+b}, och ${a+b} − ${c} = ${a+b-c}`};});
    T.push(()=>{const g=rnd(2,5),n=rnd(2,10);return{q:`${A} har ${g} påsar med ${n} ${it.p} i varje. Hur många ${it.p} är det sammanlagt?`,a:g*n,tip:`${g} påsar med ${n} i varje: ${n} + ${n}${g>2?" + …":""} eller ${g} · ${n}.`,sol:`${g} · ${n} = ${g*n}`};});
    T.push(()=>{const a=rnd(10,50),b=rnd(5,30);return{q:`${A} fick ${b} ${it.p} av ${k} och har nu ${a+b}. Hur många ${it.p} hade ${A} från början?`,a:a,tip:`Gå baklänges: ta bort det ${A} fick. ${a+b} − ${b}.`,sol:`${a+b} − ${b} = ${a}`};});
    T.push(()=>{const b=rnd(10,40),d=rnd(5,30);return{q:`${B} har ${b} ${it.p}. ${A} har ${d} fler än ${B}. Hur många ${it.p} har ${A}?`,a:b+d,tip:`Fler än betyder plus: ${b} + ${d}.`,sol:`${b} + ${d} = ${b+d}`};});
  }else{
    T.push(()=>{const m=pick([50,100,200]),p=rnd(2,9)*(m>=100?5:1),q=rnd(2,4),[s,pl]=pick(SHOP);if(p*q>=m)return null;
      return{q:`${A} har ${m} kr. ${A} köper ${q} ${pl} som kostar ${p} kr styck. Hur många kronor har ${A} kvar?`,a:m-p*q,unit:"kr",tip:`Först vad det kostar: ${q} · ${p}. Sedan ${m} minus det.`,sol:`${q} · ${p} = ${p*q}, och ${m} − ${p*q} = ${m-p*q}`};});
    T.push(()=>{const k2=rnd(2,6),e=rnd(3,12);return{q:`${k2*e} ${it.p} ska delas lika mellan ${k2} barn. Hur många ${it.p} får varje barn?`,a:e,tip:`Dela ${k2*e} i ${k2} lika stora delar. Tänk: ${k2} · ? = ${k2*e}.`,sol:`${k2*e} / ${k2} = ${e}`};});
    T.push(()=>{const a=rnd(180,600),b=rnd(20,90),c=rnd(20,150);return{q:`En skola har ${a} elever. ${b} elever går hem tidigt och ${c} elever kommer på besök från en annan skola. Hur många elever är på skolan nu?`,a:a-b+c,
      tip:`Två steg: först ${a} − ${b}, sedan plus ${c}.`,sol:`${a} − ${b} = ${a-b}, och ${a-b} + ${c} = ${a-b+c}`};});
    T.push(()=>{const p=rnd(4,12),d=rnd(3,7),e=rnd(5,30);return{q:`${A} läser ${p} sidor varje dag i ${d} dagar. Sedan läser ${A} ${e} sidor till. Hur många sidor har ${A} läst?`,a:p*d+e,
      tip:`Först ${d} dagar med ${p} sidor: ${d} · ${p}. Lägg sedan till ${e}.`,sol:`${d} · ${p} = ${p*d}, och ${p*d} + ${e} = ${p*d+e}`};});
    T.push(()=>{const n=rnd(3,9)*2,x=rnd(10,40);return{q:`${A} har ${n} ${it.p}. ${B} har dubbelt så många som ${A} och ${x} till. Hur många ${it.p} har ${B}?`,a:2*n+x,
      tip:`Dubbelt så många som ${n} är ${n} + ${n}. Lägg sedan till ${x}.`,sol:`${n} · 2 = ${2*n}, och ${2*n} + ${x} = ${2*n+x}`};});
  }
  let r=null,g=0;while(!r&&g++<20)r=pick(T)();return r;
}

/* ---------- Labyrinten: slumpas varje gång, med extra öppningar så att det finns många vägar ---------- */
const LV={1:{n:21,foes:7,onPath:3,chests:8,c:"#2BB673",desc:"Tal upp till 20. Ett steg."},2:{n:27,foes:10,onPath:4,chests:11,c:"#3D8BFD",desc:"Tal upp till 100. Två steg och grupper."},3:{n:33,foes:13,onPath:5,chests:14,c:"#7B61FF",desc:"Tal upp till 1000. Pengar, gånger och delat."}};
function makeMaze(n){
  const g=Array.from({length:n},()=>Array(n).fill(1));
  const st=[[1,1]];g[1][1]=0;
  while(st.length){const[x,y]=st[st.length-1];const nb=shuffle([[2,0],[-2,0],[0,2],[0,-2]]).map(([dx,dy])=>[x+dx,y+dy,dx,dy]).filter(([a,b])=>a>0&&b>0&&a<n-1&&b<n-1&&g[b][a]===1);
    if(!nb.length){st.pop();continue;}const[a,b,dx,dy]=nb[0];g[y+dy/2][x+dx/2]=0;g[b][a]=0;st.push([a,b]);}
  /* öppna några väggar till, så att labyrinten får flera vägar och slingor */
  let extra=Math.round(n*n/28),tries=0;
  while(extra>0&&tries++<4000){const x=rnd(1,n-2),y=rnd(1,n-2);if(g[y][x]!==1)continue;
    const h=g[y][x-1]===0&&g[y][x+1]===0&&g[y-1][x]===1&&g[y+1][x]===1,v=g[y-1][x]===0&&g[y+1][x]===0&&g[y][x-1]===1&&g[y][x+1]===1;
    if(h||v){g[y][x]=0;extra--;}}
  return g;
}
function bfs(g,sx,sy){const n=g.length,d=Array.from({length:n},()=>Array(n).fill(-1)),prev={};d[sy][sx]=0;const q=[[sx,sy]];
  while(q.length){const[x,y]=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy;if(g[b][a]===0&&d[b][a]<0){d[b][a]=d[y][x]+1;prev[a+","+b]=[x,y];q.push([a,b]);}}}
  return{d,prev};}
const degree=(g,x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>g[y+dy][x+dx]===0).length;

/* ---------- Spelet ---------- */
let G=null;
function newGame(){
  const L=LV[data.level],th=THEMES[data.theme],n=L.n,g=makeMaze(n);
  const {d,prev}=bfs(g,1,1);let ex=[1,1],best=0;
  for(let y=1;y<n-1;y++)for(let x=1;x<n-1;x++)if(g[y][x]===0&&d[y][x]>best){best=d[y][x];ex=[x,y];}
  /* vägen till utgången: några hinder står där, så att man måste lösa uppgifter */
  const path=[];let c=ex;while(c&&!(c[0]===1&&c[1]===1)){path.unshift(c);c=prev[c[0]+","+c[1]];}
  const used=new Set(["1,1",ex.join(",")]),objs={};
  const put=(x,y,o)=>{used.add(x+","+y);objs[x+","+y]=o;};
  const cand=path.slice(3,-1).filter(([x,y])=>degree(g,x,y)===2);
  for(let i=0;i<L.onPath&&cand.length;i++){const seg=Math.floor(cand.length/(L.onPath))||1,p=cand[Math.min(cand.length-1,i*seg+rnd(0,Math.max(0,seg-1)))];
    if(p&&!used.has(p.join(","))&&![...used].some(u=>{const[a,b]=u.split(",").map(Number);return Math.abs(a-p[0])+Math.abs(b-p[1])<2;}))put(p[0],p[1],{t:"foe",f:pick(th.foes)});}
  const free=[];for(let y=1;y<n-1;y++)for(let x=1;x<n-1;x++)if(g[y][x]===0&&d[y][x]>3)free.push([x,y]);
  /* skatter i återvändsgränder, längst bort först */
  const ends=shuffle(free.filter(([x,y])=>degree(g,x,y)===1&&!used.has(x+","+y)));
  /* affären: i en återvändsgränd ungefär en tredjedel in. Man går in genom att gå mot den, som hos hindren. */
  {const far=Math.max(...free.map(([x,y])=>d[y][x])),de=free.filter(([x,y])=>!used.has(x+","+y)&&degree(g,x,y)===1);
   const cs=shuffle(de.filter(([x,y])=>d[y][x]>far*.2&&d[y][x]<far*.5));
   const s=cs[0]||de.sort((a,b)=>Math.abs(d[a[1]][a[0]]-far*.35)-Math.abs(d[b[1]][b[0]]-far*.35))[0];put(s[0],s[1],{t:"shop"});var shopAt=s;}
  for(const[x,y]of ends.filter(([x,y])=>!used.has(x+","+y)).slice(0,L.chests))put(x,y,{t:"chest"});
  let extraChests=L.chests-Object.values(objs).filter(o=>o.t==="chest").length;
  for(const[x,y]of shuffle(free.slice()))if(extraChests>0&&!used.has(x+","+y)&&degree(g,x,y)<=2){put(x,y,{t:"chest"});extraChests--;}
  /* fler hinder på andra vägar, ofta framför skatterna */
  let foes=L.foes-Object.values(objs).filter(o=>o.t==="foe").length;
  for(const[x,y]of shuffle(free.filter(([x,y])=>degree(g,x,y)===2)))if(foes>0&&!used.has(x+","+y)&&!(Math.abs(x-1)+Math.abs(y-1)<4)){put(x,y,{t:"foe",f:pick(th.foes)});foes--;}
  put(ex[0],ex[1],{t:"exit"});
  /* varje ruta får en egen variant av golv och vägg, som inte ändras */
  const look=Array.from({length:n},()=>Array.from({length:n},()=>Math.random()));
  /* kistornas innehåll bestäms nu, så att nyckelns pris kan räknas fram ur hur mycket som finns */
  let total=0;Object.values(objs).forEach(o=>{if(o.t!=="chest")return;const k=Math.random()<.45?1:Math.random()<.73?2:3;o.items=[];
    for(let i=0;i<k;i++){const tr=rollTreasure();o.items.push({t:tr,cell:pick(tr.cells)});total+=varde(tr);}});
  const steg=data.level===1?1:data.level===2?5:10,rund=v=>Math.max(steg,Math.round(v/steg)*steg);
  const tak=data.level===1?[15,6]:data.level===2?[90,30]:[900,300];
  const pris={nyckel:Math.min(tak[0],rund(total*.5)),lykta:Math.min(tak[1],rund(total*.13)),karta:Math.min(tak[1],rund(total*.16)),skor:Math.min(tak[1],rund(total*.1))};
  G={n,g,objs,look,th,sheet:sheetOf(data.theme),px:1,py:1,ax:1,ay:1,seen:Array.from({length:n},()=>Array(n).fill(false)),
