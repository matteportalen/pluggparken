<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
/* startskärmen */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#3D5AFE,#17AFC4);color:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 #2A3FB8;margin:6px 0 16px}
.hero .hb{flex:none;width:104px;height:74px;border-radius:14px;background:#fff;display:grid;grid-template-columns:1fr 1fr;place-items:center;font-size:1.7rem;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.15);color:var(--ink)}
.hero .hb b{font-size:.95rem;font-weight:800}
.hero h1{margin:0;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05}
.hero p{margin:6px 0 0;font-weight:600;opacity:.97}
.niv{display:grid;gap:10px}
.niv button{display:flex;align-items:center;gap:14px;background:var(--card,#fff);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.niv button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.niv .nr{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:#fff}
.niv b{display:block;font-size:1.12rem;line-height:1.15}
.niv small{display:block;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.25}
.niv .st{margin-left:auto;flex:none;color:var(--gold);font-size:1.15rem;letter-spacing:1px}
.niv .st .off{color:var(--line)}
/* spelet */
.topp{display:flex;align-items:center;gap:10px;margin:4px 0 6px;min-height:24px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.f{background:var(--bad)}.dots i.nu{background:var(--gold)}
.niva-t{font-weight:800;color:var(--muted);font-size:.9rem}
.fraga{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 10px;min-height:64px}
.fraga .q{text-align:center;font-weight:700;font-size:clamp(1.05rem,4.4vw,1.2rem);line-height:1.2;color:var(--muted)}
.fraga .q b{display:block;color:var(--ink);font-weight:800;font-size:clamp(1.5rem,6.6vw,2rem);line-height:1.15}
.hor{flex:none;width:48px;height:48px;border-radius:50%;background:var(--card,#fff);box-shadow:0 3px 0 var(--line);font-size:1.35rem}
.hor:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.hor.stor{width:72px;height:72px;font-size:2rem;background:var(--accent);box-shadow:0 5px 0 #2A3FB8;animation:puls 1.6s ease-in-out infinite}
@keyframes puls{50%{transform:scale(1.07)}}
/* bilder: emoji, färgprick, siffra eller bildfil */
.bild{display:grid;place-items:center;line-height:1}
.bild .em{font-size:1em}
.bild .prick{width:.9em;height:.9em;border-radius:50%;box-shadow:inset 0 -.08em 0 rgba(0,0,0,.18),0 0 0 2px rgba(29,43,83,.15)}
.bild .tal{font-weight:800;font-size:.95em;color:var(--accent)}
.bild img{width:1.15em;height:1.15em;object-fit:contain;display:block}
/* välj bild */
.rutor{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rutor button{aspect-ratio:1;border-radius:20px;background:var(--card,#fff);box-shadow:0 4px 0 var(--line);font-size:clamp(2.6rem,14vw,4rem);display:grid;place-items:center;transition:box-shadow .15s}
.rutor button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.rutor button.fel{background:#FFE9EC;opacity:.55;pointer-events:none}
.rutor button.ratt{box-shadow:0 0 0 4px var(--good),0 4px 0 var(--line)}
.rutor.last button{pointer-events:none}
/* bygg ordet */
.storbild{background:var(--card,#fff);border-radius:24px;box-shadow:0 4px 0 var(--line);height:min(34vw,150px,20vh);display:grid;place-items:center;font-size:min(22vw,96px,13vh);margin-bottom:10px}
.luckor{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:56px}
.luckor button{min-width:44px;height:52px;border-radius:12px;border:3px dashed #AFC0E8;background:var(--card,#fff);font-weight:800;font-size:1.6rem;color:var(--accent);padding:0 8px;font-family:var(--ord,"Andika",var(--font))}
.luckor button.full{border-style:solid;border-color:var(--accent)}
.luckor button.fel{border-color:#F7A3A6;background:#FFF0F1;color:#B4232A}
.luckor.ratt button{border:3px solid var(--good);color:var(--good-dark)}
.luckor.ordvis button{min-width:64px;font-size:1.25rem;font-family:var(--font)}
.brickor{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.brickor button{min-width:48px;height:52px;border-radius:14px;background:var(--card,#fff);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.6rem;padding:0 10px;font-family:var(--ord,"Andika",var(--font))}
.brickor.ordvis button{font-size:1.25rem;font-family:var(--font)}
.brickor button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.brickor button.tagen{opacity:.22;pointer-events:none}
/* para ihop */
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.par button{min-height:56px;border-radius:16px;background:var(--card,#fff);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.08rem;line-height:1.15;padding:6px 10px}
.par button.en{color:var(--accent)}
.par button.vald{background:var(--accent);color:#fff;box-shadow:0 4px 0 #2A3FB8}
.par button.parad{background:#DDF5E7;color:var(--good-dark);box-shadow:0 0 0 3px var(--good);pointer-events:none}
.par button.fel{background:#FFE9EC}
/* välj betydelse (efter att ha lyssnat) */
.val{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.val button{min-height:60px;border-radius:16px;background:var(--card,#fff);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.1rem;line-height:1.15;padding:6px 10px}
.val button.fel{background:#FFE9EC;opacity:.55;pointer-events:none}
.val button.ratt{box-shadow:0 0 0 4px var(--good),0 4px 0 var(--line)}
.val.last button{pointer-events:none}
.skaka{animation:skaka .4s}
@keyframes skaka{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.forkl{text-align:center;font-weight:700;margin:10px 0 0;min-height:2.7em;font-size:1.06rem;line-height:1.3}
.forkl.ratt{color:var(--good-dark)}.forkl.fel{color:#B4232A}
.knapprad{display:flex;justify-content:center;gap:10px;margin-top:6px}
.klar,.nasta{background:var(--good);color:#fff;border-radius:18px;padding:10px 30px;font-weight:800;font-size:1.25rem;box-shadow:0 5px 0 var(--good-dark)}
.klar:active{transform:translateY(4px);box-shadow:0 1px 0 var(--good-dark)}
.klar:disabled{opacity:.4;pointer-events:none}
.nasta{background:var(--accent);box-shadow:0 5px 0 #2A3FB8}
.nasta:active{transform:translateY(4px);box-shadow:0 1px 0 #2A3FB8}
@media (max-height:700px){.wrap{padding-bottom:12px}.fraga{min-height:52px;margin-bottom:6px}.hor.stor{width:58px;height:58px;font-size:1.6rem}.rutor{gap:8px}.rutor button{font-size:clamp(2.2rem,12vw,3.2rem);aspect-ratio:1.18}.forkl{min-height:1.4em;margin-top:6px}.par button,.val button{min-height:48px}.luckor button,.brickor button{height:46px}}
@media (min-width:700px){.rutor button{aspect-ratio:1.25}}
/* resultat */
.res{text-align:center}
.res .stj{font-size:3rem;letter-spacing:6px;color:var(--gold);margin:8px 0}
.res .stj .off{color:var(--line)}
.knapp{display:inline-block;background:var(--good);color:#fff;border-radius:16px;padding:12px 26px;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 var(--good-dark);margin:6px}
.knapp.vit{background:var(--card,#fff);color:var(--ink);box-shadow:0 5px 0 var(--line)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:420px){.hero .hb{width:88px}.hero{gap:12px;padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script src="../ljud.js"></script>
<script src="../huvud.js" data-titel="Engelska ord" data-ikon="🇬🇧"></script>
<main class="wrap">

<section class="screen" id="home">
  <div class="hero">
    <div class="hb" aria-hidden="true"><span>🐱</span><b>cat</b><span>🍎</span><b>apple</b></div>
    <div><h1>Engelska ord</h1><p>Lyssna, bygg ordet och para ihop.</p></div>
  </div>
  <div class="niv" id="niv"></div>
</section>

<section class="screen" id="game" hidden>
  <button type="button" data-home hidden tabindex="-1" aria-hidden="true" onclick="hem()"></button>
  <div class="topp"><div class="dots" id="dots"></div><span class="niva-t" id="nivT"></span></div>
  <div class="fraga"><button class="hor" id="hor" aria-label="Lyssna på engelska">🔊</button><span class="q" id="q" aria-live="polite"></span></div>
  <div id="yta"></div>
  <div class="forkl" id="forkl" aria-live="polite"></div>
  <div class="knapprad"><button class="klar" id="klar" hidden>Klar ✓</button><button class="nasta" id="nasta" hidden>Nästa ▶</button></div>
</section>

<section class="screen res" id="result" hidden>
  <h2 id="rRub" style="margin:10px 0 0">Bra jobbat!</h2>
  <div class="stj" id="rStj"></div>
  <p id="rTxt" style="font-weight:700;margin:0 0 14px"></p>
  <button class="knapp" id="rIgen">Spela igen</button>
  <button class="knapp vit" id="rHome">Välj nivå</button>
</section>

</main>
<canvas id="fx" hidden></canvas>
<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const KEY="mattespel-engelskaord-v1";
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const ROUND=8;

/* ---------- Orden ----------
   [engelska, svenska, bild]. Bilden är en emoji, "färg:#hex" (en färgprick), "tal:7" (en siffra)
   eller en bildfil, till exempel "bilder/cat.webp". Byt bild genom att ändra tredje värdet; resten av övningen följer med.
   Bilden får bara kunna betyda ordet. */
const ORD={
 1:[["cat","katt","🐱"],["dog","hund","🐶"],["bird","fågel","🐦"],["fish","fisk","🐟"],["horse","häst","🐴"],["cow","ko","🐮"],["pig","gris","🐷"],["frog","groda","🐸"],
    ["house","hus","🏠"],["sun","sol","☀️"],["moon","måne","🌙"],["star","stjärna","⭐"],["tree","träd","🌳"],["flower","blomma","🌼"],
    ["apple","äpple","🍎"],["banana","banan","🍌"],["book","bok","📖"],["car","bil","🚗"],["bus","buss","🚌"],["bike","cykel","🚲"]],
 2:[["red","röd","färg:#E5484D"],["blue","blå","färg:#3D8BFD"],["green","grön","färg:#2BB673"],["yellow","gul","färg:#F7D038"],["black","svart","färg:#1F2430"],["pink","rosa","färg:#FF8FC7"],
    ["one","ett","tal:1"],["two","två","tal:2"],["three","tre","tal:3"],["four","fyra","tal:4"],["five","fem","tal:5"],["six","sex","tal:6"],["seven","sju","tal:7"],["eight","åtta","tal:8"],["nine","nio","tal:9"],["ten","tio","tal:10"],
    ["eye","öga","👁️"],["ear","öra","👂"],["nose","näsa","👃"],["hand","hand","✋"],["foot","fot","🦶"],["mouth","mun","👄"],
    ["milk","mjölk","🥛"],["bread","bröd","🍞"],["cheese","ost","🧀"],["egg","ägg","🥚"]]};
/* Fraser på nivå 3: [engelska, svenska] */
const FRASER=[["Hello","hej"],["Goodbye","hejdå"],["Thank you","tack"],["Please","snälla"],["Sorry","förlåt"],["Good morning","god morgon"],["Good night","god natt"],["How are you?","Hur mår du?"],["My name is","Jag heter"],["Yes","ja"],["No","nej"],["See you","vi ses"]];
const NIV=[null,
  {namn:"Djur, saker och mat",txt:"Cat, house, apple och fler.",col:"#2BB673",typer:["lyssna","lyssna","lyssna","las","las","bygg","bygg","bygg"]},
  {namn:"Färger, tal och kropp",txt:"Red, seven, hand och fler.",col:"#FF9F43",typer:["lyssna","lyssna","lyssna","las","las","bygg","bygg","bygg"]},
  {namn:"Hälsa och artighet",txt:"Hello, thank you, how are you?",col:"#7B61FF",typer:["para","para","para","hor","hor","bygg","bygg","bygg"]}];
function bildHtml(b){if(b.startsWith("färg:"))return `<span class="bild"><span class="prick" style="background:${b.slice(5)}"></span></span>`;
  if(b.startsWith("tal:"))return `<span class="bild"><span class="tal">${b.slice(4)}</span></span>`;
  if(b.includes("."))return `<span class="bild"><img src="${b}" alt=""></span>`;
  return `<span class="bild"><span class="em">${b}</span></span>`;}
const BOKST="aeioustrnldmhc";
function gorRunda(lvl){const N=NIV[lvl],typer=shuffle(N.typer.slice());
  if(lvl<3){const ord=shuffle(ORD[lvl].slice()),mal=ord.slice(0,ROUND);
    return typer.map((typ,i)=>{const o=mal[i],U={typ,en:o[0],sv:o[1],bild:o[2]};
      if(typ==="bygg"){const extra=shuffle(BOKST.split("").filter(c=>!o[0].includes(c))).slice(0,o[0].length>5?2:3);U.delar=o[0].split("");U.brickor=shuffle(U.delar.concat(extra));}
      else U.val=shuffle([o].concat(shuffle(ORD[lvl].filter(x=>x!==o)).slice(0,5)));
      return U;});}
  const fr=shuffle(FRASER.slice());let fi=0;const nasta=()=>fr[fi++%fr.length];
  return typer.map(typ=>{
    if(typ==="para"){const par=shuffle(FRASER.slice()).slice(0,4);return{typ,par,en:shuffle(par.map(p=>p[0])),sv:shuffle(par.map(p=>p[1]))};}
    const o=nasta(),U={typ,en:o[0],sv:o[1]};
    if(typ==="hor")U.val=shuffle([o[1]].concat(shuffle(FRASER.filter(x=>x!==o).map(x=>x[1])).slice(0,3)));
    else if(o[0].includes(" ")){const delar=o[0].split(" "),alla=[...new Set(FRASER.flatMap(f=>f[0].split(" ")))].filter(w=>!delar.includes(w));U.ordvis=true;U.delar=delar;U.brickor=shuffle(delar.concat(shuffle(alla).slice(0,3)));}
    else{const sm=o[0].toLowerCase(),extra=shuffle(BOKST.split("").filter(c=>!sm.includes(c))).slice(0,2);U.delar=sm.split("");U.brickor=shuffle(U.delar.concat(extra));}
    return U;});}

/* ---------- Skärmar ---------- */
const stjHtml=n=>[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("");
function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);if(window.MPS)MPS.visa(id);}
function hem(){rensa();tyst();
  $("niv").innerHTML=[1,2,3].map(l=>`<button data-l="${l}"><span class="nr" style="background:${NIV[l].col}">${l}</span><span><b>${NIV[l].namn}</b><small>${NIV[l].txt}</small></span><span class="st">${stjHtml(data.stars[l]||0)}</span></button>`).join("");
  show("home");}
$("niv").onclick=e=>{const b=e.target.closest("[data-l]");if(b)starta(+b.dataset.l);};
/* engelsk röst, bara när man trycker på 🔊. Finns ingen röst i enheten visas ordet i text i stället. */
let enVoice=null;const kanTala="speechSynthesis" in window;
function laddaRoster(){try{const v=speechSynthesis.getVoices();enVoice=v.find(x=>/^en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
if(kanTala){laddaRoster();speechSynthesis.onvoiceschanged=laddaRoster;}
function tyst(){try{kanTala&&speechSynthesis.cancel()}catch(e){}}
function lasUpp(t){if(!kanTala)return;tyst();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(enVoice)u.voice=enVoice;u.rate=.8;speechSynthesis.speak(u);}
$("hor").onclick=()=>{if(!G||!G.tal)return;lasUpp(G.tal);if(G.U&&!G.last&&(G.U.typ==="lyssna"||G.U.typ==="hor")){G.lyssnat=true;$("hor").classList.remove("stor");ritaFraga();}};

/* ---------- Spelet ---------- */
let G=null,tim=[];
const rensa=()=>{tim.forEach(clearTimeout);tim=[];};
const ljud=n=>{window.Ljud&&Ljud[n]&&Ljud[n]();};
function starta(lvl){G={lvl,N:NIV[lvl],i:0,fel:0,res:[],kv:gorRunda(lvl),retries:0};$("nivT").textContent=NIV[lvl].namn;show("game");nasta();}
function prickar(){$("dots").innerHTML=G.kv.map((_,j)=>`<i class="${j<G.i?(G.res[j]?"ok":"f"):j===G.i?"nu":""}"></i>`).join("");}
function fb(t,c){$("forkl").textContent=t||"";$("forkl").className="forkl"+(c?" "+c:"");}
const facit=U=>`${U.en} = ${U.sv}.`;
function ritaFraga(){const U=G.U,q=$("q");
  if(U.typ==="lyssna"||U.typ==="hor"){const visa=!kanTala||G.visaOrd;
    q.innerHTML=visa?`${U.typ==="hor"?"Vad betyder":"Hitta"}<b>${U.en}</b>`:(G.lyssnat?(U.typ==="hor"?"Vad betyder det?":"Vilken bild var det?"):"Tryck och lyssna")+`<b>${G.lyssnat?"🎧":"Listen!"}</b>`;}
  else if(U.typ==="las")q.innerHTML=`Hitta<b>${U.en}</b>`;
  else if(U.typ==="bygg")q.innerHTML=G.lvl===3?`Skriv på engelska<b>${U.sv}</b>`:`Bygg ordet på engelska`;
  else q.innerHTML=`Para ihop<b>engelska och svenska</b>`;}
function nasta(){rensa();tyst();if(G.i>=G.kv.length){slut();return;}
  const U=G.U=G.kv[G.i];G.forsok=0;G.felNu=false;G.last=false;G.lyssnat=false;G.visaOrd=false;G.vald=[];G.par={en:null,sv:null,klara:0,miss:0};prickar();fb("");
  $("nasta").hidden=true;$("klar").hidden=U.typ!=="bygg";$("klar").disabled=true;
  const ljudUpp=U.typ==="lyssna"||U.typ==="hor",h=$("hor");
  G.tal=ljudUpp?U.en:"";h.hidden=!(ljudUpp&&kanTala);h.classList.toggle("stor",ljudUpp);
  ritaFraga();ritaYta();}
function ritaYta(){const U=G.U,y=$("yta");
  if(U.typ==="lyssna"||U.typ==="las")y.innerHTML=`<div class="rutor" id="rutor">${U.val.map((o,i)=>`<button data-i="${i}" aria-label="Bild ${i+1}">${bildHtml(o[2])}</button>`).join("")}</div>`;
  else if(U.typ==="hor")y.innerHTML=`<div class="val" id="val">${U.val.map((s,i)=>`<button data-i="${i}">${s}</button>`).join("")}</div>`;
  else if(U.typ==="para")y.innerHTML=`<div class="par" id="par">${U.en.map((e,i)=>`<button class="en" data-en="${i}">${e}</button><button data-sv="${i}">${U.sv[i]}</button>`).join("")}</div>`;
  else{y.innerHTML=`${U.bild?`<div class="storbild">${bildHtml(U.bild)}</div>`:""}<div class="luckor${U.ordvis?" ordvis":""}" id="luckor"></div><div class="brickor${U.ordvis?" ordvis":""}" id="brickor"></div>`;ritaBygg();}}
function ritaBygg(){const U=G.U;
  $("luckor").innerHTML=U.delar.map((_,i)=>{const b=G.vald[i];return `<button data-ut="${i}" class="${b!=null?"full":""}" aria-label="Plats ${i+1}">${b!=null?U.brickor[b]:"&nbsp;"}</button>`;}).join("");
  $("brickor").innerHTML=U.brickor.map((t,i)=>`<button data-in="${i}" class="${G.vald.includes(i)?"tagen":""}">${t}</button>`).join("");
  $("klar").disabled=G.vald.filter(v=>v!=null).length!==U.delar.length;}
function avsluta(visaLjud){const U=G.U;if(G.felNu&&!U.igen)G.fel++;G.res[G.i]=!G.felNu;G.i++;G.last=true;prickar();
  $("klar").hidden=true;$("nasta").hidden=false;$("nasta").focus({preventScroll:true});
  if(U.typ!=="para"&&kanTala){G.tal=U.en;$("hor").hidden=false;$("hor").classList.remove("stor");}
  if(!G.felNu)tim.push(setTimeout(nasta,2600));}
function igenSist(){if(G.retries<3){G.retries++;const U=G.U;G.kv.push(Object.assign({},U,{igen:true}));}}
function skaka(el){el.classList.remove("skaka");void el.offsetWidth;el.classList.add("skaka");}
/* Tryck i ytan: bilder, betydelser, par, bokstäver */
$("yta").onclick=e=>{if(!G||G.last)return;const U=G.U,b=e.target.closest("button");if(!b)return;
  if(U.typ==="lyssna"||U.typ==="las"||U.typ==="hor"){if(b.dataset.i==null)return;const i=+b.dataset.i,ratt=U.typ==="hor"?U.val[i]===U.sv:U.val[i][0]===U.en,box=b.parentNode;
    if(ratt){b.classList.add("ratt");box.classList.add("last");ljud("ok");G.visaOrd=true;ritaFraga();fb("Rätt! ✓ "+facit(U),"ratt");avsluta();return;}
    G.felNu=true;ljud("bad");b.classList.add("fel");skaka(b);
    if(G.forsok===0){G.forsok=1;const f=U.typ==="hor"?null:U.val[i];
      /* efter första felet visas ordet i text, så att ingen fastnar utan ljud */
      G.visaOrd=true;ritaFraga();fb(f?`Det där är ${f[0]} (${f[1]}). Prova igen!`:"Inte riktigt. Nu ser du orden. Prova igen!","fel");return;}
    [...box.children].forEach((x,j)=>{if(U.typ==="hor"?U.val[j]===U.sv:U.val[j][0]===U.en)x.classList.add("ratt");});box.classList.add("last");
    fb("Så här är det: "+facit(U),"fel");igenSist();avsluta();return;}
  if(U.typ==="para"){const P=G.par,sida=b.dataset.en!=null?"en":b.dataset.sv!=null?"sv":null;if(!sida||b.classList.contains("parad"))return;
    P[sida]=+b.dataset[sida];[...$("par").children].forEach(x=>x.classList.remove("fel"));
    if(P.en==null||P.sv==null){[...$("par").querySelectorAll(`[data-${sida}]`)].forEach(x=>x.classList.toggle("vald",x===b));return;}
    const eb=$("par").querySelector(`[data-en="${P.en}"]`),sb=$("par").querySelector(`[data-sv="${P.sv}"]`),en=U.en[P.en],sv=U.sv[P.sv],par=U.par.find(p=>p[0]===en);
    eb.classList.remove("vald");sb.classList.remove("vald");P.en=P.sv=null;
    if(par[1]===sv){eb.classList.add("parad");sb.classList.add("parad");ljud("ok");P.klara++;fb(`${en} = ${sv}`,"ratt");
      if(P.klara===U.par.length){fb(G.felNu?"Alla par klara!":"Rätt! ✓ Alla par klara.","ratt");avsluta();}return;}
    G.felNu=true;P.miss++;ljud("bad");eb.classList.add("fel");sb.classList.add("fel");skaka(eb);skaka(sb);
    fb(P.miss>1?`Inte ett par. ${en} = ${par[1]}.`:"Inte ett par. Prova igen!","fel");return;}
  /* bygg: tryck på en bricka för att lägga den på första lediga plats, tryck på platsen för att ta bort */
  if(b.dataset.in!=null){const i=+b.dataset.in;if(G.vald.includes(i))return;let p=0;while(p<U.delar.length&&G.vald[p]!=null)p++;if(p>=U.delar.length)return;G.vald[p]=i;}
  else if(b.dataset.ut!=null){G.vald[+b.dataset.ut]=null;}else return;
  $("luckor").className="luckor"+(U.ordvis?" ordvis":"");window.Ljud&&Ljud.glod&&Ljud.glod("tick");ritaBygg();};
function klar(){if(!G||G.last||G.U.typ!=="bygg")return;const U=G.U,L=$("luckor"),svar=U.delar.map((_,i)=>G.vald[i]==null?null:U.brickor[G.vald[i]]);
  if(svar.some(s=>s==null))return;const fel=svar.map((s,i)=>s!==U.delar[i]);
  if(!fel.some(Boolean)){L.classList.add("ratt");ljud("ok");fb("Rätt! ✓ "+facit(U),"ratt");avsluta();return;}
  G.felNu=true;ljud("bad");skaka(L);
  if(G.forsok===0){G.forsok=1;[...L.children].forEach((x,i)=>x.classList.toggle("fel",fel[i]));
    fb(U.ordvis?"Inte riktigt. De röda orden står fel. Tryck på dem för att ta bort dem.":"Inte riktigt. De röda bokstäverna står fel. Tryck på dem för att ta bort dem.","fel");return;}
  /* andra felet: visa rätt ord */
  const kvar=U.brickor.map((_,i)=>i);G.vald=U.delar.map(d=>{const k=kvar.findIndex(i=>U.brickor[i]===d);return kvar.splice(k,1)[0];});ritaBygg();$("luckor").classList.add("ratt");
  fb("Så här stavas det: "+facit(U),"fel");igenSist();avsluta();}
$("klar").onclick=klar;$("nasta").onclick=nasta;
document.addEventListener("keydown",e=>{if(!G||$("game").hidden)return;
  if(e.key==="Enter"){e.preventDefault();if(!$("nasta").hidden)nasta();else klar();return;}
  if(G.last||G.U.typ!=="bygg"||G.U.ordvis)return;
  if(e.key==="Backspace"){e.preventDefault();for(let p=G.U.delar.length-1;p>=0;p--)if(G.vald[p]!=null){G.vald[p]=null;break;}ritaBygg();return;}
  const k=e.key.toLowerCase();if(k.length!==1)return;const i=G.U.brickor.findIndex((t,j)=>t===k&&!G.vald.includes(j));if(i<0)return;
  const knapp=$("brickor").querySelector(`[data-in="${i}"]`);if(knapp)knapp.click();});

function slut(){rensa();const st=G.fel===0?3:G.fel<=2?2:1,old=data.stars[G.lvl]||0;data.stars[G.lvl]=Math.max(old,st);save();
  $("rStj").innerHTML=stjHtml(st);$("rRub").textContent=st===3?"Perfect! 🎉":st===2?"Well done!":"Good try!";
  $("rTxt").textContent=`${ROUND-G.fel} av ${ROUND} rätt på ${G.N.namn}.${st<3?" Spela igen och se om du kan få alla rätt!":""}`;
  show("result");if(st===3){ljud("fanfare");confetti();}}
$("rIgen").onclick=()=>starta(G.lvl);$("rHome").onclick=hem;

function confetti(){if(reduced())return;const cols=["#3D8BFD","#FF9F43","#2BB673","#FFC93C","#7B61FF","#FF6B6B"];
  const c=$("fx"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*120,y:H*.3,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*7+5,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(++t<150)requestAnimationFrame(f);else c.hidden=true;})();}
window.__eng={NIV,ORD,FRASER,gorRunda,starta,klar,get G(){return G}};
hem();
