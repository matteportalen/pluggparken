<style>
:root{
  --bg:#EEF6F1; --ink:#1D2B53; --muted:#5E6E8F; --card:#FFFFFF; --line:#D3E6DA;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --ani:clamp(44px,12vw,60px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:600px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none !important}
.back{display:inline-block;color:var(--muted);font-weight:700;text-decoration:none;padding:6px 0;font-size:1rem}
h2{font-size:2rem;line-height:1.1;margin:10px 0 6px;font-weight:800}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.6rem}
.stars .off{color:#D5E3DA}
.ani{width:var(--ani);height:var(--ani);display:block;flex:none;user-select:none;-webkit-user-drag:none}
/* startskärmen */
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(180deg,var(--info-bg,#DDF1FF) 0%,var(--lc-EAF7FF,#EAF7FF) 55%,var(--card,#fff) 100%);box-shadow:0 5px 0 var(--line);padding:22px 18px 0;text-align:center;margin-top:8px}
.hero h1{font-size:2.6rem;line-height:1;margin:0;font-weight:800}
.hero p{margin:6px auto 0;color:var(--muted);font-weight:700;font-size:1.1rem;max-width:22em}
.hill{position:relative;height:118px;margin:14px -18px 0}
.hill::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-60px;height:120px;border-radius:50% 50% 0 0;background:linear-gradient(#8BD3A0,#5DBB7C)}
.peek{position:absolute;bottom:42px;width:66px;height:66px;animation:peek 3.2s ease-in-out infinite}
.peek img{width:100%;height:100%}
.peek b{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:var(--card,#fff);color:var(--accent);font-size:16px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(29,43,83,.15)}
@keyframes peek{0%,100%{transform:translateY(10px)}50%{transform:translateY(-4px)}}
.ex{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:1.6rem;margin:16px 0 4px}
.ex img{width:44px;height:44px}
.ex small{display:block;color:var(--muted);font-size:1rem;font-weight:700}
/* nivåerna */
.levels{display:grid;gap:10px;margin-top:16px}
.lv{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 14px 10px 10px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lv .ex{flex:none;width:150px;margin:0;display:flex;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:1.05rem;background:var(--lc-EAF5EE,#EAF5EE);border-radius:12px;padding:6px 6px;white-space:nowrap;min-height:48px}
.lv .ex img{width:30px;height:30px}.lv .ex.tre img{width:26px;height:26px}
.lv .lt{flex:1;min-width:0}
.lv b{display:block;font-size:1.12rem;line-height:1.15}
.lv small{display:block;color:var(--muted);font-weight:700;font-size:.85rem}
.lv .stars{flex:none;font-size:1.2rem}
@media(max-width:420px){.lv{gap:8px;padding-right:10px}.lv .ex{width:124px;font-size:.92rem}.lv .ex img{width:25px;height:25px}.lv .ex.tre{gap:1px}.lv .ex.tre img{width:21px;height:21px}.lv .stars{font-size:1rem;letter-spacing:1px}}
/* bokstäverna (nivå 4–6) */
.vx{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-weight:700;color:var(--accent);padding:0 .04em}
.ans .vx.bokst{display:grid;place-items:center;font-size:calc(var(--ani)*.8);line-height:1;padding-bottom:.08em}
.feedback .vx,.tip .vx{font-size:1.15em}
.pr{display:inline-flex;align-items:center;gap:6px}.pr.tat{gap:1px}.pi{display:inline-flex;align-items:center;gap:4px 9px;padding:0 3px 0 0}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.9em}
.frac>span{padding:0 .15em}.frac>span+span{border-top:3px solid currentColor;width:100%;text-align:center}
.feedback .frac,.tip .frac{font-size:.85em}.feedback .frac>span+span,.tip .frac>span+span{border-top-width:2px}
.rows.bok .row{gap:4px 9px}
/* spelet */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--lc-CFE3D6,#CFE3D6)}
.dots i.on{background:var(--accent);transform:scale(1.25)}.dots i.done{background:var(--good)}
.spk{flex:none;width:42px;height:42px;border-radius:50%;background:var(--card);font-size:1.2rem;box-shadow:0 3px 0 var(--line)}
.tip{text-align:center;color:var(--muted);font-weight:700;font-size:1rem;margin:6px 0 2px;min-height:0}
.rows{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 10px;min-height:calc(var(--ani) + 18px);border-radius:20px;background:var(--card);box-shadow:0 4px 0 var(--line);padding:8px 14px;font-weight:800;font-size:clamp(1.5rem,6.5vw,2rem);line-height:1;transition:background .3s}
.row .op{color:#A3B3C9;font-weight:700}
.row.done{background:var(--lc-E6F6EC,#E6F6EC);box-shadow:0 4px 0 #C4E7D1}
.row.flash{background:var(--err-bg,#FFE3E5);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.slot{display:inline-grid;place-items:center;min-width:1.9em;height:1.45em;padding:0 .2em;border:3px dashed #AFC0E8;border-radius:12px;background:var(--card,#fff);color:var(--accent);line-height:1}
.slot.sel{border:3px solid var(--accent);box-shadow:0 0 0 4px rgba(61,90,254,.15)}
.slot.ok{border:3px solid var(--good);color:var(--ok-ink,var(--good-dark));background:var(--ok-bg,#E3F7EC);box-shadow:none}
.slot.bad{border:3px solid var(--bad);background:var(--err-bg,#FFE3E5);color:var(--bad)}
.slot.shown{border:3px solid #E9A23B;color:#9A5B00;background:var(--lc-FFF4DE,#FFF4DE);box-shadow:none}
.ask{text-align:center;font-weight:800;color:var(--muted);font-size:1rem;margin:16px 0 6px}
.answers{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.ans{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border-radius:18px;padding:8px 4px 10px;box-shadow:0 4px 0 var(--line);border:3px solid transparent;transition:transform .15s}
.ans.sel{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 6px 0 var(--lc-C9D3FB,#C9D3FB)}
.ans .slot{font-weight:800;font-size:1.45rem}
.ans.hop .ani{animation:hop .55s ease-out}
.ans.nej .ani{animation:nej .45s}
@keyframes hop{35%{transform:translateY(-14px) scale(1.08)}}
@keyframes nej{20%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
.row .ani{width:calc(var(--ani)*.92);height:calc(var(--ani)*.92)}
.mi{width:1.5em;height:1.5em;vertical-align:-.45em;display:inline-block}
.feedback{min-height:1.5em;font-weight:800;font-size:1.05rem;margin:12px 0;text-align:center;color:var(--ok-ink,var(--good-dark));line-height:1.5}
.feedback.hint{background:var(--err-bg,#FFE9EC);color:var(--err-ink,#9B2C3A);border-radius:14px;padding:8px 12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:52px;border-radius:16px;background:var(--card);font-size:1.7rem;font-weight:800;box-shadow:0 4px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .okbtn{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-dark);font-size:1.4rem}
.go{display:block;width:100%;padding:14px 16px;border-radius:18px;background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-dark);font-weight:800;font-size:1.35rem;margin-top:14px}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--good-dark)}
.result{text-align:center;padding-top:20px}
.rani{display:flex;justify-content:center;gap:6px;margin:6px 0}
.rani img{width:56px;height:56px;animation:peek 2.4s ease-in-out infinite}
.rani img:nth-child(2){animation-delay:.3s}.rani img:nth-child(3){animation-delay:.6s}
.rbig{font-size:clamp(3.2rem,16vw,4.6rem);font-weight:800;line-height:1;margin:6px 0}
.rbig .stars{font-size:inherit}
.rsub{color:var(--muted);font-size:1.15rem;margin:0 0 14px}
.big{display:block;width:100%;padding:12px 16px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.2rem;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sel,var(--ink));color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:6;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
@media (min-width:700px){.ask{font-size:1.1rem}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
<section id="home" class="screen">
  <div class="hero">
    <h1>Gömda tal</h1>
    <p>Varje djur har gömt ett tal. Kan du lista ut vilka?</p>
    <div class="ex" id="ex"></div>
    <div class="hill" id="hill"></div>
  </div>
  <div class="levels" id="levels"></div>
</section>
<section id="game" class="screen" hidden>
  <div class="gtop"><button class="back" id="quit">← Avsluta</button><span class="dots" id="dots"></span><button class="spk" id="spk" aria-label="Läs upp">🔊</button></div>
  <p class="tip" id="tip"></p>
  <div class="rows" id="rows"></div>
  <p class="ask" id="ask">Vilket tal är djuret? Tryck på ett djur och skriv.</p>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del" aria-label="Sudda">⌫</button><button data-k="0">0</button><button data-k="ok" class="okbtn">OK</button>
  </div>
  <button class="go" id="next" hidden>Nästa ➜</button>
</section>
<section id="result" class="screen result" hidden>
  <div class="rani" id="rAni"></div>
  <h2 id="rTitle"></h2>
  <div class="rbig" id="rBig"></div>
  <p class="rsub" id="rSub"></p>
  <button class="go" id="rAgain">Spela igen</button>
  <button class="big" id="rHome">Tillbaka</button>
</section>
</div>
<div class="toast" id="toast" hidden></div>
<canvas id="fx" hidden></canvas>
<script src="../ljud.js"></script>
<script src="../djur.js"></script>
<script src="../huvud.js" data-titel="Gömda tal" data-ikon="🎁"></script>
<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const KEY="mattespel-gomda-v1";
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const ROUND=5;

/* ---------- Sakerna ---------- */
// djurhuvuden från Kenneys Animal Pack Remastered (CC0, bilder/LICENS.txt): [fil, namn, bestämd form]
const SAKER=[["chick","kyckling","kycklingen"],["pig","gris","grisen"],["frog","groda","grodan"],["chicken","höna","hönan"],["panda","panda","pandan"],["penguin","pingvin","pingvinen"],
  ["parrot","papegoja","papegojan"],["hippo","flodhäst","flodhästen"],["monkey","apa","apan"],["elephant","elefant","elefanten"],["giraffe","giraff","giraffen"],["rabbit","kanin","kaninen"]];
// djur som liknar varandra kommer aldrig i samma uppgift
const LIKA=[["chick","giraffe"],["elephant","rabbit"],["chick","chicken"]];
const IMG=f=>`bilder/${f}.webp`,img=(s,cls)=>`<img class="${cls||"ani"}" src="${IMG(s.f)}" alt="${s.name}" draggable="false">`;
const stor=t=>t.charAt(0).toUpperCase()+t.slice(1);

/* ---------- Nivåerna ----------
   1–3 med djur (bara addition), 4–6 med bokstäver x, y, z (mellanstadiet, Lgr22: obekanta tal betecknade med en symbol, enkla ekvationer).
   Nivå 3 är den gamla övningen; dess stjärnor ligger kvar i stars.mix. */
const NIVAER=[
 {id:"n1",nr:1,namn:"Två djur",ak:1,stil:"djur",ks:[2,2,2,2,2],o:{vmax:5,smax:10,first:[2,2,1],cn:[1],both:0,q:0,add:.3,olds2:0}},
 {id:"n2",nr:2,namn:"Tre djur",ak:2,stil:"djur",ks:[3,3,3,3,3],o:{vmax:10,smax:20,first:[2,2,3],cn:[1,1,2],both:.2,q:.3,add:.25,olds2:.3}},
 {id:"mix",nr:3,namn:"Tre eller fyra djur",ak:3,stil:"djur",ks:null,o:{vmax:10,smax:32,first:[2,3,3],cn:[1,1,2],both:.25,q:.4,add:.25,olds2:.5}},
 {id:"n4",nr:4,namn:"x och y",ak:4,stil:"gang",ks:[2,2,3,3,null]},
 {id:"n5",nr:5,namn:"Kortare skrivsätt",ak:5,stil:"kort",ks:[2,3,3,3,null]},
 {id:"n6",nr:6,namn:"Båda sidor och parenteser",ak:6,stil:"kort6",ks:[2,2,3,3,null]}];
const BOKST=["x","y","z"];
const isL=()=>G&&G.niv.stil!=="djur";

/* ---------- Uppgifterna ----------
   Raderna byggs i en ordning där varje rad har exakt en ny okänd sak, så det finns alltid en väg att lösa dem
   en i taget (och svaret är entydigt). Sedan blandas raderna. En rad är {L,R}. Delar:
   {s:i} sak (c = antal, t.ex. 3x), {n:tal}, {q:true} (frågan), {par:{c,t:[delar]}} = c(…), {fr:{s,d}} = bråk x/d; m:true = minus framför. */
function val(it,v){const b=it.par?it.par.c*rowW(it.par.t,v):it.fr?v[it.fr.s]/it.fr.d:it.s!=null?(it.c||1)*v[it.s]:it.n!=null?it.n:0;return it.m?-b:b;}
const rowW=(side,v)=>side.reduce((s,it)=>s+val(it,v),0);
const varsOf=side=>side.flatMap(it=>it.par?varsOf(it.par.t):it.fr?[it.fr.s]:it.s!=null?[it.s]:[]);
const rowVars=r=>[...varsOf(r.L),...varsOf(r.R)];
// djur (nivå 1–3): som förut, med nivåns gränser
function gen(k,o){
  for(;;){const saker=shuffle(SAKER.slice()).slice(0,k).map(([f,name,def])=>({f,name,def}));
    if(LIKA.some(([a,b])=>saker.some(x=>x.f===a)&&saker.some(x=>x.f===b)))continue;
    const v=shuffle([...Array(o.vmax).keys()].map(i=>i+1)).slice(0,k);saker.forEach((s,i)=>s.v=v[i]);
    const rows=[];
    for(let j=0;j<k;j++){
      if(j===0){const c=pickOne(o.first),add=c===1||Math.random()<o.add?rnd(1,o.vmax<=5?4:6):0,L=[];for(let i=0;i<c;i++)L.push({s:0});if(add)L.push({n:add});
        rows.push({L,R:[{n:c*v[0]+add}]});continue;}
      const cn=pickOne(o.cn);
      if(Math.random()<o.both){const oo=rnd(0,j-1),n=cn*v[j]-v[oo];
        if(n>=1){const L=[];for(let i=0;i<cn;i++)L.push({s:j});rows.push({L,R:shuffle([{s:oo},{n}])});continue;}}
      const olds=shuffle([...Array(j).keys()]).slice(0,j>=2&&Math.random()<o.olds2?2:1),L=[];
      for(let i=0;i<cn;i++)L.push({s:j});olds.forEach(x=>L.push({s:x}));shuffle(L);
      if(Math.random()<o.add)L.push({n:rnd(1,5)}); // talet står sist, då är raden lättare att läsa
      rows.push({L,R:[{n:rowW(L,v)}]});}
    if(rows.some(r=>Math.max(rowW(r.L,v),rowW(r.R,v))>o.smax))continue;
    rows.forEach(r=>{if(r.R.length===1&&r.R[0].n!=null&&Math.random()<.25)[r.L,r.R]=[r.R,r.L];});
    const shuffled=blanda(rows);
    let q=null;
    if(Math.random()<o.q){const pick=shuffle([...Array(k).keys()]).slice(0,Math.min(k,rnd(2,3))),L=pick.map(i=>({s:i}));
      if(Math.random()<.3)L.push({s:pick[0]});q=rowW(shuffle(L),v);if(q>o.smax)continue;shuffled.push({L,R:[{q:true}],q:true});}
    return{saker,rows:shuffled,qAns:q};}}
// aldrig i lösningsordning: raden att börja med ska letas fram
function blanda(rows){const s=shuffle(rows.slice());if(s.length>1&&s.every((r,i)=>r===rows[i]))[s[0],s[1]]=[s[1],s[0]];return s;}

// bokstäver (nivå 4–6). Varje mall får den nya bokstaven j och de kända; ger {L,R} eller null om talen inte passar.
const S_=(s,c,m)=>{const o={s};if(c>1)o.c=c;if(m)o.m=true;return o;},N_=(n,m)=>m?{n,m:true}:{n};
const MALL={
 4:{first:[
    (v,j)=>{const c=rnd(2,5);return{L:[S_(j,c)],R:[N_(c*v[j])]};},
    (v,j)=>{const a=rnd(2,9);return{L:[S_(j),N_(a)],R:[N_(v[j]+a)]};},
    (v,j)=>{const a=rnd(1,v[j]-1);return a>=1&&v[j]>a?{L:[S_(j),N_(a,true)],R:[N_(v[j]-a)]}:null;}],
  next:[
    (v,j,o)=>({L:shuffle([S_(j),S_(o)]),R:[N_(v[j]+v[o])]}),
    (v,j,o)=>{const c=rnd(2,4);return{L:[S_(j,c),S_(o)],R:[N_(c*v[j]+v[o])]};},
    (v,j,o)=>v[j]>v[o]?{L:[S_(j),S_(o,1,true)],R:[N_(v[j]-v[o])]}:v[o]>v[j]?{L:[S_(o),S_(j,1,true)],R:[N_(v[o]-v[j])]}:null,
    (v,j,o)=>{const c=rnd(2,3),n=c*v[j]-v[o];return n>=1?{L:[S_(j,c)],R:[S_(o),N_(n)]}:null;}]},
 5:{first:[
    (v,j)=>{const c=rnd(2,6),a=rnd(1,9);return{L:[S_(j,c),N_(a)],R:[N_(c*v[j]+a)]};},
    (v,j)=>{const c=rnd(2,5),a=rnd(1,c*v[j]-1);return{L:[S_(j,c),N_(a,true)],R:[N_(c*v[j]-a)]};},
    (v,j)=>{const c=rnd(3,8);return{L:[S_(j,c)],R:[N_(c*v[j])]};}],
  next:[
    (v,j,o)=>{const c=rnd(2,4),d=rnd(1,3);return{L:[S_(j,c),S_(o,d)],R:[N_(c*v[j]+d*v[o])]};},
    (v,j,o)=>{const c=rnd(2,4),n=c*v[j]-v[o];return n>=1?{L:[S_(j,c),S_(o,1,true)],R:[N_(n)]}:null;},
    (v,j,o,o2)=>o2!=null?{L:shuffle([S_(j),S_(o),S_(o2)]),R:[N_(v[j]+v[o]+v[o2])]}:null,
    (v,j,o)=>{const c=rnd(2,4),a=c*v[j]-v[o];return a>=1?{L:[S_(j,c)],R:[S_(o),N_(a)]}:null;}]},
 6:{first:[
    (v,j)=>{const a=rnd(3,6),c=rnd(1,a-1),b=rnd(1,9),d=b+(a-c)*v[j];return{L:[S_(j,a),N_(b)],R:[S_(j,c),N_(d)]};},
    (v,j)=>{const c=rnd(2,5),a=rnd(1,6);return{L:[{par:{c,t:[S_(j),N_(a)]}}],R:[N_(c*(v[j]+a))]};},
    (v,j)=>{const ds=[2,3,4,5].filter(d=>v[j]%d===0);if(!ds.length)return null;const d=pickOne(ds),a=rnd(1,8);return{L:[{fr:{s:j,d}},N_(a)],R:[N_(v[j]/d+a)]};}],
  next:[
    (v,j,o)=>{const a=rnd(2,4),c=a-1,n=a*v[j]+v[o]-c*v[j];return{L:[S_(j,a),S_(o)],R:[S_(j,c),N_(n)]};},
    (v,j,o)=>{const c=rnd(2,4);return v[j]>v[o]?{L:[{par:{c,t:[S_(j),S_(o,1,true)]}}],R:[N_(c*(v[j]-v[o]))]}:{L:[{par:{c,t:[S_(j),S_(o)]}}],R:[N_(c*(v[j]+v[o]))]};},
    (v,j,o)=>{const ds=[2,3,4,5].filter(d=>v[j]%d===0);if(!ds.length)return null;const d=pickOne(ds);return{L:[{fr:{s:j,d}},S_(o)],R:[N_(v[j]/d+v[o])]};},
    (v,j,o)=>{const c=rnd(2,4),d=rnd(2,3),n=c*v[j]-d*v[o];return n>=1?{L:[S_(j,c),S_(o,d,true)],R:[N_(n)]}:null;}]}};
function genL(k,niv){const M=MALL[niv],vmax=niv===4?10:niv===5?12:15;
  for(let f=0;f<500;f++){const saker=BOKST.slice(0,k).map(b=>({L:true,name:b,def:b}));
    // bokstäverna i ordning x, y, z, men den som ska lösas först är slumpad
    const ord=shuffle([...Array(k).keys()]);
    const v=Array(k);shuffle([...Array(vmax).keys()].map(i=>i+1)).slice(0,k).forEach((x,i)=>v[i]=x);saker.forEach((s,i)=>s.v=v[i]);
    const rows=[];let okk=true;
    for(let jj=0;jj<k&&okk;jj++){const j=ord[jj],kanda=shuffle(ord.slice(0,jj));let r=null;
      for(let t=0;t<12&&!r;t++)r=jj===0?pickOne(M.first)(v,j):pickOne(M.next)(v,j,kanda[0],kanda[1]);
      if(!r)okk=false;else rows.push(r);}
    if(!okk)continue;
    if(rows.some(r=>[r.L,r.R].some(s=>rowW(s,v)<1||rowW(s,v)>99||s.some(it=>it.n!=null&&it.n<1))))continue;
    rows.forEach(r=>{if(r.R.length===1&&r.R[0].n!=null&&Math.random()<.2)[r.L,r.R]=[r.R,r.L];});
    const shuffled=blanda(rows);let q=null;
    if(Math.random()<.3){const a=rnd(0,k-1),b=(a+rnd(1,k-1))%k,c=niv===4?1:rnd(1,3),L=[S_(a,c),S_(b)];if(niv===4&&Math.random()<.5)L[0]=S_(a,2);
      q=rowW(L,v);if(q<=99)shuffled.push({L,R:[{q:true}],q:true});else q=null;}
    return{saker,rows:shuffled,qAns:q};}
  throw Error("genL");}

/* ---------- Skärmar ---------- */
const starHtml=n=>`<span class="stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`;
function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);if(window.MPS)MPS.visa(id);}
let G=null;
const vx=b=>`<i class="vx">${b}</i>`,mini=f=>`<img src="${IMG(f)}" alt="">`;
function exHtml(n){const a=EXDJ;
  return n===1?`${mini(a[0])}<span>+</span>${mini(a[0])}<span>= 6</span>`:n===2?`${mini(a[0])}<span>+</span>${mini(a[1])}<span>= 7</span>`:n===3?`${mini(a[0])}<span>+</span>${mini(a[1])}<span>+</span>${mini(a[2])}<span>= 12</span>`
    :`<span>${n===4?`3 · ${vx("x")} = 21`:n===5?`3${vx("x")} + 4 = 19`:`2${vx("x")} + 3 = ${vx("x")} + 10`}</span>`;}
function openHome(){G=null;if("speechSynthesis" in window)speechSynthesis.cancel();
  $("levels").innerHTML=NIVAER.map(l=>`<button class="lv" data-l="${l.nr}" aria-label="${l.namn}, passar årskurs ${l.ak}"><span class="ex${l.nr===3?" tre":""}">${exHtml(l.nr)}</span><span class="lt"><b>${l.namn}</b><small>Passar åk ${l.ak}</small></span>${starHtml(data.stars[l.id]||0)}</button>`).join("");
  show("home");}
$("levels").onclick=e=>{const b=e.target.closest("[data-l]");if(b)start(+b.dataset.l);};
// startskärmen: fyra djur tittar upp bakom kullen, och ett litet exempel
const EXDJ=shuffle(["pig","frog","panda","penguin","monkey","hippo"]).slice(0,3);
{const a=shuffle(SAKER.slice()).slice(0,5),xs=[8,30,56,80];
  $("hill").innerHTML=xs.map((x,i)=>`<span class="peek" style="left:calc(${x}% - 33px);animation-delay:${i*.45}s"><img src="${IMG(a[i][0])}" alt=""><b>?</b></span>`).join("");
  const e=a[4];$("ex").innerHTML=`<img src="${IMG(e[0])}" alt="${e[1]}"><span>+</span><img src="${IMG(e[0])}" alt="${e[1]}"><span>= 8</span>`;}
// rundan: fem uppgifter
function start(nr){const niv=NIVAER.find(l=>l.nr===nr)||NIVAER[2];
  const ks=niv.ks?niv.ks.map(k=>k==null?pickOne([2,3]):k):[3,3,4,4,pickOne([3,4])];
  G={niv,ks:shuffle(ks),n:ROUND,i:0,err:0};show("game");next();}
function tipText(){const n=G.niv.nr;
  if(n<=3)return "Samma djur är alltid samma tal. Börja med raden där du kan räkna ut något.";
  if(n===4)return `Nu har de gömda talen blivit bokstäver: ${img({f:"pig",name:"gris"},"mi")} blir ${vx("x")}. Samma bokstav är alltid samma tal.`;
  if(n===5)return `3${vx("x")} betyder 3 · ${vx("x")}. Samma bokstav är alltid samma tal.`;
  return `2(${vx("x")} + 3) betyder 2 · (${vx("x")} + 3). ${frac(vx("x"),2)} betyder ${vx("x")} delat med 2. ${vx("x")} kan stå på båda sidor.`;}
function next(){if(G.i>=G.n)return finish();
  const k=G.ks[G.i],t=G.niv.stil==="djur"?gen(k,G.niv.o):genL(k,G.niv.nr);G.t=t;G.known=t.saker.map(()=>false);G.shown=t.saker.map(()=>false);G.tries={};G.inp="";G.bad=false;
  // svarsrutorna i blandad ordning (sakerna skapas i lösningsordning, och det ska inte avslöjas var man börjar).
  // Bokstäverna står alltid x, y, z; där är lösningsordningen redan slumpad.
  let ord;if(isL())ord=[...Array(k).keys()];else do{ord=shuffle([...Array(k).keys()]);}while(k>1&&ord.every((x,i)=>x===i));G.ord=ord;
  G.qDone=false;G.qShown=false;G.sel=ord[0];G.done=false;G.flash=-1;
  $("dots").innerHTML=Array.from({length:G.n},(_,i)=>`<i class="${i<G.i?"done":i===G.i?"on":""}"></i>`).join("");
  $("tip").innerHTML=G.i===0?tipText():"";
  $("ask").textContent=isL()?"Vilket tal är bokstaven? Tryck på en bokstav och skriv.":"Vilket tal är djuret? Tryck på ett djur och skriv.";
  $("rows").classList.toggle("bok",isL());
  $("next").hidden=true;$("pad").hidden=false;fb("");draw();}
const slots=()=>G.t.saker.length+(G.t.qAns!=null?1:0);
const isQ=i=>i===G.t.saker.length;
const solved=i=>isQ(i)?G.qDone:G.known[i];
function fb(msg,hint){const f=$("feedback");f.innerHTML=msg;f.className="feedback"+(hint?" hint":"");}

/* ---------- Rita ---------- */
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const nm=(s,cls)=>s.L?vx(s.name):img(s,cls);
// "Grisen är 7" / "x är 7"
const ar=(s,v)=>s.L?`${vx(s.name)} är ${v}`:`${img(s,"mi")} ${stor(s.def)} är ${v}`;
function slotHtml(i){const sel=G.sel===i&&!G.done,cls=solved(i)?((isQ(i)?G.qShown:G.shown[i])?"shown":"ok"):sel?(G.bad?"bad":"sel"):"";
  const txt=solved(i)?(isQ(i)?G.t.qAns:G.t.saker[i].v):sel&&G.inp!==""?G.inp:" ";
  return `<span class="slot ${cls}">${txt}</span>`;}
// talet skrivs inte ut vid djuren i raderna: eleven håller det i huvudet (lärarens val)
function itemHtml(it){const t=G.t;
  if(it.n!=null)return `<span>${it.n}</span>`;if(it.q)return slotHtml(t.saker.length);
  if(it.par)return `<span class="pr tat">${it.par.c}(<span class="pi">${sideHtml(it.par.t)}</span>)</span>`;
  if(it.fr)return frac(nm(t.saker[it.fr.s]),it.fr.d);
  const s=t.saker[it.s];if(!s.L)return img(s);
  return it.c>1?(G.niv.stil==="gang"?`<span class="pr">${it.c}<span class="op">·</span>${vx(s.name)}</span>`:`<span class="pr tat">${it.c}${vx(s.name)}</span>`):vx(s.name);}
const sideHtml=side=>side.map((it,i)=>(i?`<span class="op">${it.m?"−":"+"}</span>`:it.m?'<span class="op">−</span>':"")+itemHtml(it)).join("");
const rowDone=r=>rowVars(r).every(i=>G.known[i])&&(!r.q||G.qDone);
function draw(){const t=G.t;
  $("rows").innerHTML=t.rows.map((r,i)=>`<div class="row${i===G.flash?" flash":rowDone(r)?" done":""}" ${r.q?'data-q="1"':""}>${sideHtml(r.L)}<span class="op">=</span>${sideHtml(r.R)}</div>`).join("");
  const qr=document.querySelector(".row[data-q]");if(qr)qr.onclick=()=>pick(t.saker.length);
  $("answers").style.setProperty("--n",G.ord.length);
  $("answers").innerHTML=G.ord.map(i=>{const s=t.saker[i];return`<button class="ans${G.sel===i&&!G.done&&!solved(i)?" sel":""}" data-a="${i}" aria-label="${s.name}">${s.L?`<i class="vx ani bokst">${s.name}</i>`:img(s)}${slotHtml(i)}</button>`;}).join("");
  document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>pick(+b.dataset.a));}
function anim(i,c){requestAnimationFrame(()=>{const b=document.querySelector(`.ans[data-a="${i}"]`);if(b){b.classList.remove(c);void b.offsetWidth;b.classList.add(c);}});}
function pick(i){if(!G||G.done||solved(i))return;if(G.sel!==i){G.sel=i;G.inp="";G.bad=false;G.flash=-1;fb("");}draw();}
function flash(ri){G.flash=ri;draw();setTimeout(()=>{if(G&&G.flash===ri){G.flash=-1;draw();}},1300);}

/* ---------- Svara ---------- */
function key(k){if(!G||G.done)return;const i=G.sel;if(solved(i))return;
  if(k==="del"){if(G.bad){G.bad=false;fb("");}G.inp=G.inp.slice(0,-1);draw();return;}
  if(k==="ok"){if(G.inp!=="")check(i,+G.inp);return;}
  if(G.bad){G.bad=false;G.inp="";fb("");}
  if(G.inp.length<2){G.inp=(G.inp==="0"?"":G.inp)+k;draw();}}
function nextSlot(){const o=G.ord.concat(slots()>G.t.saker.length?[G.t.saker.length]:[]),p=o.indexOf(G.sel);for(let d=1;d<=o.length;d++){const j=o[(p+d)%o.length];if(!solved(j))return j;}return -1;}
// raden med talen insatta: "3 · 4 + 5", "2 · (4 + 3)"
function subTxt(it,vals){if(it.n!=null)return it.n;if(it.par)return `${it.par.c} · (${numTxt(it.par.t,vals)})`;if(it.fr)return frac(vals[it.fr.s],it.fr.d);
  return it.c>1?`${it.c} · ${vals[it.s]}`:vals[it.s];}
const numTxt=(side,vals)=>side.map((it,i)=>(i?(it.m?" − ":" + "):it.m?"−":"")+subTxt(it,vals)).join("");
const fmt=x=>Number.isInteger(x)?x:String(Math.round(x*10)/10).replace(".",",");
function check(i,v){const t=G.t,vals=t.saker.map(s=>s.v);
  if(isQ(i)){const qi=t.rows.findIndex(r=>r.q),qr=t.rows[qi];
    if(v===t.qAns){G.qDone=true;ok(`Rätt! ${numTxt(qr.L,vals)} = ${t.qAns}.`);return;}
    G.err++;G.tries.q=(G.tries.q||0)+1;window.Ljud&&Ljud.bad&&Ljud.bad();G.bad=true;
    const miss=[...new Set(varsOf(qr.L).filter(x=>!G.known[x]))].map(x=>nm(t.saker[x],"mi"));
    if(miss.length){flash(qi);fb(`Ta först reda på ${miss.join(" och ")}. Sedan kan du räkna ut raden.`,true);return;}
    if(G.tries.q>=2){G.qDone=true;G.qShown=true;ok(`Det blir ${numTxt(qr.L,vals)} = ${t.qAns}.`,true);return;}
    flash(qi);fb(`Räkna: ${numTxt(qr.L,vals)} = ?`,true);return;}
  const s=t.saker[i];
  if(v===s.v){G.known[i]=true;anim(i,"hop");ok(`Rätt! ${ar(s,s.v)}.`);return;}
  G.err++;window.Ljud&&Ljud.bad&&Ljud.bad();G.bad=true;anim(i,"nej");
  // en rad där allt annat redan är känt: där syns varför talet inte stämmer
  const can=r=>!r.q&&rowVars(r).includes(i)&&rowVars(r).every(x=>x===i||G.known[x]);
  const ri=t.rows.findIndex(can);
  if(ri<0){draw();fb(s.L?`Det går inte att räkna ut ${vx(s.name)} än. Hitta en rad där bara en bokstav är okänd.`:`Det går inte att räkna ut ${img(s,"mi")} än. Hitta en rad där du vet allt utom en sak.`,true);return;}
  G.tries[i]=(G.tries[i]||0)+1;const r=t.rows[ri];
  if(G.tries[i]>=2){G.known[i]=true;G.shown[i]=true;flash(ri);ok(`${ar(s,s.v)}: ${numTxt(r.L,vals)} = ${numTxt(r.R,vals)}.`,true);return;}
  const tv=vals.slice();tv[i]=v;const l=rowW(r.L,tv),rr=rowW(r.R,tv);
  const one=side=>side.length===1&&side[0].n!=null;
  let msg;
  if(one(r.R))msg=`Om ${nm(s,"mi")} är ${v} blir ${numTxt(r.L,tv)} = ${fmt(l)}, men det ska vara ${fmt(rr)}.`;
  else if(one(r.L))msg=`Om ${nm(s,"mi")} är ${v} blir ${numTxt(r.R,tv)} = ${fmt(rr)}, men det ska vara ${fmt(l)}.`;
  else msg=`Om ${nm(s,"mi")} är ${v} blir det ${fmt(l)} på ena sidan och ${fmt(rr)} på den andra. Det ska vara lika mycket.`;
  flash(ri);fb(msg,true);}
function ok(msg,shown){G.inp="";G.bad=false;
  if(!shown){window.Ljud&&Ljud.ok&&Ljud.ok();}
  const nx=nextSlot();
  if(nx<0){G.done=true;$("pad").hidden=true;draw();
    window.Ljud&&Ljud.chime&&Ljud.chime();fb(`${msg} Du hittade alla gömda tal! 🎉`,shown);G.i++;$("dots").querySelectorAll("i").forEach((d,j)=>d.className=j<G.i?"done":"");
    setTimeout(()=>{if(G&&G.done){$("next").hidden=false;$("next").focus({preventScroll:true});}},450);return;}
  G.sel=nx;draw();fb(msg,shown);}
$("next").onclick=()=>{if(G)next();};
document.querySelectorAll("#pad button").forEach(b=>b.onclick=()=>key(b.dataset.k));
document.addEventListener("keydown",e=>{if(!G||$("game").hidden)return;
  if(G.done){if(e.key==="Enter"&&!$("next").hidden){e.preventDefault();$("next").click();}return;}
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==="Backspace"){e.preventDefault();key("del");}else if(e.key==="Enter"){e.preventDefault();key("ok");}
  else if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const nx=nextSlot();if(nx>=0)pick(nx);}});

function finish(){const id=G.niv.id,st=G.err===0?3:G.err<=2?2:1,old=data.stars[id]||0;
  data.stars[id]=Math.max(old,st);data.played=(data.played||0)+1;save();
  $("rTitle").textContent=st===3?"Alla rätt direkt!":"Alla gömda tal hittade!";
  $("rBig").innerHTML=starHtml(st);
  $("rSub").textContent=(G.err===0?`${G.n} uppgifter utan ett enda fel.`:`${G.n} uppgifter. Du svarade fel ${G.err} ${G.err===1?"gång":"gånger"}.`)+(st>old&&old?" Nytt rekord!":"");
  $("rAni").innerHTML=shuffle(SAKER.slice()).slice(0,3).map(a=>`<img src="${IMG(a[0])}" alt="">`).join("");
  show("result");if(st===3||st>old){window.Ljud&&Ljud.fanfare&&Ljud.fanfare();confetti();}}
$("rAgain").onclick=()=>start(G.niv.nr);$("rHome").onclick=openHome;$("quit").onclick=openHome;

/* ---------- Uppläsning (bara med 🔊) ---------- */
let svVoice=null;function loadVoices(){try{svVoice=speechSynthesis.getVoices().find(v=>/^sv/i.test(v.lang))||null}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function speak(text){if(!("speechSynthesis" in window))return toast("Uppläsning fungerar inte i den här webbläsaren.");loadVoices();
  if(!svVoice&&speechSynthesis.getVoices().length)return toast("Den här datorn har ingen svensk röst för uppläsning.");
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="sv-SE";if(svVoice)u.voice=svVoice;u.rate=.9;speechSynthesis.speak(u);}
$("spk").onclick=()=>{if(!G)return;const t=G.t,
  ord=it=>{if(it.n!=null)return it.n;if(it.q)return "tom ruta";if(it.par)return `${it.par.c} gånger parentes ${say(it.par.t)} parentes slut`;
    if(it.fr)return `${t.saker[it.fr.s].name} delat med ${it.fr.d}`;const s=t.saker[it.s];return it.c>1?`${it.c} ${G.niv.stil==="gang"?"gånger ":""}${s.name}`:s.name;},
  say=side=>side.map((it,i)=>(i?(it.m?" minus ":" plus "):it.m?"minus ":"")+ord(it)).join("");
  speak((isL()?"Samma bokstav är alltid samma tal. ":"Samma djur är alltid samma tal. ")+t.rows.map(r=>`${say(r.L)} är lika med ${say(r.R)}.`).join(" "));};

function confetti(){
  if(reduced())return;
  const cols=["#3D8BFD","#FF9F43","#2BB673","#FFC93C","#7B61FF","#FF6B6B"];
  const c=$("fx"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*120,y:H*.3,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*7+5,c:pickOne(cols),a:Math.random()*6,va:(Math.random()-.5)*.4}));
  const t0=performance.now();(function f(now){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(now-t0<2800)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true;}})(t0);
}
openHome();
</script>
