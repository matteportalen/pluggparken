<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const R=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const KEY="mattespel-vattenkretslopp-v1";
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const ljud=n=>{window.Ljud&&Ljud[n]&&Ljud[n]();};
const NIV=[null,
 {namn:"Följ droppen",txt:"Följ en vattendroppe från havet runt hela kretsloppet.",col:"#2BA8E8"},
 {namn:"Laborera",txt:"Ändra solen och temperaturen och se vad som händer.",col:"#2BB673"},
 {namn:"Gissa först",txt:"Vad händer med molnen, regnet och floden? Gissa först.",col:"#7B61FF"}];
const stjHtml=n=>[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("");
function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);if(window.MPS)MPS.visa(id);}
function hem(){stoppa();$("niv").innerHTML=[1,2,3].map(l=>`<button data-l="${l}"><span class="nr" style="background:${NIV[l].col}">${l}</span><span><b>${NIV[l].namn}</b><small>${NIV[l].txt}</small></span><span class="st">${l===2?"":stjHtml(data.stars[l]||0)}</span></button>`).join("");show("home");}
$("niv").onclick=e=>{const b=e.target.closest("[data-l]");if(b)starta(+b.dataset.l);};

/* ======================= SIMULERINGEN (se docs/vattenkretslopp.md) ======================= */
const W=360,H=240,N=300;
const FLOD0=[[254,101],[243,111],[229,116],[217,128],[199,136],[188,147],[168,153],[150,160],[128,157.5]];
/* mjuk kurva (Catmull-Rom) genom punkterna, 64 delar: används både av ritningen och av flodPos */
const FLOD=(()=>{const P0=FLOD0,o=[],g=i=>P0[Math.max(0,Math.min(P0.length-1,i))];for(let i=0;i<P0.length-1;i++)for(let k=0;k<8;k++){const t=k/8,a=g(i-1),b=g(i),c=g(i+1),d=g(i+2),f=(q)=>.5*((2*b[q])+(-a[q]+c[q])*t+(2*a[q]-5*b[q]+4*c[q]-d[q])*t*t+(-a[q]+3*b[q]-3*c[q]+d[q])*t*t*t);o.push([f(0),f(1)]);}o.push(P0[P0.length-1]);return o;})();
const slopY=x=>x<=290?160-(x-140)*.6:70+(x-290)*1.14;
const flodPos=u=>{const n=FLOD.length-1,f=Math.min(.9999,Math.max(0,u))*n,i=Math.floor(f),t=f-i;return[lerp(FLOD[i][0],FLOD[i+1][0],t),lerp(FLOD[i][1],FLOD[i+1][1],t)];};
const varme=T=>T<=0?.12:.05+.95*Math.min(1,T/35);
let P={sun:.7,temp:15},parts=[],klock=0,haendelser=0;
function nytt(opt){opt=opt||{};parts=[];const mk=(st,n)=>{for(let i=0;i<n;i++)parts.push(ny(st));};mk("H",N-26-14-10-(opt.snö||0));mk("M",26);mk("F",14);mk("V",10);mk("L",opt.snö||0);klock=0;haendelser=0;}
function ny(st){const p={st,t:R(0,3),d:R(3.5,5.5),x:R(8,112),ph:R(0,6.28),cx:R(205,295),cy:R(36,62),tx:R(215,285),ty:0,y:R(2,60),o:R(-3,3)};p.ty=slopY(p.tx)+R(3,16);if(st==="F")p.d=R(5,8);if(st==="L")p.ty=slopY(p.tx)-R(1,4);return p;}
function steg(dt){klock+=dt;const w=varme(P.temp),pE=.018*P.sun*w,pR=.07,pM=P.temp>0?.06*Math.min(1,.3+P.temp/10):0;
  for(const p of parts){switch(p.st){
    case"H":if(Math.random()<pE*dt){p.st="V";p.t=0;p.d=R(3.5,5.5);p.x=R(8,112);p.cx=R(205,295);p.cy=R(36,62);}break;
    case"V":p.t+=dt;if(p.t>=p.d){p.st="M";p.t=0;}break;
    case"M":if(Math.random()<pR*dt){p.st=P.temp<=0?"S":"R";p.t=0;p.d=R(.9,1.6);p.cx=R(215,285);p.tx=p.cx+R(-8,8);p.ty=slopY(p.tx)+R(3,16);p.cy=R(60,70);haendelser++;}break;
    case"R":p.t+=dt;if(p.t>=p.d){p.st="F";p.t=0;p.d=R(5,8);}break;
    case"S":p.t+=dt;if(p.t>=p.d){p.st="L";p.ty=slopY(p.tx)-R(1,4);}break;
    case"L":if(pM&&Math.random()<pM*dt){p.st="F";p.t=0;p.d=R(5,8);}break;
    case"F":p.t+=dt;if(p.t>=p.d){p.st="H";p.t=0;p.x=R(8,112);p.y=R(2,60);}break;}}}
const antal=()=>{const c={H:0,V:0,M:0,R:0,S:0,L:0,F:0};for(const p of parts)c[p.st]++;return c;};
/* kör utan ritning: returnerar medelvärden och haendelser */
function kor(pp,T,opt){opt=opt||{};const old=P;P=Object.assign({},pp);if(opt.snö!=null)nytt({snö:opt.snö});else nytt();const hist=[];let t=0;if(opt.fore){P=Object.assign({},opt.fore.P);for(;t<opt.fore.T;t+=.1)steg(.1);P=Object.assign({},pp);t=0;}haendelser=0;for(;t<T;t+=.1){steg(.1);if(Math.round(t*10)%10===0)hist.push(antal());}const r={hist,hae:haendelser,slut:antal()};P=old;return r;}
const medel=(h,a,b,k)=>{const s=h.slice(a,b);return s.reduce((x,c)=>x+c[k],0)/Math.max(1,s.length);};

/* ======================= RITNING ======================= */
const cv=$("cv"),ctx=cv.getContext("2d");let DPR=1;
function storlek(){const r=cv.getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);cv.width=Math.max(10,Math.round(r.width*DPR));cv.height=Math.max(10,Math.round(r.width*DPR*2/3));}
new ResizeObserver(storlek).observe(cv);
/* Scenen målas i lager: himmel, sol, fjärran kust, berg (klippa, snö, skog), flod, hav, strand, förgrund.
   VIS är utjämnade värden ur simuleringen så att bilden inte flimrar. Geometrin (hav x<126, molnet vid 250,52, toppen 290,66, FLOD) får inte flyttas: nivå 1 och simuleringen använder den. */
const VIS={snow:0,cloud:1,river:1,frost:0,night:0,hav:1},LVL0=156;let LVL=LVL0;
const cl01=x=>Math.max(0,Math.min(1,x)),mixA=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),rgb=a=>`rgb(${a.map(Math.round).join(",")})`,rgba=(a,al)=>`rgba(${a.map(Math.round).join(",")},${al})`;
function visUpd(dt){const c=antal(),k=Math.min(1,dt*3.5),e=(key,v)=>{VIS[key]+=(v-VIS[key])*k;};e("snow",cl01(c.L/85));e("cloud",G&&G.lvl===1?Math.max(1.15,c.M/26):c.M/26);e("river",Math.min(1.6,(c.F+c.R*.3)/13));e("frost",P.temp<=0?1:0);e("night",1-cl01(P.sun/.25));e("hav",c.H/(N*.8));LVL=LVL0+16*cl01(1-VIS.hav);}
const shoreX=y=>126-(y-157)*.36;
const rnd=(()=>{let a=7;return()=>{a=(a*16807)%2147483647;return a/2147483647;};})();
const MTN=[[126,157],[140,159],[165,146],[190,130],[214,116],[240,99],[265,83],[281,72],[290,66],[299,77],[312,90],[326,109],[344,129],[360,146]];
function mtnPath(c){c.beginPath();c.moveTo(96,240);c.lineTo(MTN[0][0],MTN[0][1]);for(let i=1;i<MTN.length-1;i++){const a=MTN[i],b=MTN[i+1];if(i===8||i===7){c.lineTo(a[0],a[1]);continue;}c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}c.lineTo(360,146);c.lineTo(360,240);c.closePath();}
const dSeg=(x,y,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],t=cl01(((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy);};
const TRAD=(()=>{const L=[];let tries=0;while(L.length<34&&tries++<900){const x=146+rnd()*100,y=slopY(x)+5+rnd()*46;if(y>212||y<slopY(x)+4)continue;let near=99;for(let k=0;k<FLOD.length-1;k++)near=Math.min(near,dSeg(x,y,FLOD[k],FLOD[k+1]));if(near<8)continue;if(slopY(x)<92)continue;L.push({x,y,h:6+rnd()*5,t:rnd()});}
  for(let k=0;k<9;k++){const x=300+rnd()*56,y=slopY(x)+14+rnd()*40;L.push({x,y,h:6+rnd()*4,t:rnd(),sk:1});}return L.sort((a,b)=>a.y-b.y);})();
const STJ=Array.from({length:38},()=>[rnd()*360,rnd()*110,.5+rnd()*.9,rnd()*6]);

function nivå2(){P={sun:.7,temp:15};nytt();

const Q=[

 {namn:"Snön smälter",fraga:"Det ligger mycket snö på berget. Sedan blir det varmt. Vad händer med floden?",alt:["Mer vatten i floden","Mindre vatten i floden","Samma som vanligt"],rätt:0,sc:{P:{sun:.7,temp:15},T:30,snö:80,fore:{P:{sun:.7,temp:-8},T:5}},

function fraga(i){G.i=i;const q=Q[i];G.val=null;G.kor=false;prick();P={sun:.7,temp:15};nytt();fart=1;G.paus=false;G.tick=null;G.matar=null;

  $("val").onclick=e=>{const b=e.target.closest("[data-k]");if(!b||G.kor)return;G.val=+b.dataset.k;ljud("pip");$("val").querySelectorAll("button").forEach(x=>x.classList.toggle("v",x===b));$("bKor").disabled=false;$("bKor").textContent="▶ Kör och se";};
