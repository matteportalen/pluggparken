<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
/* startskärmen */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#3D5AFE,#1E9E5E);color:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 #2A3FB8;margin:6px 0 16px}
.hero svg{flex:none;width:104px;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.hero h1{margin:0;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05}
.hero p{margin:6px 0 0;font-weight:600;opacity:.97}
.niv{display:grid;gap:10px}
.niv button{display:flex;align-items:center;gap:14px;background:var(--card,#fff);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.niv button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.niv .nr{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:#fff}
.niv b{display:block;font-size:1.12rem;line-height:1.15}
.niv small{display:block;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.25}
.niv .st{margin-left:auto;flex:none;color:var(--gold);font-size:1.15rem;letter-spacing:1px}
.niv .st .off{color:var(--line)}
/* spelet */
.topp{display:flex;align-items:center;gap:10px;margin:4px 0 6px;min-height:24px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.f{background:var(--bad)}.dots i.nu{background:var(--gold)}
.niva-t{font-weight:800;color:var(--muted);font-size:.9rem}
.fraga{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 8px;min-height:56px}
.fraga .q{text-align:center;font-weight:800;font-size:clamp(1.1rem,4.7vw,1.32rem);line-height:1.2}
.fraga .q small{display:block;font-weight:700;font-size:.82em;color:var(--muted);margin-top:2px}
.hor{flex:none;width:44px;height:44px;border-radius:50%;background:var(--card,#fff);box-shadow:0 3px 0 var(--line);font-size:1.25rem}
.hor:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
/* klassen */
.klass{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:var(--card,#fff);border-radius:20px;box-shadow:0 4px 0 var(--line);padding:10px}
.barn{aspect-ratio:.86;border-radius:12px;background:#F7FAFF;box-shadow:inset 0 0 0 2.5px var(--c,#C6D6F2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1;overflow:hidden}
.barn .an{font-size:clamp(.8rem,3.6vw,1.05rem);opacity:.9}
.barn .an svg{width:1.5em;height:auto;display:block}
.barn .lapp{font-size:clamp(1.15rem,5.6vw,1.6rem)}
.barn.jag{background:#FFF4D6}
.barn.ny{animation:pop .35s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
/* förslagen */
.forslag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.forslag>button,.forslag .fs{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card,#fff);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:8px 4px;font-weight:800;font-size:.98rem;line-height:1.1;text-align:center;border-top:6px solid var(--c)}
.forslag>button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.forslag .em{font-size:1.9rem;line-height:1.1}
.forslag .ratt{box-shadow:0 0 0 4px var(--good),0 4px 0 var(--line)}
.forslag>button.fel{background:#FFE9EC;opacity:.6;pointer-events:none}
.stegare{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:4px}
.forslag>*,.partier>*{min-width:0}
.stegare button{flex:none;width:clamp(30px,8.6vw,40px);height:40px;border-radius:12px;background:#F1F6FF;color:#1D2B53;box-shadow:0 3px 0 var(--line);font-weight:800;font-size:1.4rem;line-height:1}
.stegare button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.stegare b{min-width:1.35em;font-size:1.5rem;color:var(--accent);text-align:center}
.fs.fel{background:#FFF0F1}.fs.fel .stegare b{color:#B4232A}
.fs.ok .stegare b{color:var(--good-dark)}
/* majoritet */
.rad-prickar{position:relative;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;background:var(--card,#fff);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:14px 10px;margin-top:10px}
.rad-prickar i{width:clamp(13px,4.4vw,19px);aspect-ratio:1;border-radius:50%;background:#D7DEEE}
.rad-prickar i.v{background:var(--c)}
.rad-prickar i.halv{margin-right:10px;position:relative}
.rad-prickar i.halv::after{content:"";position:absolute;right:-8px;top:-9px;bottom:-9px;width:3px;border-radius:2px;background:#E5484D}
.janej{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.janej button{min-height:60px;border-radius:18px;color:#fff;font-weight:800;font-size:1.35rem;box-shadow:0 5px 0 rgba(0,0,0,.22);line-height:1.1}
.janej button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.janej button small{display:block;font-size:.62em;font-weight:700;opacity:.95}
.janej .a{background:linear-gradient(180deg,#34C77F,#1E9E5E)}.janej .b{background:linear-gradient(180deg,#7C8DFF,#4A5BE0)}
.janej button.ratt{box-shadow:0 0 0 4px var(--gold),0 5px 0 rgba(0,0,0,.22)}
.janej button.dim{opacity:.4}
.janej.last button{pointer-events:none}
/* kort att sortera */
.sortkort{background:var(--card,#fff);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:16px 14px;text-align:center;font-weight:800;font-size:clamp(1.15rem,5vw,1.4rem);line-height:1.2;min-height:120px;display:grid;place-items:center;transition:box-shadow .2s}
.sortkort .em{display:block;font-size:2.3rem;line-height:1.1;margin-bottom:4px}
.sortkort.ratt{box-shadow:0 0 0 4px var(--good),0 4px 0 var(--line)}
.sortkort.fel{box-shadow:0 0 0 4px #F7A3A6,0 4px 0 var(--line)}
/* ordna stegen */
.steg{display:grid;gap:8px}
.steg button{display:flex;align-items:center;gap:12px;background:var(--card,#fff);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:10px 12px;text-align:left;font-weight:800;font-size:1.06rem;line-height:1.15;min-height:56px}
.steg button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.steg .nr{flex:none;width:34px;height:34px;border-radius:50%;border:3px dashed #AFC0E8;display:grid;place-items:center;font-size:1.15rem;color:#fff}
.steg button.vald .nr{border:0;background:var(--accent)}
.steg button.fel{background:#FFF0F1}.steg button.fel .nr{background:#E8747A}
.steg button.ratt .nr{background:var(--good)}
.steg .em{font-size:1.5rem;flex:none}
/* platser i riksdagen */
.sal{background:var(--card,#fff);border-radius:20px;box-shadow:0 4px 0 var(--line);padding:10px}
.sal svg{display:block;width:100%;height:auto;max-height:22vh}
.partier{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.partier .fs{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--card,#fff);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:8px 4px;font-weight:800;font-size:.95rem;line-height:1.1;text-align:center;border-top:6px solid var(--c)}
.partier .em{font-size:1.6rem;line-height:1.1}
.partier small{color:var(--muted);font-weight:700;font-size:.82rem}
/* tidslinje */
.ar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ar button{min-height:54px;border-radius:16px;background:var(--card,#fff);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.3rem}
.ar button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ar button.val{background:var(--accent);color:#fff;box-shadow:0 4px 0 #2A3FB8;pointer-events:none}
.ar button.ratt{box-shadow:0 0 0 4px var(--good),0 4px 0 var(--line)}
.ar button.fel{background:#FFE9EC;opacity:.6;pointer-events:none}
.ar.last button{pointer-events:none}
/* para ihop */
.par{display:grid;grid-template-columns:1fr 1.25fr;gap:8px 12px}
.par button{min-height:58px;border-radius:16px;background:var(--card,#fff);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1rem;line-height:1.15;padding:6px 10px}
.par button.v{color:var(--accent);font-size:1.08rem}
.par button.vald{background:var(--accent);color:#fff;box-shadow:0 4px 0 #2A3FB8}
.par button.parad{background:#DDF5E7;color:var(--good-dark);box-shadow:0 0 0 3px var(--good);pointer-events:none}
.par button.fel{background:#FFE9EC}
.skaka{animation:skaka .4s}
@keyframes skaka{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.forkl{text-align:center;font-weight:700;margin:10px 0 0;min-height:2.7em;font-size:1.04rem;line-height:1.3}
.forkl.ratt{color:var(--good-dark)}.forkl.fel{color:#B4232A}
.knapprad{display:flex;justify-content:center;gap:10px;margin-top:6px}
.klar,.nasta{background:var(--good);color:#fff;border-radius:18px;padding:10px 30px;font-weight:800;font-size:1.25rem;box-shadow:0 5px 0 var(--good-dark)}
.klar:active{transform:translateY(4px);box-shadow:0 1px 0 var(--good-dark)}
.klar:disabled{opacity:.4;pointer-events:none}
.nasta{background:var(--accent);box-shadow:0 5px 0 #2A3FB8}
.nasta:active{transform:translateY(4px);box-shadow:0 1px 0 #2A3FB8}
@media (max-height:700px){.wrap{padding-bottom:12px}.fraga{min-height:46px;margin-bottom:5px}.klass{gap:4px;padding:7px;grid-template-columns:repeat(9,1fr)}.barn{border-radius:9px}.barn .lapp{font-size:1.1rem}.barn .an{font-size:.72rem}.forslag{margin-top:7px}.forslag .em{font-size:1.5rem}.forkl{min-height:1.4em;margin-top:6px}.steg button{min-height:48px;padding:7px 10px}.par button{min-height:48px}.sortkort{min-height:96px;padding:10px}.janej button{min-height:52px}.stegare button{width:34px;height:34px}}
@media (min-width:700px){.klass{grid-template-columns:repeat(9,1fr)}}
/* resultat */
.res{text-align:center}
.res .stj{font-size:3rem;letter-spacing:6px;color:var(--gold);margin:8px 0}
.res .stj .off{color:var(--line)}
.knapp{display:inline-block;background:var(--good);color:#fff;border-radius:16px;padding:12px 26px;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 var(--good-dark);margin:6px}
.knapp.vit{background:var(--card,#fff);color:var(--ink);box-shadow:0 5px 0 var(--line)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:420px){.hero svg{width:86px}.hero{gap:12px;padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function gorRosta(i){const [fraga,forslag]=FRAGOR[i],n=rnd(11,16),vill=Math.random()<.5;let v,forsok=0;
  /* vinnaren leder alltid med minst två röster, så att elevens egen röst aldrig ger oavgjort */
  do{const a=vill?rnd(Math.floor(n/2)+1,n-3):rnd(Math.ceil(n/3)+1,Math.floor(n/2)),b=rnd(1,n-a-1),c=n-a-b;v=[a,b,c];}while((v[2]<1||v[0]-Math.max(v[1],v[2])<2)&&forsok++<200);
  if(v[2]<1||v[0]-Math.max(v[1],v[2])<2)v=[7,3,2];
  const ordn=shuffle([0,1,2]),roster=[0,0,0];ordn.forEach((k,j)=>roster[k]=v[j]);
  return{fraga,forslag,roster,barn:shuffle(roster.flatMap((r,k)=>Array(r).fill(k))).map((k,j)=>({k,e:BARN[j%BARN.length]}))};}
function gorRunda(lvl){
  if(lvl===1)return shuffle([0,1,2,3,4]).slice(0,3).flatMap(i=>{const R=gorRosta(i);return[{typ:"rosta",R,fri:true},{typ:"rakna",R},{typ:"vinnare",R},{typ:"majoritet",R}];});
  if(lvl===2){const pers=shuffle(VALJARE.slice());const p=[pers.find(x=>x[2]),pers.find(x=>!x[2])];p.push(pers.find(x=>!p.includes(x)));
    const tal=shuffle(ROSTTAL.slice()).slice(0,2),ar=pick([2014,2018,2022,2026]);
    return[{typ:"ordna"}].concat(shuffle(p).map(k=>({typ:"sortera",k,fr:"Får personen rösta i riksdagsvalet?",sm:"Man ska ha fyllt 18 år senast på valdagen.",ja:["Får rösta",""],nej:["Får inte","rösta än"]})),
      tal.map(t=>({typ:"platser",tal:shuffle(t.slice())})),[{typ:"ar",ar},{typ:"para",par:shuffle(STYRE.slice()).slice(0,4),fr:"Vem gör vad?"}]);}
  const r=shuffle(RATT.slice()),rk=[r.find(x=>x[2]),r.find(x=>!x[2])];rk.push(r.find(x=>!rk.includes(x)));
  const d=shuffle(DEMO.slice()),dk=[d.find(x=>x[2]),d.find(x=>!x[2])];dk.push(...d.filter(x=>!dk.includes(x)).slice(0,2));
  return shuffle(rk).map(k=>({typ:"sortera",k,fr:"Rättighet eller önskan?",sm:"En rättighet är något alla barn ska ha.",ja:["Rättighet","alla barn ska ha det"],nej:["Önskan","bra, men inget måste"]}))
    .concat(shuffle(dk).map(k=>({typ:"sortera",k,fr:"Är det demokrati?",sm:"",ja:["Demokrati",""],nej:["Inte","demokrati"]})),[{typ:"para",par:shuffle(BEGREPP.slice()).slice(0,4),fr:"Vad betyder ordet?"}]);}
