<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2; --soft:#F1F6FF;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707; --hero1:#FF9F43; --hero2:#F2780C; --heroS:#B85A06;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --ord:"Andika","Baloo 2",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 var(--heroS);margin:6px 0 16px}
.hero svg{flex:none;width:130px;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.hero h1{margin:0;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05}
.hero p{margin:6px 0 0;font-weight:600;opacity:.95}
.niv{display:grid;gap:10px}
.niv button{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.niv button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.niv .nr{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:#fff}
.niv b{display:block;font-size:1.12rem;line-height:1.15}
.niv small{display:block;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.25}
.niv .st{margin-left:auto;flex:none;color:var(--gold);font-size:1.15rem;letter-spacing:1px}
.niv .st .off{color:var(--line)}
.info{color:var(--muted);font-size:.9rem;margin:14px 2px 0}
.topp{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.f{background:var(--bad)}.dots i.nu{background:var(--gold)}
.niva-t{font-weight:800;color:var(--muted);font-size:.9rem}
.pet{flex:none;width:48px;height:52px;pointer-events:none}.pet svg{width:100%;height:100%}
.pet.hopp{animation:hopp .55s ease}
@keyframes hopp{40%{transform:translateY(-18px)}}
.kort{background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:16px}
.fb{text-align:center;font-weight:700;margin:12px 0 0;min-height:2.6em;font-size:1.05rem}
.fb.ratt{color:var(--good-dark)}.fb.fel{color:#B4232A}
.knapp{display:inline-block;background:var(--good);color:#fff;border-radius:16px;padding:12px 26px;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 var(--good-dark);margin:6px}
.knapp.vit{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.knapp.bla{background:var(--accent);box-shadow:0 5px 0 #2A3FB8}
.knapp:disabled{opacity:.4;pointer-events:none}
.knapp:active{transform:translateY(3px)}
.lyssna{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem;box-shadow:0 2px 0 var(--line)}
.res{text-align:center}
.res .stj{font-size:3rem;letter-spacing:6px;color:var(--gold);margin:8px 0}
.res .stj .off{color:var(--line)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:420px){.hero svg{width:96px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.fraga{text-align:center;font-weight:800;color:var(--muted);margin:0 0 8px;font-size:1rem}
.svar{display:flex;flex-wrap:wrap;gap:8px;min-height:68px;padding:10px 4px;border-bottom:3px dashed var(--line);margin-bottom:12px;align-content:flex-start}
.svar.tom::before{content:"Tryck på orden i rätt ordning";color:var(--muted);font-weight:600;align-self:center;margin:0 auto}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.chip{font-family:var(--ord);font-size:1.3rem;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 14px;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.svar .chip{background:#FFF3E0;border-color:#F2A455;box-shadow:0 3px 0 #F2A455}
.chip.kod{background:#E6F7EE;border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.chip.rosa{background:#FDE7E8;border-color:#F0A3A6;box-shadow:0 3px 0 #F0A3A6}
.marks{display:flex;gap:10px;justify-content:center;margin:0 0 12px}
.marks button{width:60px;height:56px;border-radius:14px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--ord);font-weight:700;font-size:1.8rem}
.marks button.v{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 0 #2A3FB8}
.fix{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px 0 4px}
.fix .chip{padding:8px 12px}
.fix .chip.pa{background:#E3EAFF;border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.fix .mk{font-family:var(--ord);font-size:1.6rem;font-weight:700;align-self:center;padding:0 2px}
.svar .mk{font-family:var(--ord);font-size:1.5rem;font-weight:700;align-self:center;color:var(--accent)}
.rad{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}


.fraga.q1{background:#E3EAFF;color:#2A3FB8}.fraga.q2{background:#FFE7C2;color:#B85A06}.fraga.ok{display:none}

.fraga{font-size:1.6rem;line-height:1.15;font-weight:800;color:var(--ink);margin:0 0 10px;padding:12px 10px;border-radius:16px;background:var(--soft)}
.fraga .ik{display:inline-block;animation:peka 1.2s ease-in-out infinite}
@keyframes peka{50%{transform:translateY(-5px)}}
.fb{font-size:1.3rem;font-weight:800}
.skaka{animation:skaka .45s}
@keyframes skaka{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.puls{animation:puls .6s}
@keyframes puls{40%{transform:scale(1.12)}}
.meng{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 0 14px}
.meng .chip.val1{background:#E3EAFF;border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.meng .chip.val2{background:#FFE7C2;border-color:#F2780C;box-shadow:0 3px 0 #F2780C}
.meng .chip.rtt1{background:#E3EAFF;border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.meng .chip.rtt2{background:#FFE7C2;border-color:#F2780C;box-shadow:0 3px 0 #F2780C}
.meng .chip[disabled]{cursor:default}
.fb small{display:block;font-weight:600;color:var(--muted)}
.leg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-weight:700;font-size:.95rem;margin-top:4px}
.leg i{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-2px;margin-right:5px;border:2px solid}

</style>
</head>

<main class="wrap">

<section class="screen" id="home">
  <div class="hero">
    <svg viewBox="0 0 120 64" aria-hidden="true"><rect x="2" y="2" width="116" height="60" rx="10" fill="#fff"/><g font-family="Andika, Baloo 2, sans-serif" font-weight="700" font-size="13" text-anchor="middle"><rect x="8" y="12" width="48" height="22" rx="8" fill="#E3EAFF" stroke="#3D5AFE" stroke-width="2"/><text x="32" y="28" fill="#1D2B53">Katten</text><rect x="62" y="12" width="48" height="22" rx="8" fill="#FFE7C2" stroke="#F2780C" stroke-width="2"/><text x="86" y="28" fill="#1D2B53">sover</text></g><text x="60" y="54" text-anchor="middle" font-family="Andika, sans-serif" font-weight="800" font-size="11" fill="#56668F">vem? vad gör den?</text></svg>
    <div><h1>Vem gör vad?</h1><p>Tryck på orden!</p></div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const KEY="mattespel-vemgorvad-v1";
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const NIV_UNUSED=[null].concat([{"namn": "Nivå 1: Ordning", "txt": "Sätt orden i rätt ordning. Stor bokstav och punkt är med.", "col": "#2BB673"}, {"namn": "Nivå 2: Skiljetecken", "txt": "Ordning och rätt tecken på slutet: punkt, frågetecken eller utropstecken.", "col": "#FF9F43"}, {"namn": "Nivå 3: Stor bokstav", "txt": "Ordning, tecken och stor bokstav i början och på namn.", "col": "#7B61FF"}]);
const stjHtml=n=>[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("");
function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);if(window.MPS)MPS.visa(id);}
function hem(){
  $("niv").innerHTML=[1,2,3].map(l=>`<button data-l="${l}"><span class="nr" style="background:${NIV[l].col}">${l}</span><span><b>${NIV[l].namn}</b><small>${NIV[l].txt}</small></span><span class="st">${stjHtml(data.stars[l]||0)}</span></button>`).join("");
  if(window.speechSynthesis)speechSynthesis.cancel();show("home");}
$("niv").onclick=e=>{const b=e.target.closest("[data-l]");if(b)begin(+b.dataset.l);};
// uppläsning bara när man trycker (svensk röst)
let svVoice=null;function laddaRoster(){try{svVoice=speechSynthesis.getVoices().find(v=>/^sv/i.test(v.lang))||null}catch(e){}}
if("speechSynthesis" in window){laddaRoster();speechSynthesis.onvoiceschanged=laddaRoster;}
function lasUpp(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="sv-SE";if(svVoice)u.voice=svVoice;u.rate=.9;speechSynthesis.speak(u);}
function prickar(n,i,res){$("dots").innerHTML=Array.from({length:n},(_,j)=>`<i class="${j<i?(res[j]?"ok":"f"):j===i?"nu":""}"></i>`).join("");}
function haj(){const p=$("pet");if(!p)return;p.classList.remove("hopp");void p.offsetWidth;p.classList.add("hopp");}
function resultat(st,txt){const old=data.stars[G.lvl]||0;data.stars[G.lvl]=Math.max(old,st);save();
  $("rStj").innerHTML=stjHtml(st);$("rRub").textContent=st===3?"Perfekt! 🎉":st===2?"Bra jobbat!":"Bra kämpat!";$("rTxt").textContent=txt;
  show("result");if(st===3){window.Ljud&&Ljud.fanfare&&Ljud.fanfare();confetti();}else window.Ljud&&Ljud.chime&&Ljud.chime();}
$("rIgen").onclick=()=>begin(G.lvl);$("rHome").onclick=hem;
function confetti(){if(reduced())return;const cols=["#3D8BFD","#FF9F43","#2BB673","#FFC93C","#7B61FF","#FF6B6B"];
  const c=$("fx"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*120,y:H*.3,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*7+5,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(++t<150)requestAnimationFrame(f);else c.hidden=true;})();}
const NIV=[null].concat([{"namn":"Nivå 1: Vem eller vad?","txt":"Hitta den som gör något i meningen.","col":"#2BB673"},{"namn":"Nivå 2: Vad gör den?","txt":"Hitta ordet som säger vad som händer.","col":"#FF9F43"},{"namn":"Nivå 3: Båda två","txt":"Först den som gör något, sedan vad den gör. Längre meningar.","col":"#7B61FF"}]);
let G=null;

const RUND=8;
/* [ord] = den som gör något (vem eller vad), (ord) = verbet. Skiljetecken står utanför parenteserna. */
const D={
1:["[Katten] (sover) på soffan.","[Hunden] (springer) i parken.","[Mamma] (bakar) en kaka.","[Fåglarna] (sjunger) i trädet.","[Pappa] (läser) en bok.","[Barnen] (leker) på gården.","[Kalle] (äter) ett äpple.","[Fisken] (simmar) i vattnet.","[Kaninen] (gillar) morötter.","[Båten] (gungar) på havet.","[Tåget] (går) till stan.","[Lisa] (ritar) en katt.","[Ugglan] (flyger) på natten.","[Hästen] (äter) hö.","[Pojken] (kastar) bollen.","[Flickan] (cyklar) hem.","[Ormen] (kryper) i gräset.","[Tomas] (gillar) fotboll.","[Kossan] (står) på ängen.","[Solen] (skiner) idag.","[Mormor] (bor) vid sjön.","[Månen] (lyser) på himlen."],
2:["[Jag] (borstar) tänderna.","[Vi] (bygger) ett snöhus.","[Det] (regnar) ute.","[Vi] (badar) i havet.","[Jag] (tvättar) händerna.","[Eleverna] (skriver) i sina böcker.","[Läraren] (läser) en saga.","[Barnen] (åker) pulka i backen.","[Katten] (jagar) en liten mus.","[Traktorn] (kör) över fältet.","[Hunden] (gräver) ett hål.","[Mamma] (lagar) middag.","[Fåglarna] (flyger) söderut.","[Kalle] (målar) en stor bil.","[Vi] (tittar) på en film.","[Pappa] (cyklar) till jobbet.","[Jag] (plockar) blommor.","[Snön] (faller) mjukt.","[Alla] (hjälps) åt.","[Stina] (sjunger) en visa.","[Ugglan] (sitter) i trädet.","[Tåget] (stannar) vid stationen."],
3:["[Den lilla hunden] (springer) snabbt i parken.","[Min storasyster] (spelar) fiol varje dag.","Idag (skiner) [solen] över sjön.","På natten (flyger) [ugglan] genom skogen.","[Pappa och jag] (bakar) bullar på söndagen.","I trädgården (växer) [de röda blommorna].","[Elsa och Oskar] (bygger) en koja.","Efter skolan (cyklar) [vi] till Johan.","[Den stora björnen] (sover) hela vintern.","Varje morgon (äter) [jag] gröt.","[Vår nya lärare] (heter) Nora.","[Hundarna] (hoppar) över staketet.","Ibland (regnar) [det] i flera dagar.","[Fåglarna] (flyger) söderut på hösten.","[Sara och hennes kompis] (tittar) på en film.","På lördagen (kommer) [mormor] på besök.","[Den gamla klockan] (tickar) högt.","I skogen (plockar) [vi] blåbär.","[Det lilla barnet] (skrattar) åt hunden.","Under bordet (sover) [katten]."]};
function parse(line){const toks=[];line.replace(/\[([^\]]+)\]|\(([^)]+)\)([.!?,]?)|([^\s\[\]()]+)/g,(m,s,v,p,o)=>{
  if(s)s.split(" ").forEach(w=>toks.push({t:w,r:1}));else if(v)toks.push({t:v+(p||""),r:2});else toks.push({t:o,r:0});return m;});
  for(let k=toks.length-1;k>0;k--)if(/^[.!?,]+$/.test(toks[k].t)){toks[k-1].t+=toks[k].t;toks.splice(k,1);}   // skiljetecken efter hakparentes hör till ordet före
  return{toks,txt:toks.map(x=>x.t).join(" ")};}
function begin(lvl){G={lvl,i:0,fel:0,res:[],felNu:0,gjort:false};$("nivT").textContent="Nivå "+lvl;$("pet").innerHTML=owlSVG(lasDjur());
  G.set=shuffle(D[lvl].slice()).slice(0,RUND).map(parse);show("game");nasta();}
function nasta(){if(window.speechSynthesis)speechSynthesis.cancel();if(G.i>=RUND){slut();return;}
  G.q=G.set[G.i];G.felNu=0;G.gjort=false;G.steg=G.lvl===2?2:1;G.val=new Set();
  prickar(RUND,G.i,G.res);$("fb").textContent="";$("fb").className="fb";$("bNasta").hidden=true;$("bLas").hidden=true;$("leg").hidden=true;render();}
function fragetext(){return G.steg===1?'<span class="ik">👆</span> Vem gör något?':'<span class="ik">👆</span> Vad gör den?';}
function render(){
  $("fraga").className="fraga "+(G.gjort?"ok":G.steg===1?"q1":"q2");$("fraga").innerHTML=G.gjort?"":fragetext();
  $("meng").innerHTML=G.q.toks.map((x,j)=>{let k="chip";
    if(G.gjort){if(x.r===1)k+=" rtt1";else if(x.r===2)k+=" rtt2";}
    else if(G.rosa&&G.rosa.has(j))k+=" rosa";
    else if(G.val.has(j))k+=G.steg===1?" val1":" val2";
    else if(G.steg===2&&G.klar1&&x.r===1)k+=" rtt1";
    return`<button class="${k}" data-j="${j}"${G.gjort?" disabled":""}>${x.t}</button>`;}).join("");
  $("bKlar").disabled=G.gjort||!G.val.size;}
$("meng").onclick=e=>{const b=e.target.closest("[data-j]");if(!b||G.gjort)return;const j=+b.dataset.j;
  if(G.steg===2){G.val=G.val.has(j)?new Set():new Set([j]);}else{G.val.has(j)?G.val.delete(j):G.val.add(j);}
  window.Ljud&&Ljud.pop&&Ljud.pop(1);render();};
const rent=t=>t.replace(/[.!?,]$/,"");
function skaka(){const m=$("meng");m.classList.remove("skaka");void m.offsetWidth;m.classList.add("skaka");}
function fel(hint){G.felNu++;if(G.felNu===1)G.fel++;window.Ljud&&Ljud.bad&&Ljud.bad();const f=$("fb");
