<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 32px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#F2780C,#F2B707);color:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 #B86A10;margin:6px 0 16px}
.hero .hk{flex:none;width:110px;height:74px;border-radius:14px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.18);background:#14213D}
.hero .hk svg{display:block;width:100%;height:100%}
.hero h1{margin:0;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05}
.hero p{margin:6px 0 0;font-weight:600;opacity:.97}
.niv{display:grid;gap:10px}
.niv button{display:flex;align-items:center;gap:14px;background:var(--card,#fff);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.niv button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.niv .nr{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:#fff}
.niv b{display:block;font-size:1.12rem;line-height:1.15}
.niv small{display:block;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.25}
.niv .st{margin-left:auto;flex:none;color:var(--gold);font-size:1.15rem;letter-spacing:1px}
.niv .st .off{color:var(--line)}
.not{color:var(--muted);font-size:.85rem;font-weight:600;margin:14px 2px 0;line-height:1.3}
.topp{display:flex;align-items:center;gap:10px;margin:4px 0 6px;min-height:24px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.f{background:var(--bad)}.dots i.nu{background:var(--gold)}
.niva-t{font-weight:800;color:var(--muted);font-size:.9rem}
.uppg{background:var(--card,#fff);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:8px 12px;margin-bottom:8px}
.uppg b{display:block;font-size:.8rem;color:var(--muted);line-height:1.1}
.uppg p{margin:2px 0 0;font-weight:800;font-size:1.05rem;line-height:1.2}
.uppg p small{display:block;font-weight:700;font-size:.8rem;color:var(--muted);margin-top:2px}
.bord{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 4px 0 #0B1630;background:#14213D;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bord svg{display:block;width:100%;height:auto;max-height:44vh}
.bord.ratt{box-shadow:0 0 0 4px var(--good),0 4px 0 #0B1630}
.kant{stroke:transparent;stroke-width:36;cursor:pointer}
.tom{stroke:#2E4373;stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round}
.led{stroke:#9FB6E8;stroke-width:4;stroke-linecap:round;fill:none}
.flode{stroke:#FFD84D;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;fill:none;pointer-events:none;filter:drop-shadow(0 0 3px #FFC93C)}
.dd{fill:#14213D;stroke:#6C84BF;stroke-width:2}
.glyf text{font-family:var(--font);font-weight:800;fill:#CFE0FF;text-anchor:middle;pointer-events:none}
.las{stroke:#F2B707}
.skaka{animation:skaka .4s}
@keyframes skaka{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.verk{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
.verk button{background:var(--card,#fff);border-radius:12px;box-shadow:0 3px 0 var(--line);padding:3px 1px 4px;display:flex;flex-direction:column;align-items:center;gap:0;font-weight:800;font-size:.62rem;line-height:1.05;min-width:0}
.verk button svg{width:100%;height:30px;display:block}
.verk button.v{background:var(--accent);color:#fff;box-shadow:0 3px 0 #2A3FB8}
.verk button.v svg *{stroke:#fff}
.verk button:active{transform:translateY(2px)}
.rad2{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.rad2 button{min-height:38px;border-radius:12px;background:var(--card,#fff);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:.9rem;padding:0 12px}
.rad2 button:active{transform:translateY(2px)}
.mat{font-weight:800;font-size:.85rem;color:var(--muted);flex:1;text-align:center;min-width:120px}
.mat.var{color:#B4232A}
.expl{background:#FFF4D6;border-radius:14px;padding:8px 12px;font-weight:700;font-size:.92rem;line-height:1.3;text-align:center;margin-top:8px}
.expl.ok{background:#DDF5E7}.expl.fel{background:#FFE9EC}
.knapprad{display:flex;justify-content:center;gap:10px;margin-top:8px}
.stor{background:var(--good);color:#fff;border-radius:18px;padding:10px 30px;font-weight:800;font-size:1.2rem;box-shadow:0 5px 0 var(--good-dark)}
.stor:disabled{background:#E6ECF8;color:#56668F;box-shadow:0 4px 0 var(--line);pointer-events:none}
.stor.bla{background:var(--accent);box-shadow:0 5px 0 #2A3FB8}
.val3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.val3 button{min-height:54px;border-radius:14px;background:var(--card,#fff);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:.95rem;line-height:1.1;padding:4px 6px}
.val3 button.v{background:var(--accent);color:#fff;box-shadow:0 4px 0 #2A3FB8}
.val3 button.rk{background:#DDF5E7;color:var(--good-dark);box-shadow:0 0 0 3px var(--good)}
.val3 button.rf{background:#FFE9EC;color:#B4232A;opacity:.85}
.val3.last button{pointer-events:none}
@media (min-width:820px){.wrap{max-width:900px}.bord svg{max-height:56vh}.verk button svg{height:38px}.verk button{font-size:.75rem}}
@media (max-height:700px){.bord svg{max-height:34vh}.verk button svg{height:24px}.uppg p small{display:none}.wrap{padding-bottom:12px}}

.res .stj .off{color:var(--line)}
.knapp{display:inline-block;background:var(--good);color:#fff;border-radius:16px;padding:12px 26px;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 var(--good-dark);margin:6px}
.knapp.vit{background:var(--card,#fff);color:var(--ink);box-shadow:0 5px 0 var(--line)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:420px){.hero .hk{width:88px;height:64px}.hero{gap:12px;padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const KEY="mattespel-elkrets-v1";
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const ljud=n=>{window.Ljud&&Ljud[n]&&Ljud[n]();};
const NIV=[null,
 {namn:"Bygg",txt:"Sex utmaningar: lampa, brytare, serie, parallell, kortslutning och motor.",col:"#F2780C"},
 {namn:"Laborera",txt:"Bygg vad du vill och se strömmen. Ingen uppgift.",col:"#1E9ED8"},
 {namn:"Gissa först",txt:"Vad händer med lampan? Gissa, och se sedan om du hade rätt.",col:"#7B61FF"}];
const stjHtml=n=>[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("");
function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);if(window.MPS)MPS.visa(id);}
function hem(){stoppa();$("niv").innerHTML=[1,2,3].map(l=>`<button data-l="${l}"><span class="nr" style="background:${NIV[l].col}">${l}</span><span><b>${NIV[l].namn}</b><small>${NIV[l].txt}</small></span><span class="st">${l===2?"":stjHtml(data.stars[l]||0)}</span></button>`).join("");show("home");}
$("niv").onclick=e=>{const b=e.target.closest("[data-l]");if(b)starta(+b.dataset.l);};

/* ======================= SIMULATORN (se docs/elkrets.md) ======================= */
const COLS=7,ROWS=5,R_LAMP=10,R_MOT=12,R_RES=20,R_W=.02,V_BAT=3,R_BAT=.2,P0=.9;
const ends=k=>{const p=k.split(","),d=p[0],c=+p[1],r=+p[2];return d==="h"?[[c,r],[c+1,r]]:[[c,r],[c,r+1]];};
const nid=(c,r)=>r*COLS+c;
function sim(circ,opt){const n=COLS*ROWS,G=Array.from({length:n},()=>new Float64Array(n)),I=new Float64Array(n),els=[];
  for(const key in circ){const e=circ[key],E=ends(key),a=nid(E[0][0],E[0][1]),b=nid(E[1][0],E[1][1]);let on=e.on;if(opt&&opt.sw!=null&&e.t==="s")on=opt.sw;
    if(e.t==="s"&&!on)continue;
    if(e.t==="w"||e.t==="s")els.push({key,a,b,R:R_W,t:e.t});else if(e.t==="l")els.push({key,a,b,R:R_LAMP,t:"l"});else if(e.t==="r")els.push({key,a,b,R:R_RES,t:"r"});else if(e.t==="m")els.push({key,a,b,R:R_MOT,t:"m"});
    else if(e.t==="b"){const m=e.o>0?a:b,p=e.o>0?b:a;els.push({key,a:m,b:p,R:R_BAT,t:"b",src:V_BAT/R_BAT,o:e.o});}}
  for(const e of els){const g=1/e.R;G[e.a][e.a]+=g;G[e.b][e.b]+=g;G[e.a][e.b]-=g;G[e.b][e.a]-=g;if(e.src){I[e.b]+=e.src;I[e.a]-=e.src;}}
  for(let i=0;i<n;i++)G[i][i]+=1e-9;
  const M=G.map((row,i)=>{const r=Array.from(row);r.push(I[i]);return r;});
  for(let i=0;i<n;i++){let p=i;for(let j=i+1;j<n;j++)if(Math.abs(M[j][i])>Math.abs(M[p][i]))p=j;[M[i],M[p]]=[M[p],M[i]];const d=M[i][i];for(let j=i;j<=n;j++)M[i][j]/=d;
    for(let k=0;k<n;k++)if(k!==i){const f=M[k][i];if(f)for(let j=i;j<=n;j++)M[k][j]-=f*M[i][j];}}
  const v=M.map(r=>r[n]),cur={},lamps=[],motors=[];let ibat=0;
  for(const e of els){let i=(v[e.a]-v[e.b])/e.R;if(e.t==="b"){i+=e.src;ibat=Math.max(ibat,Math.abs(i));cur[e.key]=i*(e.o>0?1:-1);}else{cur[e.key]=i;if(e.t==="m")motors.push({key:e.key,I:Math.abs(i),dir:i});if(e.t==="l"){const P=i*i*R_LAMP;lamps.push({key:e.key,b:Math.min(1,P/P0),I:Math.abs(i)});}}}
  for(const key in circ){if(circ[key].t==="l"&&!lamps.find(l=>l.key===key))lamps.push({key,b:0,I:0});if(circ[key].t==="m"&&!motors.find(m=>m.key===key))motors.push({key,I:0,dir:0});}
  return{v,cur,lamps,motors,ibat,short:ibat>3};}

/* ======================= RITBRÄDAN ======================= */
const SP=50,PX=25,PY=25,VW=350,VH=250;
const pos=(c,r)=>[PX+c*SP,PY+r*SP];
const ALLA=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(c<COLS-1)ALLA.push(`h,${c},${r}`);if(r<ROWS-1)ALLA.push(`v,${c},${r}`);}
const VERK=[["hand","Använd"],["w","Ledning"],["b","Batteri"],["l","Lampa"],["s","Brytare"],["r","Motstånd"],["m","Motor"],["x","Sudd"]];
function glyf(t,o,key,w,ang){const s=(x)=>x;
  if(t==="w")return `<line class="led" x1="-25" y1="0" x2="25" y2="0"/>`;
  if(t==="b")return `<line class="led" x1="-25" y1="0" x2="-5" y2="0"/><line class="led" x1="5" y1="0" x2="25" y2="0"/><line x1="-5" y1="-7" x2="-5" y2="7" stroke="#CFE0FF" stroke-width="4" stroke-linecap="round"/><line x1="5" y1="-13" x2="5" y2="13" stroke="#CFE0FF" stroke-width="3" stroke-linecap="round"/><text x="14" y="-9" font-size="12">+</text><text x="-14" y="-9" font-size="12">−</text>`;
  if(t==="l")return `<line class="led" x1="-25" y1="0" x2="-12" y2="0"/><line class="led" x1="12" y1="0" x2="25" y2="0"/><circle cx="0" cy="0" r="12" fill="#1B2C52" stroke="#9FB6E8" stroke-width="3"/><path d="M-6 6L-3 -5L1 5L5 -6" fill="none" stroke="#9FB6E8" stroke-width="2.2" stroke-linecap="round"/>`;
  if(t==="s")return `<line class="led" x1="-25" y1="0" x2="-13" y2="0"/><line class="led" x1="13" y1="0" x2="25" y2="0"/><circle class="dd" cx="-13" cy="0" r="3.5"/><circle class="dd" cx="13" cy="0" r="3.5"/>`;
  if(t==="m")return `<line class="led" x1="-25" y1="0" x2="-13" y2="0"/><line class="led" x1="13" y1="0" x2="25" y2="0"/><circle cx="0" cy="0" r="13" fill="#1B2C52" stroke="#9FB6E8" stroke-width="3"/><g class="blad"${key?` data-b="${key}" data-w="${w||0}" transform="rotate(${ang||0})"`:""} stroke="#FF9F43" stroke-width="3" stroke-linecap="round"><path d="M0 0L0 -9M0 0L7.8 4.5M0 0L-7.8 4.5"/></g><circle cx="0" cy="0" r="2.2" fill="#CFE0FF"/>`;
  if(t==="r")return `<line class="led" x1="-25" y1="0" x2="-14" y2="0"/><line class="led" x1="14" y1="0" x2="25" y2="0"/><path d="M-14 0L-11 -7L-5 7L1 -7L7 7L11 -7L14 0" fill="none" stroke="#9FB6E8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  return "";}
function ikon(t){const inn=t==="hand"?'<path d="M-6 12V-6a2.5 2.5 0 0 1 5 0V3M-1 3V-9a2.5 2.5 0 0 1 5 0V3M4 3V-7a2.5 2.5 0 0 1 5 0V7c0 7-4 10-9 10S-8 14-8 8V4" fill="none" stroke="#1D2B53" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>':t==="x"?'<path d="M-9 -9L9 9M9 -9L-9 9" stroke="#1D2B53" stroke-width="4" stroke-linecap="round"/>':glyf(t).replace(/#9FB6E8|#CFE0FF/g,"#1D2B53").replace(/class="led"/g,'stroke="#1D2B53" stroke-width="3.5" stroke-linecap="round"').replace(/class="dd"/g,'fill="#fff" stroke="#1D2B53" stroke-width="2"').replace(/<text[^>]*>[^<]*<\/text>/g,"").replace(/fill="#1B2C52"/g,'fill="#FFF3C0"');
  return `<svg viewBox="-27 -16 54 32" aria-hidden="true">${inn}</svg>`;}
/* ritar bräda i elementet host; B = {circ, las:Set, verktyg, onKant(key)} */
function ritaBord(host,B,res){const rad=[];
  for(const key of ALLA){const E=ends(key),[x1,y1]=pos(...E[0]),[x2,y2]=pos(...E[1]);if(!B.circ[key])rad.push(`<line class="tom" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`);}
  const nod=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const [x,y]=pos(c,r);nod.push(`<circle class="dd" cx="${x}" cy="${y}" r="3.2"/>`);}
  const gl=[];
  for(const key in B.circ){const e=B.circ[key],E=ends(key),[x1,y1]=pos(...E[0]),[x2,y2]=pos(...E[1]),mx=(x1+x2)/2,my=(y1+y2)/2,vert=key[0]==="v",rot=vert?90:0;
    let inre=e.t==="m"?glyf("m",0,key,(res&&res.cur[key]||0)*900,angM[key]||0):glyf(e.t);if(e.t==="b"&&e.o<0)inre=`<g transform="scale(-1 1)">${inre}</g>`;
    if(e.t==="l"){const L=res&&res.lamps.find(l=>l.key===key),b=L?L.b:0;if(b>.02){const gl=Math.pow(b,.6);inre=`<circle r="${16+14*gl}" fill="rgba(255,214,80,${.45*gl})"/><circle r="12" fill="rgba(255,243,170,${.35+.65*gl})" stroke="#FFE27A" stroke-width="3"/>`+glyf("l").replace(/<circle[^>]*\/>/,"").replace(/stroke="#9FB6E8" stroke-width="2.2"/,'stroke="#F2780C" stroke-width="2.4"');}}
