name: Publicera Pluggparken

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# En nyare push ersätter en äldre publicering som väntar eller hänger sig, så att en hängande deploy inte blockerar kön.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pure static HTML/JS, including underscore-prefixed pixelfx modules.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8   # en deploy som hänger ska misslyckas snabbt, inte stå kvar i kön
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Väntar högst fem minuter på att Pages blir klar (Pages tillåter tio); concurrency ersätter äldre körningar.
          timeout: 300000
