name: Publicera Pluggparken

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publiceringar köar i stället för att avbryta varandra: en avbruten deployment lever kvar i Pages och får nästa att stå i kö
# (och en ny deployment av samma version återanvänder den avbrutna och avbryts direkt). Högst en väntar, den nyaste.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pure static HTML/JS, including underscore-prefixed pixelfx modules.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      pages: write
      id-token: write
      deployments: read
    environment:
      name: github-pages
      url: https://pluggparken.se/
    steps:
      # Pages vägrar en ny publicering så länge en gammal, nedgiven deployment fortfarande räknas som pågående i GitHubs backend
      # ("due to in progress deployment. Please cancel <sha> first"). Det är därför publiceringen fastnar efter en körning som gett upp.
      # Här avbryts alla tidigare deployments som inte slutade i success innan vi försöker; fel ignoreras (redan klara går inte att avbryta).
      - name: Avbryt gamla deployments som står i vägen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for id in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=8" --jq '.[].id'); do
            st=$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].state' || echo "")
            sha=$(gh api "repos/$REPO/deployments/$id" --jq '.sha')
            if [ "$sha" = "${{ github.sha }}" ]; then continue; fi   # körningens egen deployment ska inte avbrytas
            if [ "$st" != "success" ] && [ "$st" != "inactive" ]; then
              echo "Avbryter $sha (läge: $st)"
              gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" || echo "  (gick inte att avbryta, hoppar över)"
            fi
          done
          sleep 5
      # Ett enda, tåligt försök: Pages kan stå i kö eller synka i flera minuter när något stort ändrats. Omförsök i samma körning
      # fungerar inte (samma version får samma deployment-id och avbryts direkt), men en ny körning en stund senare går igenom.
      - name: Publicera till GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          timeout: 840000
