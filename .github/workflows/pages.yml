name: Publicera Pluggparken

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publiceringar köar i stället för att avbryta varandra: en avbruten deployment lever kvar i Pages och får nästa att stå i kö
# (och en ny deployment av samma version återanvänder den avbrutna och avbryts direkt). Högst en väntar, den nyaste.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pure static HTML/JS, including underscore-prefixed pixelfx modules.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://pluggparken.se/
    steps:
      # Ett enda, tåligt försök: Pages kan stå i kö eller synka i flera minuter när något stort ändrats. Omförsök i samma körning
      # fungerar inte (samma version får samma deployment-id och avbryts direkt), men en ny körning en stund senare går igenom.
      - name: Publicera till GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          timeout: 840000
