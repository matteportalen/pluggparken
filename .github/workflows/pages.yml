name: Publicera Pluggparken

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# En nyare push ersätter en äldre publicering som väntar eller hänger sig, så att en hängande deploy inte blockerar kön.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pure static HTML/JS, including underscore-prefixed pixelfx modules.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8   # en deploy som hänger ska misslyckas snabbt, inte stå kvar i kön
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://pluggparken.se/
    steps:
      # Pages hänger sig ibland i "syncing_files". En frisk publicering är klar på några sekunder, så varje försök får bara 90 sekunder
      # och sedan provar vi om (nytt försök av samma paket) i stället för att vänta fem minuter på ett som ändå inte går igenom.
      - name: Publicera till GitHub Pages (försök 1)
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 90000
      - name: Publicera till GitHub Pages (försök 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 90000
      - name: Publicera till GitHub Pages (försök 3)
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
