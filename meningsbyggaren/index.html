<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2; --soft:#F1F6FF;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707; --hero1:#FF9F43; --hero2:#F2780C; --heroS:#B85A06;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --ord:"Andika","Baloo 2",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 var(--heroS);margin:6px 0 16px}
.hero svg{flex:none;width:130px;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.hero h1{margin:0;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05}
.hero p{margin:6px 0 0;font-weight:600;opacity:.95}
.niv{display:grid;gap:10px}
.niv button{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.niv button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.niv .nr{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:#fff}
.niv b{display:block;font-size:1.12rem;line-height:1.15}
.niv small{display:block;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.25}
.niv .st{margin-left:auto;flex:none;color:var(--gold);font-size:1.15rem;letter-spacing:1px}
.niv .st .off{color:var(--line)}
.info{color:var(--muted);font-size:.9rem;margin:14px 2px 0}
.topp{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.f{background:var(--bad)}.dots i.nu{background:var(--gold)}
.niva-t{font-weight:800;color:var(--muted);font-size:.9rem}
.pet{flex:none;width:48px;height:52px;pointer-events:none}.pet svg{width:100%;height:100%}
.pet.hopp{animation:hopp .55s ease}
@keyframes hopp{40%{transform:translateY(-18px)}}
.kort{background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:16px}
.fb{text-align:center;font-weight:700;margin:12px 0 0;min-height:2.6em;font-size:1.05rem}
.fb.ratt{color:var(--good-dark)}.fb.fel{color:#B4232A}
.knapp{display:inline-block;background:var(--good);color:#fff;border-radius:16px;padding:12px 26px;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 var(--good-dark);margin:6px}
.knapp.vit{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.knapp.bla{background:var(--accent);box-shadow:0 5px 0 #2A3FB8}
.knapp:disabled{opacity:.4;pointer-events:none}
.knapp:active{transform:translateY(3px)}
.lyssna{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem;box-shadow:0 2px 0 var(--line)}
.res{text-align:center}
.res .stj{font-size:3rem;letter-spacing:6px;color:var(--gold);margin:8px 0}
.res .stj .off{color:var(--line)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:420px){.hero svg{width:96px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.fraga{text-align:center;font-weight:800;color:var(--muted);margin:0 0 8px;font-size:1rem}
.svar{display:flex;flex-wrap:wrap;gap:8px;min-height:68px;padding:10px 4px;border-bottom:3px dashed var(--line);margin-bottom:12px;align-content:flex-start}
.svar.tom::before{content:"Tryck på orden i rätt ordning";color:var(--muted);font-weight:600;align-self:center;margin:0 auto}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.chip{font-family:var(--ord);font-size:1.3rem;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 14px;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.svar .chip{background:#FFF3E0;border-color:#F2A455;box-shadow:0 3px 0 #F2A455}
.chip.kod{background:#E6F7EE;border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.chip.rosa{background:#FDE7E8;border-color:#F0A3A6;box-shadow:0 3px 0 #F0A3A6}
.marks{display:flex;gap:10px;justify-content:center;margin:0 0 12px}
.marks button{width:60px;height:56px;border-radius:14px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--ord);font-weight:700;font-size:1.8rem}
.marks button.v{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 0 #2A3FB8}
.fix{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px 0 4px}
.fix .chip{padding:8px 12px}
.fix .chip.pa{background:#E3EAFF;border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.fix .mk{font-family:var(--ord);font-size:1.6rem;font-weight:700;align-self:center;padding:0 2px}
.svar .mk{font-family:var(--ord);font-size:1.5rem;font-weight:700;align-self:center;color:var(--accent)}
.rad{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}

</style>

<g font-family="Andika, Baloo 2, sans-serif" font-weight="700" font-size="13" text-anchor="middle"><rect x="8" y="12" width="48" height="22" rx="8" fill="#FFE7C2" stroke="#F2780C" stroke-width="2"/><text x="32" y="28" fill="#1D2B53">Katten</text>

<rect x="8" y="40" width="30" height="16" rx="6" fill="#fff" stroke="#C6D6F2" stroke-width="2" stroke-dasharray="3 3"/><rect x="44" y="40" width="30" height="16" rx="6" fill="#fff" stroke="#C6D6F2" stroke-width="2" stroke-dasharray="3 3"/><text x="96" y="53" font-size="16" fill="#E5484D">.</text></g></svg>
    <div><h1>Meningsbyggaren</h1><p>Orden är blandade. Bygg meningen, och glöm inte stor bokstav och punkt!</p></div>
  </div>

<section class="screen" id="game" hidden>
  <button type="button" data-home hidden tabindex="-1" aria-hidden="true" onclick="hem()"></button>
  <div class="topp"><div class="dots" id="dots"></div><span class="niva-t" id="nivT"></span><span class="pet" id="pet"></span></div>
  <div class="kort">
    <div class="fraga" id="fraga"></div>

    <div class="marks" id="marks" hidden aria-label="Skiljetecken"><button data-m=".">.</button><button data-m="?">?</button><button data-m="!">!</button></div>

  </div>
  <div class="rad"><button class="knapp vit" id="bOm">Börja om</button><button class="knapp" id="bKlar" disabled>Klar ✓</button><button class="knapp bla" id="bNasta" hidden>Nästa ▶</button></div>
  <div class="fb" id="fb" aria-live="polite"></div>

</section>

  <div class="stj" id="rStj"></div>
  <p id="rTxt" style="font-weight:700;margin:0 0 14px"></p>
  <button class="knapp" id="rIgen">Spela igen</button>
  <button class="knapp vit" id="rHome">Välj nivå</button>
</section>

<canvas id="fx" hidden></canvas>
<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const KEY="mattespel-meningsbyggaren-v1";
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const NIV=[null].concat([{"namn": "Nivå 1: Ordning", "txt": "Sätt orden i rätt ordning. Stor bokstav och punkt är med.", "col": "#2BB673"}, {"namn": "Nivå 2: Skiljetecken", "txt": "Ordning och rätt tecken på slutet: punkt, frågetecken eller utropstecken.", "col": "#FF9F43"}, {"namn": "Nivå 3: Stor bokstav", "txt": "Ordning, tecken och stor bokstav i början och på namn.", "col": "#7B61FF"}]);
const stjHtml=n=>[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("");
function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);if(window.MPS)MPS.visa(id);}
function hem(){
  $("niv").innerHTML=[1,2,3].map(l=>`<button data-l="${l}"><span class="nr" style="background:${NIV[l].col}">${l}</span><span><b>${NIV[l].namn}</b><small>${NIV[l].txt}</small></span><span class="st">${stjHtml(data.stars[l]||0)}</span></button>`).join("");
  if(window.speechSynthesis)speechSynthesis.cancel();show("home");}
$("niv").onclick=e=>{const b=e.target.closest("[data-l]");if(b)begin(+b.dataset.l);};
// uppläsning bara när man trycker (svensk röst)
let svVoice=null;function laddaRoster(){try{svVoice=speechSynthesis.getVoices().find(v=>/^sv/i.test(v.lang))||null}catch(e){}}
if("speechSynthesis" in window){laddaRoster();speechSynthesis.onvoiceschanged=laddaRoster;}
function lasUpp(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="sv-SE";if(svVoice)u.voice=svVoice;u.rate=.9;speechSynthesis.speak(u);}
function prickar(n,i,res){$("dots").innerHTML=Array.from({length:n},(_,j)=>`<i class="${j<i?(res[j]?"ok":"f"):j===i?"nu":""}"></i>`).join("");}
function haj(){const p=$("pet");if(!p)return;p.classList.remove("hopp");void p.offsetWidth;p.classList.add("hopp");}
function resultat(st,txt){const old=data.stars[G.lvl]||0;data.stars[G.lvl]=Math.max(old,st);save();
  $("rStj").innerHTML=stjHtml(st);$("rRub").textContent=st===3?"Perfekt! 🎉":st===2?"Bra jobbat!":"Bra kämpat!";$("rTxt").textContent=txt;
  show("result");if(st===3){window.Ljud&&Ljud.fanfare&&Ljud.fanfare();confetti();}else window.Ljud&&Ljud.chime&&Ljud.chime();}
$("rIgen").onclick=()=>begin(G.lvl);$("rHome").onclick=hem;
function confetti(){if(reduced())return;const cols=["#3D8BFD","#FF9F43","#2BB673","#FFC93C","#7B61FF","#FF6B6B"];
  const c=$("fx"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*120,y:H*.3,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*7+5,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(++t<150)requestAnimationFrame(f);else c.hidden=true;})();}
let G=null;

const RUND=8;
const D={1:["Katten sover på soffan.", "Jag älskar glass.", "Hunden springer i parken.", "Vi åker till skolan.", "Mamma bakar en kaka.", "Fåglarna sjunger i trädet.", "Solen skiner idag.|Idag skiner solen.", "Pappa läser en bok.", "Barnen leker på gården.", "Kalle äter ett äpple.", "Fisken simmar i vattnet.", "Jag borstar tänderna.", "Det regnar ute.|Ute regnar det.", "Kaninen gillar morötter.", "Vi har gympa idag.|Idag har vi gympa.", "Båten gungar på havet.", "Tåget går till stan.", "Lisa ritar en katt.", "Jag har en röd cykel.", "Bilen är blå.", "Ugglan flyger på natten.|På natten flyger ugglan.", "Vi bygger ett snöhus.", "Hästen äter hö.", "Mormor bor vid sjön.", "Månen lyser på himlen.", "Jag tvättar händerna.", "Pojken kastar bollen.", "Vi badar i havet.", "Flickan cyklar hem.", "Snön är kall.", "Ormen kryper i gräset.", "Tomas gillar fotboll.", "Jag ser en stjärna.", "Kossan står på ängen.", "Vi äter middag nu.|Nu äter vi middag."],2:["Vad heter din hund?", "Vilken dag är det idag?", "Kan jag få en glass?", "Vem vill leka med mig?", "Hur gammal är du?", "Vart ska vi åka på lovet?", "Har du sett min röda keps?", "Vad ska vi äta till middag?", "Vad fint det är här!", "Hjälp, det brinner!", "Se upp för bilen!", "Grattis på födelsedagen!", "Vilken fin teckning du har ritat!", "Hurra, nu är det sommarlov!", "Min bästa kompis heter Emil.", "Vi går till skogen och plockar bär.", "På lördagar äter vi pannkakor.|Vi äter pannkakor på lördagar.", "Efter skolan går jag till fritids.|Jag går till fritids efter skolan.", "Fåglarna flyger söderut på hösten.|På hösten flyger fåglarna söderut.", "Hunden gräver ett hål i trädgården.", "Vi tittar på en film ikväll.|Ikväll tittar vi på en film.", "Jag cyklar till skolan varje morgon.|Varje morgon cyklar jag till skolan.", "Läraren läser en saga för klassen.", "Barnen åker pulka i backen.", "Mormor stickar en varm halsduk.", "Vi plockar svamp i skogen.", "Traktorn kör över det stora fältet.", "Elsa och Oskar bygger en koja.", "Katten jagar en liten mus.", "Jag har ont i magen idag.|Idag har jag ont i magen.", "Var är min gula tröja?", "Titta, det snöar!", "Får jag låna din penna?", "Nu ska vi leka kull!"],3:["Anna och Lisa leker i parken.", "Idag har vi besök av Kalle.", "Vi åker till Göteborg i sommar.|I sommar åker vi till Göteborg.", "På måndag börjar skolan igen.|Skolan börjar igen på måndag.", "Min kompis Oskar bor i Malmö.", "Vem har sett Pelle?", "Hjälp, Nisse har ramlat!", "Sverige ligger i Europa.", "Stockholm är Sveriges huvudstad.", "Elsa har fyllt åtta år idag.|Idag har Elsa fyllt åtta år.", "Vi firar jul i december.|I december firar vi jul.", "Kan Sara komma och leka?", "Fredrik och jag bygger en koja.", "Hon heter Maja och han heter Leo.", "På söndag åker vi till Visby.|Vi åker till Visby på söndag.", "Vad heter din lärare, Nora?", "Se upp, Ida!", "Lasse bor i Umeå.", "Nu är det Pias tur!", "Vi cyklar till Johan efter skolan.|Efter skolan cyklar vi till Johan.", "Hunden Bella älskar bollar.", "Mormor kommer på onsdag.|På onsdag kommer mormor.", "Karin och Ahmed spelar fotboll.", "Vilken fin dag det är, Selma!", "Min syster Wilma går i trean.", "Tåget går till Uppsala klockan tre.", "Olle har tappat sin mössa.", "Jag har fått en katt som heter Pelle.", "Var ligger Kiruna?", "Hurra, Elias vann loppet!"]};
const NAMN=new Set("Kalle Lisa Tomas Emil Elsa Oskar Anna Fredrik Maja Leo Nora Ida Lasse Pia Pias Johan Bella Karin Ahmed Selma Wilma Olle Pelle Nisse Sara Elias Göteborg Malmö Sverige Europa Stockholm Sveriges Visby Umeå Uppsala Kiruna".split(" "));
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1),lcf=t=>t.charAt(0).toLowerCase()+t.slice(1);
function parse(line){const v=line.split("|"),mark=v[0].slice(-1),vs=v.map(x=>x.slice(0,-1));return{vs,mark,toks:vs[0].split(" ")};}
function makeChips(toks){return toks.map((t,j)=>({id:j,t:G.lvl===3?t.toLowerCase():NAMN.has(t)?t:lcf(t)}));}
const vis=(c,pos)=>G.lvl<3&&pos===0?cap(c.t):c.t;
function begin(lvl){G={lvl,i:0,fel:0,res:[],q:null,felNu:0,gjort:false};$("nivT").textContent="Nivå "+lvl;$("pet").innerHTML=owlSVG(lasDjur());
  G.set=shuffle(D[lvl].slice()).slice(0,RUND).map(parse);show("game");nasta();}
function nasta(){if(window.speechSynthesis)speechSynthesis.cancel();if(G.i>=RUND){slut();return;}
  const q=G.q=G.set[G.i];G.felNu=0;G.gjort=false;G.stage=1;G.placed=[];G.mark=G.lvl===1?q.mark:null;G.caps=null;
  let chips=makeChips(q.toks);
  do shuffle(chips);while(chips.length>2&&chips.every((c,j)=>c.id===j));
  G.chips=chips;prickar(RUND,G.i,G.res);$("fb").textContent="";$("fb").className="fb";$("bNasta").hidden=true;$("bLas").hidden=true;
  $("fraga").textContent=G.lvl===1?"Bygg en mening. Stor bokstav och punkt fixar vi åt dig.":G.lvl===2?"Bygg en mening och välj tecknet på slutet":"Bygg meningen. Sedan: stor bokstav!";
  render();}
const orden=()=>G.placed.map(id=>G.chips.find(c=>c.id===id).t);
function render(){
  const ans=$("ans"),pool=$("pool");
  if(G.stage===2){ans.hidden=pool.hidden=$("marks").hidden=true;$("fix").hidden=false;ritaFix();$("bKlar").disabled=false;$("bOm").hidden=true;return;}
  ans.hidden=pool.hidden=false;$("fix").hidden=true;$("bOm").hidden=false;
  ans.classList.toggle("tom",!G.placed.length);
  const klar=G.placed.length===G.chips.length;
  ans.innerHTML=G.placed.map((id,p)=>`<button class="chip" data-a="${id}">${vis(G.chips.find(c=>c.id===id),p)}</button>`).join("")+(G.lvl===1&&klar?`<span class="mk">${G.q.mark}</span>`:G.lvl===2&&klar&&G.mark?`<span class="mk">${G.mark}</span>`:"");
  pool.innerHTML=G.chips.filter(c=>!G.placed.includes(c.id)).map(c=>`<button class="chip" data-p="${c.id}">${c.t}</button>`).join("");
  $("marks").hidden=G.lvl===1;$("marks").querySelectorAll("button").forEach(b=>b.classList.toggle("v",b.dataset.m===G.mark));
  $("bKlar").disabled=G.gjort||!klar||(G.lvl>1&&!G.mark);}
function ritaFix(){const t=G.sol;$("fix").innerHTML=t.map((w,j)=>{const v=G.caps[j]?cap(w):w;return`<button class="chip${G.caps[j]?" pa":""}" data-k="${j}">${v}</button>`}).join("")+`<span class="mk">${G.mark}</span>`;
  $("fraga").textContent="Tryck på orden som ska börja med stor bokstav";}

function facit(){return G.q.vs.find(v=>v.toLowerCase()===orden().join(" ").toLowerCase())||G.q.vs[0];}

  const f=$("fb");f.className="fb ratt";f.textContent="Rätt! "+G.final;haj();window.Ljud&&Ljud.ok&&Ljud.ok();

function fel(hint){G.felNu++;if(G.felNu===1)G.fel++;window.Ljud&&Ljud.bad&&Ljud.bad();const f=$("fb");
  if(G.felNu<2){f.className="fb fel";f.textContent=hint+" Prova igen.";return;}
  // andra försöket: visa rätta meningen och gå vidare
  G.gjort=true;G.res[G.i]=false;G.i++;prickar(RUND,G.i,G.res);
  const va=G.q.vs[0];G.chips=makeChips(va.split(" "));G.placed=G.chips.map(c=>c.id);G.stage=1;G.mark=G.q.mark;
  G.final=va+G.q.mark;render();$("ans").querySelectorAll(".chip").forEach(c=>c.classList.add("rosa"));

$("bKlar").onclick=()=>{if(G.gjort)return;const q=G.q,o=orden().join(" ").toLowerCase();
  if(G.stage===1){const ok=q.vs.some(v=>v.toLowerCase()===o);
    if(!ok){const lik=q.vs.some(v=>v.toLowerCase().split(" ").sort().join(" ")===o.split(" ").sort().join(" "));

    if(G.lvl>=2&&G.mark!==q.mark){fel(q.mark==="?"?"Det här är en fråga.":q.mark==="!"?"Det här är ett utrop, någon ropar eller blir glad.":"Det här är ett påstående, en vanlig mening.");return;}
    if(G.lvl===3){const f=facit();G.sol=f.split(" ").map(t=>t.toLowerCase());G.solCase=f.split(" ");G.caps=G.sol.map(()=>false);G.stage=2;render();return;}
    G.final=facit()+q.mark;ratt();return;}
  // steg 2 (nivå 3): stor bokstav
  const bra=G.solCase.every((w,j)=>(w!==w.toLowerCase())===G.caps[j]);
  if(!bra){fel(!G.caps[0]?"En mening börjar alltid med stor bokstav.":"Namn på personer och platser får stor bokstav, men inte dagar och månader.");return;}
  G.final=G.solCase.join(" ")+q.mark;ratt();};
