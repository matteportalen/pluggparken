<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2; --soft:#F1F6FF;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:820px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#FF9F43,#F2780C);color:#fff;border-radius:24px;padding:16px 18px;box-shadow:0 5px 0 #B4560E;margin:6px 0 16px}
.hero .hm{flex:none;font-size:3.6rem;font-family:var(--emoji);line-height:1}
.hero h1{margin:0;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05}
.hero p{margin:6px 0 0;font-weight:600;opacity:.95}
.niv{display:grid;gap:10px}
.niv button{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.niv button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.niv .nr{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:#fff}
.niv b{display:block;font-size:1.12rem;line-height:1.15}
.niv small{display:block;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.25}
.niv .st{margin-left:auto;flex:none;color:var(--gold);font-size:1.15rem;letter-spacing:1px}
.niv .st .off{color:var(--line)}
.info{color:var(--muted);font-size:.9rem;margin:14px 2px 0}
.topp{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.f{background:var(--bad)}.dots i.nu{background:var(--gold)}
.niva-t{font-weight:800;color:var(--muted);font-size:.9rem}
.pet{flex:none;width:48px;height:52px;pointer-events:none}.pet svg{width:100%;height:100%}
.pet.hopp{animation:hopp .55s ease}
@keyframes hopp{40%{transform:translateY(-18px)}}
.kort{background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:12px}
.uppdrag{text-align:center;margin-bottom:8px}
.lyssna{display:inline-flex;align-items:center;gap:8px;min-height:56px;padding:8px 22px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 #2A3FB8}
.lyssna:active{transform:translateY(3px)}
.lyssna.spelar{background:#7B61FF;box-shadow:0 4px 0 #3D2AA8}
.uppdrag p{margin:6px 0 0;font-weight:700;color:var(--muted);font-size:.95rem}
.facit{margin:8px 4px 0;font-weight:800;font-size:1.2rem}
.facit small{display:block;font-weight:600;color:var(--muted);font-size:.92rem}
/* rummet */
.rum{position:relative;width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;container-type:inline-size;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(#FFF6E6 0 74%,#E9C79C 74% 100%)}
.rum::before{content:"";position:absolute;left:0;right:0;top:74%;height:2px;background:#C9A27A}
.rum .m{position:absolute;transform:translate(-50%,-50%);font-family:var(--emoji);line-height:1;pointer-events:none}
.rum .sak{position:absolute;transform:translate(-50%,-50%) scale(var(--s,1));font-family:var(--emoji);font-size:9cqw;line-height:1;cursor:grab;transition:left .18s,top .18s,transform .18s}
.rum .sak.lyft{cursor:grabbing;transition:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.rum .sak.vald{filter:drop-shadow(0 0 6px #3D5AFE) drop-shadow(0 0 2px #3D5AFE)}
.rum .zon{position:absolute;width:9cqw;height:9cqw;border-radius:50%;transform:translate(-50%,-50%);border:2px dashed rgba(61,90,254,.55);background:rgba(61,90,254,.07);opacity:0;transition:opacity .15s;pointer-events:none}
.rum.visa .zon{opacity:1;pointer-events:auto}
.rum .zon.mal{opacity:1;border:3px solid var(--good);background:rgba(30,158,94,.18);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.15)}}
.hylla{display:flex;justify-content:center;gap:10px;margin-top:10px;min-height:64px}
.hylla .tom{font-weight:700;color:var(--muted);align-self:center;font-size:.9rem}
.val3{display:grid;gap:10px;margin-top:10px}
.val3 .alt{display:flex;align-items:center;gap:8px}
.val3 .alt button.svar{flex:1;min-height:56px;border-radius:16px;background:var(--soft);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:1.12rem;text-align:left;padding:8px 14px}
.val3 .alt button.svar.ratt{background:#E6F7EE;box-shadow:0 3px 0 var(--good)}
.val3 .alt button.svar.fel{background:#FDE7E8;box-shadow:0 3px 0 #F0A3A6}
.val3 .alt button.hor{flex:none;width:48px;height:48px;border-radius:50%;background:var(--soft);box-shadow:0 3px 0 var(--line);font-size:1.2rem}
.fraga{font-size:1.4rem;font-weight:800;text-align:center;margin:2px 0 0}
.klar{display:block;width:100%;min-height:56px;margin-top:10px;border-radius:18px;background:var(--good);color:#fff;font-weight:800;font-size:1.2rem;box-shadow:0 5px 0 var(--good-dark)}
.klar:active{transform:translateY(3px)}
.fb{text-align:center;font-weight:700;margin:10px 0 0;min-height:1.6em}
.fb.ratt{color:var(--good-dark)}.fb.fel{color:#B4232A}
.res{text-align:center}
.res .stj{font-size:3rem;letter-spacing:6px;color:var(--gold);margin:8px 0}
.res .stj .off{color:var(--line)}
.knapp{display:inline-block;background:var(--good);color:#fff;border-radius:16px;padding:12px 26px;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 var(--good-dark);margin:6px}
.knapp.vit{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script src="../ljud.js"></script>
<script src="../djur.js"></script>
<script src="../huvud.js" data-titel="Var är katten?" data-ikon="🐱"></script>
<main class="wrap">
<section class="screen" id="home">
  <div class="hero"><div class="hm" aria-hidden="true">🐱📦</div><div><h1>Var är katten?</h1><p>Lyssna på engelska och flytta sakerna. In, on, under, behind …</p></div></div>
  <div class="niv" id="niv"></div>
  <p class="info">Tryck på 🔊 för att höra vad du ska göra. Dra saken dit, eller tryck på saken och sedan på platsen.</p>
</section>

<section class="screen" id="game" hidden>
  <button type="button" data-home hidden tabindex="-1" aria-hidden="true" onclick="hem()"></button>
  <div class="topp"><div class="dots" id="dots"></div><span class="niva-t" id="nivT"></span><span class="pet" id="pet"></span></div>
  <div class="kort">
    <div class="uppdrag" id="uppdrag"></div>
    <div class="rum" id="rum" aria-label="Ett rum med en låda, en stol och en säng"></div>
    <div class="hylla" id="hylla"></div>
    <div id="val3" class="val3" hidden></div>
    <button class="klar" id="bKlar" type="button">✅ Klar!</button>
    <div class="fb" id="fb" aria-live="polite"></div>
  </div>
</section>

<section class="screen res" id="result" hidden>
  <div style="font-size:4rem;font-family:var(--emoji)">🐱</div>
  <h2 id="rRub" style="margin:4px 0 0">Bra jobbat!</h2>
  <div class="stj" id="rStj"></div>
  <p id="rTxt" style="font-weight:700;margin:0 0 14px"></p>
  <button class="knapp" id="rIgen">Spela igen</button>
  <button class="knapp vit" id="rHome">Välj nivå</button>
</section>
</main>
<canvas id="fx" hidden></canvas>
<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const KEY="mattespel-varkatten-v1";
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const ljud=n=>{window.Ljud&&Ljud[n]&&Ljud[n]()};

/* ---------- rummet ----------
   Möblerna är emojis. Platserna (zoner) har en position och ett lager: z 1 = bakom möbeln, 3 = framför. */
const MOB={box:{e:"📦",x:17,y:62,s:17,sv:"lådan"},chair:{e:"🪑",x:49,y:56,s:22,sv:"stolen"},bed:{e:"🛏️",x:79,y:60,s:22,sv:"sängen"}};
const SAK={cat:{e:"🐱",sv:"katten"},dog:{e:"🐶",sv:"hunden"},ball:{e:"⚽",sv:"bollen"},teddy:{e:"🧸",sv:"nallen"}};
const ZON={inBox:{x:17,y:52,z:1,s:.85},onBox:{x:17,y:43,z:3},onChair:{x:49,y:52,z:3},underChair:{x:49,y:69,z:1,s:.7},behindChair:{x:52,y:38,z:1,s:.8},frontChair:{x:49,y:80,z:3},
  onBed:{x:79,y:52,z:3},underBed:{x:79,y:72,z:1,s:.6},G0:{x:5,y:70,z:3},G1:{x:33,y:70,z:3},G2:{x:64,y:70,z:3},G3:{x:95,y:70,z:3}};
/* fras -> vilka zoner som är rätt (next to = båda sidorna; mellan två möbler räknas också som bredvid) */
const FRAS={"in-box":{en:"in the box",sv:"i lådan",z:["inBox"]},"on-box":{en:"on the box",sv:"på lådan",z:["onBox"]},"next-box":{en:"next to the box",sv:"bredvid lådan",z:["G0","G1"]},
  "on-chair":{en:"on the chair",sv:"på stolen",z:["onChair"]},"under-chair":{en:"under the chair",sv:"under stolen",z:["underChair"]},"next-chair":{en:"next to the chair",sv:"bredvid stolen",z:["G1","G2"]},
  "behind-chair":{en:"behind the chair",sv:"bakom stolen",z:["behindChair"]},"front-chair":{en:"in front of the chair",sv:"framför stolen",z:["frontChair"]},
  "on-bed":{en:"on the bed",sv:"på sängen",z:["onBed"]},"under-bed":{en:"under the bed",sv:"under sängen",z:["underBed"]},"next-bed":{en:"next to the bed",sv:"bredvid sängen",z:["G2","G3"]},
  "between-box-chair":{en:"between the box and the chair",sv:"mellan lådan och stolen",z:["G1"]},"between-chair-bed":{en:"between the chair and the bed",sv:"mellan stolen och sängen",z:["G2"]}};
const ENKLA=["in-box","on-box","next-box","on-chair","under-chair","next-chair","on-bed","under-bed","next-bed"],
      SVARA=["behind-chair","front-chair","between-box-chair","between-chair-bed","under-chair","in-box","under-bed","next-bed"];
const zonFras=z=>Object.keys(FRAS).find(k=>FRAS[k].z.length===1&&FRAS[k].z[0]===z)||Object.keys(FRAS).find(k=>FRAS[k].z.includes(z));

/* ---------- rösten (Philippa, ljud/katten/): "Put the cat," + "under the chair." spelas direkt efter varandra ---------- */
const LJUDBAS="../ljud/katten/",LJUD_V=1;let spelar=null;
function tystna(){if(spelar){spelar.stop=true;if(spelar.a)spelar.a.pause();spelar=null}if(window.speechSynthesis)speechSynthesis.cancel()}
function reserv(t,klar){if(!("speechSynthesis" in window)){klar();return}const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;const v=speechSynthesis.getVoices().find(v=>/^en-GB/i.test(v.lang));if(v)u.voice=v;u.onend=klar;u.onerror=klar;speechSynthesis.speak(u)}
/* delar: [["put-cat","next-chair"],["put-dog","in-box"]] = två meningar */
function spela(meningar,knapp,text){tystna();const s={stop:false};spelar=s;knapp&&knapp.classList.add("spelar");let i=0,j=0;
  const slut=()=>{if(spelar===s)spelar=null;knapp&&knapp.classList.remove("spelar")};
  const nasta=()=>{if(s.stop)return slut();if(i>=meningar.length)return slut();const m=meningar[i];if(j>=m.length){i++;j=0;setTimeout(nasta,650);return}
    const f=m[j++],a=new Audio(LJUDBAS+f+".mp3?v="+LJUD_V);s.a=a;a.onended=()=>setTimeout(nasta,j<m.length?40:0);
    const fel=()=>{s.stop=true;slut();reserv(text,()=>{})};a.onerror=fel;a.play().catch(fel)};
  nasta()}

/* ---------- nivåer ---------- */
const NIV=[null,
 {namn:"Nivå 1: In, on, under",txt:"Lyssna och flytta en sak: in, on, under, next to. Åk 1–3.",col:"#2BB673",antal:8},
 {namn:"Nivå 2: Två saker i rad",txt:"Lyssna på två meningar. Nu kommer också behind, in front of och between. Åk 3–4.",col:"#FF9F43",antal:6,tva:true},
 {namn:"Nivå 3: Var är den?",txt:"Titta på rummet och läs. Vilken mening stämmer? Åk 5–6.",col:"#7B61FF",antal:6,las:true}];
const stjHtml=n=>[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("");
function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);if(window.MPS)MPS.visa(id)}
function hem(){tystna();$("niv").innerHTML=[1,2,3].map(l=>`<button data-l="${l}"><span class="nr" style="background:${NIV[l].col}">${l}</span><span><b>${NIV[l].namn}</b><small>${NIV[l].txt}</small></span><span class="st">${stjHtml(data.stars[l]||0)}</span></button>`).join("");show("home")}
$("niv").onclick=e=>{const b=e.target.closest("[data-l]");if(b)starta(+b.dataset.l)};

let G=null;
function starta(l){G={l,i:0,fel:0,res:[]};$("nivT").textContent="Nivå "+l;$("pet").innerHTML=window.owlSVG?owlSVG(lasDjur()):"";show("game");ny()}
function prickar(){$("dots").innerHTML=Array.from({length:NIV[G.l].antal},(_,j)=>`<i class="${j<G.i?(G.res[j]?"ok":"f"):j===G.i?"nu":""}"></i>`).join("")}
const mening=(o,f)=>`Put the ${o} ${FRAS[f].en}.`,svMening=(o,f)=>`Lägg ${SAK[o].sv} ${FRAS[f].sv}.`;
function ny(){if(G.i>=NIV[G.l].antal){slut();return}tystna();const n=NIV[G.l];G.forsta=true;G.vald=null;G.pos={};
  $("fb").textContent="";$("fb").className="fb";$("bKlar").hidden=!!n.las;$("bKlar").disabled=false;$("val3").hidden=!n.las;
  if(n.las){/* alla fyra sakerna står i rummet, en fråga om en av dem */
    const zoner=shuffle(Object.keys(ZON)).filter(z=>!/^G[03]$/.test(z)),sakerna=Object.keys(SAK);sakerna.forEach((o,i)=>G.pos[o]=zoner[i]);
    const o=pick(sakerna),ratt=zonFras(G.pos[o]),fel=shuffle(Object.keys(FRAS).filter(k=>!FRAS[k].z.includes(G.pos[o]))).slice(0,2);
    G.fraga={o,ratt,alt:shuffle([ratt,...fel])};
    $("uppdrag").innerHTML=`<div class="fraga">Where is the ${o}? <span style="font-family:var(--emoji)">${SAK[o].e}</span></div>`;
    $("val3").innerHTML=G.fraga.alt.map(f=>`<div class="alt"><button class="hor" type="button" data-hor="${f}" aria-label="Lyssna">🔊</button><button class="svar" type="button" data-f="${f}">The ${o} is ${FRAS[f].en}.</button></div>`).join("");
    $("hylla").innerHTML="";}
  else{const ant=n.tva?2:1,objs=shuffle(Object.keys(SAK)).slice(0,ant),lista=n.tva?SVARA.concat(ENKLA):ENKLA;let fr;
    do{fr=objs.map(()=>pick(lista))}while(ant===2&&fr[0]===fr[1]);
    G.mal=objs.map((o,i)=>({o,f:fr[i]}));
    $("uppdrag").innerHTML=`<button class="lyssna" id="bLyss" type="button">🔊 ${ant===2?"Lyssna på två saker":"Lyssna"}</button><p>${ant===2?"Flytta båda sakerna.":"Vad ska du flytta, och vart?"}</p><div class="facit" id="facit" hidden></div>`;
    $("bLyss").onclick=()=>{if(window.Ljud&&Ljud.on===false){visaFacit(true);$("fb").className="fb";$("fb").textContent="Ljudet är av, så meningen syns som text.";return}
      spela(G.mal.map(m=>["put-"+m.o,m.f]),$("bLyss"),G.mal.map(m=>mening(m.o,m.f)).join(" "))};}
  prickar();rita()}
function visaFacit(barEngelska){const f=$("facit");if(!f)return;f.hidden=false;f.innerHTML=G.mal.map(m=>mening(m.o,m.f)).join(" ")+(barEngelska?"":`<small>${G.mal.map(m=>svMening(m.o,m.f)).join(" ")}</small>`)}
function rita(markera){const r=$("rum");let h=Object.entries(MOB).map(([k,m])=>`<span class="m" style="left:${m.x}%;top:${m.y}%;font-size:${m.s}cqw;z-index:2">${m.e}</span>`).join("");
  h+=Object.entries(ZON).map(([k,z])=>`<span class="zon${markera&&markera.includes(k)?" mal":""}" data-z="${k}" style="left:${z.x}%;top:${z.y}%;z-index:4"></span>`).join("");
  for(const [o,z] of Object.entries(G.pos)){const Z=ZON[z];h+=`<span class="sak${G.vald===o?" vald":""}" data-o="${o}" style="left:${Z.x}%;top:${Z.y}%;--s:${Z.s||1};z-index:${Z.z}">${SAK[o].e}</span>`}
  r.innerHTML=h;
  if(!NIV[G.l].las){const ute=Object.keys(SAK).filter(o=>!G.pos[o]);$("hylla").innerHTML=ute.map(o=>`<span class="sak hyl${G.vald===o?" vald":""}" data-o="${o}" style="position:relative;font-family:var(--emoji);font-size:2.8rem;cursor:grab;touch-action:none;line-height:1">${SAK[o].e}</span>`).join("")||'<span class="tom">Alla saker står i rummet.</span>'}}
/* ---------- dra eller tryck ---------- */
function narmasteZon(cx,cy){const r=$("rum").getBoundingClientRect();let b=null,bd=1e9;for(const [k,z] of Object.entries(ZON)){const x=r.left+z.x/100*r.width,y=r.top+z.y/100*r.height,d=Math.hypot(cx-x,cy-y);if(d<bd){bd=d;b=k}}
  return bd<r.width*.12?b:null}
function placera(o,z){if(!z){delete G.pos[o];rita();return}for(const [p,q] of Object.entries(G.pos))if(q===z&&p!==o)delete G.pos[p];G.pos[o]=z;ljud("pip");rita()}
document.addEventListener("pointerdown",e=>{if(!G||NIV[G.l].las||$("game").hidden)return;const el=e.target.closest(".sak");
  if(!el){const zon=e.target.closest(".zon");if(zon&&G.vald){placera(G.vald,zon.dataset.z);G.vald=null;$("rum").classList.remove("visa");rita()}return}
  e.preventDefault();const o=el.dataset.o,sx=e.clientX,sy=e.clientY;let ghost=null,flyttad=false;
  const mv=ev=>{if(!flyttad&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){flyttad=true;ghost=el.cloneNode(true);ghost.classList.add("lyft");const b=el.getBoundingClientRect();
      ghost.style.cssText=`position:fixed;left:${b.left+b.width/2}px;top:${b.top+b.height/2}px;transform:translate(-50%,-50%) scale(1.15);font-size:${Math.max(40,b.height)}px;z-index:80;pointer-events:none;margin:0`;document.body.appendChild(ghost);el.style.opacity=".3";$("rum").classList.add("visa")}
