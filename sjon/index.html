<meta property="og:description" content="Bygg en näringskedja och rädda en sjö där något har gått fel. Se hur alger, vattenloppor, mört, gädda och fiskgjuse hänger ihop.">

<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --cA:#4CAF50; --cV:#FF9F43; --cM:#3D8BFD; --cG:#8E5CF7; --cF:#E5484D;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 32px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.symboler{position:absolute;width:0;height:0;overflow:hidden}
/* startskärmen */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#1E9ED8,#1E9E5E);color:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 #157548;margin:6px 0 16px}
.hero .hk{flex:none;width:110px;height:74px;border-radius:14px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.hero .hk svg{display:block;width:100%;height:100%}
.hero h1{margin:0;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05}
.hero p{margin:6px 0 0;font-weight:600;opacity:.97}
.niv{display:grid;gap:10px}
.niv button{display:flex;align-items:center;gap:14px;background:var(--card,#fff);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.niv button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.niv .nr{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:#fff}
.niv b{display:block;font-size:1.12rem;line-height:1.15}
.niv small{display:block;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.25}
.niv .st{margin-left:auto;flex:none;color:var(--gold);font-size:1.15rem;letter-spacing:1px}
.niv .st .off{color:var(--line)}
.not{color:var(--muted);font-size:.85rem;font-weight:600;margin:14px 2px 0;line-height:1.3}
/* spelet */
.topp{display:flex;align-items:center;gap:10px;margin:4px 0 6px;min-height:24px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.f{background:var(--bad)}.dots i.nu{background:var(--gold)}
.niva-t{font-weight:800;color:var(--muted);font-size:.9rem}
.fraga{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 8px;min-height:50px}
.fraga .q{text-align:center;font-weight:800;font-size:clamp(1.08rem,4.6vw,1.28rem);line-height:1.2}
.fraga .q small{display:block;font-weight:700;font-size:.8em;color:var(--muted);margin-top:2px}
.forkl{text-align:center;font-weight:700;margin:8px 0 0;min-height:2.6em;font-size:1.04rem;line-height:1.3}
.forkl.ratt{color:var(--good-dark)}.forkl.fel{color:#B4232A}
.knapprad{display:flex;justify-content:center;gap:10px;margin-top:6px}
.klar,.nasta{background:var(--good);color:#fff;border-radius:18px;padding:10px 30px;font-weight:800;font-size:1.25rem;box-shadow:0 5px 0 var(--good-dark)}
.klar:active{transform:translateY(4px);box-shadow:0 1px 0 var(--good-dark)}
.klar:disabled{opacity:.4;pointer-events:none}
.nasta{background:var(--accent);box-shadow:0 5px 0 #2A3FB8}
.nasta:active{transform:translateY(4px);box-shadow:0 1px 0 #2A3FB8}
.skaka{animation:skaka .4s}
@keyframes skaka{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* nivå 1: kedja */
.kedja{display:flex;align-items:center;justify-content:center;gap:2px;background:var(--card,#fff);border-radius:20px;box-shadow:0 4px 0 var(--line);padding:10px 6px}
.kedja .pil{flex:none;width:12px;text-align:center;font-weight:800;color:var(--muted);font-size:1rem}
.plats{flex:1 1 0;min-width:0;max-width:62px;aspect-ratio:1;border-radius:14px;border:3px dashed #AFC0E8;background:#F7FAFF;display:grid;place-items:center;padding:2px;position:relative}
.plats.full{border:3px solid var(--accent);background:#fff}
.plats.fast{border:3px solid #F2B707;background:#FFF8DD}
.plats.fel{border-color:#E8747A;background:#FFF0F1}
.plats.ratt{border-color:var(--good);background:#F1FBF5}
.plats svg{width:100%;height:100%;display:block}
.hylla{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:8px;margin-top:12px}
.kort{background:var(--card,#fff);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:6px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.8rem;line-height:1.1;text-align:center;min-width:0}
.kort:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.kort svg{width:100%;height:46px;display:block}
.kort.tagen{opacity:.2;pointer-events:none}
.kort span{padding:0 2px;overflow-wrap:anywhere}
.etik{font-weight:800;font-size:.62rem;line-height:1;text-align:center;color:var(--muted);margin-top:2px}
/* nivå 1: väv */
.vav{position:relative;background:linear-gradient(#DDF2FF,#BFE6FB 70%,#9ED8B2);border-radius:20px;box-shadow:0 4px 0 var(--line);overflow:hidden;touch-action:manipulation}
.vav svg.v{display:block;width:100%;height:auto;max-height:50vh}
.nod{cursor:pointer}
.nod circle.ring{fill:#fff;stroke:#1D2B53;stroke-width:2.5}
.nod.vald circle.ring{fill:#FFF4D6;stroke:#F2B707;stroke-width:4}
.nod text{font-family:var(--font);font-weight:800;font-size:12px;fill:#1D2B53;text-anchor:middle}
.pilv{fill:none;stroke:#1D2B53;stroke-width:3;stroke-linecap:round}
.pilv.ok{stroke:#1E9E5E}.pilv.fel{stroke:#E5484D;stroke-dasharray:6 5}
.pilh{fill:#1D2B53}.pilh.ok{fill:#1E9E5E}.pilh.fel{fill:#E5484D}
.vavtips{position:absolute;left:8px;right:8px;top:6px;text-align:center;font-weight:700;font-size:.78rem;color:#1D2B53;pointer-events:none}
/* nivå 2 */
.lv2{display:grid;gap:8px}
.scen{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 4px 0 var(--line);background:#9FD8F5;touch-action:manipulation}
.scen>svg{display:block;width:100%;height:auto;max-height:38vh}
.sp{transition:opacity .45s}
.plask{fill:none;stroke:#fff;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ringut .8s ease-out forwards}
@keyframes ringut{from{transform:scale(1);opacity:.95}to{transform:scale(7);opacity:0}}
.sp.ut{opacity:0}
.toast{position:absolute;left:8px;right:8px;bottom:8px;display:grid;gap:4px;pointer-events:none}
.toast div{background:rgba(29,43,83,.88);color:#fff;border-radius:12px;padding:4px 10px;font-weight:800;font-size:.9rem;text-align:center;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.mhud{position:absolute;left:8px;top:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.mhud span{background:rgba(255,255,255,.9);border-radius:999px;padding:1px 10px;font-weight:800;font-size:.8rem;box-shadow:0 2px 0 rgba(29,43,83,.15)}
.diag{background:var(--card,#fff);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:4px 6px 2px}
.diag svg{display:block;width:100%;height:auto;max-height:15vh}
.diag .gl{stroke:#C6D6F2;stroke-width:1}
.diag .band{fill:#DDF5E7}
.diag text{font-family:var(--font);font-weight:700;font-size:9px;fill:#56668F}
.kontroll{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.art{background:var(--card,#fff);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:5px 3px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;border-top:5px solid var(--c)}
.art svg{width:100%;height:34px;display:block}
.art b{font-size:.68rem;line-height:1;font-weight:800}
.mat{width:90%;height:7px;border-radius:4px;background:#E6ECF8;position:relative;overflow:hidden}
.mat i{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:4px;transition:width .25s}
.mat u{position:absolute;top:0;bottom:0;left:20.8%;width:54.2%;border-left:2px solid rgba(29,43,83,.35);border-right:2px solid rgba(29,43,83,.35)}
.stat{font-size:.62rem;font-weight:800;line-height:1;min-height:.7em;color:var(--muted)}
.stat.ok{color:var(--good-dark)}.stat.vart{color:#C96A0C}.stat.dod{color:#B4232A}
.pm{display:flex;gap:4px;width:100%;padding:0 2px}
.pm button{flex:1;height:38px;border-radius:11px;background:#F1F6FF;box-shadow:0 3px 0 var(--line);font-weight:800;font-size:1.3rem;line-height:1;color:var(--ink)}
.pm button.plus{background:#DDF5E7;color:var(--good-dark)}
.pm button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.rad2{display:flex;gap:6px;align-items:center;justify-content:space-between}
.rad2 .grp{display:flex;gap:5px}
.rad2 button{min-width:42px;height:38px;border-radius:12px;background:var(--card,#fff);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:.95rem;padding:0 9px}
.rad2 button.pa{background:var(--accent);color:#fff;box-shadow:0 3px 0 #2A3FB8}
.rad2 button:active{transform:translateY(2px)}
.rad2 .bal{flex:1;text-align:center;font-weight:800;font-size:.85rem;color:var(--muted)}
.rad2 .bal i{display:block;height:8px;border-radius:3px;background:#E6ECF8;margin-top:2px;overflow:hidden}
.rad2 .bal i b{display:block;height:100%;width:0;background:var(--good);border-radius:3px;transition:width .3s}
.tips{background:#FFF4D6;border-radius:14px;padding:6px 12px;font-weight:700;font-size:.92rem;line-height:1.25;text-align:center}
.ov{position:absolute;inset:0;background:rgba(29,43,83,.55);display:grid;place-items:center;padding:12px;z-index:5}
.ov .k{background:#fff;border-radius:22px;box-shadow:0 5px 0 var(--line);padding:16px 16px 14px;text-align:center;max-width:360px;width:100%}
.ov .k h3{margin:0 0 4px;font-size:1.35rem;line-height:1.1}
.ov .k p{margin:6px 0 10px;font-weight:600;font-size:.98rem;line-height:1.3}
.ov .k .em{font-size:2.2rem;line-height:1}
.ov .k button{background:var(--good);color:#fff;border-radius:16px;padding:9px 26px;font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 var(--good-dark)}
@media (min-width:820px){.wrap{max-width:1000px}.n1{max-width:620px;margin:0 auto}.lv2{grid-template-columns:1.35fr 1fr;align-items:start}.lv2 .v1{grid-column:1}.lv2 .v2{grid-column:2;grid-row:1/span 3}.scen>svg{max-height:60vh}.diag svg{max-height:22vh}.kontroll{grid-template-columns:repeat(5,1fr)}}
@media (max-height:700px){.exp p small{display:none}.gv button{height:34px}.grad{padding:3px 8px}.wrap{padding-bottom:12px}.scen>svg{max-height:27vh}.diag svg{max-height:11vh}.art svg{height:26px}.pm button{height:34px}.fraga{min-height:40px;margin-bottom:5px}.kort svg{height:38px}.hylla{margin-top:8px}}
/* nivå 3 */
.exp{background:var(--card,#fff);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:8px 12px}
.exp b{display:block;font-size:.8rem;color:var(--muted);line-height:1.1}
.exp p{margin:2px 0 0;font-weight:800;font-size:1.02rem;line-height:1.2}
.exp p small{display:block;font-weight:700;font-size:.8rem;color:var(--muted);margin-top:2px}
.grad{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--card,#fff);border-radius:14px;box-shadow:0 3px 0 var(--line);padding:5px 8px;border-left:6px solid var(--c)}
.grad svg{width:30px;height:24px;display:block}
.grad b{font-size:.78rem;line-height:1.05;font-weight:800;overflow-wrap:anywhere}
.grad b small{display:block;font-size:.66rem;color:var(--muted)}
.gv{display:flex;gap:4px}
.gv button{width:52px;height:38px;border-radius:11px;background:#F1F6FF;box-shadow:0 3px 0 var(--line);font-weight:800;font-size:.72rem;line-height:1.05;padding:0}
.gv button i{display:block;font-style:normal;font-size:1rem;line-height:1}
.gv button.v{background:var(--accent);color:#fff;box-shadow:0 3px 0 #2A3FB8}
.gv button.rk{background:#DDF5E7;color:var(--good-dark);box-shadow:0 0 0 3px var(--good)}
.gv button.rf{background:#FFE9EC;color:#B4232A;opacity:.8}
.gv.last button{pointer-events:none}
.expl{background:#FFF4D6;border-radius:14px;padding:8px 12px;font-weight:700;font-size:.92rem;line-height:1.3;text-align:center}
.expl.ok{background:#DDF5E7}
.kor{height:44px;border-radius:14px;background:var(--good);color:#fff;font-weight:800;font-size:1.1rem;box-shadow:0 4px 0 var(--good-dark);padding:0 18px;flex:1}
.kor:disabled{background:#E6ECF8;color:#56668F;box-shadow:0 4px 0 var(--line);pointer-events:none}
.kor.nasta2{background:var(--accent);box-shadow:0 4px 0 #2A3FB8}
/* resultat */
.res{text-align:center}
.res .stj{font-size:3rem;letter-spacing:6px;color:var(--gold);margin:8px 0}
.res .stj .off{color:var(--line)}
.knapp{display:inline-block;background:var(--good);color:#fff;border-radius:16px;padding:12px 26px;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 var(--good-dark);margin:6px}
.knapp.vit{background:var(--card,#fff);color:var(--ink);box-shadow:0 5px 0 var(--line)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:420px){.hero .hk{width:88px;height:64px}.hero{gap:12px;padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>

const KEY="mattespel-sjon-v1";

const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;

const NIV=[null,
  {namn:"Bygg",txt:"Näringskedjan, näringsväven och kretsloppet.",col:"#2BB673"},

/* ---------- Arterna ---------- */
const ART=[
 {id:"A",namn:"Alger",c:"#4CAF50",vb:"0 0 100 60",info:"Alger gör egen mat av solljus."},
 {id:"V",namn:"Vattenloppor",enk:"Vattenloppa",c:"#FF9F43",vb:"0 0 100 60",info:"Vattenloppor äter alger."},
 {id:"M",namn:"Mört",c:"#3D8BFD",vb:"0 0 100 60",info:"Mört äter alger och vattenloppor."},

 {id:"F",namn:"Fiskgjuse",c:"#E5484D",vb:"0 0 140 80",info:"Fiskgjusen fångar mört och gäddor."}];
const IDX={A:0,V:1,M:2,G:3,F:4};
const SYM={A:"sp-A",V:"sp-V",M:"sp-M",G:"sp-G",F:"sp-F",dod:"sp-dod",bakt:"sp-bakt",nar:"sp-nar",sol:"sp-sol"};

const ico=id=>`<svg viewBox="${VB[id]}" aria-hidden="true"><use href="#${SYM[id]}"/></svg>`;

/* ---------- Gemensamt för spelen ---------- */
let G=null,tim=[],raf=0;
const rensa=()=>{tim.forEach(clearTimeout);tim=[];};
function stoppa(){rensa();cancelAnimationFrame(raf);raf=0;G=null;}
function starta(l){stoppa();G={lvl:l,fel:0,res:[],i:0};$("nivT").textContent=NIV[l].namn;$("yta").className=l===1?"n1":"";show("game");l===1?startNiva1():l===2?startNiva2():l===3?startNiva3():startNiva4();}
function prickar(n){$("dots").innerHTML=Array.from({length:n},(_,j)=>`<i class="${j<G.i?(G.res[j]?"ok":"f"):j===G.i?"nu":""}"></i>`).join("");}
function fb(t,c){const f=$("forkl");if(f){f.textContent=t||"";f.className="forkl"+(c?" "+c:"");}}
function skaka(el){if(!el)return;el.classList.remove("skaka");void el.offsetWidth;el.classList.add("skaka");}
function slut(st,txt){stoppa();const old=data.stars[G_l]||0;data.stars[G_l]=Math.max(old,st);save();
  $("rStj").innerHTML=stjHtml(st);$("rRub").textContent=st===3?"Perfekt! 🎉":st===2?"Bra jobbat!":"Bra kämpat!";$("rTxt").textContent=txt;
  show("result");if(st===3){ljud("fanfare");confetti();}else ljud("chime");}
let G_l=1;
$("rIgen").onclick=()=>starta(G_l);$("rHome").onclick=hem;

/* ======================= NIVÅ 1: BYGG ======================= */
const KEDJA=["A","V","M","G","F"];
const VAV_KANTER=[["A","V"],["A","M"],["V","M"],["M","G"],["M","F"],["G","F"]];
const VAV_POS={F:[180,52],G:[292,128],M:[150,196],V:[276,268],A:[70,292]};
const KRETS=[{id:"dod",namn:"Död fisk"},{id:"bakt",namn:"Bakterier"},{id:"nar",namn:"Näring"},{id:"A",namn:"Alger"}];
const KRETSTEXT=["Död fisk","Bakterier bryter ner den","Näring i vattnet","Algerna växer"];
let N1=null;
function startNiva1(){G_l=1;G.uppg=[{typ:"kedja"},{typ:"vav"},{typ:"krets"}];G.i=0;N1=null;nastaUppg();}
function nastaUppg(){rensa();if(G.i>=G.uppg.length){const st=G.fel===0?3:G.fel<=2?2:1;slut(st,`${3-Math.min(3,G.fel)} av 3 uppgifter rätt på första försöket. Pilarna visar vart energin går.`);return;}
  prickar(G.uppg.length);const U=G.uppg[G.i];G.forsok=0;G.felNu=false;G.last=false;
  $("yta").innerHTML=`<div class="fraga"><span class="q" id="q"></span></div><div id="arb"></div><div class="forkl" id="forkl" aria-live="polite"></div><div class="knapprad"><button class="klar" id="klar" disabled>Klar ✓</button><button class="nasta" id="nasta" hidden>Nästa ▶</button></div>`;
  $("klar").onclick=klar1;$("nasta").onclick=()=>nastaUppg();
  if(U.typ==="kedja")ritaOrd({q:"Bygg näringskedjan",sm:"Solen först. Pilen pekar mot den som äter.",start:"sol",items:KEDJA.map(id=>({id,namn:ART.find(a=>a.id===id).namn})),ratt:KEDJA});
  else if(U.typ==="krets")ritaOrd({q:"Vad händer med en död fisk?",sm:"Tryck på stegen i rätt ordning.",start:null,items:KRETS,ratt:["dod","bakt","nar","A"],krets:true});
  else ritaVav();}
function klar1(){if(!G||G.last)return;const U=G.uppg[G.i];if(U.typ==="vav")klarVav();else klarOrd();}
function avslutaUppg(){G.res[G.i]=!G.felNu;if(G.felNu)G.fel++;G.i++;G.last=true;prickar(G.uppg.length);$("klar").hidden=true;$("nasta").hidden=false;$("nasta").focus({preventScroll:true});if(!G.felNu)tim.push(setTimeout(()=>nastaUppg(),2900));}
/* ordna: kedjan och kretsloppet */
function ritaOrd(c){N1={c,plats:c.ratt.map(()=>null),hand:shuffle(c.items.map(x=>x.id))};
  $("q").innerHTML=c.q+`<small>${c.sm}</small>`;visaOrd();}
function visaOrd(){const c=N1.c,n=c.ratt.length;
  const rad=[];if(c.start)rad.push(`<div class="plats fast" aria-label="Solen">${ico("sol")}</div><span class="pil">→</span>`);
  N1.plats.forEach((p,i)=>{rad.push(`<button class="plats ${p?"full":""}${N1.fel&&N1.fel[i]?" fel":""}${N1.ratt&&N1.ratt[i]?" ratt":""}" data-p="${i}" aria-label="Plats ${i+1}${p?": "+namnAv(p):""}">${p?ico(p):""}</button>`);if(i<n-1)rad.push(`<span class="pil">→</span>`);});
  const namn=id=>namnAv(id);
  $("arb").innerHTML=`<div class="kedja" id="kedja">${rad.join("")}</div><div class="hylla" style="--n:${c.items.length}">${N1.hand.map(id=>`<button class="kort${N1.plats.includes(id)?" tagen":""}" data-k="${id}">${ico(id)}<span>${namn(id)}</span></button>`).join("")}</div>`;
  $("klar").disabled=N1.plats.some(p=>!p);}
const namnAv=id=>{const a=ART.find(a=>a.id===id)||KRETS.find(a=>a.id===id)||{namn:id};return a.enk||a.namn;};
$("yta").onclick=e=>{if(!G||G.lvl!==1||G.last||!N1)return;const U=G.uppg[G.i];if(U.typ==="vav")return vavKlick(e);
  const k=e.target.closest("[data-k]"),p=e.target.closest("[data-p]");
  if(k&&!k.classList.contains("tagen")){const i=N1.plats.indexOf(null);if(i>=0){N1.plats[i]=k.dataset.k;ljud("pip");}}
  else if(p){N1.plats[+p.dataset.p]=null;}else return;
  N1.fel=null;visaOrd();};
function klarOrd(){const c=N1.c,fel=N1.plats.map((p,i)=>p!==c.ratt[i]);
  if(!fel.some(Boolean)){N1.ratt=fel.map(()=>true);N1.fel=null;visaOrd();ljud("ok");fb(c.krets?"Rätt! ✓ Bakterierna bryter ner döda djur och växter. Då blir det näring, och algerna kan växa igen. Så går materialet runt i ett kretslopp.":"Rätt! ✓ Energin går från solen till algerna, och sedan från den som blir äten till den som äter.","ratt");avslutaUppg();return;}
  G.felNu=true;ljud("bad");skaka($("kedja"));
  if(G.forsok===0){G.forsok=1;N1.fel=fel;visaOrd();
    fb(c.krets?"Inte riktigt. Vad händer med en död fisk? Någon måste bryta ner den innan det blir näring.":(fel[0]?"Inte riktigt. Först kommer den som gör egen mat av solljus: algerna.":"Inte riktigt. De röda är fel. Fråga dig: vem äter vem? Pilen pekar mot den som äter."),"fel");$("klar").disabled=true;return;}
  N1.plats=c.ratt.slice();N1.fel=null;N1.ratt=c.ratt.map(()=>true);visaOrd();
  fb(c.krets?"Så här går det till: "+KRETSTEXT.join(" → ")+".":"Så här hänger det ihop: "+KEDJA.map(namnAv).join(" → ")+". "+"Gäddan äter mört och fiskgjusen äter gädda.","fel");avslutaUppg();}
/* väven */
function ritaVav(){N1={vav:true,kanter:[],vald:null,fel:null,ratt:null};$("q").innerHTML=`Bygg näringsväven<small>Tryck på den som blir äten, sedan på den som äter.</small>`;visaVav();}
function visaVav(){const K=N1.kanter,pil=(a,b,kl)=>{const [x1,y1]=VAV_POS[a],[x2,y2]=VAV_POS[b];let dx=x2-x1,dy=y2-y1;const L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy*6,py=ux*6,r=36;
    const sx=x1+ux*r+px,sy=y1+uy*r+py,ex=x2-ux*(r+4)+px,ey=y2-uy*(r+4)+py,hx=ex-ux*12,hy=ey-uy*12;
    return `<path class="pilv ${kl}" d="M${sx} ${sy}L${hx} ${hy}"/><path class="pilh ${kl}" d="M${ex} ${ey}L${hx+uy*7} ${hy-ux*7}L${hx-uy*7} ${hy+ux*7}Z"/>`;};
  const kl=(a,b)=>N1.ratt?"ok":N1.fel&&N1.fel.has(a+b)?"fel":"";
  const noder=ART.map(a=>{const [x,y]=VAV_POS[a.id];return `<g class="nod${N1.vald===a.id?" vald":""}" data-n="${a.id}" role="button" aria-label="${a.namn}"><circle class="ring" cx="${x}" cy="${y}" r="32"/><svg x="${x-26}" y="${y-22}" width="52" height="40" viewBox="${a.vb}"><use href="#${SYM[a.id]}"/></svg><text x="${x}" y="${y+46}">${a.namn}</text></g>`;}).join("");
  const rutor=(N1.ratt?VAV_KANTER:K).map(([a,b])=>pil(a,b,kl(a,b))).join("");
  $("arb").innerHTML=`<div class="vav"><svg class="v" viewBox="0 0 360 340" role="img" aria-label="Näringsväv">${rutor}${noder}</svg><div class="vavtips">${N1.vald?"Vem äter "+namnAv(N1.vald).toLowerCase()+"? Tryck på den.":"Tryck på den som blir äten."}</div></div>`;
  $("klar").disabled=K.length===0;}
function vavKlick(e){const n=e.target.closest("[data-n]");if(!n)return;const id=n.dataset.n;
  if(!N1.vald){N1.vald=id;N1.fel=null;visaVav();return;}
  if(N1.vald===id){N1.vald=null;visaVav();return;}
  const a=N1.vald,i=N1.kanter.findIndex(k=>k[0]===a&&k[1]===id);if(i>=0)N1.kanter.splice(i,1);else{N1.kanter.push([a,id]);ljud("pip");}
  N1.vald=null;N1.fel=null;visaVav();}
function klarVav(){const key=k=>k[0]+k[1],ratt=new Set(VAV_KANTER.map(key)),har=new Set(N1.kanter.map(key));
  const fel=new Set([...har].filter(k=>!ratt.has(k))),sakn=[...ratt].filter(k=>!har.has(k)),omv=[...fel].filter(k=>ratt.has(k[1]+k[0]));
  if(!fel.size&&!sakn.length){N1.ratt=true;visaVav();ljud("ok");fb("Rätt! ✓ Pilen pekar mot den som äter. Mört äter både alger och vattenloppor, så sjön är en väv och inte bara en kedja.","ratt");avslutaUppg();return;}
  G.felNu=true;ljud("bad");skaka($("arb"));
  if(G.forsok===0){G.forsok=1;N1.fel=fel;visaVav();
    fb(omv.length?"Inte riktigt. Några pilar pekar åt fel håll. Pilen ska peka mot den som äter.":fel.size?"Inte riktigt. De röda pilarna stämmer inte. Vem äter vem?":`Nästan! Det fattas ${sakn.length} ${sakn.length===1?"pil":"pilar"}. Vem äter mer än en sort?`,"fel");$("klar").disabled=true;
    const kd=$("klar");tim.push(setTimeout(()=>{if(kd)kd.disabled=false;},400));return;}
  N1.ratt=true;visaVav();fb("Så här äter de: "+VAV_KANTER.map(k=>namnAv(k[0]).toLowerCase()+" → "+namnAv(k[1]).toLowerCase()).join(", ")+".","fel");avslutaUppg();}

/* ======================= NIVÅ 2: RÄDDA SJÖN ======================= */
/* Modellen: se docs/sjon.md. A alger, V vattenloppor, M mört, G gädda, F fiskgjuse. */
const PM={"rA":0.5126,"KA":22.13,"sAV":0.7755,"kAV":3.938,"eAV":0.6861,"sAM":0.4488,"kAM":2.766,"eAM":0.3991,"sVM":0.3637,"kVM":3.685,"eVM":0.4256,"dV":0.1246,"qV":0.04177,"sMG":1.366,"kMG":3.129,"eMG":0.3264,"dM":0.03954,"qM":0.02698,"sMF":0.8063,"kMF":2.581,"eMF":0.5616,"sGF":1.427,"kGF":1.674,"eGF":0.2791,"dG":0.03021,"qG":0.1043,"dF":0.1154,"qF":1.052,"iA":0.01,"iV":0.01};
function deriv(P,x,o){const A=x[0],V=x[1],M=x[2],Gd=x[3],F=x[4],
  fAV=P.sAV*V*A/(P.kAV+A),fAM=P.sAM*M*A/(P.kAM+A),fVM=P.sVM*M*V/(P.kVM+V),fMG=P.sMG*Gd*M/(P.kMG+M),fMF=P.sMF*F*M/(P.kMF+M),fGF=P.sGF*F*Gd/(P.kGF+Gd);
  o[0]=P.rA*A*(1-A/P.KA)-fAV-fAM+P.iA;o[1]=P.eAV*fAV-fVM-P.dV*V-P.qV*V*V+P.iV;
  o[2]=P.eAM*fAM+P.eVM*fVM-fMG-fMF-P.dM*M-P.qM*M*M;o[3]=P.eMG*fMG-fGF-P.dG*Gd-P.qG*Gd*Gd;o[4]=P.eMF*fMF+P.eGF*fGF-P.dF*F-P.qF*F*F;}
function rk4(P,x,h){const k1=[0,0,0,0,0],k2=[0,0,0,0,0],k3=[0,0,0,0,0],k4=[0,0,0,0,0],t=[0,0,0,0,0];
  deriv(P,x,k1);for(let i=0;i<5;i++)t[i]=x[i]+h/2*k1[i];deriv(P,t,k2);for(let i=0;i<5;i++)t[i]=x[i]+h/2*k2[i];deriv(P,t,k3);for(let i=0;i<5;i++)t[i]=x[i]+h*k3[i];deriv(P,t,k4);
  for(let i=0;i<5;i++){x[i]+=h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]);if(x[i]<0)x[i]=0;}}
const H=.05,UT=.03;
let EQ=null,PMR=PM;
function jamvikt(){if(EQ)return EQ;const x=[9.4,3.9,1.9,.37,.14];for(let t=0;t<1500;t+=H)rk4(PM,x,H);EQ=x.slice();return EQ;}
function utan(i,T){const x=jamvikt().slice();x[i]=0;for(let t=0;t<T;t+=H){rk4(PM,x,H);if(x[i]!==0)x[i]=0;if(i>1)for(let j=2;j<5;j++)if(j!==i&&x[j]<UT*EQ[j])x[j]=0;}return x;}
const UPPDRAG=[
