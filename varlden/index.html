function platsFor(po){return{x:po.g.position.x+po.zx*5.2*Math.max(.75,po.sk),z:po.g.position.z+po.zz*5.2*Math.max(.75,po.sk),yaw:Math.atan2(-po.zx,-po.zz)};}
function platsForK(po){const zv=new V3(0,0,1).applyQuaternion(po.g.quaternion),p=po.g.position.clone().addScaledVector(zv,5.2*Math.max(.75,po.sk));p.setLength(S.Rs(p.clone().normalize()));const h=tangTill(p.clone().normalize(),zv.clone().negate());return{x:p.x,y:p.y,z:p.z,hx:h.x,hy:h.y,hz:h.z};}
function sparaPlats(extra){if(gaar&&!extra)return;lsSet('mp-varlden-pos',JSON.stringify(extra||(S.klot?{scen:S.id,x:Pv.x,y:Pv.y,z:Pv.z,hx:hdK.x,hy:hdK.y,hz:hdK.z}:(rida?{scen:S.id,x:rida.fran.x,z:rida.fran.z,yaw:rida.fran.yaw,cam:rida.fran.cam}:{scen:S.id,x:P.x,z:P.z,yaw:P.ang,cam:camYaw}))));}
function gaIn(po){
  if(gaar)return;gaar=true;pling(440,880);stangDlg();
  const p=S.klot?platsForK(po):platsFor(po);
  if(po.p.scen){ // till en annan scen på samma sida
    const mal=po.p.scen;
    $('fade').classList.add('pa');
    setTimeout(()=>{
      let plats=null;
      if(mal==='hub'){const i=HUB.findIndex(h=>h.scen===S.id);const a=i/HUB.length*Math.PI*2;plats={x:Math.cos(a)*(RING-5.2),z:Math.sin(a)*(RING-5.2),ang:Math.atan2(Math.cos(a),Math.sin(a))};}
      laddaScen(mal,plats);gaar=false;sparaPlats();$('fade').classList.remove('pa');
      if(mal!=='hub'&&!SV.seen.includes('besokt-'+mal)){SV.seen.push('besokt-'+mal);sparaSV();}
    },REDUCE?60:420);
    return;
  }
  sparaPlats(S.klot?Object.assign({scen:S.id},p):{scen:S.id,x:p.x,z:p.z,yaw:p.yaw,cam:p.yaw});
  try{sessionStorage.setItem('mp-fran-varlden','1');}catch(e){}
  if(SV.arende&&SV.arende.h===po.p.h&&SV.arende.scen===S.id){SV.arende.besokt=true;sparaSV();}
  $('fade').classList.add('pa');
  setTimeout(()=>{location.href=new URL('../'+po.p.h,location.href).href;},REDUCE?60:420);
}
$('hem2').addEventListener('click',tillHuben);
prompt.addEventListener('click',()=>{if(rida){slutRida();return;}if(narmaste)gaIn(narmaste);else if(narNpc)oppnaDlg();else if(narRide)startRida(narRide);});
addEventListener('pagehide',()=>sparaPlats());
addEventListener('pageshow',e=>{if(e.persisted||gaar){gaar=false;$('fade').classList.remove('pa');const s=lasPlats();
  if(S.klot){if(s&&s.scen===S.id&&isFinite(s.hx))placeraK(new V3(s.x,s.y,s.z),new V3(s.hx,s.hy,s.hz));}else if(s&&(s.scen||'hub')===S.id&&isFinite(s.x))placera(s.x,s.z,s.yaw||0,s.cam!=null?s.cam:s.yaw||0);uppdateraArende();}});
setInterval(()=>sparaPlats(),4000);

/* ---------- Hjälptext ---------- */
const hint=$('hint');
hint.textContent=TOUCH?'Dra i cirkeln för att gå, tryck Hoppa för att hoppa. Dra på bilden för att titta runt. Gå in i en portal! ✨':'Gå med W A S D eller pilarna, hoppa med mellanslag, titta runt med musen (dra) eller Q och E. Gå in i en portal! ✨';
setTimeout(()=>hint.classList.add('bort'),11000);
let hintBort=false;const gomHint=()=>{if(!hintBort){hintBort=true;setTimeout(()=>hint.classList.add('bort'),2500);}};

/* ---------- Lågt läge ---------- */
function stallLagt(v,bygg){const andrad=v!==lagt;lagt=v;$('lagt').setAttribute('aria-pressed',String(v));$('lagt').innerHTML=v?'🐢<span class="tx"> Lågt läge: på</span>':'🐢<span class="tx"> Lågt läge</span>';
  lsSet('mp-varlden-lagt',v?'1':'0');renderer.setPixelRatio(skala());storlek();
  if(andrad&&S&&bygg!==false){const id=S.id,x=P.x,z=P.z,a=P.ang,c=camYaw;laddaScen(id,S.klot?{pv:Pv.clone(),hd:hdK.clone()}:{x,z,ang:a,cam:c});}}
$('lagt').addEventListener('click',()=>stallLagt(!lagt));
function storlek(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',storlek);storlek();
function dimma(){if(S&&S.klot){scene.fog.near=500;scene.fog.far=1200;}else{scene.fog.near=lagt?45:60;scene.fog.far=lagt?105:150;}}

/* ---------- Slingan ---------- */
const clock=new THREE.Clock();let tid=0,fpsSum=0,fpsN=0,fpsKoll=true;
const v3=new THREE.Vector3();
function steg(dt){
  const varPaMark=P.mark;
  tid+=dt;
  if(rida){if(P.hoppKo){P.hoppKo=false;slutRida();return;}stegRida(dt);if(rida){prompt.hidden=false;if(prompt.textContent!=='⏹ Hoppa av')prompt.textContent='⏹ Hoppa av';}return;}
  let ix=0,iz=0;
  if(!dlgOpen){
    if(tang['w']||tang['arrowup'])iz+=1;if(tang['s']||tang['arrowdown'])iz-=1;
    if(tang['d']||tang['arrowright'])ix+=1;if(tang['a']||tang['arrowleft'])ix-=1;
    if(jid!==null){ix+=jx;iz-=jy;}
    if(tang['q'])camYaw+=1.9*dt;if(tang['e'])camYaw-=1.9*dt;
  }
  const m=Math.hypot(ix,iz);if(m>1){ix/=m;iz/=m;}
  const fx=Math.sin(camYaw),fz=Math.cos(camYaw),rx=-Math.cos(camYaw),rz=Math.sin(camYaw);
  const mx=(fx*iz+rx*ix)*FART,mz=(fz*iz+rz*ix)*FART;
  const ac=P.mark?14:7;
  P.fartX+=(mx-P.fartX)*Math.min(1,ac*dt);P.fartZ+=(mz-P.fartZ)*Math.min(1,ac*dt);
  const gar=Math.hypot(P.fartX,P.fartZ)>.6;
  if(gar){gomHint();let d=Math.atan2(P.fartX,P.fartZ)-P.ang;d=Math.atan2(Math.sin(d),Math.cos(d));P.ang+=d*Math.min(1,12*dt);}
  if(P.hoppKo){P.hoppKo=false;if(dlgOpen){}else if(P.mark){P.vy=HOPP;P.mark=false;P.hopp=1;hoppljud();gomHint();}else if(P.hopp<2){P.vy=HOPP*.9;P.hopp=2;pling(420,660);}}
  P.x+=P.fartX*dt;P.z+=P.fartZ*dt;
  stoppa();
  P.vy-=G*dt;P.y+=P.vy*dt;
  const mh=markhojd(P.x,P.z,P.y-P.vy*dt);
  if(P.y<=mh&&P.vy<=0){P.y=mh;P.vy=0;P.mark=true;P.hopp=0;}else if(P.mark&&P.vy<=0&&P.y-mh<.7){P.y=mh;P.vy=0;}else if(P.y>mh+.05)P.mark=false;
  if(!varPaMark&&P.mark)landaLjusbrade();
  if(S.pads)for(const q of S.pads){const dx=P.x-q.x,dz=P.z-q.z,inne=(q.halv?Math.max(Math.abs(dx),Math.abs(dz))<q.r:Math.hypot(dx,dz)<q.r)&&P.y<=q.top+.4;
    if(inne&&!q.inne){q.inne=true;pling(q.f,q.f*1.5);if(q.boost){P.vy=q.boost;P.mark=false;P.hopp=1;}}else if(!inne)q.inne=false;}
  narmaste=null;narNpc=false;
  if(!gaar)for(const po of S.portaler){
    const dx=P.x-po.g.position.x,dz=P.z-po.g.position.z,lx=dx*po.xx+dz*po.xz,lz=dx*po.zx+dz*po.zz,k=po.sk;
    if(Math.abs(lx)<2*k&&lz>-1*k&&lz<1*k&&P.y-po.g.position.y<3.5){gaIn(po);break;}
    if(Math.abs(lx)<5*k&&lz>0&&lz<8.5*k)narmaste=po;
  }
  if(!narmaste&&S.npc&&Math.hypot(P.x-S.npc.x,P.z-S.npc.z)<4.2)narNpc=true;
  narRide=null;if(!narmaste&&!narNpc)for(const q of S.rides)if(Math.hypot(P.x-q.x,P.z-q.z)<q.r&&Math.abs(P.y-(q.hy!=null?q.hy:S.hojd(P.x,P.z)))<2.6){narRide=q;break;}
  if(!gaar&&!dlgOpen&&(narmaste||narNpc||narRide)){prompt.hidden=false;const t=narmaste?'🚪 Gå in: '+narmaste.p.e+' '+narmaste.p.n:narNpc?'💬 Prata med '+S.npc.namn:narRide.e+' Åk '+narRide.namn;if(prompt.textContent!==t)prompt.textContent=t;}else prompt.hidden=true;
  // stjärnor
  for(const s of S.stjarnor){
    if(s.tagen)continue;
    if(Math.hypot(P.x-s.x,P.z-s.z)<1.3&&Math.abs(P.y+1-s.y)<1.6){
      s.tagen=true;s.m.visible=false;if(s.ton)pling(s.ton*2,s.ton*2.4);else pling(660,990);
      (SV.stj[S.id]=SV.stj[S.id]||[]).push(s.idx);sparaSV();stjarnaText();
      if(s.bokstav){const kvar=S.stjarnor.filter(q=>!q.tagen).length;if(kvar)toast('Du hittade vokalen '+s.bokstav+'! '+(kvar===1?'Bara 1 kvar.':kvar+' kvar.'));}
      else if(s.biljett){const kvar=S.stjarnor.filter(q=>!q.tagen).length;if(kvar)toast('Du hittade en biljett! '+(kvar===1?'Bara 1 kvar.':kvar+' kvar.'));}
      else if(s.namn){const kvar=S.stjarnor.filter(q=>!q.tagen).length;if(kvar)toast('Du hittade '+s.namn+'! '+s.fakta+' '+(kvar===1?'Bara 1 kvar.':kvar+' kvar.'));}
      if(S.stjarnor.every(q=>q.tagen))klart(S.id+'-stj','Du hittade alla '+(S.samlaAlla||(s.bokstav?'vokaler':'stjärnor'))+'!');}
  }
  // hopptornet
  if(S.flagga&&!SV.seen.includes(S.id+'-torn')&&P.y>=S.flagga.y-.2&&Math.hypot(P.x-S.flagga.x,P.z-S.flagga.z)<2.6)klart(S.id+'-torn','Du nådde toppen av '+S.tornNamn+'!');
}
function rita(dt){
  const t=tid;
  djur.position.set(P.x,P.y,P.z);
  const under=markhojd(P.x,P.z,P.y+1);
  skugga.position.set(P.x,under+.03,P.z);skugga.scale.setScalar(Math.max(.5,1-(P.y-under)*.07));
  djur.rotation.y=P.ang;
  const fart=Math.hypot(P.fartX,P.fartZ),gar=fart>.6&&P.mark;
  const inner=djur.userData.inner;
  const vag=gar?Math.abs(Math.sin(t*14*Math.min(1,fart/FART+.3))):0;
  const sq=P.mark?1:1+Math.max(-.12,Math.min(.18,P.vy*.02));
  inner.position.y=vag*.2;inner.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
  inner.rotation.z=gar?Math.sin(t*14)*.06:0;
  djur.userData.fot.forEach((f,i)=>{f.position.z=.12+(gar?Math.sin(t*14+i*Math.PI)*.22:0);f.position.y=.2+(P.mark?(gar?Math.max(0,Math.sin(t*14+i*Math.PI))*.15:0):.25);});
  const cx=P.x-Math.sin(camYaw)*Math.cos(camPitch)*camDist,cz=P.z-Math.cos(camYaw)*Math.cos(camPitch)*camDist,cy=P.y+1.7+Math.sin(camPitch)*camDist;
  if(!window.__oversikt){cam.position.lerp(v3.set(cx,Math.max(cy,S.hojd(cx,cz)+1.6),cz),Math.min(1,dt*10));
  cam.lookAt(P.x,P.y+2.7,P.z);}
  for(const f of S.liv)f(t);firaSteg(dt);
  for(const s of S.stjarnor)if(!s.tagen){s.m.rotation.y=t*2;s.m.position.y=s.y0+Math.sin(t*2.4+s.x)*.18;}
  for(const po of S.portaler){po.yta.material.opacity=.42+Math.sin(t*2+po.fas)*.1;po.ljus.rotation.z=t*1.5;po.ljus.scale.setScalar(.85+Math.sin(t*2+po.fas)*.15);if(po.mark)po.mark.position.y=(3.4*po.sk)+Math.max(2.3,3.2*po.sk)+1.6+Math.sin(t*5)*.3;}
  if(!REDUCE)for(const g of S.moln){g.position.x+=g.userData.v*dt;if(g.position.x>110)g.position.x=-110;}
}
dimma();stallLagt(lagt,false);
startVarlden();dimma();
let sistaFas=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(.05,clock.getDelta());
  if(S.klot){stegK(dt);ritaK(dt);}else{steg(dt);rita(dt);}renderer.render(scene,cam);
  if(!sistaFas){sistaFas=1;$('load').classList.add('klar');}
  if(fpsKoll&&tid>1&&tid<5){fpsSum+=dt;fpsN++;}
  if(fpsKoll&&tid>=5){fpsKoll=false;if(fpsN&&fpsSum/fpsN>1/26&&!lagt){stallLagt(true);dimma();}}
});
window.__varlden={rida:()=>rida,Pv,hdK,placeraK,placera,scene,cam,P,get S(){return S;},SV,gaIn,laddaScen,klart,oppnaDlg,get dlg(){return dlgOpen;}};
</script>
