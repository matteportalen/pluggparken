<script type="module">
/* Pluggparken-världen: en liten ö i 3D (three.js, lib/) och en egen park för varje ämne (hittills Matte).
   Elevens djur går runt och hoppar och går genom portaler till ämnessidorna och övningarna.
   Allt byggs av enkla former i kod (inga modeller, inga bilder).
   Spelarens plats (scen, x, z) sparas i localStorage (mp-varlden-pos) så att man kommer tillbaka till samma portal.
   Uppdrag, hittade stjärnor och prydnader sparas i mattespel-pluggvarlden-v1 (följer profilen, ligger i PKEYS i konto.js). */

const REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches;
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(TOUCH)document.body.classList.add('touch');
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}},lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

/* ---------- Sparad data: uppdrag, stjärnor, prydnader ---------- */

let SV;
{let o={};try{o=JSON.parse(lsGet(NYCKEL)||'{}')||{};}catch(e){}
 SV=Object.assign({seen:[],deko:[],stj:{},arende:null},o);if(!Array.isArray(SV.seen))SV.seen=[];if(!Array.isArray(SV.deko))SV.deko=[];if(!SV.stj||typeof SV.stj!=='object')SV.stj={};}

const idag=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
const dagNr=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);

      {n:'Läsa tillsammans',e:'👩‍🏫',c:0x7B61FF,prop:'hylla',p:[{n:'Högfrekventa ord',e:'👀',h:'ovriga/hogfrekventa/'},{n:'Bokstäver',e:'🔤',h:'ovriga/bokstaver/'},{n:'Läsflyt',e:'📖',h:'ovriga/lasflyt/'}]}

const RING=27,O_HUB=40;

/* ---------- Prydnader (belöningar, syns på huvudön) ---------- */
const DEKO=[
  {id:'lykta',e:'🏮',namn:'Lykta',bygg:(g,M)=>{const a=new THREE.Mesh(new THREE.CylinderGeometry(.1,.14,2.6,6),M(0x5E3B1C));a.position.y=1.3;g.add(a);const l=new THREE.Mesh(new THREE.SphereGeometry(.45,10,8),new THREE.MeshBasicMaterial({color:0xFFE07A,fog:false}));l.position.y=2.9;g.add(l);return t=>{l.scale.setScalar(1+Math.sin(t*3)*.08);};}},
  {id:'blommor',e:'🌸',namn:'Blomrabatt',bygg:(g,M)=>{const b=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.9,.3,14),M(0x8A5A2B));b.position.y=.15;g.add(b);const fa=[0xFF7EB6,0xFFD23F,0xFFFFFF,0xB28DFF];for(let i=0;i<14;i++){const a=i/14*6.28,r=.4+(i%3)*.5;const f=new THREE.Mesh(new THREE.IcosahedronGeometry(.28,0),M(fa[i%4]));f.position.set(Math.cos(a)*r,.55+(i%2)*.15,Math.sin(a)*r);g.add(f);}}},
  {id:'ballonger',e:'🎈',namn:'Ballonger',bygg:(g,M)=>{const gr=new THREE.Group();[[0xE5484D,-.5,0],[0x3D5AFE,.5,.3],[0xFFD23F,0,-.5]].forEach(([c,x,z],i)=>{const b=new THREE.Mesh(new THREE.SphereGeometry(.7,12,10),M(c));b.scale.y=1.2;b.position.set(x,4+i*.3,z);gr.add(b);const s=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,3.4,4),M(0xffffff));s.position.set(x/2,2.2,z/2);gr.add(s);});g.add(gr);return t=>{gr.position.y=Math.sin(t*1.5)*.25;gr.rotation.y=Math.sin(t*.8)*.2;};}},
  {id:'flagga',e:'🚩',namn:'Flagga',bygg:(g,M)=>{const a=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,4,6),M(0xDDDDDD));a.position.y=2;g.add(a);const f=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.1,.06),M(0xE5484D));f.position.set(.95,3.4,0);g.add(f);return t=>{f.rotation.y=Math.sin(t*3)*.25;};}},

function firaSteg(dt){
