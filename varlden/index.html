<style>
:root{--ink:#1D2B53;--card:#fff;--line:#C6D6F2;--accent:#3D5AFE;--gold:#F2B707;--font:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#7FD0F5;overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.btn{font:inherit;font-weight:800;font-size:1rem;color:var(--ink);background:var(--card);border:0;border-radius:999px;min-height:48px;padding:0 16px;box-shadow:0 4px 0 var(--line);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#topL{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:5}
#topR{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:5}
.pill{background:rgba(255,255,255,.92);box-shadow:0 4px 0 var(--line)}
#hint{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(92vw,560px);text-align:center;background:rgba(29,43,83,.82);color:#fff;border-radius:18px;padding:10px 16px;font-weight:700;line-height:1.3;z-index:4;transition:opacity .6s;pointer-events:none}
#hint.bort{opacity:0}
#prompt{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;font-size:1.25rem;min-height:60px;padding:0 26px;background:#FFC93C;box-shadow:0 5px 0 #C99A0A}
#prompt[hidden]{display:none}
#stick{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.85);z-index:5;touch-action:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 0 rgba(29,43,83,.25)}
#jump{position:fixed;right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:rgba(255,201,60,.92);color:var(--ink);font:800 1.15rem var(--font);z-index:5;touch-action:none;display:none;box-shadow:0 5px 0 #C99A0A}
#jump:active{transform:translateY(3px)}
body.touch #stick,body.touch #jump{display:block}
#load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(#7FD0F5,#CFEFFF);text-align:center;font-weight:800;font-size:1.3rem;padding:20px;transition:opacity .5s}
#load.klar{opacity:0;pointer-events:none}
#load .em{font-size:4rem;display:block;animation:hopp 1s ease-in-out infinite}
@keyframes hopp{50%{transform:translateY(-14px)}}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;transition:opacity .45s}
#fade.pa{opacity:1}
#fel{position:fixed;inset:0;z-index:30;display:none;place-items:center;text-align:center;padding:24px;background:#EAF3FF;font-weight:700;font-size:1.15rem}
#fel div{max-width:440px}
#stj{font-weight:800}
@media (prefers-reduced-motion:reduce){#load .em{animation:none}}

<script src="../djur.js"></script>
<script type="module">
/* Pluggparken-världen: en liten ö i 3D (three.js, lib/). Elevens djur går runt och hoppar genom portaler till ämnena.
   Allt byggs av enkla former i kod (inga modeller, inga bilder). Spelarens plats sparas i localStorage (mp-varlden-pos)
   så att man kommer tillbaka till samma portal. Stjärnorna man plockar här är bara en lek och sparas inte. */
const felvisa=m=>{const f=document.getElementById('fel');if(m)document.getElementById('felTxt').textContent=m;f.style.display='grid';};
let THREE;
try{THREE=await import('three');}catch(e){felvisa('Världen behöver ladda sina filer. Kontrollera uppkopplingen och ladda om sidan.');throw e;}
const $=id=>document.getElementById(id);
const REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches;
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(TOUCH)document.body.classList.add('touch');

/* ---------- Portaler (ämnen) ---------- */
const PORTALER=[
  {n:'Matte',e:'🔢',h:'matte/',c:0x3D5AFE},
  {n:'Svenska',e:'📖',h:'svenska/',c:0xE5484D},
  {n:'Spel',e:'🎮',h:'spel/',c:0xFFB400},
  {n:'SO',e:'🌍',h:'so/',c:0xF2780C},
  {n:'Rymdlabbet',e:'🚀',h:'ovriga/rymdlabbet/',c:0x1E9E5E},
  {n:'Kroppen',e:'🫀',h:'anatomi/',c:0xE0558A},
  {n:'Specialare',e:'✨',h:'specialare/',c:0x7B61FF},
  {n:'Fler ämnen',e:'🧩',h:'fler/',c:0x0E9AA7},
  {n:'Extra',e:'🎵',h:'extra/',c:0xD6409F}
];
const RING=27,O=40; // ringens radie, öns radie

/* ---------- Djuret ---------- */
const cfg=(typeof lasDjur==='function')?lasDjur():{animal:'uggla',color:'natur'};
function djurFarg(){
  const col=(WARD.color.items.find(x=>x.id===cfg.color)||{}).c;
  return col||NATUR[cfg.animal]||NATUR.uggla;
}
$('ldEm').textContent={uggla:'🦉',katt:'🐱',kanin:'🐰',rav:'🦊',panda:'🐼',pingvin:'🐧',robot:'🤖',drake:'🐲',enhorning:'🦄',groda:'🐸',hund:'🐶',bjorn:'🐻'}[cfg.animal]||'🦉';

/* ---------- Renderare, scen, kamera ---------- */
let lagt=false;
try{lagt=localStorage.getItem('mp-varlden-lagt')==='1';}catch(e){}
if(!lagt&&(navigator.hardwareConcurrency||8)<=4&&TOUCH)lagt=true; // enkel gissning för svaga enheter
const canvas=$('c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:!lagt,powerPreference:'low-power'});}
catch(e){felvisa();throw e;}
const skala=()=>lagt?1:Math.min(devicePixelRatio||1,2);
renderer.setPixelRatio(skala());
const scene=new THREE.Scene();
{ // himlen: en lodrät toning som bakgrund
  const c=document.createElement('canvas');c.width=2;c.height=256;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#5BB8F0');gr.addColorStop(.6,'#A9E0FA');gr.addColorStop(1,'#E8F8FF');g.fillStyle=gr;g.fillRect(0,0,2,256);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;scene.background=t;
}
scene.fog=new THREE.Fog(0xCFEFFF,lagt?45:60,lagt?105:150);
const cam=new THREE.PerspectiveCamera(58,1,.3,260);
scene.add(new THREE.HemisphereLight(0xFFFFFF,0x7DB07A,1.75));
const sol=new THREE.DirectionalLight(0xFFF4D6,1.9);sol.position.set(30,50,20);scene.add(sol);
const M=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c,flatShading:true},o||{}));

/* ---------- Ön ---------- */
const grass=new THREE.Mesh(new THREE.CylinderGeometry(O,O+1.5,3,56),M(0x6FCB6B));grass.position.y=-1.5;scene.add(grass);
const sand=new THREE.Mesh(new THREE.CylinderGeometry(O+1.6,O+4,2.4,56),M(0xF3DFA2));sand.position.y=-2.7;scene.add(sand);
const vatten=new THREE.Mesh(new THREE.CircleGeometry(300,48),new THREE.MeshLambertMaterial({color:0x4CC3F0,transparent:true,opacity:.92}));
vatten.rotation.x=-Math.PI/2;vatten.position.y=-2.2;scene.add(vatten);

// stigar och torget
const stig=M(0xF6E7B4);
const torg=new THREE.Mesh(new THREE.CylinderGeometry(8.5,8.5,.12,40),stig);torg.position.y=.03;scene.add(torg);
const torgRing=new THREE.Mesh(new THREE.TorusGeometry(8.5,.22,6,48),M(0xFFC93C));torgRing.rotation.x=Math.PI/2;torgRing.position.y=.12;scene.add(torgRing);
PORTALER.forEach((p,i)=>{
  const a=i/PORTALER.length*Math.PI*2;
  const s=new THREE.Mesh(new THREE.BoxGeometry(3,.1,RING-9),stig);
  const r=(RING+8.5)/2-1.6;s.position.set(Math.cos(a)*r,.02,Math.sin(a)*r);s.rotation.y=-a+Math.PI/2;scene.add(s);
});

// fontän-staty på torget: en stjärna på en sockel
const kollider=[]; // {x,z,r,top}: top = hur högt det går att kliva upp, 99 = vägg
function stjarnaGeo(R,r,d){
  const sh=new THREE.Shape();for(let i=0;i<10;i++){const q=i%2?r:R,t=i/10*Math.PI*2+Math.PI/2;(i?sh.lineTo:sh.moveTo).call(sh,Math.cos(t)*q,Math.sin(t)*q);}sh.closePath();
  const g=new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:true,bevelSize:d*.25,bevelThickness:d*.25,bevelSegments:1});g.translate(0,0,-d/2);return g;
}
const sockel=new THREE.Mesh(new THREE.CylinderGeometry(1.6,2.2,1.6,8),M(0xE9E2D0));sockel.position.y=.8;scene.add(sockel);
kollider.push({x:0,z:0,r:2.2,top:99});
const statyStjarna=new THREE.Mesh(stjarnaGeo(1.6,.7,.5),M(0xFFC93C,{emissive:0x553d00}));statyStjarna.position.y=3.6;scene.add(statyStjarna);

function etikett(text,emoji,bred,farg){
  const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');
  g.fillStyle='rgba(255,255,255,.96)';const r=60;g.beginPath();g.roundRect(6,10,500,108,r);g.fill();
  g.lineWidth=8;g.strokeStyle=farg||'#C6D6F2';g.stroke();
  g.fillStyle='#1D2B53';g.font='800 64px "Baloo 2","Trebuchet MS",system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText((emoji?emoji+' ':'')+text,256,68);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.set(bred,bred/4,1);return s;
}
const skylt=etikett('Pluggparken','','7','#FFC93C');skylt.position.set(0,6.6,0);skylt.scale.set(9,2.25,1);scene.add(skylt);

/* ---------- Portaler ---------- */
const portaler=[];
PORTALER.forEach((p,i)=>{
  const a=i/PORTALER.length*Math.PI*2,g=new THREE.Group();
  g.position.set(Math.cos(a)*RING,0,Math.sin(a)*RING);
  const yaw=Math.atan2(-Math.cos(a),-Math.sin(a)); // lokal +z pekar mot torget
  g.rotation.y=yaw;
  const fm=M(p.c),vit=M(0xFFFFFF);
  const ph=3.4;
  for(const sx of [-1,1]){
    const pil=new THREE.Mesh(new THREE.CylinderGeometry(.5,.62,ph,10),fm);pil.position.set(sx*2.4,ph/2,0);g.add(pil);
    const top=new THREE.Mesh(new THREE.SphereGeometry(.62,10,8),vit);top.position.set(sx*2.4,ph+.05,0);g.add(top);
  }
  const bage=new THREE.Mesh(new THREE.TorusGeometry(2.4,.5,8,28,Math.PI),fm);bage.position.y=ph;g.add(bage);
  const sh=new THREE.Shape();sh.moveTo(-2.4,0);sh.lineTo(2.4,0);sh.lineTo(2.4,ph);sh.absarc(0,ph,2.4,0,Math.PI,false);sh.lineTo(-2.4,0);
  const yta=new THREE.Mesh(new THREE.ShapeGeometry(sh,16),new THREE.MeshBasicMaterial({color:p.c,transparent:true,opacity:.5,side:THREE.DoubleSide,depthWrite:false,fog:false}));
  yta.position.z=-.02;g.add(yta);
  const ljus=new THREE.Mesh(new THREE.TorusGeometry(1.2,.12,6,24),new THREE.MeshBasicMaterial({color:0xFFFFFF,transparent:true,opacity:.7,fog:false}));
  ljus.position.set(0,2.1,0);g.add(ljus);
  const plat=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.6,.28,28),M(p.c));plat.position.set(0,.05,1.2);g.add(plat);
  const plat2=new THREE.Mesh(new THREE.CylinderGeometry(3.5,3.5,.3,28),M(0xFFFFFF));plat2.position.set(0,.06,1.2);g.add(plat2);
  const sk=etikett(p.n,p.e,5.6,'#'+p.c.toString(16).padStart(6,'0'));sk.position.set(0,ph+3.2,0);g.add(sk);
  scene.add(g);
  const rt=g.rotation.y,zx=Math.sin(rt),zz=Math.cos(rt),xx=Math.cos(rt),xz=-Math.sin(rt);
  for(const sx of [-1,1])kollider.push({x:g.position.x+xx*sx*2.4,z:g.position.z+xz*sx*2.4,r:.7,top:99});
  portaler.push({p,g,yta,ljus,zx,zz,xx,xz,fas:i});
});

/* ---------- Träd, buskar, blommor, stenar, moln ---------- */
let sd=7;const sr=()=>{sd=(sd*16807)%2147483647;return(sd-1)/2147483646;};
const vinklar=PORTALER.map((_,i)=>i/PORTALER.length*Math.PI*2);
const fri=(x,z)=>{ // inte på portalerna, stigarna eller torget
  const rr=Math.hypot(x,z);if(rr<12)return false;
  const v=Math.atan2(z,x);for(const a of vinklar){const d=Math.abs(((v-a+Math.PI*3)%(Math.PI*2))-Math.PI);if(d<.2&&rr<RING+8)return false;}
  for(const k of kollider)if(Math.hypot(x-k.x,z-k.z)<k.r+2.2)return false;return true;};
const antalTrad=lagt?22:38;
const stam=new THREE.InstancedMesh(new THREE.CylinderGeometry(.28,.38,1.6,6),M(0x9A6534),antalTrad);
const kron=new THREE.InstancedMesh(new THREE.ConeGeometry(1.7,3.4,7),M(0x3FAE5A),antalTrad);
const kron2=new THREE.InstancedMesh(new THREE.ConeGeometry(1.3,2.8,7),M(0x58C46E),antalTrad);
const mm=new THREE.Matrix4(),qq=new THREE.Quaternion(),sc=new THREE.Vector3(),pp=new THREE.Vector3();
let nt=0;
for(let f=0;nt<antalTrad&&f<900;f++){
  const a=sr()*Math.PI*2,r=14+sr()*(O-17),x=Math.cos(a)*r,z=Math.sin(a)*r;
  if(!fri(x,z)||(r<RING+3&&r>RING-6&&sr()<.7))continue;
  const s=.8+sr()*.7;
  sc.set(s,s,s);qq.identity();
  pp.set(x,.8*s,z);stam.setMatrixAt(nt,mm.compose(pp,qq,sc));
  pp.set(x,(1.6+1.5)*s,z);kron.setMatrixAt(nt,mm.compose(pp,qq,sc));
  pp.set(x,(1.6+3.1)*s,z);kron2.setMatrixAt(nt,mm.compose(pp,qq,sc));
  kollider.push({x,z,r:.6*s,top:99});nt++;
}
stam.count=kron.count=kron2.count=nt;scene.add(stam,kron,kron2);

const antalBl=lagt?90:220;
const blom=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.28,0),new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true}),antalBl);
const bfarg=[0xFF7EB6,0xFFD23F,0xFFFFFF,0xB28DFF,0xFF9A5C];
let nb=0;
for(let f=0;nb<antalBl&&f<2000;f++){
  const a=sr()*Math.PI*2,r=10+sr()*(O-12),x=Math.cos(a)*r,z=Math.sin(a)*r;
  if(!fri(x,z))continue;
  pp.set(x,.22,z);sc.set(1,1,1);blom.setMatrixAt(nb,mm.compose(pp,qq,sc));blom.setColorAt(nb,new THREE.Color(bfarg[nb%bfarg.length]));nb++;
}
blom.count=nb;scene.add(blom);

const sten=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,0),M(0xB7B2A5),56);
for(let i=0;i<56;i++){const a=i/56*Math.PI*2,r=O-.4+sr()*.6,s=.5+sr()*.7;
  pp.set(Math.cos(a)*r,.1,Math.sin(a)*r);sc.set(s*1.2,s*.8,s);qq.setFromAxisAngle(new THREE.Vector3(0,1,0),sr()*6);sten.setMatrixAt(i,mm.compose(pp,qq,sc));}
scene.add(sten);qq.identity();

const moln=[];
for(let i=0;i<(lagt?5:9);i++){
  const g=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true,transparent:true,opacity:.93});
  for(let k=0;k<4;k++){const b=new THREE.Mesh(new THREE.IcosahedronGeometry(2.2+sr()*1.4,0),m);b.position.set(k*2.4-3.6,sr()*.8,sr()*1.2);g.add(b);}
  const a=sr()*Math.PI*2,r=30+sr()*60;g.position.set(Math.cos(a)*r,22+sr()*16,Math.sin(a)*r);g.userData.v=.4+sr()*.5;scene.add(g);moln.push(g);
}

/* ---------- Hoppstig med stjärnor ---------- */
const plattformar=[];
function plattform(x,z,r,h,farg){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r+.25,h+1,14),M(farg));m.position.set(x,h/2-.5,z);scene.add(m);
  const kant=new THREE.Mesh(new THREE.CylinderGeometry(r+.04,r+.04,.22,14),M(0xFFFFFF));kant.position.set(x,h-.11,z);scene.add(kant);
  kollider.push({x,z,r,top:h});plattformar.push({x,z,r,h});
}
{ // en spiraltrappa av klossar nära torget (sydväst) och en lång hoppsekvens österut
  const bas=[-24,-12];
  [[0,0,1.3],[5,3,2.6],[10,0,3.9],[15,-4,5.0]].forEach(([dx,dz,h],i)=>plattform(bas[0]+dx,bas[1]+dz,2.1,h,[0xFF9A5C,0xFFD23F,0xB28DFF,0xFF7EB6][i]));
  [[8,-26,1.3],[12,-29,2.5],[16,-26,1.3]].forEach(([x,z,h],i)=>plattform(x,z,2,h,[0x58C4F0,0x3FBF7F,0xFFA24C][i]));
  plattform(-5,26,2.4,1.5,0x7B61FF);
}
const stjarnor=[];
{
  const sp=[[-9,-12+4,5.7],[-24+15,-12-4,6.7],[12,-29,4.4],[-5,26,3.9],[22,-13,1.3],[-3,-30,1.3],[24,16,1.3]];
  // plattformarnas toppar (bas -24,-12 + (15,-4) = -9,-16) och fria stjärnor i terrängen
  sp[0]=[-9,-16,6.7];sp[1]=[-14,-9,5.3];
  sp.forEach(([x,z,y])=>{const m=new THREE.Mesh(stjarnaGeo(.85,.38,.3),M(0xFFD23F,{emissive:0x7a5a00}));m.position.set(x,y,z);scene.add(m);stjarnor.push({m,x,y,z,tagen:false,y0:y});});
}
$('stj').textContent='⭐ 0 av '+stjarnor.length;

/* ---------- Spelaren ---------- */
function bygg(){
  const [c1,c2]=djurFarg(),a=cfg.animal,g=new THREE.Group(),inner=new THREE.Group();g.add(inner);
  const m1=M(c1),m2=M(c2),vit=M(0xffffff),svart=M(0x1D2B53),orange=M(0xFFA24C);
  const rund=a==='robot'?new THREE.BoxGeometry(1.1,1.2,.9):new THREE.SphereGeometry(.62,14,12);
  const kropp=new THREE.Mesh(rund,m1);kropp.position.y=.85;kropp.scale.set(1,a==='robot'?1:1.08,a==='robot'?1:.92);inner.add(kropp);
  const mage=new THREE.Mesh(new THREE.SphereGeometry(.42,12,10),M(a==='pingvin'||a==='panda'?0xFFFFFF:a==='uggla'?0xF5E9C8:0xFFF3E2));mage.position.set(0,.8,.34);mage.scale.set(1,1.1,.6);inner.add(mage);
  const huvud=new THREE.Mesh(a==='robot'?new THREE.BoxGeometry(1.05,.9,.9):new THREE.SphereGeometry(.56,14,12),m1);huvud.position.y=1.72;inner.add(huvud);
  const ogon=(x,y,z,s)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(s,10,8),vit);o.position.set(x,y,z);inner.add(o);const p=new THREE.Mesh(new THREE.SphereGeometry(s*.55,8,6),svart);p.position.set(x,y,z+s*.62);inner.add(p);};
  if(a==='groda'){ogon(-.26,2.17,.18,.22);ogon(.26,2.17,.18,.22);}
  else {const sy=a==='uggla'?.26:.22,s=a==='uggla'?.2:.14;ogon(-sy,1.78,.45,s);ogon(sy,1.78,.45,s);}
  const ora=(x,y,z,geo,mat,rx,rz)=>{const e=new THREE.Mesh(geo,mat);e.position.set(x,y,z);if(rx)e.rotation.x=rx;if(rz)e.rotation.z=rz;inner.add(e);return e;};
  const kon=new THREE.ConeGeometry(.2,.5,6),runda=new THREE.SphereGeometry(.2,8,6);
  if(a==='uggla'){ora(0,1.58,.62,new THREE.ConeGeometry(.12,.3,5),orange,Math.PI/2);ora(-.34,2.25,0,kon,m2);ora(.34,2.25,0,kon,m2);}
  else if(a==='katt'||a==='rav'){ora(-.32,2.22,0,kon,m1);ora(.32,2.22,0,kon,m1);ora(0,1.62,.58,new THREE.SphereGeometry(.12,8,6),a==='rav'?svart:M(0xFF9DB6));if(a==='rav'){const sn=ora(0,1.6,.42,new THREE.SphereGeometry(.3,10,8),vit);sn.scale.set(1,.7,1);ora(0,.55,-.55,new THREE.ConeGeometry(.28,.9,6),m1,-Math.PI/2.4);}}
  else if(a==='kanin'){const l=new THREE.CapsuleGeometry(.12,.55,3,8);ora(-.22,2.45,-.05,l,m1);ora(.22,2.45,-.05,l,m1);ora(0,1.6,.56,new THREE.SphereGeometry(.1,8,6),M(0xFF9DB6));}
  else if(a==='panda'||a==='bjorn'){const mo=a==='panda'?svart:m2;ora(-.42,2.15,0,runda,mo);ora(.42,2.15,0,runda,mo);ora(0,1.62,.52,new THREE.SphereGeometry(.2,10,8),a==='panda'?vit:M(0xE7C9A0));ora(0,1.7,.7,new THREE.SphereGeometry(.09,8,6),svart);if(a==='panda'){ora(-.2,1.78,.5,new THREE.SphereGeometry(.16,8,6),svart).scale.set(1,1.2,.5);ora(.2,1.78,.5,new THREE.SphereGeometry(.16,8,6),svart).scale.set(1,1.2,.5);}}
  else if(a==='hund'){ora(-.5,1.8,0,new THREE.SphereGeometry(.22,8,6),m2).scale.set(.7,1.5,1);ora(.5,1.8,0,new THREE.SphereGeometry(.22,8,6),m2).scale.set(.7,1.5,1);ora(0,1.62,.55,new THREE.SphereGeometry(.2,10,8),M(0xF5DDBB));ora(0,1.7,.72,new THREE.SphereGeometry(.09,8,6),svart);}
  else if(a==='pingvin'){ora(0,1.6,.62,new THREE.ConeGeometry(.13,.3,5),orange,Math.PI/2);ora(-.68,.95,0,new THREE.SphereGeometry(.2,8,6),m2).scale.set(.5,1.6,.9);ora(.68,.95,0,new THREE.SphereGeometry(.2,8,6),m2).scale.set(.5,1.6,.9);}
  else if(a==='robot'){ora(0,2.4,0,new THREE.CylinderGeometry(.04,.04,.4,6),m2);ora(0,2.65,0,new THREE.SphereGeometry(.12,8,6),M(0xE5484D));ora(0,1.5,.46,new THREE.BoxGeometry(.5,.1,.04),svart);}
  else if(a==='drake'){ora(-.3,2.28,0,kon,M(0xFFD23F));ora(.3,2.28,0,kon,M(0xFFD23F));ora(0,1.58,.56,new THREE.SphereGeometry(.16,8,6),m2);ora(-.55,1,-.3,new THREE.ConeGeometry(.35,.9,3),m2,0,Math.PI/2);ora(.55,1,-.3,new THREE.ConeGeometry(.35,.9,3),m2,0,-Math.PI/2);}
  else if(a==='enhorning'){ora(0,2.5,.1,new THREE.ConeGeometry(.12,.7,6),M(0xFFD23F));ora(-.36,2.18,0,kon,m1);ora(.36,2.18,0,kon,m1);ora(0,1.58,.56,new THREE.SphereGeometry(.14,8,6),M(0xFFB3D1));}
  else if(a==='groda'){ora(0,1.55,.5,new THREE.BoxGeometry(.7,.06,.1),svart);}
  // hatt
  const hatt=cfg.hat;
  if(hatt==='krona'){ora(0,2.3,0,new THREE.CylinderGeometry(.34,.4,.3,6),M(0xFFD23F));ora(0,2.55,0,new THREE.ConeGeometry(.34,.3,6),M(0xFFD23F));}
  else if(hatt==='party'){ora(0,2.5,0,new THREE.ConeGeometry(.3,.8,10),M(0xFF7EB6));}
  else if(hatt==='troll'||hatt==='haxhatt'){ora(0,2.1,0,new THREE.CylinderGeometry(.7,.7,.06,14),M(hatt==='troll'?0x3D2F8A:0x1D2B53));ora(0,2.55,0,new THREE.ConeGeometry(.42,.95,10),M(hatt==='troll'?0x3D2F8A:0x1D2B53));}
  else if(hatt==='tomteluva'){ora(0,2.3,0,new THREE.ConeGeometry(.42,.8,10),M(0xE5484D));ora(0,2.7,0,new THREE.SphereGeometry(.12,8,6),vit);}
  else if(hatt==='mossa'||hatt==='keps'||hatt==='hjalm'||hatt==='solhatt'||hatt==='cowboy'||hatt==='pirat'){ora(0,2.18,0,new THREE.SphereGeometry(.5,12,8,0,Math.PI*2,0,Math.PI/2),M(0x3D5AFE));}
  const fot=[-.26,.26].map(x=>{const f=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),a==='pingvin'?orange:m2);f.position.set(x,.2,.12);f.scale.set(1,.7,1.3);g.add(f);return f;});
  const skugga=new THREE.Mesh(new THREE.CircleGeometry(.7,16),new THREE.MeshBasicMaterial({color:0x1D2B53,transparent:true,opacity:.28,depthWrite:false}));
  skugga.rotation.x=-Math.PI/2;skugga.position.y=.03;
  g.userData={inner,fot,skugga};
  return g;
}
const djur=bygg();scene.add(djur,djur.userData.skugga);

/* ---------- Tillstånd: plats, kamera, rörelse ---------- */
const P={x:0,y:0,z:7,vy:0,hopp:0,yaw:Math.PI,fartX:0,fartZ:0,mark:true,ang:0,hopp:0};
let camYaw=0,camPitch=.5,camDist=11.5;
function startpunkt(){
  let s=null;try{s=JSON.parse(localStorage.getItem('mp-varlden-pos')||'null');}catch(e){}
  if(s&&isFinite(s.x)&&isFinite(s.z)&&Math.hypot(s.x,s.z)<O-1){P.x=s.x;P.z=s.z;P.y=0;P.vy=0;P.ang=s.yaw||0;camYaw=s.cam!=null?s.cam:s.yaw||0;}
  else{P.x=0;P.z=8;P.ang=Math.PI;camYaw=Math.PI; /* ser ut över torget mot en portal */ P.x=Math.cos(vinklar[0])*(RING-6);P.z=Math.sin(vinklar[0])*(RING-6);P.ang=Math.atan2(Math.cos(vinklar[0]),Math.sin(vinklar[0]));camYaw=P.ang;}
}
startpunkt();

/* ---------- Ingångar ---------- */
const tang={};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
  if(k===' '&&!tang[' '])P.hoppKo=true;tang[k]=true;
  if(k==='enter'&&narmaste&&!e.repeat)gaIn(narmaste);});
addEventListener('keyup',e=>{tang[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in tang)tang[k]=false;});
// joystick
const stick=$('stick'),knob=$('knob');let jid=null,jx=0,jy=0;
function jflytta(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),mx=r.width/2-10;if(m>mx){dx=dx/m*mx;dy=dy/m*mx;}jx=dx/mx;jy=dy/mx;knob.style.transform=`translate(${dx}px,${dy}px)`;}
stick.addEventListener('pointerdown',e=>{jid=e.pointerId;stick.setPointerCapture(jid);jflytta(e);e.preventDefault();});
stick.addEventListener('pointermove',e=>{if(e.pointerId===jid)jflytta(e);});
const jslut=e=>{if(e.pointerId!==jid)return;jid=null;jx=jy=0;knob.style.transform='';};
stick.addEventListener('pointerup',jslut);stick.addEventListener('pointercancel',jslut);
$('jump').addEventListener('pointerdown',e=>{P.hoppKo=true;e.preventDefault();});
// kameran: dra på bilden
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;camYaw-=(e.clientX-drag.x)*.0055;camPitch=Math.max(.12,Math.min(1.1,camPitch+(e.clientY-drag.y)*.004));drag.x=e.clientX;drag.y=e.clientY;});
const dslut=e=>{if(drag&&e.pointerId===drag.id)drag=null;};canvas.addEventListener('pointerup',dslut);canvas.addEventListener('pointercancel',dslut);
canvas.addEventListener('wheel',e=>{camDist=Math.max(6,Math.min(16,camDist+e.deltaY*.01));e.preventDefault();},{passive:false});

/* ---------- Ljud (litet pling, bara efter första trycket) ---------- */
let ac=null;
function pling(f1,f2){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(f1,t);o.frequency.setValueAtTime(f2,t+.09);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.32);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.35);}catch(e){}}
const hoppljud=()=>pling(330,520);

/* ---------- Spelregler ---------- */
const G=24,HOPP=9.2,FART=9;
function markhojd(x,z,fy){let h=0;for(const k of kollider)if(k.top<90&&Math.hypot(x-k.x,z-k.z)<k.r&&k.top<=fy+.55&&k.top>h)h=k.top;return h;}
function stoppa(){ // putta ut spelaren ur väggar och för höga klossar
  for(const k of kollider){const dx=P.x-k.x,dz=P.z-k.z,d=Math.hypot(dx,dz),min=k.r+.5;
    if(d<min&&P.y<k.top-.55){const n=d||1;P.x=k.x+dx/n*min;P.z=k.z+dz/n*min;}}
  const rr=Math.hypot(P.x,P.z),mx=O-1.2;if(rr>mx){P.x*=mx/rr;P.z*=mx/rr;}
}
let narmaste=null,gaar=false;
const prompt=$('prompt');
function gaIn(po){
  if(gaar)return;gaar=true;pling(440,880);
  try{ // stå framför portalen när man kommer tillbaka, med blicken mot den
    const x=po.g.position.x+po.zx*5.2,z=po.g.position.z+po.zz*5.2,ang=Math.atan2(-po.zx,-po.zz);
    localStorage.setItem('mp-varlden-pos',JSON.stringify({x,z,yaw:ang,cam:ang}));
    sessionStorage.setItem('mp-fran-varlden','1');}catch(e){}
  $('fade').classList.add('pa');
  setTimeout(()=>{location.href=new URL('../'+po.p.h,location.href).href;},REDUCE?60:420);
}
prompt.addEventListener('click',()=>{if(narmaste)gaIn(narmaste);});
function sparaPlats(){try{if(!gaar)localStorage.setItem('mp-varlden-pos',JSON.stringify({x:P.x,z:P.z,yaw:P.ang,cam:camYaw}));}catch(e){}}
addEventListener('pagehide',sparaPlats);
addEventListener('pageshow',e=>{if(e.persisted||gaar){gaar=false;$('fade').classList.remove('pa');startpunkt();}});
setInterval(sparaPlats,4000);

/* ---------- Hjälptext ---------- */
const hint=$('hint');
hint.textContent=TOUCH?'Dra i cirkeln för att gå, tryck Hoppa för att hoppa. Dra på bilden för att titta runt. Gå in i en portal! ✨':'Gå med W A S D eller pilarna, hoppa med mellanslag, titta runt med musen (dra) eller Q och E. Gå in i en portal! ✨';
setTimeout(()=>hint.classList.add('bort'),11000);
let hintBort=false;const gomHint=()=>{if(!hintBort){hintBort=true;setTimeout(()=>hint.classList.add('bort'),2500);}};

/* ---------- Lågt läge ---------- */
function stallLagt(v){lagt=v;$('lagt').setAttribute('aria-pressed',String(v));$('lagt').textContent=v?'🐢 Lågt läge: på':'🐢 Lågt läge';
  try{localStorage.setItem('mp-varlden-lagt',v?'1':'0');}catch(e){}
  renderer.setPixelRatio(skala());scene.fog.near=v?45:60;scene.fog.far=v?105:150;storlek();}
$('lagt').addEventListener('click',()=>stallLagt(!lagt));
stallLagt(lagt);

function storlek(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',storlek);storlek();

/* ---------- Slingan ---------- */
const clock=new THREE.Clock();let tid=0,tagna=0,fpsSum=0,fpsN=0,fpsKoll=true;
const v3=new THREE.Vector3();
function steg(dt){
  tid+=dt;
  // önskad riktning (kameran bestämmer vad "framåt" är)
  let ix=0,iz=0;
  if(tang['w']||tang['arrowup'])iz+=1;if(tang['s']||tang['arrowdown'])iz-=1;
  if(tang['d']||tang['arrowright'])ix+=1;if(tang['a']||tang['arrowleft'])ix-=1;
  if(jid!==null){ix+=jx;iz-=jy;}
  if(tang['q'])camYaw+=1.9*dt;if(tang['e'])camYaw-=1.9*dt;
  const m=Math.hypot(ix,iz);if(m>1){ix/=m;iz/=m;}
  const fx=Math.sin(camYaw),fz=Math.cos(camYaw),rx=-Math.cos(camYaw),rz=Math.sin(camYaw);
  const mx=(fx*iz+rx*ix)*FART,mz=(fz*iz+rz*ix)*FART;
  // mjuk acceleration (snabbare på marken)
  const ac=P.mark?14:7;
  P.fartX+=(mx-P.fartX)*Math.min(1,ac*dt);P.fartZ+=(mz-P.fartZ)*Math.min(1,ac*dt);
  const gar=Math.hypot(P.fartX,P.fartZ)>.6;
  if(gar){gomHint();let d=Math.atan2(P.fartX,P.fartZ)-P.ang;d=Math.atan2(Math.sin(d),Math.cos(d));P.ang+=d*Math.min(1,12*dt);}
  // hopp och dubbelhopp
  if(P.hoppKo){P.hoppKo=false;if(P.mark){P.vy=HOPP;P.mark=false;P.hopp=1;hoppljud();gomHint();}else if(P.hopp<2){P.vy=HOPP*.9;P.hopp=2;pling(420,660);}}
  P.x+=P.fartX*dt;P.z+=P.fartZ*dt;
  stoppa();
  P.vy-=G*dt;P.y+=P.vy*dt;
  const mh=markhojd(P.x,P.z,P.y-P.vy*dt);
  if(P.y<=mh&&P.vy<=0){P.y=mh;P.vy=0;P.mark=true;P.hopp=0;}else if(P.y>mh+.05)P.mark=false;
  // portaler
  narmaste=null;
  for(const po of portaler){
    const dx=P.x-po.g.position.x,dz=P.z-po.g.position.z,lx=dx*po.xx+dz*po.xz,lz=dx*po.zx+dz*po.zz;
    if(Math.abs(lx)<2.0&&lz>-1&&lz<1&&P.y<3.5){gaIn(po);break;}
    if(Math.abs(lx)<5&&lz>0&&lz<8.5)narmaste=po;
  }
  if(narmaste&&!gaar){prompt.hidden=false;const t='🚪 Gå in: '+narmaste.p.e+' '+narmaste.p.n;if(prompt.textContent!==t)prompt.textContent=t;}else prompt.hidden=true;
  // stjärnor
  for(const s of stjarnor){
    if(s.tagen)continue;
    if(Math.hypot(P.x-s.x,P.z-s.z)<1.3&&Math.abs(P.y+1-s.y)<1.6){s.tagen=true;s.m.visible=false;tagna++;pling(660,990);
      $('stj').textContent='⭐ '+tagna+' av '+stjarnor.length+(tagna===stjarnor.length?' 🎉':'');}
  }
}
function rita(dt){
  const t=tid;
  djur.position.set(P.x,P.y,P.z);
  djur.userData.skugga.position.set(P.x,markhojd(P.x,P.z,P.y+1)+.03,P.z);
  const hojdUnder=P.y-markhojd(P.x,P.z,P.y+1);
  djur.userData.skugga.scale.setScalar(Math.max(.5,1-hojdUnder*.07));
  djur.rotation.y=P.ang;
  const fart=Math.hypot(P.fartX,P.fartZ),gar=fart>.6&&P.mark;
  const inner=djur.userData.inner;
  const vag=gar?Math.abs(Math.sin(t*14*Math.min(1,fart/FART+.3))):0;
  const sq=P.mark?1:1+Math.max(-.12,Math.min(.18,P.vy*.02));
  inner.position.y=vag*.2;inner.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
  inner.rotation.z=gar?Math.sin(t*14)*.06:0;
  djur.userData.fot.forEach((f,i)=>{f.position.z=.12+(gar?Math.sin(t*14+i*Math.PI)*.22:0);f.position.y=.2+(P.mark?(gar?Math.max(0,Math.sin(t*14+i*Math.PI))*.15:0):.25);});
  // kameran
  const cx=P.x-Math.sin(camYaw)*Math.cos(camPitch)*camDist,cz=P.z-Math.cos(camYaw)*Math.cos(camPitch)*camDist,cy=P.y+1.7+Math.sin(camPitch)*camDist;
  cam.position.lerp(v3.set(cx,cy,cz),Math.min(1,dt*10));
  cam.lookAt(P.x,P.y+2.7,P.z);
  // liv i världen
  statyStjarna.rotation.y=t*1.2;statyStjarna.position.y=3.6+Math.sin(t*2)*.2;
  for(const s of stjarnor)if(!s.tagen){s.m.rotation.y=t*2;s.m.position.y=s.y0+Math.sin(t*2.4+s.x)*.18;}
  for(const po of portaler){po.yta.material.opacity=.42+Math.sin(t*2+po.fas)*.1;po.ljus.rotation.z=t*1.5;po.ljus.scale.setScalar(.85+Math.sin(t*2+po.fas)*.15);}
  if(!REDUCE)for(const g of moln){g.position.x+=g.userData.v*dt;if(g.position.x>110)g.position.x=-110;}
}
let sistaFas=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(.05,clock.getDelta());
  steg(dt);rita(dt);renderer.render(scene,cam);
  if(!sistaFas){sistaFas=1;$('load').classList.add('klar');}
  // går det trögt de första sekunderna slår vi på lågt läge av oss själva
  if(fpsKoll&&tid>1&&tid<5){fpsSum+=dt;fpsN++;}
  if(fpsKoll&&tid>=5){fpsKoll=false;if(fpsN&&fpsSum/fpsN>1/26&&!lagt){stallLagt(true);}}
});
window.__varlden={P,portaler,stjarnor,gaIn,kamera:()=>({camYaw,camPitch})};
</script>
