<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klasstavlan – Pluggparken</title>
<meta name="description" content="Klasstavlan: en interaktiv whiteboard för projektorn med rutor för 'Du behöver' och 'När du är klar', timer, lyckohjul och anteckningar. Rita och skriv fritt på tavlan.">
<link rel="canonical" href="https://pluggparken.se/larare/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pluggparken">
<meta property="og:locale" content="sv_SE">
<meta property="og:title" content="Klasstavlan – Pluggparken">
<meta property="og:description" content="En tavla för projektorn med instruktioner, timer, lyckohjul och anteckningar.">
<meta property="og:url" content="https://pluggparken.se/larare/">
<meta property="og:image" content="https://pluggparken.se/og.jpg">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--ink:#1D2B53;--muted:#56668F;--line:#C6D6F2;--accent:#3D5AFE;--good:#1E9E5E;--font:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#board{position:fixed;inset:0;background:#fff;transition:background .3s}
#board{--g:40px}
#board.rutat{background-color:#fff;background-image:linear-gradient(#DCE6F7 1px,transparent 1px),linear-gradient(90deg,#DCE6F7 1px,transparent 1px);background-size:var(--gz,var(--g)) var(--gz,var(--g));background-position:var(--bx,0) var(--by,0)}
#board.linjerat{background-color:#fff;background-image:linear-gradient(#DCE6F7 2px,transparent 2px);background-size:100% var(--gz,var(--g));background-position:0 var(--byl,calc(var(--g) - 16px))}
#board.tavla{background:radial-gradient(ellipse 40% 70% at 20% 40%,rgba(255,255,255,.05),transparent 70%),radial-gradient(ellipse 45% 50% at 72% 90%,rgba(255,255,255,.035),transparent 70%),#1F3A35}
#rita{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#rita.sudd{cursor:cell}
#bPenna{position:relative}#bPenna::after{content:"▾";position:absolute;right:5px;bottom:2px;font-size:.7rem;opacity:.75}
.pop.pensler{width:360px;box-sizing:border-box;grid-template-columns:minmax(0,1fr);white-space:normal}
.pens{display:grid;gap:6px}.pens button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:50px;padding:0 12px}.pens button canvas{width:150px;height:34px;flex:none}.pens button span{font-weight:800;font-size:.95rem;flex:1;text-align:left;min-width:0}
.formrad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.formrad button{display:flex;flex-direction:column;align-items:center;justify-content:center;height:58px;padding:0 4px;font-size:.78rem;line-height:1.1}
.pop .fg.egen{position:relative;overflow:hidden;background:conic-gradient(#E5484D,#F5C400,#1E9E5E,#2F6BFF,#7B61FF,#E5484D)}.pop .fg.egen input{position:absolute;inset:-6px;width:60px;height:60px;opacity:0;cursor:pointer}
#rita.hand{cursor:grab}#rita.tag{cursor:grabbing}
#zoomrad{position:fixed;right:14px;bottom:14px;z-index:150;display:flex;gap:4px;background:rgba(31,58,53,.94);border-radius:16px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
#zoomrad button{min-width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:1.1rem;padding:0 10px}#zoomrad button:hover{background:rgba(255,255,255,.24)}
#bar.mini ~ #zoomrad,#bar.mini ~ .fly{display:none}
#bar #bLagg{font-size:2.1rem;font-weight:800;line-height:1;color:#fff;padding-bottom:3px}
.grp{position:relative}.grp::after{content:"▸";position:absolute;right:5px;bottom:2px;font-size:.7rem;opacity:.75}.grp.oppen{background:rgba(255,255,255,.3)!important}
.fly{position:fixed;z-index:205;background:#fff;border-radius:16px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:grid;gap:6px;min-width:280px}
.fly button{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 14px;border-radius:12px;background:#F1F6FF;font-weight:800;font-size:1.02rem;text-align:left}.fly button i{font-style:normal;font-size:1.3rem;width:1.6rem;text-align:center;flex:none}.fly button:hover{background:#E3EAFF}.fly button:disabled{opacity:.45;cursor:default}
.pop.lager{width:430px;box-sizing:border-box;grid-template-columns:minmax(0,1fr);white-space:normal}
.lagrad{display:flex;gap:4px}.lagrad button{flex:0 0 44px;padding:0}.lagrad .ln{flex:1 1 auto;min-width:0;padding:0 10px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lagrad.dold .ln{opacity:.5}.lagop{display:grid;gap:4px;font-weight:800;font-size:.9rem;color:var(--muted);padding:2px 4px}.lagop b{color:var(--ink);float:right}.lagop input{width:100%}
#barGrepp{height:16px;margin:-2px 0 -2px;display:grid;place-items:center;color:rgba(255,255,255,.5);cursor:grab;touch-action:none;font-size:1rem;letter-spacing:2px;line-height:1}#barGrepp:active{cursor:grabbing}
#rita.av{pointer-events:none}
#widgets{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
/* verktygsfält */
#bar{position:fixed;left:10px;top:10px;z-index:200;display:flex;flex-direction:column;gap:6px;background:rgba(31,58,53,.94);border-radius:20px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.28);max-height:calc(100% - 20px);overflow:auto}
#bar button,#bar a{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:1.5rem;line-height:1;display:grid;place-items:center;text-decoration:none;position:relative}
#bar button:hover,#bar a:hover{background:rgba(255,255,255,.24)}
#bar button.v{background:#F4D35E;color:#1F3A35}
#bar small{position:absolute;bottom:2px;font-size:.6rem;font-weight:800;opacity:.85}
#bar hr{width:100%;border:0;border-top:1px solid rgba(255,255,255,.18);margin:2px 0}
#bar.mini{padding:0;background:none;box-shadow:none}
#bar.mini>*:not(#bMin){display:none!important}
#bar.mini #bMin{background:rgba(31,58,53,.94);box-shadow:0 4px 12px rgba(0,0,0,.28)}
.pop{position:fixed;z-index:210;background:#fff;border-radius:16px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:grid;gap:8px;min-width:200px}
.pop .rad{display:flex;gap:6px;flex-wrap:wrap}
.pop button{min-width:44px;height:44px;border-radius:12px;background:#F1F6FF;border:2px solid transparent;font-weight:800;padding:0 10px}
.pop button.v{border-color:var(--accent);background:#E3EAFF}
.pop .fg{width:38px;min-width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.pop .fg.v{box-shadow:0 0 0 4px var(--accent)}
.pop .tj{display:grid;place-items:center}.pop .tj i{display:block;background:#1D2B53;border-radius:50%}
.pop h4{margin:0;font-size:.85rem;color:var(--muted)}
.meny button{display:flex;gap:10px;align-items:center;justify-content:flex-start;width:100%;height:46px;font-size:1.02rem}
/* rutor */
.w{position:absolute;pointer-events:auto;transform-origin:0 0;background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(20,30,70,.28);border:4px solid var(--c,#3D5AFE);min-width:240px;max-width:1700px;animation:wIn .22s ease-out;user-select:none;-webkit-user-select:none}
.w.fram{z-index:50}
.wh{display:flex;align-items:center;gap:6px;background:var(--c,#3D5AFE);color:#fff;padding:6px 8px;border-radius:12px 12px 0 0;cursor:grab;touch-action:none}
.wh:active{cursor:grabbing}
.wh input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;font-weight:800;font-size:1.25rem;padding:2px 4px;border-radius:8px}
.wh input::placeholder{color:rgba(255,255,255,.7)}
.wh input:focus{background:rgba(255,255,255,.2)}
.wh b{flex:1;font-size:1.25rem}
.wh button{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-weight:800;font-size:1rem;line-height:1}
.wh button:hover{background:rgba(255,255,255,.4)}
.wb{padding:12px;user-select:text;-webkit-user-select:text}
@keyframes wIn{from{opacity:0}to{opacity:1}}
.pop.tavlor{width:380px;box-sizing:border-box;grid-template-columns:minmax(0,1fr);white-space:normal}
.tavrad{display:flex;gap:4px}.tavrad button{flex:0 0 44px;padding:0}.tavrad .tn{flex:1 1 auto;min-width:0;padding:0 12px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tavny{display:flex;gap:6px}.tavny button{flex:none}.tavny input{flex:1 1 auto;min-width:0;width:100%;height:44px;box-sizing:border-box;font:inherit;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:0 10px;color:var(--ink);background:#fff}
.tavinfo,.tomtav{font-size:.85rem;font-weight:700;color:var(--muted);padding:0 4px;line-height:1.3}
.efter{margin-top:10px;font-size:.8rem;font-weight:800;color:var(--muted)}.efter select{display:block;width:100%;margin-top:3px;font:inherit;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:5px 8px;background:#fff;color:var(--ink)}
.gp{width:780px;display:grid;gap:10px}   /* fast bredd: annars blir rutan lika bred som alla kort på en rad */
.gplage{display:flex;gap:6px;flex-wrap:wrap}.gplage button{flex:1 1 auto;height:44px;border-radius:12px;background:#F1F6FF;border:2px solid var(--line);font-weight:800;padding:0 12px}.gplage button.v{background:#E3EAFF;border-color:var(--accent)}
.gpn{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--muted)}.gpn b{font-size:1.6rem;color:var(--ink);min-width:2ch;text-align:center}.gpn button{width:44px;height:44px;border-radius:12px;background:#F1F6FF;border:2px solid var(--line);font-size:1.4rem;font-weight:800}
.gpgo{justify-self:center;background:var(--accent);color:#fff;border-radius:14px;padding:10px 26px;font-weight:800;font-size:1.3rem;box-shadow:0 4px 0 #2A3FB8}.gpgo:disabled{opacity:.5}
.gpres{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.gptom{color:var(--muted);font-weight:700;text-align:center}
.gpk{border:3px solid;border-radius:14px;padding:8px 12px}.gpk h5{margin:0 0 4px;font-size:.9rem;color:var(--muted)}.gpk div{font-weight:800;font-size:1.35rem;line-height:1.25;color:var(--ink)}
@media(prefers-reduced-motion:no-preference){.gpres.ny .gpk{animation:gpIn .3s ease-out both}@keyframes gpIn{from{transform:scale(.85);opacity:0}}}
.gpchips{display:flex;flex-wrap:wrap;gap:6px}.gpchips button{border-radius:999px;padding:4px 12px;background:#F1F6FF;border:2px solid var(--line);font-weight:800;font-size:.95rem}.gpchips button.borta{opacity:.45;text-decoration:line-through}
.gp textarea{width:100%;height:130px;font:inherit;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:8px;resize:vertical;color:var(--ink)}
.gpsm{justify-self:start;background:#F1F6FF;border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:800;font-size:.9rem}.gpnot{font-size:.8rem;font-weight:700;color:var(--muted)}
.w.ordnar{transition:left .45s ease,top .45s ease,transform .45s ease}
.w.last{box-shadow:0 8px 24px rgba(20,30,70,.28),0 0 0 3px rgba(255,255,255,.65)}
.w.last .wh{cursor:default}
.hjorn{position:absolute;right:-8px;bottom:-8px;width:30px;height:30px;cursor:nwse-resize;touch-action:none;pointer-events:auto;z-index:3}
.hjorn::after{content:"";position:absolute;right:9px;bottom:9px;width:14px;height:14px;border-right:4px solid var(--c,#3D5AFE);border-bottom:4px solid var(--c,#3D5AFE);border-radius:0 0 6px 0;opacity:0;transition:opacity .15s}
.w:hover .hjorn::after,.hjorn:active::after{opacity:.85}
.w.last .hjorn{display:none}
@media(hover:none){.hjorn::after{opacity:.6}}
.gl{position:absolute;background:#F2780C;pointer-events:none;z-index:9999;opacity:.9;border-radius:2px}
.gl.v{width:3px;top:0;bottom:0;margin-left:-1px}
.gl.h{height:3px;left:0;right:0;margin-top:-1px}
#widgets.pres .wh button{display:none}
#widgets.pres .wh{cursor:grab}
.wh button[data-a="las"]{opacity:.75}
/* lista */
.saker{display:flex;flex-wrap:wrap;gap:10px;min-height:56px}
.it{position:relative;width:112px;text-align:center;background:#F6F9FF;border:2px solid var(--line);border-radius:16px;padding:8px 4px 6px}
.it .ik{font-size:3rem;line-height:1.1;height:3.4rem;display:grid;place-items:center}
.it .ik svg{width:64px;height:44px}
.it .n{display:block;font-weight:800;font-size:.95rem;line-height:1.1;margin-top:2px}
.it input{width:92%;margin-top:4px;font:inherit;font-weight:800;font-size:1.05rem;text-align:center;border:2px solid #B9C9EE;border-radius:10px;padding:2px;background:#fff;color:var(--ink)}
.it .x{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 0 var(--line);font-size:.7rem;font-weight:800;opacity:0}
.it:hover .x,.it:focus-within .x{opacity:1}
.tomrad{color:var(--muted);font-weight:700;align-self:center}
.it .ik:has(>img.eg){height:auto;min-height:3.4rem}
.it .ik img.eg{width:auto;height:auto;max-width:96px;max-height:100px;object-fit:contain;border-radius:8px;display:block}   /* hela bilden syns, ingen beskärning */
.it .bi{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 0 var(--line);font-size:.8rem;opacity:0}
.it:hover .bi,.it:focus-within .bi{opacity:1}
.it textarea.en{width:94%;margin-top:2px;font:inherit;font-weight:800;font-size:.95rem;line-height:1.1;text-align:center;border:2px solid #B9C9EE;border-radius:10px;padding:3px;background:#fff;color:var(--ink);resize:none;overflow:hidden}
@media(hover:none){.it .x,.it .bi{opacity:.85}}
.egenform{flex:1 1 100%;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#F1F6FF;border:2px dashed var(--line);border-radius:14px;padding:10px}
.egenform input[type=text]{grid-column:1/-1;font:inherit;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--ink);background:#fff}
.egenform label{font-weight:800;font-size:.95rem;display:flex;gap:6px;align-items:center;cursor:pointer}
.egenform .bildv{background:#fff;border:2px solid var(--line);border-radius:10px;padding:4px 10px}
.egenform .bildv img{width:34px;height:28px;object-fit:contain;border-radius:6px}
.egenform .emojirad{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px}
.emojirad button,.pop .eg button{width:36px;min-width:36px;height:36px;border-radius:10px;background:#fff;border:2px solid transparent;font-size:1.25rem;line-height:1;padding:0}
.emojirad button.v{border-color:var(--accent);background:#E3EAFF}
.pop .eg{display:flex;flex-wrap:wrap;gap:3px;max-width:340px}
.egenform .ok{grid-column:1/-1;background:var(--good);color:#fff;border-radius:12px;padding:8px;font-weight:800;font-size:1.05rem}
.palett{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:2px dashed var(--line);max-width:640px}   /* max 8 per rad, så att rutan inte blir en lång rad i sidled */
.palett button{position:relative;width:74px;min-height:72px;border-radius:12px;background:#F1F6FF;border:2px solid var(--line);font-size:1.7rem;line-height:1.1;display:grid;place-items:center;align-content:center;padding:2px}
.palett small{font-size:.62rem;font-weight:800;line-height:1;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.palett button img.eg{width:48px;height:34px;object-fit:contain;border-radius:6px}
.palett .rm{position:absolute;top:-7px;right:-7px;background:#E5484D;color:#fff;border-radius:50%;width:20px;height:20px;font-size:.65rem;display:grid;place-items:center;font-style:normal;font-weight:800}
.palett.red button[data-add]{border-color:#F0A3A6;background:#FFF1F1}
.rednot{flex:1 1 100%;font-weight:700;font-size:.85rem;color:#B4232A}
.palett button.on{border-color:var(--good);background:#E6F7EE}
.palett button svg{width:40px;height:28px}
.palett .eget{width:auto;min-height:56px;padding:0 12px;font-size:.95rem;font-weight:800}
.lagg{margin-top:8px;background:#F1F6FF;border:2px dashed var(--line);border-radius:12px;padding:6px 12px;font-weight:800;color:var(--muted)}
/* timer */
.tm{text-align:center}
.tm .ring{position:relative;width:210px;height:210px;margin:0 auto}
.tm svg{width:100%;height:100%;transform:rotate(-90deg)}
.tm .tid{position:absolute;inset:0;display:grid;place-items:center;font-size:3.6rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.tm .rad{display:flex;gap:6px;justify-content:center;margin:8px 0 0;flex-wrap:wrap}
.tm .rad button{min-width:44px;height:42px;border-radius:12px;background:#F1F6FF;border:2px solid var(--line);font-weight:800;padding:0 10px}
.tm .rad.tider{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:300px;margin:8px auto 0}
.tm .rad.tider button{min-width:0;padding:0 4px}
.tm .rad button.stor{background:var(--good);color:#fff;border-color:var(--good);min-width:96px;font-size:1.1rem}
.tm .rad button.stor.paus{background:#F2780C;border-color:#F2780C}
.w.slut{animation:blink .6s 6}
@keyframes blink{50%{box-shadow:0 0 0 12px rgba(229,72,77,.5)}}
/* hjul */
.hj{text-align:center}
.hj canvas{display:block;margin:0 auto;max-width:100%}
.hj .res{min-height:2.6rem;font-size:2rem;font-weight:800;color:var(--accent);line-height:1.2;margin:4px 0}
.hj .rad{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:4px}
.hj .snurra{background:var(--accent);color:#fff;border-radius:14px;padding:8px 22px;font-weight:800;font-size:1.2rem;box-shadow:0 4px 0 #2A3FB8}
.hj .snurra:disabled{opacity:.5}
.hj textarea{width:100%;height:110px;font:inherit;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;resize:vertical;color:var(--ink)}
.hj label{font-weight:700;font-size:.9rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.hj .sm{background:#F1F6FF;border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:800;font-size:.9rem}
.hj input[type=number]{width:60px;font:inherit;font-weight:800;border:2px solid var(--line);border-radius:8px;padding:2px 4px}
.hj .not{font-size:.78rem;color:var(--muted);font-weight:700;margin-top:6px}
/* post-it */
.w.lapp{--p:#FFF176;background:var(--p);border:0;border-radius:3px 3px 3px 3px;width:230px;min-width:210px;box-shadow:0 12px 20px rgba(0,0,0,.28),inset 0 -34px 40px -34px rgba(0,0,0,.18)}
.w.lapp.c-rosa{--p:#FFB3D1}.w.lapp.c-bla{--p:#A7D8FF}.w.lapp.c-gron{--p:#B8F0B0}
.w.lapp .wh{background:rgba(0,0,0,.07);border-radius:3px 3px 0 0;padding:2px 6px;min-height:28px;color:#5A4B00}
.w.lapp .wh b{flex:1}
.w.lapp .wh button{width:26px;height:26px;background:rgba(0,0,0,.1);color:#4A3F00;opacity:.25;font-size:.9rem}
.w.lapp:hover .wh button,.w.lapp:focus-within .wh button{opacity:1}
.w.lapp .wb{padding:8px 12px 18px}
.w.dold .wb{display:none}
.w.dold .wh{border-radius:12px}
.w.dold{min-width:0}
.w.video{width:480px;max-width:none;min-width:300px}
.w.video .wb{padding:8px}
.vram{aspect-ratio:16/9;background:#111;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#cfd6ea;font-weight:700;text-align:center}
.vram iframe{width:100%;height:100%;border:0;display:block}
.vrad{display:flex;gap:6px;margin-top:8px}
.vrad input{flex:1;min-width:0;font:inherit;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--ink);background:#fff}
.vrad button{border-radius:10px;border:2px solid var(--line);background:#F1F6FF;font:inherit;font-weight:800;padding:4px 10px;cursor:pointer}
.vrad .vgo{background:#D6336C;color:#fff;border-color:#D6336C}
.vfav{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vf{display:inline-flex;border-radius:999px;background:#FDE8F0;border:2px solid #F3B5CC;overflow:hidden}
.vf button{border:0;background:transparent;font:inherit;font-weight:800;font-size:.85rem;padding:3px 10px;cursor:pointer;color:#8A1F47}
.vf .vx{padding:3px 8px 3px 2px;opacity:.55}
.vsp{border:2px dashed #F3B5CC;border-radius:999px;background:#fff;font:inherit;font-weight:800;font-size:.85rem;padding:3px 10px;cursor:pointer;color:#8A1F47}
.w.textruta{background:transparent;border:2px dashed transparent;box-shadow:none;border-radius:14px;width:560px;min-width:240px;transition:border-color .15s,background .15s}
.w.textruta:hover,.w.textruta:focus-within{border-color:rgba(61,90,254,.55);background:rgba(255,255,255,.4)}
.w.textruta .wh{background:rgba(31,58,53,.9);border-radius:10px 10px 0 0;padding:2px 6px;min-height:28px;opacity:0;transition:opacity .15s}
.w.textruta:hover .wh,.w.textruta:focus-within .wh,.w.textruta.last .wh{opacity:1}
.w.textruta .wb{padding:6px 12px 10px 34px}
.w.textruta .grep{position:absolute;left:0;top:0;bottom:0;width:30px;cursor:grab;display:grid;place-items:center;color:#5A6AA8;font-size:1.3rem;font-weight:800;opacity:0;transition:opacity .15s;touch-action:none;user-select:none;-webkit-user-select:none}
.w.textruta .grep:active{cursor:grabbing}
.w.textruta .bredd{position:absolute;right:-9px;top:0;bottom:0;width:18px;cursor:ew-resize;touch-action:none}
.w.textruta .bredd::after{content:"";position:absolute;right:7px;top:25%;bottom:25%;width:4px;border-radius:2px;background:rgba(61,90,254,.65);opacity:0;transition:opacity .15s}
.w.textruta:hover .grep,.w.textruta:focus-within .grep,.w.textruta:hover .bredd::after,.w.textruta:focus-within .bredd::after{opacity:1}
.w.textruta.last .grep,.w.textruta.last .bredd{display:none}
@media(hover:none){.w.textruta .grep,.w.textruta .bredd::after{opacity:.9}}
.tt{min-height:70px;outline:none;font-weight:700;font-size:44px;line-height:1.25;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text;color:#1D2B53}
.tt:empty::before{content:"Skriv här …";opacity:.35}
@media(hover:none){.w.textruta .wh{opacity:.9}}
.w.skrivrad{background:transparent;box-shadow:none;border:0;border-radius:0;width:900px;max-width:none;min-width:0;pointer-events:none}
.w.skrivrad .wh{pointer-events:auto;width:fit-content;min-width:230px;box-shadow:0 4px 12px rgba(20,30,70,.25)}
.w.skrivrad .wh{background:#E8EEFB;color:#3B4F86;padding:2px 6px;min-height:28px;border-radius:10px}
.w.skrivrad .wh b{flex:1;font-size:.9rem}
.w.skrivrad .wh button{width:26px;height:26px;background:rgba(0,0,0,.08);color:#3B4F86;font-size:.9rem}
.w.skrivrad .wb{padding:0;user-select:none;-webkit-user-select:none;pointer-events:none}
.an{min-height:170px;outline:none;font-weight:700;font-size:1.55rem;line-height:1.25;white-space:pre-wrap;user-select:text;color:#33290A}
.an:empty::before{content:"Skriv här …";color:rgba(51,41,10,.4)}
/* ljudnivå */
.lj{text-align:center;min-width:280px}
.lj .ans{font-size:4rem;line-height:1.1}
.lj .lbl{font-weight:800;font-size:1.4rem;margin:2px 0 8px}
.lj .mat{position:relative;height:38px;border-radius:19px;overflow:hidden;background:#E7ECF6;box-shadow:inset 0 0 0 3px #fff,0 0 0 2px var(--line)}
.lj .mat .fyll{position:absolute;inset:0;background:linear-gradient(90deg,#4CC38A 0%,#4CC38A 38%,#F7D44C 62%,#E5484D 100%)}
.lj .mat .skym{position:absolute;top:0;bottom:0;right:0;width:100%;background:#E7ECF6;transition:width .06s linear}
.lj .mat .gr{position:absolute;top:0;bottom:0;width:4px;background:#1D2B53;margin-left:-2px}
.lj .rad{display:flex;gap:8px;justify-content:center;margin-top:10px;align-items:center;flex-wrap:wrap}
.lj .rad button{background:var(--c);color:#fff;border-radius:12px;padding:6px 18px;font-weight:800;font-size:1.05rem}
.lj label{font-weight:700;font-size:.9rem;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}
.lj input[type=range]{width:150px}
.lj .not{font-size:.78rem;color:var(--muted);font-weight:700;margin-top:8px;line-height:1.3}
.w.hogt{animation:hogt .5s infinite alternate}
@keyframes hogt{to{box-shadow:0 0 0 14px rgba(229,72,77,.45)}}
/* hjälp */
#hjalp{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:150;background:rgba(31,58,53,.92);color:#fff;border-radius:16px;padding:10px 18px;font-weight:700;text-align:center;max-width:min(560px,90vw);box-shadow:0 6px 18px rgba(0,0,0,.3)}
#hjalp button{margin-left:10px;background:#F4D35E;color:#1F3A35;border-radius:10px;padding:2px 12px;font-weight:800}
@media(max-width:700px){#barGrepp{display:none}#bar{flex-direction:row;flex-wrap:wrap;left:6px;right:6px;top:6px}#bar button,#bar a{width:44px;height:44px;font-size:1.3rem}}
/* Apple-känsla: frostat glas, mjuka hörn, diskreta skuggor och en liten inzoomning från knappen. Samma stil på alla paneler och på verktygsfältet. */
.pop,.fly{background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.7);border-radius:22px;padding:10px;box-shadow:0 24px 64px rgba(15,25,60,.3),0 0 0 1px rgba(20,30,70,.06);transform-origin:left center;animation:panelIn .17s cubic-bezier(.2,.9,.3,1.12)}
@keyframes panelIn{from{opacity:0;transform:scale(.93) translateX(-8px)}}
#bar{-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);background:rgba(31,58,53,.84);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 34px rgba(0,0,0,.32)}
#bar button,#bar a,#zoomrad button{transition:background .15s,transform .12s}#bar button:active,#bar a:active,#zoomrad button:active{transform:scale(.93)}
#zoomrad{-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);background:rgba(31,58,53,.84);border:1px solid rgba(255,255,255,.14)}
.fly{min-width:300px;padding:8px}.fly button{background:transparent;border-radius:14px;height:50px;transition:background .12s}.fly button:hover:not(:disabled){background:rgba(61,90,254,.1)}.fly button:active:not(:disabled){background:rgba(61,90,254,.18)}
.fly button i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(61,90,254,.1);font-size:1.2rem}
#flyBg button i{background:rgba(123,97,255,.14)}#flyMer button i{background:rgba(86,102,143,.14)}
.fly kbd{margin-left:auto;font:inherit;font-size:.8rem;font-weight:800;color:var(--muted);background:rgba(86,102,143,.12);border-radius:7px;padding:1px 8px}
.pop button:not(.fg):not(.tj){transition:background .12s}
@media print{#bar,#zoomrad,.fly,#hjalp,.pop{display:none!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="board">
  <canvas id="rita" aria-label="Rityta"></canvas>
  <div id="widgets"></div>
</div>
<div id="bar" role="toolbar" aria-label="Verktyg">
  <div id="barGrepp" title="Dra för att flytta verktygen" aria-label="Flytta verktygen" role="img">⠿</div>
  <button id="bMin" title="Visa eller dölj verktygen" aria-label="Visa eller dölj verktygen">🍎</button>
  <a href="../" title="Tillbaka till Pluggparken" aria-label="Tillbaka till Pluggparken">←</a>
  <hr>
  <button id="bPenna" class="v" title="Penna (P)" aria-label="Penna">✏️</button>
  <button id="bSudd" title="Sudd (E)" aria-label="Sudd">🧽</button>
  <button id="bHand" title="Flytta tavlan (H, eller håll ner mellanslag)" aria-label="Flytta tavlan">🖐️</button>
  <button id="bFarg" title="Färg och tjocklek" aria-label="Färg och tjocklek"><span id="fargprick" style="width:26px;height:26px;border-radius:50%;background:#1D2B53;border:3px solid #fff;display:block"></span></button>
  <button id="bAngra" title="Ångra (Ctrl+Z)" aria-label="Ångra">↶</button>
  <button id="bRensa" title="Sudda hela ritningen" aria-label="Sudda hela ritningen">🧹</button>
  <hr>
  <button id="bLagg" title="Lägg till en ruta eller en mall" aria-label="Lägg till en ruta eller en mall">+</button>
  <button id="bTav" title="Mina tavlor: spara och byt mellan tavlor" aria-label="Mina tavlor">📚</button>
  <button id="bLag" title="Lager" aria-label="Lager">📑</button>
  <button id="bGrRutor" class="grp" data-fly="flyRutor" aria-haspopup="menu" aria-expanded="false" title="Rutor: lägg till, ordna, fyll tavlan" aria-label="Rutor">🧩</button>
  <button id="bGrBg" class="grp" data-fly="flyBg" aria-haspopup="menu" aria-expanded="false" title="Bakgrund: byt och storlek på rutor" aria-label="Bakgrund">🖼️</button>
  <button id="bGrMer" class="grp" data-fly="flyMer" aria-haspopup="menu" aria-expanded="false" title="Mer: helskärm, fil, ljud, sudda allt" aria-label="Mer">⚙️</button>
</div>
<div id="zoomrad" role="group" aria-label="Zoom"><button id="zMinus" title="Zooma ut (−)" aria-label="Zooma ut">−</button><button id="zProc" title="Tillbaka till början (0)" aria-label="Tillbaka till början">1 ×</button><button id="zPlus" title="Zooma in (+)" aria-label="Zooma in">+</button><button id="zAlla" title="Visa hela ritningen" aria-label="Visa hela ritningen">⤢</button></div>
<div class="fly" id="flyRutor" hidden role="menu" aria-label="Rutor"><button id="bOrd" title="Ordna rutorna snyggt" aria-label="Ordna rutorna"><i>🗂️</i><span>Ordna rutorna snyggt</span></button><button id="bFyll" title="Fyll tavlan: rutorna bredvid varandra, så stora det går" aria-label="Fyll tavlan med rutorna, så stora det går"><i>↔️</i><span>Fyll tavlan, så stora det går</span></button></div>
<div class="fly" id="flyBg" hidden role="menu" aria-label="Bakgrund"><button id="bBg" title="Byt bakgrund" aria-label="Byt bakgrund"><i>🖼️</i><span>Byt bakgrund</span></button><button id="bStl" title="Storlek på rutor och rader" aria-label="Storlek på rutor och rader"><i>📐</i><span>Storlek på rutor och rader</span></button></div>
<div class="fly" id="flyMer" hidden role="menu" aria-label="Mer"><button id="bFull" title="Helskärm (F)" aria-label="Helskärm"><i>⛶</i><span>Helskärm</span><kbd>F</kbd></button><button id="bFil" title="Spara eller ladda tavlan som fil" aria-label="Spara eller ladda tavlan som fil"><i>💾</i><span>Spara eller ladda som fil</span></button><button id="bSnd" title="Ljud av eller på (timer och lyckohjul)" aria-label="Ljud av eller på"><i>🔔</i><span>Ljud av eller på</span></button></div>
<div id="hjalp" role="status">Tryck på + för att lägga till rutor och mallar, 🧩 ordnar dem. Dra i en rutas rubrik för att flytta den. ✏️ ritar (tryck igen för penslar), 📑 är lager. Zooma med scrollhjulet eller två fingrar, och håll ner mellanslag för att flytta tavlan.<button id="hjalpX">Ok</button></div>
<script src="../ljud.js"></script>
<script>
const $=id=>document.getElementById(id);
const KEY="pluggparken-larare-v1";   // sparas bara i den här webbläsaren, aldrig i molnet (innehåller bl.a. elevnamn till lyckohjulet)
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SAKER=[["penna","✏️","Penna"],["sudd","SVG:sudd","Sudd"],["fargpennor","🖍️","Färgpennor"],["mattebok","📘","Mattebok",1],["lasbok","📖","Läsebok",1],["skrivbok","📓","Skrivbok",1],["linjal","📏","Linjal"],["sax","✂️","Sax"],["lim","SVG:lim","Limstift"],["dator","💻","Dator"],["platta","📱","Surfplatta"],["horlurar","🎧","Hörlurar"],["minir","🧮","Räknehjälp"],["anteckn","📝","Anteckningsbok"],["frukt","🍎","Frukt"],["gympa","👟","Gympakläder"],["bok","📚","Annan bok",1]];
const SVG={sudd:'<svg viewBox="0 0 64 40" aria-hidden="true"><rect x="4" y="8" width="56" height="26" rx="6" fill="#F4A6C0" stroke="#C0527A" stroke-width="3"/><rect x="4" y="8" width="26" height="26" rx="6" fill="#fff" stroke="#C0527A" stroke-width="3"/></svg>',lim:'<svg viewBox="0 0 40 64" aria-hidden="true" style="width:40px;height:56px"><rect x="8" y="24" width="24" height="34" rx="5" fill="#4C8DFF" stroke="#2A3FB8" stroke-width="3"/><rect x="12" y="6" width="16" height="20" rx="3" fill="#fff" stroke="#2A3FB8" stroke-width="3"/></svg>'};
const ikon=k=>{const s=SAKER.find(x=>x[0]===k);if(!s)return"📌";return s[1].startsWith("SVG:")?SVG[s[1].slice(4)]:s[1];};
const EMO=["📘","📗","📕","📙","📖","📚","📓","📝","✏️","🖍️","🖊️","📏","📐","✂️","🧮","💻","📱","🎧","🎒","🍎","🍌","🥪","🥤","🧥","👟","🧤","🎨","🎵","⚽","🔬","🌍","🧩","📎","🗂️","📁","🧪","🔭","🎲","🎻","⭐"];
/* min lista: grundförslagen (SAKER) kan redigeras; listan ligger i S.bank (null = grundlistan) */
const grund=()=>SAKER.map(([k,e,n,bok])=>({k,e:e.startsWith("SVG:")?"":e,svg:e.startsWith("SVG:")?e.slice(4):"",n,bok:!!bok,img:""}));
const bank=()=>Array.isArray(S&&S.bank)?S.bank:grund();
const GAMLA=[["flaska","🥤","Vattenflaska"],["mellanmal","🥪","Mellanmål"],["ytter","🧥","Ytterkläder"]].map(([k,e,n])=>({k,e,n,svg:"",bok:false,img:""}));  /* inte längre förslag, men finns kvar på tavlor där de redan ligger */
const sak=k=>bank().find(x=>x.k===k)||grund().find(x=>x.k===k)||GAMLA.find(x=>x.k===k)||null;
const ico=x=>x.img?`<img class="eg" src="${x.img}" alt="">`:x.svg?SVG[x.svg]:esc(x.e||"📌");
const alleListor=()=>S.widgets.filter(x=>x.typ==="lista").forEach(x=>{const e=elOf(x.id);if(e)fyllLista(e.querySelector(".wb"),x);});
const FARGER=["#1D2B53","#000000","#6B7280","#E5484D","#F2780C","#F5C400","#7ED957","#1E9E5E","#12B5B0","#2F6BFF","#7B61FF","#E64980","#8B5A2B","#FFFFFF"];
const STL={rutat:[["Små rutor",22],["Medelstora rutor",40],["Stora rutor",64],["Mycket stora rutor",96]],linjerat:[["Smala rader",34],["Medelbreda rader",56],["Breda rader",80],["Mycket breda rader",110]]};
const BG=["vit","rutat","linjerat","tavla"];
const BGNAMN={vit:"Vit",rutat:"Rutat",linjerat:"Linjerat",tavla:"Griffeltavla"};
const TYPFARG={lista:"#3D5AFE",lista2:"#1E9E5E",timer:"#F2780C",hjul:"#7B61FF",text:"#E0A21B",ljud:"#0E9AA7",skrivrad:"#5B78D6",video:"#D6336C",textruta:"#3D5AFE",grupper:"#D9480F"};
const LAPPFARG=["gul","rosa","bla","gron"];
const tf=o=>`scale(${o.s||1})`+(o.rot?` rotate(${o.rot}deg)`:"");
/* Textrutor ligger i ritningens värld: o.x, o.y, o.s är världsmått och följer med zoom och flytt (V). Övriga rutor ligger fast på skärmen. */
const vär=o=>o.typ==="textruta";
const skX=o=>vär(o)?(o.x-V.x)*V.z:o.x,skY=o=>vär(o)?(o.y-V.y)*V.z:o.y;
const tfEl=o=>vär(o)?`scale(${(o.s||1)*V.z})`:tf(o);
function plac(o,e){e.style.left=skX(o)+"px";e.style.top=skY(o)+"px";e.style.transform=tfEl(o);}

/* ---------- tillstånd ---------- */
function mall(){return{v:2,ordnaNy:true,bg:"vit",namn:{},pen:{c:"#1D2B53",w:6,v:"penna"},widgets:[
  {id:uid(),typ:"lista",x:96,y:24,s:1,d:{titel:"Du behöver:",farg:"lista",items:[{k:"penna"},{k:"sudd"},{k:"mattebok",sid:""}].map(i=>Object.assign(i,minnet(i.k)))}},
  {id:uid(),typ:"lista",x:96,y:340,s:1,d:{titel:"När du är klar:",farg:"lista2",items:[{k:"lasbok",sid:""}].map(i=>Object.assign(i,minnet(i.k)))}},
  {id:uid(),typ:"timer",x:900,y:24,s:1,d:{tot:300}}]};}
let S;try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!S||!Array.isArray(S.widgets)){S=mall();}
if(S.v!==2){const k=1920/Math.max(600,innerWidth);S.widgets.forEach(w=>{w.x=Math.round((+w.x||0)*k);w.y=Math.round((+w.y||0)*k)});S.v=2;}   // äldre tavlor sparade i skärmpixlar: räknas om till tavlans mått (1920 breda)
S.pen=S.pen||{c:"#1D2B53",w:6,v:"penna"};if(!S.namn||typeof S.namn!=="object")S.namn={};if(!Array.isArray(S.bank))S.bank=null;S.fav=renaFav(S.fav);if(!BG.includes(S.bg))S.bg="vit";if(!S.stl||typeof S.stl!=="object")S.stl={rutat:1,linjerat:1};
let sparaT=0;
function sparaNu(){clearTimeout(sparaT);try{localStorage.setItem(KEY,JSON.stringify({v:2,bg:S.bg,pen:S.pen,namn:S.namn,bank:S.bank||null,stl:S.stl,fav:S.fav||[],tavlor:S.tavlor||[],lager:S.lager,lagerAkt:S.lagerAkt,vy:S.vy||null,bar:S.bar||null,widgets:S.widgets}));return true;}catch(e){return false;}}
function spara(){clearTimeout(sparaT);sparaT=setTimeout(sparaNu,250);}
/* sparar direkt när man lämnar sidan eller byter flik, så att det man nyss skrev (t.ex. på en post-it) alltid finns kvar */
addEventListener("pagehide",sparaNu);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")sparaNu();});
/* minne: ett namn eller en bild man ändrat på en sak (t.ex. Läsebok → Tyst läsning) följer med den saken nästa gång */
function kom(k,f){if(!k||String(k).startsWith("egen"))return;const m=S.namn[k]=Object.assign(S.namn[k]||{},f);if(!m.t&&!m.img&&!m.e)delete S.namn[k];spara();}
function minnet(k){const m=(S&&S.namn||{})[k];if(!m)return{};const r={};if(m.t)r.t=m.t;if(m.img)r.img=m.img;if(m.e)r.e=m.e;return r;}
let z=60;

/* ---------- ritning ---------- */
const cv=$("rita"),cx=cv.getContext("2d");let strokes=[],cur=null,DPR=1;
/* Tavlan är en oändlig yta. Ritningen ligger i världskoordinater (samma enheter som rutorna, tavlan är 1920 enheter bred).
   V.x, V.y = punkten som ligger överst till vänster på skärmen, V.z = zoom (1 = som förut). Rutorna ligger kvar fast på skärmen och följer inte med. */
/* Lager: S.lager = [{id,n,v (synligt),l (låst)}] nerifrån och upp, S.lagerAkt = det man ritar på. Varje streck har ly = lagrets id. Suddet raderar bara på det valda lagret. Rutorna ligger alltid överst. */
const LMAX=6,lagId=()=>"l"+uid().slice(-6);
function renaLager(a){const r=[];if(Array.isArray(a))a.slice(0,LMAX).forEach(l=>{if(!l||typeof l!=="object")return;let id=/^[\w-]{1,12}$/.test(l.id||"")?l.id:lagId();if(r.some(x=>x.id===id))id=lagId();r.push({id,n:String(l.n||"Lager").slice(0,24),v:l.v!==false,l:!!l.l,o:isFinite(+l.o)?Math.max(0,Math.min(1,+l.o)):1});});if(!r.length)r.push({id:lagId(),n:"Lager 1",v:true,l:false,o:1});return r;}
const lagerVal=()=>S.lager.find(l=>l.id===S.lagerAkt)||S.lager[S.lager.length-1];
const aktOverst=()=>{const v=S.lager.filter(l=>l.v);return v.length>0&&v[v.length-1].id===lagerVal().id;};
const direkt=()=>(S.lager.length===1||aktOverst())&&(lagerVal().o==null||lagerVal().o>=1);   // ritas rakt på ytan bara när lagret är ogenomskinligt och överst
const lagerSyns=t=>{const l=S.lager.find(x=>x.id===t.ly);return !l||l.v;};

/* ---------- tavlans mått: allt placeras i en yta som är 1920 enheter bred (projektor) och skalas efter fönstret ---------- */
const SW=1920,GAP=16,X0=96,Y0=20;
/* rutor som ligger kvar vid Ny lektion och mallar: låsta rutor och post-it-lappar med text (de stängs bara av läraren själv) */
const behall=o=>!!o.lock||(o.typ==="text"&&!!String((o.d&&o.d.text)||"").trim());let K=1,SH=1080;
function scenen(){K=innerWidth/SW;SH=Math.round(innerHeight/K);const w=$("widgets");w.style.width=SW+"px";w.style.height=SH+"px";w.style.transform="scale("+K+")";}
function mat(id){const e=elOf(id),o=S.widgets.find(x=>x.id===id);if(!e||!o)return{w:240,h:100};const s=(o.s||1)*(vär(o)?V.z:1);return{w:e.offsetWidth*s,h:e.offsetHeight*s};}
function rektar(utan){return S.widgets.filter(o=>o.id!==utan).map(o=>{const m=mat(o.id);return{id:o.id,x:skX(o),y:skY(o),w:m.w,h:m.h,lock:!!o.lock};});}
function fritt(w,h,hinder){const st=12;
  for(let y=Y0;y<=Math.max(Y0,SH-h-24);y+=st)for(let x=X0;x<=Math.max(X0,SW-w-24);x+=st){
    if(!hinder.some(r=>x<r.x+r.w+GAP&&x+w+GAP>r.x&&y<r.y+r.h+GAP&&y+h+GAP>r.y))return{x,y};}
  // ingen helt ledig plats (t.ex. en hög ruta): ta platsen där det blir minst överlapp
  let bast=null;
  for(let y=Y0;y<=Math.max(Y0,SH-h-24);y+=st)for(let x=X0;x<=Math.max(X0,SW-w-24);x+=st){let a=0;hinder.forEach(r=>{const ox=Math.min(x+w,r.x+r.w)-Math.max(x,r.x),oy=Math.min(y+h,r.y+r.h)-Math.max(y,r.y);if(ox>0&&oy>0)a+=ox*oy;});if(!bast||a<bast.a)bast={a,x,y};}
  return bast?{x:bast.x,y:bast.y}:{x:X0,y:Y0};}
function flytta(o,x,y){if(vär(o)){o.x=Math.round((V.x+x/V.z)*1000)/1000;o.y=Math.round((V.y+y/V.z)*1000)/1000;}else{o.x=Math.round(x);o.y=Math.round(y);}const e=elOf(o.id);if(e)plac(o,e);}
function plats(w){const m=mat(w.id),p=fritt(m.w,m.h,rektar(w.id));flytta(w,p.x,p.y);}
function ordna(anim){const lista=S.widgets.slice().sort((a,b)=>(Math.round(skY(a)/140)-Math.round(skY(b)/140))||(skX(a)-skX(b)));
  const hinder=S.widgets.filter(o=>o.lock).map(o=>{const m=mat(o.id);return{x:skX(o),y:skY(o),w:m.w,h:m.h};});
  const els=[];
  lista.forEach(o=>{if(o.lock)return;const m=mat(o.id),p=fritt(m.w,m.h,hinder);const e=elOf(o.id);if(anim&&e){e.classList.add("ordnar");els.push(e);}flytta(o,p.x,p.y);hinder.push({x:p.x,y:p.y,w:m.w,h:m.h});});
  if(els.length)setTimeout(()=>els.forEach(e=>e.classList.remove("ordnar")),700);spara();}
/* ↔️ Fyll tavlan: alla olåsta rutor (utom skrivraden) bredvid varandra, lika stora (samma förstoring) och så stora det går.
   Rutorna delas i så få rader som behövs; av alla uppdelningar i läsordning väljs den som ger störst storlek. Taket är 2,6 gånger (som + på rutan). */
function fyllTavlan(){
  const lista=S.widgets.filter(o=>!o.lock&&o.typ!=="skrivrad").sort((a,b)=>(Math.round(skY(a)/140)-Math.round(skY(b)/140))||(skX(a)-skX(b)));
  if(!lista.length){hjalpText("Inga rutor att fylla med (låsta rutor flyttas inte)");return;}
  const W=SW-24-X0,H=SH-24-Y0,n=lista.length,B=lista.map(o=>{const e=elOf(o.id);return{o,w:e?e.offsetWidth:240,h:e?e.offsetHeight:100};});
  let bast=null;const konv=[];
  /* alla uppdelningar i rader (n är litet; över 12 rutor tas bara en rad per fem rutor) */
  if(n<=12){for(let m=0;m<(1<<(n-1));m++){const rader=[[]];B.forEach((b,i)=>{rader[rader.length-1].push(b);if(i<n-1&&(m>>i&1))rader.push([]);});konv.push(rader);}}
  else{const rader=[];for(let i=0;i<n;i+=5)rader.push(B.slice(i,i+5));konv.push(rader);}
  konv.forEach(rader=>{let s=2.6;
    rader.forEach(r=>{s=Math.min(s,(W-GAP*(r.length-1))/r.reduce((a,b)=>a+b.w,0));});
    s=Math.min(s,(H-GAP*(rader.length-1))/rader.reduce((a,r)=>a+Math.max(...r.map(b=>b.h)),0));
    if(!bast||s>bast.s+1e-6||(Math.abs(s-bast.s)<=1e-6&&rader.length<bast.rader.length))bast={s,rader};});
  const s=Math.max(.5,Math.floor(bast.s*100)/100),snap=JSON.stringify(S.widgets);let y=Y0;
  const els=[];
  bast.rader.forEach(r=>{const bredd=r.reduce((a,b)=>a+b.w*s,0)+GAP*(r.length-1);let x=X0+Math.max(0,(W-bredd)/2);
    r.forEach(b=>{const e=elOf(b.o.id);if(e){e.classList.add("ordnar");els.push(e);}b.o.s=vär(b.o)?s/V.z:s;flytta(b.o,x,y);x+=b.w*s+GAP;});
    y+=Math.max(...r.map(b=>b.h))*s+GAP;});
  setTimeout(()=>els.forEach(e=>e.classList.remove("ordnar")),700);spara();
  angraRuta(n+(n===1?" ruta":" rutor")+" fyller tavlan ("+bast.rader.length+(bast.rader.length===1?" rad":" rader")+", "+Math.round(s*100)+" %)",snap);}

function ritaHjul(c,d){const x=c.getContext("2d"),W=c.width,R=W/2-12,n=d.namn.length;x.clearRect(0,0,W,W);x.save();x.translate(W/2,W/2);

  else{const sg=Math.PI*2/n;x.rotate(d.rot||0);for(let i=0;i<n;i++){x.fillStyle=HJFARGER[i%HJFARGER.length];x.beginPath();x.moveTo(0,0);x.arc(0,0,R,i*sg,(i+1)*sg);x.closePath();x.fill();x.strokeStyle="#fff";x.lineWidth=3;x.stroke();
    x.save();x.rotate(i*sg+sg/2);x.fillStyle="#1D2B53";x.textAlign="right";x.textBaseline="middle";const fs=Math.max(12,Math.min(26,Math.floor(R*sg*.5)));x.font=`800 ${fs}px Baloo 2, sans-serif`;let t=d.namn[i];while(x.measureText(t).width>R-30&&t.length>2)t=t.slice(0,-2);if(t!==d.namn[i])t+="…";x.fillText(t,R-14,0);x.restore();}}

  x.fillStyle="#1D2B53";x.beginPath();x.moveTo(W/2-16,6);x.lineTo(W/2+16,6);x.lineTo(W/2,38);x.closePath();x.fill();}

const MAT={};
function fyllLjud(b,w){const igang=!!MAT[w.id];

  <label>Gräns <input type="range" min="30" max="95" value="${w.d.gr}" data-gr aria-label="Gräns för för högt ljud"></label>
  <div class="not">Ljudet spelas aldrig in och skickas ingenstans. Bara nivån mäts, här i webbläsaren.</div></div>`;}
$("widgets").addEventListener("click",async e=>{const w=e.target.closest(".w");if(!w)return;const o=S.widgets.find(x=>x.id===w.dataset.id);if(!o||o.typ!=="ljud"||!e.target.closest("[data-l]"))return;const b=w.querySelector(".wb");
  if(MAT[o.id]){stoppaMatare(o.id);w.classList.remove("hogt");fyllLjud(b,o);return;}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ac=new(window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(st).connect(an);
    const m=MAT[o.id]={st,ac,lv:0,hog:0,raf:0},buf=new Float32Array(an.fftSize);fyllLjud(b,o);
    const loop=()=>{if(!MAT[o.id])return;an.getFloatTimeDomainData(buf);let q=0;for(let i=0;i<buf.length;i++)q+=buf[i]*buf[i];const db=20*Math.log10(Math.max(Math.sqrt(q/buf.length),1e-5)),t=Math.max(0,Math.min(1,(db+65)/55));
      m.lv+=(t-m.lv)*(t>m.lv?.5:.06);const g=o.d.gr/100,el=elOf(o.id);
      if(el){el.querySelector(".skym").style.width=(100-m.lv*100)+"%";const f=m.lv>=g?["😬","För högt!"]:m.lv>=g*.6?["🙂","Lagom"]:["😌","Lugnt"];

/* lagermenyn: 👁 visa/dölj, 🔒 lås, namnet väljer lagret man ritar på, ✏️ döp om, ▲▼ ordning, 🗑️ ta bort */
function ikonLager(){const b=$("bLag"),i=S.lager.findIndex(l=>l.id===lagerVal().id);b.innerHTML="📑"+(S.lager.length>1?`<small>${i+1}/${S.lager.length}</small>`:"");b.title="Lager: "+lagerVal().n+(S.lager.length>1?` (${i+1} av ${S.lager.length})`:"");}
function visaLager(msg){
  const rader=S.lager.slice().reverse().map(l=>{const n=strokes.filter(t=>t.ly===l.id&&!t.e).length,akt=l.id===lagerVal().id;
    return`<div class="lagrad${l.v?"":" dold"}" data-id="${l.id}"><button data-lg="vis" title="${l.v?"Dölj lagret":"Visa lagret"}" aria-label="${l.v?"Dölj":"Visa"} ${esc(l.n)}">${l.v?"👁️":"🙈"}</button><button data-lg="las" title="${l.l?"Lås upp":"Lås lagret"}" aria-label="${l.l?"Lås upp":"Lås"} ${esc(l.n)}">${l.l?"🔒":"🔓"}</button><button class="ln ${akt?"v":""}" data-lg="val" title="Rita på det här lagret">${esc(l.n)} <small style="opacity:.6">${n}</small></button><button data-lg="namn" title="Döp om" aria-label="Döp om ${esc(l.n)}">✏️</button><button data-lg="upp" title="Flytta upp" aria-label="Flytta ${esc(l.n)} upp">▲</button><button data-lg="ner" title="Flytta ner" aria-label="Flytta ${esc(l.n)} ner">▼</button><button data-lg="ta" title="Ta bort" aria-label="Ta bort ${esc(l.n)}">🗑️</button></div>`;}).join("");
  const p=oppnaPop($("bLag"),`<h4>Lager (överst först)</h4>${rader}<button data-lg="ny" ${S.lager.length>=LMAX?"disabled":""}>➕ Nytt lager</button><label class="lagop">Genomskinlighet för «${esc(lagerVal().n)}» <b id="lagopv">${lagerVal().o===0?"0 % (osynligt)":Math.round((lagerVal().o==null?1:lagerVal().o)*100)+" %"}</b><input type="range" id="lagop" min="0" max="100" step="5" value="${Math.round((lagerVal().o==null?1:lagerVal().o)*100)}" aria-label="Genomskinlighet för valt lager"></label><div class="tavinfo">${esc(msg||"Pennan och suddet ritar bara på det valda lagret. Dolda eller låsta lager går inte att rita på. Rutorna ligger alltid överst.")}</div>`,"lager");p.dataset.t="lag";
  p.addEventListener("input",ev=>{if(ev.target.id!=="lagop")return;const l=lagerVal();l.o=+ev.target.value/100;p.querySelector("#lagopv").textContent=+ev.target.value?ev.target.value+" %":"0 % (osynligt)";ritaNu();spara();});
  p.onclick=ev=>{const b=ev.target.closest("[data-lg]");if(!b||b.disabled)return;const g=b.dataset.lg,rad=b.closest(".lagrad"),id=rad&&rad.dataset.id,i=S.lager.findIndex(l=>l.id===id),l=S.lager[i];
    const klar=m=>{omrita();ikonLager();spara();sparaRitning();visaLager(m);};
    if(g==="ny"){if(S.lager.length>=LMAX)return;const k=S.lager.length+1,nl={id:lagId(),n:"Lager "+k,v:true,l:false};S.lager.splice(S.lager.findIndex(x=>x.id===lagerVal().id)+1,0,nl);S.lagerAkt=nl.id;return klar();}
    if(!l)return;
    if(g==="vis"){l.v=!l.v;klar();}else if(g==="las"){l.l=!l.l;klar();}else if(g==="val"){S.lagerAkt=l.id;klar();}
    else if(g==="namn"){const n=prompt("Nytt namn på lagret:",l.n);if(n===null)return;l.n=n.trim().slice(0,24)||l.n;klar();}
    else if(g==="upp"&&i<S.lager.length-1){[S.lager[i],S.lager[i+1]]=[S.lager[i+1],S.lager[i]];klar();}
    else if(g==="ner"&&i>0){[S.lager[i],S.lager[i-1]]=[S.lager[i-1],S.lager[i]];klar();}
    else if(g==="ta"){if(S.lager.length<2)return visaLager("Det måste finnas minst ett lager.");const n=strokes.filter(t=>t.ly===l.id).length;if(n&&!confirm("Ta bort lagret «"+l.n+"» och det som är ritat på det?"))return;
      const lag=JSON.stringify({l:S.lager,a:S.lagerAkt}),rits=JSON.stringify(strokes),snap=JSON.stringify(S.widgets);strokes=strokes.filter(t=>t.ly!==l.id);S.lager.splice(i,1);if(S.lagerAkt===l.id)S.lagerAkt=S.lager[Math.min(i,S.lager.length-1)].id;
      omrita();ikonLager();spara();sparaRitning();stangPop();angraRuta("Lagret «"+l.n+"» togs bort",snap,rits,undefined,undefined,()=>{const o=JSON.parse(lag);S.lager=o.l;S.lagerAkt=o.a;ikonLager();});}};}
$("bLag").onclick=()=>{if(pop&&pop.dataset.t==="lag"){stangPop();return;}stangFly();visaLager();};

/* ---------- start ---------- */
S.tavlor=renaTavlor(S.tavlor);S.lager=renaLager(S.lager);if(!S.lager.some(l=>l.id===S.lagerAkt))S.lagerAkt=S.lager[S.lager.length-1].id;
bakgrund(S.bg);$("fargprick").style.background=S.pen.c;verktyg(S.pen.v==="sudd"?"sudd":"penna");
laddaRitning();storlek();satt(S.vy);barBorja();ritaAlla();sndIkon();ikonLager();if(S.ordnaNy){delete S.ordnaNy;ordna(false);}
</script>
