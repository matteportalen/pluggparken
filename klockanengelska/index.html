<style>
:root{
  --bg:#EAF3FF; --ink:#1D2B53; --muted:#56668F; --card:#FFFFFF; --line:#C6D6F2;
  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
/* startskärmen */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#3D5AFE,#7B61FF);color:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 #2A3FB8;margin:6px 0 16px}
.hero .hk{flex:none;width:104px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.hero .hk svg{width:100%;height:auto;display:block}
.hero h1{margin:0;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.05}
.hero p{margin:6px 0 0;font-weight:600;opacity:.97}
.niv{display:grid;gap:10px}
.niv button{display:flex;align-items:center;gap:14px;background:var(--card,#fff);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.niv button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.niv .nr{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:#fff}
.niv b{display:block;font-size:1.12rem;line-height:1.15}
.niv small{display:block;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.25}
.niv .st{margin-left:auto;flex:none;color:var(--gold);font-size:1.15rem;letter-spacing:1px}
.niv .st .off{color:var(--line)}
/* spelet */
.topp{display:flex;align-items:center;gap:10px;margin:4px 0 6px;min-height:24px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.f{background:var(--bad)}.dots i.nu{background:var(--gold)}
.niva-t{font-weight:800;color:var(--muted);font-size:.9rem}
.fraga{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 8px;min-height:56px}
.fraga .q{text-align:center;font-weight:700;font-size:clamp(1.05rem,4.4vw,1.2rem);line-height:1.2;color:var(--muted)}
.fraga .q b{display:block;color:var(--ink);font-weight:800;font-size:clamp(1.45rem,6.4vw,1.9rem);line-height:1.15}
.hor{flex:none;width:46px;height:46px;border-radius:50%;background:var(--card,#fff);box-shadow:0 3px 0 var(--line);font-size:1.3rem}
.hor:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ur{background:var(--card,#fff);border-radius:24px;box-shadow:0 4px 0 var(--line);padding:10px;transition:box-shadow .2s}
.ur.ratt{box-shadow:0 0 0 4px var(--good),0 4px 0 var(--line)}
.ur.fel{box-shadow:0 0 0 4px #F7A3A6,0 4px 0 var(--line)}
.clock{width:min(78vw,300px,42vh);height:auto;display:block;margin:0 auto;user-select:none;-webkit-user-select:none}
.ur.liten .clock{width:min(56vw,210px,29vh)}
.clock text{font-family:var(--font)}
.clock g.grab{filter:drop-shadow(0 0 3px #FFC93C) drop-shadow(0 0 3px #FFC93C)}
.clock .hh,.clock .mh{transition:none}
.clock.glid .hh,.clock.glid .mh{transition:transform .7s cubic-bezier(.3,1.2,.5,1)}
.skaka{animation:skaka .4s}
@keyframes skaka{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* bygg klockslaget av ord */
.bygg{margin-top:10px}
.mening{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;min-height:58px;border-radius:16px;border:3px dashed #AFC0E8;background:var(--card,#fff);padding:6px 8px}
.mening.fel{border-color:#F7A3A6;background:#FFF0F1}
.mening.ratt{border:3px solid var(--good)}
.mening .tom{color:var(--muted);font-weight:700;font-size:.98rem}
.brickor{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.ord{background:var(--card,#fff);border-radius:14px;padding:7px 14px;font-weight:800;font-size:1.2rem;box-shadow:0 4px 0 var(--line);min-height:44px}
.ord:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mening .ord{background:var(--accent);color:#fff;box-shadow:0 4px 0 #2A3FB8}
.mening.ratt .ord{background:var(--good);box-shadow:0 4px 0 var(--good-dark)}
.brickor .ord.tagen{opacity:.25;pointer-events:none}
.forkl{text-align:center;font-weight:700;margin:8px 0 0;min-height:2.7em;font-size:1.04rem;line-height:1.3}
.forkl.ratt{color:var(--good-dark)}.forkl.fel{color:#B4232A}
.knapprad{display:flex;justify-content:center;gap:10px;margin-top:6px}
.klar,.nasta{background:var(--good);color:#fff;border-radius:18px;padding:10px 30px;font-weight:800;font-size:1.25rem;box-shadow:0 5px 0 var(--good-dark)}
.klar:active{transform:translateY(4px);box-shadow:0 1px 0 var(--good-dark)}
.klar:disabled{opacity:.4;pointer-events:none}
.nasta{background:var(--accent);box-shadow:0 5px 0 #2A3FB8}
.nasta:active{transform:translateY(4px);box-shadow:0 1px 0 #2A3FB8}
@media (max-height:700px){.wrap{padding-bottom:12px}.fraga{min-height:48px;margin-bottom:5px}.forkl{min-height:1.4em;margin-top:5px}.ur{padding:6px}.clock{width:min(78vw,300px,38vh)}.ur.liten .clock{width:min(56vw,210px,24vh)}.mening{min-height:50px}.ord{min-height:40px;padding:5px 12px}.brickor{margin-top:7px;gap:6px}.bygg{margin-top:7px}}
/* resultat */
.res{text-align:center}
.res .stj{font-size:3rem;letter-spacing:6px;color:var(--gold);margin:8px 0}
.res .stj .off{color:var(--line)}
.knapp{display:inline-block;background:var(--good);color:#fff;border-radius:16px;padding:12px 26px;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 var(--good-dark);margin:6px}
.knapp.vit{background:var(--card,#fff);color:var(--ink);box-shadow:0 5px 0 var(--line)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:420px){.hero .hk{width:84px}.hero{gap:12px;padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main class="wrap">

<section class="screen" id="home">
  <div class="hero">
    <div class="hk" id="heroKlocka" aria-hidden="true"></div>
    <div><h1>Klockan på engelska</h1><p>What time is it? Ställ klockan och bygg klockslaget på engelska.</p></div>
  </div>
  <div class="niv" id="niv"></div>
</section>

<section class="screen" id="game" hidden>
  <button type="button" data-home hidden tabindex="-1" aria-hidden="true" onclick="hem()"></button>
  <div class="topp"><div class="dots" id="dots"></div><span class="niva-t" id="nivT"></span></div>
  <div class="fraga"><button class="hor" id="hor" aria-label="Lyssna på engelska">🔊</button><span class="q" id="q" aria-live="polite"></span></div>
  <div class="ur" id="ur"></div>
  <div class="bygg" id="bygg" hidden>
    <div class="mening" id="mening"></div>

  </div>

</section>

<section class="screen res" id="result" hidden>
  <h2 id="rRub" style="margin:10px 0 0">Bra jobbat!</h2>
  <div class="stj" id="rStj"></div>
  <p id="rTxt" style="font-weight:700;margin:0 0 14px"></p>
  <button class="knapp" id="rIgen">Spela igen</button>
  <button class="knapp vit" id="rHome">Välj nivå</button>
</section>

</main>
<canvas id="fx" hidden></canvas>
<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const KEY="mattespel-klockanengelska-v1";
const data=(()=>{try{return Object.assign({stars:{}},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return{stars:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const ROUND=8;

/* ---------- Nivåer ----------
   typer: stall = ställ klockan efter den engelska frasen, bygg = bygg frasen av ordbrickor efter klockan. */
const NIV=[null,
  {namn:"O'clock",txt:"Hela timmar: three o'clock.",col:"#2BB673",min:[0],typer:["stall","stall","stall","stall","stall","bygg","bygg","bygg"]},
  {namn:"Half and quarter",txt:"Half past, quarter past och quarter to.",col:"#FF9F43",min:[30,30,15,45,0],typer:["stall","stall","stall","stall","bygg","bygg","bygg","bygg"]},
  {namn:"Minutes",txt:"Five past, twenty to och fler.",col:"#7B61FF",min:[5,10,20,25,35,40,50,55,15,45,30],typer:["stall","stall","stall","stall","bygg","bygg","bygg","bygg"]}];
const NAMN=["twelve","one","two","three","four","five","six","seven","eight","nine","ten","eleven"];
const nm=h=>NAMN[((h%12)+12)%12];
const MINORD={5:"five",10:"ten",20:"twenty",25:"twenty-five"};
/* h = 0–11 (0 är klockan tolv), m = minuter */
function fras(h,m){if(m===0)return nm(h)+" o'clock";if(m===30)return"half past "+nm(h);if(m===15)return"quarter past "+nm(h);if(m===45)return"quarter to "+nm(h+1);
  return m<30?MINORD[m]+" past "+nm(h):MINORD[60-m]+" to "+nm(h+1);}
const svenska=(h,m)=>MPKlocka.phrase(h===0?12:h,m);
function gorRunda(lvl){const N=NIV[lvl],tagna=new Set(),ut=[];
  shuffle(N.typer.slice()).forEach((typ,i)=>{let h,m,k,v=0;do{h=rnd(0,11);m=lvl===2?N.min[i%N.min.length]:pick(N.min);k=h*60+m;}
    /* samma ord får inte behövas två gånger i en fras (five past five), och inget klockslag två gånger i rundan */
    while((tagna.has(k)||new Set(fras(h,m).split(" ")).size<fras(h,m).split(" ").length)&&v++<200);tagna.add(k);
    const T={typ,h,m,T:k,fras:fras(h,m)};
    if(typ==="bygg"){const ratt=T.fras.split(" "),set=new Set(ratt);
      /* lockord: fel timme (grannarna), past/to, half/quarter och på nivå 3 ett annat minutord */
      [nm(h),nm(h+1),nm(h-1)].forEach(o=>set.add(o));if(lvl>1){set.add("past");set.add("to");set.add(m===30?"quarter":"half");}else set.add("past");
      if(lvl===3)set.add(pick(Object.values(MINORD).filter(o=>!set.has(o)))||"ten");
      T.ratt=ratt;T.brickor=shuffle([...set]);}
    else{let s;do{s=(k+pick([125,190,250,305,430,515]))%720;s-=s%5;}while(s===k);T.start=s;}
    ut.push(T);});
  return ut;}

/* ---------- Ledtrådar ---------- */
const hm=T=>[Math.floor(T/60)%12,T%60];
function ledStall(U,val){const [h,m]=hm(val),t=U;
  if(m===t.m&&h!==t.h){
    if(t.m===30&&h===(t.h+11)%12)return `Half past ${nm(t.h)} är en halv timme efter ${nm(t.h)}. På svenska säger vi ${svenska(t.h,t.m)}.`;
    if(t.m>30&&h===(t.h+1)%12)return `To betyder före. Den korta visaren har inte kommit fram till ${nm(t.h+1)} än.`;
    return "Den långa visaren står rätt. Titta på den korta en gång till.";}
  if(t.m===0)return "O'clock betyder hel timme. Den långa visaren ska peka rakt upp på 12.";
  if(t.m>30&&m===60-t.m)return "To betyder före timmen. Den långa visaren ska stå på vänstra halvan.";
  if(t.m<30&&m===60-t.m)return "Past betyder efter timmen. Den långa visaren ska stå på högra halvan.";
  if(t.m===30)return "Half betyder halv. Den långa visaren ska peka rakt ner på 6.";
  if(t.m===15||t.m===45)return "Quarter betyder kvart. Den långa visaren ska peka på 3 eller 9.";
  return "Titta på den långa visaren. Varje siffra är fem minuter.";}
function ledBygg(U,ord){const s=ord.join(" "),t=U;
  if(t.m===0)return ord.includes("o'clock")?"Titta på den korta visaren. Vilken timme pekar den på?":"Vid hel timme säger man timmen och sedan o'clock.";
  if(t.m>30&&ord.includes("past"))return "Den långa visaren har gått förbi halv. Då räknar man fram till nästa timme: to.";
  if(t.m<=30&&ord.includes("to"))return "Den långa visaren är på högra halvan. Då säger man past.";
  if(t.m>30&&ord.includes("to")&&ord[ord.length-1]!==nm(t.h+1))return `To betyder före nästa timme. Vilken timme är klockan snart?`;
  if(t.m<=30&&ord[ord.length-1]!==nm(t.h))return "Past betyder efter. Vilken timme har den korta visaren just gått förbi?";
  if(ord.length!==t.ratt.length)return "Orden ska stå i den här ordningen: minuterna, past eller to, timmen.";
  return "Titta på den långa visaren. Hur många minuter är det?";}

/* ---------- Skärmar ---------- */
const stjHtml=n=>[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("");
function show(id){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0);if(window.MPS)MPS.visa(id);}
function hem(){rensa();tyst();$("heroKlocka").innerHTML=MPKlocka.clockSVG(3,30);
  $("niv").innerHTML=[1,2,3].map(l=>`<button data-l="${l}"><span class="nr" style="background:${NIV[l].col}">${l}</span><span><b>${NIV[l].namn}</b><small>${NIV[l].txt}</small></span><span class="st">${stjHtml(data.stars[l]||0)}</span></button>`).join("");
  show("home");}
$("niv").onclick=e=>{const b=e.target.closest("[data-l]");if(b)starta(+b.dataset.l);};
/* engelsk uppläsning, bara när man trycker på 🔊 */
let enVoice=null;function laddaRoster(){try{const v=speechSynthesis.getVoices();enVoice=v.find(x=>/^en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
if("speechSynthesis" in window){laddaRoster();speechSynthesis.onvoiceschanged=laddaRoster;}
function tyst(){try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
function lasUpp(t){if(!("speechSynthesis" in window))return;tyst();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(enVoice)u.voice=enVoice;u.rate=.85;speechSynthesis.speak(u);}
$("hor").onclick=()=>{if(G&&G.tal)lasUpp(G.tal);};

/* ---------- Spelet ---------- */
let G=null,tim=[];
const rensa=()=>{tim.forEach(clearTimeout);tim=[];};
const ljud=n=>{window.Ljud&&Ljud[n]&&Ljud[n]();};
function starta(lvl){G={lvl,N:NIV[lvl],i:0,fel:0,res:[],kv:gorRunda(lvl),retries:0};$("nivT").textContent=NIV[lvl].namn;show("game");nasta();}
function prickar(){$("dots").innerHTML=G.kv.map((_,j)=>`<i class="${j<G.i?(G.res[j]?"ok":"f"):j===G.i?"nu":""}"></i>`).join("");}
function fb(t,c){$("forkl").textContent=t||"";$("forkl").className="forkl"+(c?" "+c:"");}
function nasta(){rensa();tyst();if(G.i>=G.kv.length){slut();return;}
  const U=G.U=G.kv[G.i];G.forsok=0;G.felNu=false;G.last=false;G.ord=[];G.rort=false;prickar();fb("");
  $("nasta").hidden=true;$("klar").hidden=false;const ur=$("ur");ur.className="ur"+(U.typ==="bygg"?" liten":"");$("bygg").hidden=U.typ!=="bygg";
  if(U.typ==="stall"){G.T=U.start;G.tal=U.fras;$("hor").hidden=false;$("q").innerHTML=`Set the clock to<b>${U.fras}</b>`;
    ur.innerHTML=MPKlocka.clockSVG(Math.floor(G.T/60),G.T%60);const svg=ur.querySelector("svg.clock");
    MPKlocka.drag(svg,{get:()=>G.T,set:T=>{G.T=T;},step:()=>5,busy:()=>G.last,onMove:()=>{MPKlocka.setHands(svg,G.T);G.rort=true;$("klar").disabled=false;ur.classList.remove("fel");}});
    $("klar").disabled=true;}
  else{G.tal="";$("hor").hidden=true;$("q").innerHTML=`What time is it?<b>Bygg klockslaget</b>`;ur.innerHTML=MPKlocka.clockSVG(U.h,U.m);$("mening").className="mening";ritaBygg();}}
function ritaBygg(){const U=G.U,m=$("mening");
  m.innerHTML=G.ord.length?G.ord.map((o,i)=>`<button class="ord" data-ut="${i}">${o}</button>`).join(""):'<span class="tom">Tryck på orden i rätt ordning</span>';
  $("brickor").innerHTML=U.brickor.map(o=>`<button class="ord${G.ord.includes(o)?" tagen":""}" data-in="${o}">${o}</button>`).join("");
  $("klar").disabled=!G.ord.length;}
$("bygg").onclick=e=>{if(!G||G.last||G.U.typ!=="bygg")return;const i=e.target.closest("[data-in]"),u=e.target.closest("[data-ut]");
  if(i&&!G.ord.includes(i.dataset.in)&&G.ord.length<4)G.ord.push(i.dataset.in);else if(u)G.ord.splice(+u.dataset.ut,1);else return;
  $("mening").className="mening";window.Ljud&&Ljud.glod&&Ljud.glod("tick");ritaBygg();};
function avsluta(){const U=G.U;if(G.felNu&&!U.igen)G.fel++;G.res[G.i]=!G.felNu;G.i++;G.last=true;prickar();
  $("klar").hidden=true;$("nasta").hidden=false;$("nasta").focus({preventScroll:true});G.tal=U.fras;$("hor").hidden=false;
  if(!G.felNu)tim.push(setTimeout(nasta,3200));}
function igenSist(){if(G.retries<3){G.retries++;const U=G.U;G.kv.push(Object.assign({},U,{igen:true}));}}
const facit=U=>`${U.fras} = ${svenska(U.h,U.m)}.`;
function klar(){if(!G||G.last)return;const U=G.U,ur=$("ur");
  if(U.typ==="stall"){if(!G.rort)return;const svg=ur.querySelector("svg.clock");
    if(G.T%720===U.T){ur.className="ur ratt";ljud("ok");fb("Rätt! ✓ "+facit(U),"ratt");avsluta();return;}
    G.felNu=true;ljud("bad");ur.classList.remove("skaka");void ur.offsetWidth;ur.classList.add("fel","skaka");
    if(G.forsok===0){G.forsok=1;fb("Inte riktigt. "+ledStall(U,G.T),"fel");$("klar").disabled=true;return;}
    svg.classList.add("glid");G.T=U.T;MPKlocka.setHands(svg,U.T);fb("Så här står klockan då: "+facit(U),"fel");igenSist();avsluta();return;}
  const m=$("mening");if(!G.ord.length)return;
  if(G.ord.join(" ")===U.fras){m.className="mening ratt";ur.className="ur liten ratt";ljud("ok");fb("Rätt! ✓ "+facit(U),"ratt");avsluta();return;}
  G.felNu=true;ljud("bad");m.classList.remove("skaka");void m.offsetWidth;m.className="mening fel skaka";
  if(G.forsok===0){G.forsok=1;fb("Inte riktigt. "+ledBygg(U,G.ord),"fel");return;}
  G.ord=U.ratt.slice();ritaBygg();m.className="mening ratt";fb("Så här säger man: "+facit(U),"fel");igenSist();avsluta();}
