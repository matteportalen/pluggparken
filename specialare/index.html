<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Specialare – Pluggparken</title>
<meta name="theme-color" content="#1F3A35">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6E0;--ink:#1D2B53;--muted:#56668F;--card:#fff;--line:#EBD9A8;--accent:#3D5AFE;--gold:#F2B707;--font:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 56px}
.topp{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topp small{color:var(--muted);font-weight:700}
h1{font-size:clamp(2.2rem,8vw,3.4rem);line-height:1;margin:10px 0 4px;font-weight:800;letter-spacing:-.5px}
h1 span{color:#E0562B}
.lead{margin:0 0 16px;color:var(--muted)}
.dagens{position:relative;display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--c,#3F51B5),#1D2B53);color:#fff;border-radius:26px;padding:20px;margin:8px 0 18px;box-shadow:0 6px 0 rgba(0,0,0,.18);overflow:hidden}
.dagens .stor{flex:none;font-size:clamp(4rem,16vw,6.5rem);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.dagens .t{flex:1;min-width:0}
.dagens small{display:inline-block;background:var(--gold);color:var(--ink);border-radius:999px;padding:0 10px;font-weight:800;font-size:.85rem}
.dagens h2{margin:6px 0 2px;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.05}
.dagens p{margin:0 0 12px;opacity:.9}
.btn{border:0;background:#fff;color:var(--ink);border-radius:16px;padding:10px 18px;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.guld{background:var(--gold)}
.dagens .rad{display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 14px;font-weight:700;font-size:1rem}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr 1fr}}
.kort{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:20px;padding:10px 12px;text-align:left;box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s;width:100%}
.kort:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
@media(hover:hover){.kort:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--line)}}
.kort .ik{flex:none;width:62px;height:62px;border-radius:16px;background:var(--c);display:grid;place-items:center;font-size:2.1rem;transform:rotate(-4deg);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.kort b{display:block;font-size:1.15rem;line-height:1.15}
.kort small{display:block;color:var(--muted);font-size:.9rem;line-height:1.25}
.etikett{display:inline-block;background:#EEF1FF;color:var(--accent);border-radius:8px;padding:0 7px;font-size:.75rem;font-weight:800;margin-right:4px}
.etikett.g{background:#FFF0D6;color:#B25B00}
.foot{text-align:center;color:var(--muted);font-size:.9rem;margin-top:26px}
/* visare */
#vy{position:fixed;inset:0;z-index:50;background:var(--c,#3F51B5);color:#fff;display:none;flex-direction:column}
#vy.on{display:flex}
.vy-top{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.vy-top .t{flex:1;font-weight:800;font-size:1.1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rund{border:0;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--ink);font-size:1.3rem;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.rund:active{transform:translateY(2px)}
.slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 20px;gap:10px;min-height:0;overflow:auto}
.slide .tx{display:flex;flex-direction:column;align-items:center;gap:10px}
.slide .foto{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:0;max-width:100%}
.slide .foto img{display:block;max-width:100%;max-height:min(40vh,520px);border-radius:18px;box-shadow:0 8px 0 rgba(0,0,0,.25);background:rgba(255,255,255,.15);animation:pop .4s cubic-bezier(.3,1.3,.5,1)}
.slide .foto figcaption{font-size:.72rem;opacity:.75;max-width:60ch;line-height:1.2}
.slide .foto figcaption a{color:inherit}
@media(min-width:900px){.slide{flex-direction:row;flex-wrap:wrap;gap:12px 28px}.slide .foto img{max-height:min(56vh,600px);max-width:min(52vw,820px)}.slide .tx{max-width:min(36vw,460px);display:flex;flex-direction:column;gap:12px;align-items:center}.slide .slut,.slide .gillar{flex-basis:100%;justify-content:center;text-align:center}}
.slide ul{margin:0;padding:0;list-style:none;max-width:34ch;font-size:clamp(1.15rem,4vw,1.9rem);line-height:1.3;display:flex;flex-direction:column;gap:8px;text-align:left}
.slide ul li{background:rgba(255,255,255,.14);border-radius:16px;padding:8px 16px 8px 40px;position:relative}
.slide ul li::before{content:"";position:absolute;left:15px;top:.85em;width:12px;height:12px;border-radius:50%;background:#F2B707}
.slide ul.led li::before{background:#fff}
@media(min-width:900px){.slide ul{max-width:34ch;font-size:clamp(1.3rem,2.1vw,2rem)}.slide .tx{align-items:flex-start}.slide .tx h2{text-align:left;font-size:clamp(2rem,3.6vw,3.4rem)}.slide .tx .slut{justify-content:flex-start}}
.slide img.susig{filter:blur(26px) saturate(1.2);clip-path:inset(0 round 18px);box-shadow:none}
.slide .e{font-size:clamp(5rem,26vmin,11rem);line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.18));animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.slide h2{margin:0;font-size:clamp(1.8rem,7vw,3.4rem);line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.slide p{margin:0;max-width:30ch;font-size:clamp(1.2rem,4.2vw,2rem);line-height:1.3;background:rgba(255,255,255,.14);border-radius:20px;padding:12px 18px}
@media(min-width:900px){.slide p{max-width:34ch}}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.vy-nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 12px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.prickar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:50vw}
.prick{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35)}
.prick.on{background:#fff;transform:scale(1.3)}
.nav{border:0;border-radius:18px;background:#fff;color:var(--ink);font-weight:800;font-size:1.25rem;min-width:84px;height:54px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.nav:disabled{opacity:.35}
.nav:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.slut{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
/* proffsig bildspelsvy */
#vy{background:#080b12;color:#fff;font-family:Inter,"Helvetica Neue",Arial,system-ui,sans-serif;overflow:hidden}
#vy::before{content:"";position:absolute;inset:-60px;background:var(--bi,none) center/cover no-repeat,radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--ac,#345) 45%,#080b12),#080b12);filter:blur(50px) brightness(.36) saturate(1.25);z-index:0;pointer-events:none}
#vy>*{position:relative;z-index:1}
#vy .vy-top{padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top))}
#vy .vy-top .t{font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
#vy .rund{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);box-shadow:none;backdrop-filter:blur(8px);font-weight:600}
#vy .rund:active{background:rgba(255,255,255,.25);transform:none}
#vy .tum button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);box-shadow:none;filter:none;opacity:.8}
#vy .tum button.on{background:rgba(255,255,255,.28);outline:none;opacity:1;border-color:#fff}
#vy .slide{align-items:center;text-align:left;padding:6px 24px 10px;gap:18px;justify-content:center}
#vy .slide .foto{align-items:flex-end;gap:6px}
#vy .slide .foto img{border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);animation:fade .5s ease both;background:#0003}
#vy .slide .foto figcaption{font-size:.68rem;opacity:.55;text-align:right}
#vy .slide .foto figcaption a{text-decoration:none}
#vy .slide .tx{gap:12px;align-items:flex-start;width:100%;max-width:640px}
#vy .kick{font-size:.78rem;font-weight:800;letter-spacing:.16em;color:color-mix(in srgb,var(--ac,#9bd) 50%,#fff)}
#vy .slide h2{font-size:clamp(1.9rem,6.5vw,3rem);font-weight:800;letter-spacing:-.025em;line-height:1.04;text-shadow:none;text-align:left}
#vy .slide ul{max-width:none;gap:14px;font-size:clamp(1.05rem,3.6vw,1.45rem);font-weight:400;line-height:1.4}
#vy .slide ul li{background:none;border-radius:0;padding:2px 0 2px 16px;border-left:3px solid var(--ac,#9bd)}
#vy .slide ul li::before{display:none}
#vy .slide ul li small{display:block;font-size:.65rem;font-weight:800;letter-spacing:.16em;opacity:.65;margin-bottom:2px}
#vy .slide p{background:none;padding:0 0 0 16px;border-left:3px solid var(--ac,#9bd);border-radius:0;max-width:none;font-size:clamp(1.05rem,3.6vw,1.45rem);line-height:1.4}
#vy .slide .e{filter:none;font-size:clamp(4rem,18vmin,8rem)}
#vy .btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none;border-radius:12px;font-weight:600}
#vy .btn.guld{background:#fff;color:#0b1020;border-color:#fff}
#vy .gillar{font-weight:600;font-size:1rem;opacity:.9}
#vy .vy-nav{padding:8px 18px;padding-bottom:max(16px,env(safe-area-inset-bottom));gap:18px}
#vy .nav{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);box-shadow:none;font-weight:600;border-radius:12px;height:48px;min-width:96px;font-size:1rem}
#vy .nav:active:not(:disabled){background:rgba(255,255,255,.25);transform:none}
#vy .prickar{gap:5px;max-width:42vw}
#vy .prick{width:20px;height:3px;border-radius:2px;background:rgba(255,255,255,.3);transform:none}
#vy .prick.on{background:#fff}
#vy .slide img.susig{filter:blur(30px) saturate(1.2);clip-path:inset(0 round 10px);box-shadow:none}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(min-width:900px){#vy .slide{flex-direction:row;flex-wrap:nowrap;gap:5vw;padding:10px 6vw}#vy .slide .foto img{max-height:70vh;max-width:56vw}#vy .slide .tx{max-width:34vw}#vy .slide h2{font-size:clamp(2.2rem,3.6vw,3.6rem)}#vy .slide ul,#vy .slide p{font-size:clamp(1.2rem,1.55vw,1.7rem)}#vy .slide .slut,#vy .slide .gillar{flex-basis:auto}}
@media(min-width:900px){#vy .slide.sist{flex-wrap:wrap}#vy .kuriosa{margin-top:6px}.kuriosa .btn{border-color:rgba(255,255,255,.4);font-size:.95rem}
#vy .slide.sist .foto img{max-height:27vh}}

/* museum och planetarium */
#vy .stjarnor{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1s;background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 27% 72%,#fff,transparent),radial-gradient(1.4px 1.4px at 41% 33%,#fff,transparent),radial-gradient(1px 1px at 58% 82%,#fff,transparent),radial-gradient(1.3px 1.3px at 73% 24%,#fff,transparent),radial-gradient(1px 1px at 88% 61%,#fff,transparent),radial-gradient(1.2px 1.2px at 94% 12%,#fff,transparent),radial-gradient(1px 1px at 6% 88%,#fff,transparent),radial-gradient(1.1px 1.1px at 66% 52%,#fff,transparent),radial-gradient(1px 1px at 35% 8%,#fff,transparent);background-size:340px 300px;animation:drift 120s linear infinite}
#vy.rymd .stjarnor{opacity:.55}
@keyframes drift{to{background-position:-340px 300px}}
#vy .prog{position:absolute;left:0;top:0;height:3px;width:calc(var(--p,0)*100%);background:color-mix(in srgb,var(--ac,#9bd) 60%,#fff);z-index:3;transition:width .5s ease}
#vy::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 100%)}
#vy .slide h2{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em;line-height:1.08}
#vy .kick{padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.22);width:100%}
#vy .slide .foto img{animation:fade .6s ease both,zoom 22s ease-out .2s both;border-radius:3px}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.035)}}
#vy .slide .foto{overflow:visible}
#vy .slide .foto figcaption{display:flex;gap:10px;justify-content:flex-start;width:100%;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;opacity:.7;text-align:left;margin-top:2px}
#vy .slide .foto figcaption .fig{font-weight:800;opacity:1;flex:none}
#vy .slide .foto figcaption a{opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vy .slide ul li,#vy .slide p{font-weight:400;letter-spacing:.005em}
#vy .slide img.susig{animation:none}
@media(prefers-reduced-motion:reduce){#vy .stjarnor,#vy .slide .foto img{animation:none}}
/* lite bling */
#vy .slide .rama{position:relative;overflow:hidden;border-radius:3px;line-height:0;box-shadow:0 0 110px -10px color-mix(in srgb,var(--ac,#9bd) 70%,transparent),0 24px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.14);max-width:100%}
#vy .slide .rama img{box-shadow:none;border-radius:0;display:block}
#vy .slide .rama::after{content:"";position:absolute;inset:-20% auto -20% -60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent);transform:skewX(-18deg);animation:blank 1.6s ease-out .5s both;pointer-events:none}
@keyframes blank{to{left:140%}}
#vy .slide h2{background:linear-gradient(100deg,#fff 38%,color-mix(in srgb,var(--ac,#9bd) 35%,#fff) 50%,#fff 62%);background-size:260% 100%;background-position:120% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:glans 2.6s ease-out .3s both}
@keyframes glans{from{background-position:120% 0}to{background-position:-30% 0}}
#vy .kick{border-bottom:0;background:linear-gradient(90deg,transparent,transparent) bottom/100% 1px no-repeat;position:relative}
#vy .kick::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--ac,#9bd) 70%,#fff),rgba(255,255,255,.08))}
#vy .btn.guld{box-shadow:0 0 28px color-mix(in srgb,var(--ac,#9bd) 70%,transparent),0 0 0 1px rgba(255,255,255,.6);animation:puls 2.6s ease-in-out infinite}
@keyframes puls{50%{box-shadow:0 0 44px color-mix(in srgb,var(--ac,#9bd) 90%,transparent),0 0 0 1px #fff}}
#vy .gnista{position:absolute;z-index:5;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);background:var(--h);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);pointer-events:none;animation:flyg var(--t) ease-out forwards;filter:drop-shadow(0 0 6px var(--h))}
@keyframes flyg{from{transform:translate(0,0) scale(.2) rotate(0);opacity:1}70%{opacity:1}to{transform:translate(var(--x),var(--y)) scale(1) rotate(200deg);opacity:0}}
@media(prefers-reduced-motion:reduce){#vy .slide .rama::after,#vy .slide h2,#vy .btn.guld{animation:none}#vy .slide h2{-webkit-text-fill-color:#fff;color:#fff;background:none}}
/* tummar */
.tum{display:inline-flex;gap:6px;flex:none}
.tum button{border:0;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.95);font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.2);filter:grayscale(1);opacity:.75}
.tum button.on{filter:none;opacity:1;outline:3px solid #F2B707}
.tum button:active{transform:translateY(2px)}
.kort{position:relative}.kort.nej{opacity:.55}
.mark{position:absolute;right:8px;top:6px;font-size:1.1rem}
.gillar{margin-top:6px;font-weight:800;font-size:1.1rem}
.gillar .tum button{width:56px;height:56px;font-size:1.6rem}
.foot button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:3px 12px;font-weight:700;font-size:.95rem}
.slide.sist .foto img{max-height:min(34vh,360px)}
@media(min-width:900px){.slide.sist .foto img{max-height:min(38vh,400px)}}
/* klipp */
#kv{position:fixed;inset:0;z-index:50;background:#14142a;display:none;flex-direction:column;color:#fff}
#kv.on{display:flex}
#kv .gv-top{background:#C62828}
.kv-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:12px;min-height:0}
.kv-ram{width:min(100%,calc((100vh - 170px)*16/9));aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.kv-ram iframe{width:100%;height:100%;border:0;display:block}
.kv-not{margin:0;color:#c9cdea;font-size:.9rem;text-align:center;max-width:60ch}
.kort .ik.bild{background-size:cover;background-position:center;font-size:1.6rem;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6);align-content:center}
/* ritloop i helskärm */
#gv.mork div.rit{position:fixed;left:0;right:0;bottom:0;top:var(--top,67px);max-width:none;margin:0;padding:0;z-index:1}
#gv.mork .rit #rC{position:absolute;inset:0;width:100%;max-width:none;height:100%;margin:0;border-radius:0;box-shadow:none;background:#070a11;cursor:crosshair;aspect-ratio:auto}
.rit-t{position:absolute;top:12px;left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:.95rem;pointer-events:none;transition:opacity 1.5s;z-index:3;padding:0 16px;text-shadow:0 1px 8px #000}
.rit-t.dim{opacity:0}
.rit-ui{position:absolute;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:3;pointer-events:none;padding:0 10px}
.rit-ui .k{pointer-events:auto}
.rit-rad{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rit-rad .k[hidden]{display:none}
/* prova själv i mörk stil */
#gv.mork{background:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--c,#345) 38%,#070a11),#070a11 62%);font-family:Inter,"Helvetica Neue",Arial,system-ui,sans-serif;color:#fff}
#gv.mork .ill,#gv.mork .rit,#gv.mork .udda,#gv.mork .hitta,#gv.mork .tid{max-width:840px;margin:0 auto;padding:24px 18px 56px}
#gv.mork .kick{font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--c,#9bd) 45%,#fff);text-align:center;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:12px}
#gv.mork .ill-q,#gv.mork .tid h3{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:clamp(1.5rem,3.4vw,2.3rem);line-height:1.12;margin:6px 0 16px;color:#fff}
#gv.mork .k{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border-radius:12px;font-weight:600;font-size:1rem;padding:8px 18px;backdrop-filter:blur(8px)}

<body>
<main class="wrap" id="hem">
  <div class="topp"><a href="../ovriga/" style="color:rgba(255,255,255,.7);text-decoration:none;font-weight:600;font-size:.9rem">← Fler ämnen</a></div>
  <h1>Special<span>are</span></h1>
  <p class="lead">Minilektioner om coola saker. Gissa mysteriet, titta på riktiga bilder och lär dig något nytt.</p>
  <section class="dagens" id="dagens"></section>
  <div class="chips" id="chips" role="group" aria-label="Välj ämne"></div>
  <div class="grid" id="grid"></div>
  <p class="foot" id="foot"></p>

  <div class="vy-top"><button class="rund" id="vyX" aria-label="Stäng">✕</button><div class="t" id="vyT"></div><span class="tum" data-tum></span><button class="rund" id="vyF" aria-label="Helskärm">⛶</button></div>
  <div class="slide" id="vyS"></div>
  <div class="vy-nav"><button class="nav" id="vyP">‹ Förra</button><div class="prickar" id="vyD"></div><button class="nav" id="vyN">Nästa ›</button></div>
</section>

<section id="kv" aria-label="Klipp">
  <div class="gv-top"><button class="rund" id="kvX" aria-label="Stäng">✕</button><div class="t" id="kvT"></div><span class="tum" data-tum></span></div>

</section>

</section>

<script>
(function(){
const $=s=>document.querySelector(s);
const ALLA=[].concat(LEKTIONER.map(l=>Object.assign({typ:"l"},l,{beskr:l.rutor[0][2]})),GREJER.map(g=>Object.assign({typ:"g"},g)),[].map(k=>({typ:"k",id:k.id,titel:k.titel,kat:"Klipp",e:"🎬",c:"#C62828",beskr:k.kanal+" · "+Math.round(k.sek/60)+" min · "+(k.sprak==="en"?"engelska":"svenska"),sek:k.sek,kanal:k.kanal,sprak:k.sprak})));
let filter="Alla",cur=null,idx=0,stang=null,nu=null;
let BET={};try{BET=JSON.parse(localStorage.getItem("sp-betyg")||"{}")||{}}catch(e){}
const sparaB=()=>{try{localStorage.setItem("sp-betyg",JSON.stringify(BET))}catch(e){}};
function tumHtml(id){return `<button data-v="1" aria-label="Tummen upp" class="${BET[id]===1?"on":""}">👍</button><button data-v="-1" aria-label="Tummen ner" class="${BET[id]===-1?"on":""}">👎</button>`}
function uppdTum(){document.querySelectorAll("[data-tum]").forEach(e=>{e.innerHTML=nu?tumHtml(nu):"";e.style.display=nu?"":"none"});const g=document.querySelector(".gillar .tum");if(g&&nu)g.innerHTML=tumHtml(nu)}
function satt(v){if(!nu)return;if(BET[nu]===v)delete BET[nu];else BET[nu]=v;sparaB();uppdTum();hem()}
document.addEventListener("click",e=>{const b=e.target.closest(".tum button");if(b){satt(+b.dataset.v)}});
const dagNr=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function pool(){const p=[];ALLA.forEach(a=>{if(BET[a.id]===-1)return;p.push(a);if(BET[a.id]===1)p.push(a)});return p.length?p:ALLA}
function dagens(){const p=pool();return p[(dagNr()*7+3)%p.length]}
function href(a,i){return a.typ==="k"?"#k/"+a.id:a.typ==="l"?"#l/"+a.id+(i?"/"+i:""):"#g/"+a.id}
function foto1(a){const b=(typeof BILDER!=="undefined"&&BILDER[a.id]||[])[a.id==="storlek"?9:0];return b?"bilder/"+b.f:a.id==="djuret"?"bilder/snoleopard1.jpg":""}
function hem(){
  const d=dagens();
  const kort=a=>{const f=foto1(a);return `<button class="kort${BET[a.id]===-1?" nej":""}" data-id="${a.id}" style="--c:${a.c}${f?`;--bi:url(${f})`:""}">${a.typ==="g"&&!f?`<span class="em" aria-hidden="true">${a.e}</span>`:""}${BET[a.id]?`<span class="mark" aria-label="${BET[a.id]===1?"Du gillade":"Du gillade inte"}">${BET[a.id]===1?"👍":"👎"}</span>`:""}<span class="kk">${a.typ==="g"?"PROVA SJÄLV":a.kat.toUpperCase()}</span><b>${a.titel}</b><small>${a.typ==="l"?a.rutor.length+" bilder":a.beskr}</small></button>`};
  const mys=d.typ==="l";
  $("#dagens").style.setProperty("--c",d.c);const df=foto1(d);$("#dagens").style.setProperty("--bi",df?`url(${df})`:"none");
  $("#dagens").innerHTML=`<div class="stor" aria-hidden="true">${mys?"?":d.e}</div><div class="t"><small>Dagens specialare</small><h2>${mys?"Dagens mysterium":d.titel}</h2><p>${mys?"Ett nytt mysterium inom "+d.kat.toLowerCase()+". Läs ledtrådarna och gissa vad det handlar om!":d.beskr}</p><div class="rad"><button class="btn guld" id="dgo">${mys?"Starta mysteriet":"Visa"}</button><button class="btn" id="slump">🎲 Slumpa</button></div></div>`;
  $("#dgo").onclick=()=>{location.hash=href(d)};
  $("#slump").onclick=()=>{let a;const P=pool();do{a=P[Math.random()*P.length|0]}while(a===d&&P.length>1);location.hash=href(a)};
  const kats=["Alla","Prova själv",...new Set(LEKTIONER.map(l=>l.kat))];
  $("#chips").innerHTML=kats.map(k=>`<button class="chip${k===filter?" on":""}" data-k="${k}">${k}</button>`).join("");
  const lista=ALLA.filter(a=>filter==="Alla"||(filter==="Prova själv"?a.typ==="g":a.typ==="l"&&a.kat===filter));
  const L=lista.filter(a=>a.typ==="l"),G=lista.filter(a=>a.typ==="g");
  $("#grid").className="";
  $("#grid").innerHTML=(L.length?`<h2 class="grp">Minilektioner</h2><div class="grid">${L.map(kort).join("")}</div>`:"")+(G.length?`<h2 class="grp">Prova själv</h2><div class="grid">${G.map(kort).join("")}</div>`:"");
  $("#foot").textContent=LEKTIONER.length+" minilektioner och "+GREJER.length+" saker att prova";
}
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(b){filter=b.dataset.k;hem()}};
$("#grid").onclick=e=>{const b=e.target.closest(".kort");if(!b)return;const a=ALLA.find(x=>x.id===b.dataset.id);location.hash=href(a)};
/* bildspel */
function gnistor(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const v=$("#vy"),r=v.getBoundingClientRect();
  for(let i=0;i<42;i++){const e=document.createElement("i");e.className="gnista";const a=Math.random()*Math.PI*2,d=120+Math.random()*Math.min(r.width,r.height)*.45;
    e.style.cssText=`left:${r.width/2}px;top:${r.height*.45}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--s:${6+Math.random()*10}px;--t:${.9+Math.random()*.9}s;--h:${Math.random()<.5?"#fff":"#ffd86b"}`;v.appendChild(e);setTimeout(()=>e.remove(),2000)}}
let kvTill=null,gvTill=null;
let ledt=0,svarat=false;
const ledtLista=l=>(typeof LEDTRADAR!=="undefined"&&LEDTRADAR[l.id])||null;
const punkter=t=>{const d=t.split(/(?<=[.!?])\s+(?=[A-ZÅÄÖ0-9"])/);return d.length>1?"<ul>"+d.map(x=>"<li>"+x+"</li>").join("")+"</ul>":"<p>"+t+"</p>"};
function visaBild(){
  const l=cur,L=ledtLista(l),o=L?1:0,n=l.rutor.length+o,sist=idx===n-1;
  $("#vy").style.setProperty("--p",(idx+1)/n);$("#vy").classList.toggle("rymd",l.kat==="Rymden");
  const kick=t=>`<div class="kick">${t}</div>`;
  const bildar=(typeof BILDER!=="undefined"&&BILDER[l.id])||[];
  if(L&&idx===0){
    const bi=bildar[0];
    const tips=L.slice(0,ledt).map((t,i)=>`<li><small>LEDTRÅD ${i+1}</small>${t}</li>`).join("");
    $("#vyT").textContent=svarat?l.titel:"Mysterium";$("#vy").style.setProperty("--bi",bi?`url(bilder/${bi.f})`:"none");
    $("#vyS").classList.remove("sist");
    $("#vyS").innerHTML=(bi?`<figure class="foto"><div class="rama"><img class="${svarat?"":"susig"}" src="bilder/${bi.f}" alt="" decoding="async"></div>${svarat?`<figcaption><a href="${bi.s}" target="_blank" rel="noopener">${bi.k}</a></figcaption>`:""}</figure>`:`<div class="e" aria-hidden="true">${svarat?l.e:"❓"}</div>`)+
     `<div class="tx">${kick(svarat?"SVARET":"MYSTERIUM")}<h2>${svarat?l.titel:"Vad handlar det om?"}</h2>${tips?`<ul class="led">${tips}</ul>`:"<p>Tryck på knappen för första ledtråden.</p>"}<div class="slut">${svarat?(l.film?`<button class="btn guld" id="filmB">🎬 Starta filmen</button>`:""):(ledt<L.length?`<button class="btn guld" id="ledB">🔎 ${ledt?"Nästa ledtråd":"Första ledtråden"}</button>`:"")+`<button class="btn" id="svarB">Visa svaret</button>`}</div></div>`;
    $("#filmB")&&($("#filmB").onclick=()=>{const F={titanic:window.MPTitanicFilm,vulkan:window.MPVulkanFilm,dinosaurier:window.MPDinoFilm,vikingar:window.MPVikingFilm,blaval:window.MPBlavalFilm,hajar:window.MPHajFilm,pyramid:window.MPPyramidFilm,snabbast:window.MPSnabbastFilm,manen:window.MPManFilm,vasa:window.MPVasaFilm,digerdoden:window.MPDigerFilm,pirater:window.MPPiratFilm,everest:window.MPEverestFilm,antarktis:window.MPAntarktisFilm,iss:window.MPIssFilm,blackfisk:window.MPBlackfiskFilm,blixt:window.MPBlixtFilm,kontinenter:window.MPKontFilm,regnbage:window.MPRegnbageFilm,norrsken:window.MPNorrskenFilm,bin:window.MPBinFilm,illusioner:window.MPIllusionerFilm,leonardo:window.MPLeonardoFilm,orkan:window.MPOrkanFilm,mammutar:window.MPMammutFilm,mars:window.MPMarsFilm,svampar:window.MPSvampFilm,vanallen:window.MPVanAllenFilm}[l.film];if(F){const prev=document.body.style.overflow;document.body.style.overflow="hidden";F.start(document.body,{overlay:true,onClose:()=>{document.body.style.overflow=prev}})}});
    $("#ledB")&&($("#ledB").onclick=()=>{ledt++;visaBild()});$("#svarB")&&($("#svarB").onclick=()=>{svarat=true;visaBild();gnistor()});
  }else{
    const i=idx-o,r=l.rutor[i];$("#vyT").textContent=l.titel;
    const bi=bildar[i];$("#vy").style.setProperty("--bi",bi?`url(bilder/${bi.f})`:"none");
    const bild=bi?`<figure class="foto"><div class="rama"><img src="bilder/${bi.f}" alt="${r[1]}" decoding="async"></div><figcaption><span class="fig">FIG. ${i+1}</span><a href="${bi.s}" target="_blank" rel="noopener">${bi.k}</a></figcaption></figure>`:`<div class="e" aria-hidden="true">${r[0]}</div>`;
    const nb=bildar[i+1];if(nb){const im=new Image();im.src="bilder/"+nb.f}
    $("#vyS").classList.toggle("sist",sist);$("#vyS").innerHTML=bild+`<div class="tx">${kick(l.kat.toUpperCase()+" · "+(idx+1)+" / "+n)}<h2>${r[1]}</h2>${punkter(r[2])}</div>`+(sist?`<div class="gillar">Gillade du den? <span class="tum">${tumHtml(l.id)}</span></div>${(KLIPPL[l.id]||l.grej||l.lank)?`<div class="kuriosa">${(l.lank||[]).map(k=>`<a class="btn" href="${k[1]}"${k[1][0]==="#"?"":' target="_blank" rel="noopener"'}>${/^#g\//.test(k[1])||/youtube/.test(k[1])?"🎬":k[1][0]==="#"?"📖":"🎧"} ${k[0]}</a> `).join("")}${l.grej?`<button class="btn guld" id="slG">🧪 Prova själv: ${GREJER.find(x=>x.id===l.grej).titel}</button> `:""}${KLIPPL[l.id]?`<button class="btn" id="slK">🎬 Kuriosa: se ett kort filmklipp${KLIPPL[l.id].sprak==="en"?" (på engelska)":" på svenska"} (${Math.max(1,Math.round(KLIPPL[l.id].sek/60))} min)</button>`:""}</div>`:""}<div class="slut"><button class="btn guld" id="sl1">🎲 Slumpa en till</button><button class="btn" id="sl2">Till listan</button></div>`:"");
  }
  $("#vyD").innerHTML=Array.from({length:n},(_,i)=>`<span class="prick${i===idx?" on":""}"></span>`).join("");
  $("#vyP").disabled=idx===0;$("#vyN").disabled=sist;$("#vyN").style.visibility=sist?"hidden":"visible";
  if(sist&&$("#slG")){$("#slG").onclick=()=>{gvTill=location.hash;location.hash="#g/"+l.grej}}
  if(sist&&$("#slK")){$("#slK").onclick=()=>{kvTill=location.hash;location.hash="#k/"+KLIPPL[l.id].id}}
  if(sist){$("#sl1").onclick=()=>{let a;const P=pool();do{a=P[Math.random()*P.length|0]}while(a===l&&P.length>1);location.hash=href(a)};$("#sl2").onclick=()=>{location.hash=""}}
  history.replaceState(null,"","#l/"+l.id+"/"+(idx+1));
}
function oppnaL(l,i){const nyL=cur!==l||!$("#vy").classList.contains("on");cur=l;nu=l.id;uppdTum();if(nyL){ledt=0;svarat=false}const tot=l.rutor.length+(ledtLista(l)?1:0);idx=Math.max(0,Math.min(tot-1,i));if(idx>0)svarat=true;$("#vy").style.setProperty("--ac",l.c);$("#vyT").textContent=l.titel;$("#vy").classList.add("on");visaBild()}
function stangAlla(){$("#kv").classList.remove("on");$("#kvR").innerHTML="";$("#vy").classList.remove("on");$("#gv").classList.remove("on");if(stang){try{stang()}catch(e){}stang=null}$("#gvB").innerHTML="";cur=null;nu=null;uppdTum()}
function oppnaK(k){stangAlla();nu=k.id;uppdTum();$("#kvT").textContent="🎬 "+k.titel;$("#kvN").textContent="Spelas från YouTube"+(k.sprak==="en"?" (engelska)":"")+". Stäng med ✕ när klippet är slut, så hamnar du inte i andra klipp.";
  $("#kvR").innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${k.id}?rel=0&modestbranding=1&playsinline=1" title="${k.titel.replace(/"/g,"")}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;$("#kv").classList.add("on")}
function oppnaG(g){stangAlla();$("#gv").classList.toggle("mork",!!g.mork);nu=g.id;uppdTum();$("#gv").style.setProperty("--c",g.c);$("#gvT").textContent=g.e+" "+g.titel;$("#gv").classList.add("on");$("#gv").scrollTop=0;stang=g.start($("#gvB"))}
function rut(){
  const h=location.hash.replace(/^#/,"").split("/");
  if(h[0]==="l"){const l=LEKTIONER.find(x=>x.id===h[1]);if(l){if(cur!==l||!$("#vy").classList.contains("on")){stangAlla()}oppnaL(l,(+h[2]||1)-1);return}}
  if(h[0]==="k"){const k=KLIPP.find(x=>x.id===h[1])||Object.values(KLIPPL).find(x=>x.id===h[1]);if(k){oppnaK(k);return}}
  if(h[0]==="g"){const g=GREJER.find(x=>x.id===h[1]);if(g){oppnaG(g);return}}
  stangAlla();
}
function gaTill(d){if(!cur)return;const n=idx+d,tot=cur.rutor.length+(ledtLista(cur)?1:0);if(n<0||n>=tot)return;idx=n;visaBild()}
$("#vyN").onclick=()=>gaTill(1);$("#vyP").onclick=()=>gaTill(-1);
$("#vyX").onclick=()=>{location.hash=""};
$("#gvX").onclick=()=>{const t=gvTill;gvTill=null;location.hash=t||""};
$("#kvX").onclick=()=>{const t=kvTill;kvTill=null;location.hash=t||""};
$("#vyF").onclick=()=>{const e=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(e.requestFullscreen)e.requestFullscreen().catch(()=>{})};
if(!document.documentElement.requestFullscreen)$("#vyF").style.display="none";
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#kv").classList.contains("on")){$("#kvX").click();return}if($("#vy").classList.contains("on")||$("#gv").classList.contains("on")||$("#kv").classList.contains("on")){if(!document.fullscreenElement)location.hash=""}return}
  if(!$("#vy").classList.contains("on"))return;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();gaTill(1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();gaTill(-1)}
  else if(e.key==="f"||e.key==="F")$("#vyF").click();
});
let sx=null;
$("#vyS").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("#vyS").addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)gaTill(dx<0?1:-1)},{passive:true});
$("#kopB").onclick=async()=>{const t=JSON.stringify(ALLA.filter(a=>BET[a.id]).map(a=>({id:a.id,titel:a.titel,typ:a.typ,kat:a.kat,kanal:a.kanal||undefined,v:BET[a.id]})));
  try{await navigator.clipboard.writeText(t);$("#kopB").textContent="✓ Kopierat! Klistra in i chatten"}catch(e){prompt("Kopiera:",t)}};
window.addEventListener("hashchange",rut);
hem();rut();
})();
</script>
