const ALLA=[].concat(LEKTIONER.map(l=>Object.assign({typ:"l"},l,{beskr:l.rutor[0][2]})),GREJER.map(g=>Object.assign({typ:"g"},g)),[].map(k=>({typ:"k",id:k.id,titel:k.titel,kat:"Klipp",e:"🎬",c:"#C62828",beskr:k.kanal+" · "+Math.round(k.sek/60)+" min · "+(k.sprak==="en"?"engelska":"svenska"),sek:k.sek,kanal:k.kanal,sprak:k.sprak})));
let filter="Alla",cur=null,idx=0,stang=null,nu=null;
let BET={};try{BET=JSON.parse(localStorage.getItem("sp-betyg")||"{}")||{}}catch(e){}

function tumHtml(id){return `<button data-v="1" aria-label="Tummen upp" class="${BET[id]===1?"on":""}">👍</button><button data-v="-1" aria-label="Tummen ner" class="${BET[id]===-1?"on":""}">👎</button>`}
function uppdTum(){document.querySelectorAll("[data-tum]").forEach(e=>{e.innerHTML=nu?tumHtml(nu):"";e.style.display=nu?"":"none"});const g=document.querySelector(".gillar .tum");if(g&&nu)g.innerHTML=tumHtml(nu)}
function satt(v){if(!nu)return;if(BET[nu]===v)delete BET[nu];else BET[nu]=v;sparaB();uppdTum();hem()}
document.addEventListener("click",e=>{const b=e.target.closest(".tum button");if(b){satt(+b.dataset.v)}});
const dagNr=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function pool(){const p=[];ALLA.forEach(a=>{if(BET[a.id]===-1)return;p.push(a);if(BET[a.id]===1)p.push(a)});return p.length?p:ALLA}

/* bildspel */
function gnistor(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const v=$("#vy"),r=v.getBoundingClientRect();
  for(let i=0;i<42;i++){const e=document.createElement("i");e.className="gnista";const a=Math.random()*Math.PI*2,d=120+Math.random()*Math.min(r.width,r.height)*.45;

function visaBild(){

    $("#vyS").innerHTML=(bi?`<figure class="foto"><div class="rama"><img class="${svarat?"":"susig"}" src="bilder/${bi.f}" alt="" decoding="async"></div>${svarat?`<figcaption><a href="${bi.s}" target="_blank" rel="noopener">${bi.k}</a></figcaption>`:""}</figure>`:`<div class="e" aria-hidden="true">${svarat?l.e:"❓"}</div>`)+
     `<div class="tx">${kick(svarat?"SVARET":"MYSTERIUM")}<h2>${svarat?l.titel:"Vad handlar det om?"}</h2>${tips?`<ul class="led">${tips}</ul>`:"<p>Tryck på knappen för första ledtråden.</p>"}<div class="slut">${svarat?(l.film?`<button class="btn guld" id="filmB">🎬 Starta filmen</button>`:""):(ledt<L.length?`<button class="btn guld" id="ledB">🔎 ${ledt?"Nästa ledtråd":"Första ledtråden"}</button>`:"")+`<button class="btn" id="svarB">Visa svaret</button>`}</div></div>`;
    $("#filmB")&&($("#filmB").onclick=()=>{const F={titanic:window.MPTitanicFilm,vulkan:window.MPVulkanFilm,dinosaurier:window.MPDinoFilm,vikingar:window.MPVikingFilm,blaval:window.MPBlavalFilm,hajar:window.MPHajFilm,pyramid:window.MPPyramidFilm,snabbast:window.MPSnabbastFilm,manen:window.MPManFilm,vasa:window.MPVasaFilm,digerdoden:window.MPDigerFilm,pirater:window.MPPiratFilm,everest:window.MPEverestFilm,antarktis:window.MPAntarktisFilm,iss:window.MPIssFilm,blackfisk:window.MPBlackfiskFilm,blixt:window.MPBlixtFilm,kontinenter:window.MPKontFilm,regnbage:window.MPRegnbageFilm,norrsken:window.MPNorrskenFilm,bin:window.MPBinFilm,illusioner:window.MPIllusionerFilm,leonardo:window.MPLeonardoFilm,orkan:window.MPOrkanFilm,mammutar:window.MPMammutFilm,mars:window.MPMarsFilm,svampar:window.MPSvampFilm,vanallen:window.MPVanAllenFilm,marianer:window.MPMarianerFilm,webb:window.MPWebbFilm,raket:window.MPRaketFilm,sjokablar:window.MPSjokablarFilm,vaccin:window.MPVaccinFilm,morkmateria:window.MPMorkMateriaFilm,tjernobyl:window.MPTjernobylFilm,krakatau:window.MPKrakatauFilm,elfte:window.MPElfteFilm,bitcoin:window.MPBitcoinFilm,ananas:window.MPAnanasFilm,chip:window.MPChipFilm,penicillin:window.MPPenicillinFilm,curie:window.MPCurieFilm,gps:window.MPGpsFilm,spinnande:window.MPSpinnandeFilm,smaklokar:window.MPSmaklokarFilm,bermuda:window.MPBermudaFilm,nobel:window.MPNobelFilm,himlen:window.MPHimlenFilm,jast:window.MPJastFilm,kvant:window.MPKvantFilm,atom:window.MPAtomFilm,petrichor:window.MPPetrichorFilm,dygn:window.MPDygnFilm,hjarnan:window.MPHjarnFilm,kroppen:window.MPKroppFilm,storatal:window.MPStoraTalFilm,dans:window.MPDansFilm}[l.film];if(F){const prev=document.body.style.overflow;document.body.style.overflow="hidden";
      /* samma extralänkar som på sista bilden i bildspelet: länkar, Prova själv och kuriosaklipp */
      const extra=[];(l.lank||[]).forEach(k=>extra.push({t:(/^#g\//.test(k[1])||/youtube/.test(k[1])?"🎬 ":k[1][0]==="#"?"📖 ":"🎧 ")+k[0],go:()=>{const h=lh(k);if(h[0]==="#"){if(ytId(k[1]))kvTill=location.hash;location.hash=h}else window.open(h,"_blank","noopener")}}));

      F.start(document.body,{overlay:true,extra,onClose:()=>{document.body.style.overflow=prev}})}});
    $("#ledB")&&($("#ledB").onclick=()=>{ledt++;visaBild()});$("#svarB")&&($("#svarB").onclick=()=>{svarat=true;visaBild();gnistor()});
  }else{
    const i=idx-o,r=l.rutor[i];$("#vyT").textContent=l.titel;
    const bi=bildar[i];$("#vy").style.setProperty("--bi",bi?`url(bilder/${bi.f})`:"none");

/* quiz: #l/<id>/q = testa dig själv, #l/<id>/f = facit (en fråga i taget). Inget sparas. */
const QS=l=>(typeof QUIZ!=="undefined"&&QUIZ[l.id])||null;

  const bokst="ABC";
  if(mode==="f"){
    const i=QZ.fi,q=QZ.q[i];stapel(i);
    H(kick("FACIT · FRÅGA "+(i+1)+" / "+n)+`<h2>${q.f}</h2><div class="qlista">${q.o.map((o,k)=>`<div class="btn qo ${o.r?"rat":q.v===k?"fel":"dim"}"><b>${o.r?"✓":q.v===k?"✗":bokst[k]}</b><span>${o.t}${q.v===k&&!o.r?" <small>(ditt svar)</small>":""}</span></div>`).join("")}</div><div class="qf"><strong>Visste du?</strong>${q.fk}</div><div class="slut">${i>0?`<button class="btn" id="qP">‹ Förra frågan</button>`:""}${i<n-1?`<button class="btn guld" id="qN">Nästa fråga ›</button>`:`<button class="btn guld" id="qT">← Till lektionen</button><button class="btn" id="qA">🔁 Testa dig själv</button>`}</div>`);
    $("#qP")&&($("#qP").onclick=()=>{QZ.fi--;visaQ("f")});$("#qN")&&($("#qN").onclick=()=>{QZ.fi++;visaQ("f")});
    $("#qT")&&($("#qT").onclick=qSlut);$("#qA")&&($("#qA").onclick=()=>{nyttQ(l);QZ.fas="fraga";location.hash="#l/"+l.id+"/q"});return}
  if(QZ.fas==="intro"){
    stapel(-1);H(kick("TESTA DIG SJÄLV")+`<h2>${n} frågor om ${l.titel.replace(/\?$/,"")}</h2><p>Ett svar är rätt. Efter varje fråga får du veta varför, och lite till.</p><div class="slut"><button class="btn guld" id="qS">Starta ▶</button><button class="btn" id="qF">📖 Visa facit</button><button class="btn" id="qT">← Till lektionen</button></div>`);
    $("#qS").onclick=()=>{QZ.fas="fraga";visaQ("q")};$("#qF").onclick=()=>{QZ.fi=0;location.hash="#l/"+l.id+"/f"};$("#qT").onclick=qSlut;return}
  if(QZ.fas==="fraga"){
    const i=QZ.i,q=QZ.q[i];stapel(i);const svar=q.v!==null;
    H(kick("TESTA DIG SJÄLV · FRÅGA "+(i+1)+" / "+n)+`<h2>${q.f}</h2><div class="qlista">${q.o.map((o,k)=>`<button class="btn qo${svar?(o.r?" rat":q.v===k?" fel":" dim"):""}" data-k="${k}"${svar?" disabled":""}><b>${svar&&o.r?"✓":svar&&q.v===k?"✗":bokst[k]}</b><span>${o.t}</span></button>`).join("")}</div>${svar?`<div class="qf"><strong>${q.o[q.v].r?"Rätt! 🎉":"Inte riktigt."}</strong>${q.fk}</div><div class="slut"><button class="btn guld" id="qN">${i<n-1?"Nästa fråga ›":"Se resultatet ›"}</button></div>`:""}`);
    document.querySelectorAll("#vyS .qo[data-k]").forEach(b=>b.onclick=()=>{if(q.v!==null)return;q.v=+b.dataset.k;if(q.o[q.v].r)gnistor();visaQ("q")});
    $("#qN")&&($("#qN").onclick=()=>{if(i<n-1)QZ.i++;else QZ.fas="klar";visaQ("q")});return}
  stapel(n-1);const ra=QZ.q.filter(q=>q.o[q.v]&&q.o[q.v].r).length;
  H(kick("RESULTAT")+`<div class="qstor" aria-hidden="true">${"⭐".repeat(ra)}${"☆".repeat(n-ra)}</div><h2>${ra} av ${n} rätt</h2><p>${ra===n?"Alla rätt! Du kan det här.":ra>=n-1?"Bra jobbat! Titta i facit så får du veta lite mer.":"Det här var klurigt. Titta i facit, så blir du smartare till nästa gång."}</p><div class="slut"><button class="btn guld" id="qF">📖 Visa facit</button><button class="btn" id="qA">🔁 Försök igen</button><button class="btn" id="qT">← Till lektionen</button><button class="btn" id="qR">🎲 Slumpa en till</button></div>`);
  if(ra===n)gnistor();
  $("#qF").onclick=()=>{QZ.fi=0;location.hash="#l/"+l.id+"/f"};$("#qA").onclick=()=>{nyttQ(l);QZ.fas="fraga";visaQ("q")};$("#qT").onclick=qSlut;
  $("#qR").onclick=()=>{let a;const P=pool();do{a=P[Math.random()*P.length|0]}while(a===l&&P.length>1);location.hash=href(a)};
}
function oppnaQ(l,mode){const ny=cur!==l||!$("#vy").classList.contains("on");if(ny){stangAlla()}cur=l;nu=l.id;uppdTum();$("#vy").style.setProperty("--ac",l.c);$("#vy").classList.add("on");if(ny||!QZ||QZ.id!==l.id){if(!QS(l)){qSlut();return}nyttQ(l)}visaQ(mode)}
function oppnaL(l,i){const nyL=cur!==l||!$("#vy").classList.contains("on");cur=l;nu=l.id;uppdTum();if(nyL){ledt=0;svarat=false}const tot=l.rutor.length+(ledtLista(l)?1:0);idx=Math.max(0,Math.min(tot-1,i));if(idx>0)svarat=true;$("#vy").style.setProperty("--ac",l.c);$("#vyT").textContent=l.titel;$("#vy").classList.add("on");visaBild()}
function stangAlla(){$("#kv").classList.remove("on");$("#kvR").innerHTML="";$("#vy").classList.remove("on");$("#gv").classList.remove("on");if(stang){try{stang()}catch(e){}stang=null}$("#gvB").innerHTML="";cur=null;nu=null;uppdTum()}
/* YouTube-länkar i lektionernas länkar spelas alltid i den inbäddade spelaren (#k/<id>), aldrig i ny flik */
const LANKK={};const ytId=u=>{const m=String(u).match(/(?:v=|youtu\.be\/)([\w-]{11})/);return m?m[1]:null};
const lh=k=>{const id=ytId(k[1]);if(id){LANKK[id]={id,titel:k[0].replace(/\s*\(YouTube\)\s*$/,""),sprak:"en"};return "#k/"+id}return k[1]};
function oppnaK(k){stangAlla();nu=k.id;uppdTum();$("#kvT").textContent="🎬 "+k.titel;$("#kvN").textContent="Spelas från YouTube"+(k.sprak==="en"?" (engelska)":"")+". Stäng med ✕ när klippet är slut, så hamnar du inte i andra klipp.";
  $("#kvR").innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${k.id}?rel=0&modestbranding=1&playsinline=1" title="${k.titel.replace(/"/g,"")}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;$("#kv").classList.add("on")}
function oppnaG(g){stangAlla();$("#gv").classList.toggle("mork",!!g.mork);nu=g.id;uppdTum();$("#gv").style.setProperty("--c",g.c);$("#gvT").textContent=g.e+" "+g.titel;$("#gv").classList.add("on");$("#gv").scrollTop=0;stang=g.start($("#gvB"))}
function rut(){
  const h=location.hash.replace(/^#/,"").split("/");
  if(h[0]==="l"){const l=LEKTIONER.find(x=>x.id===h[1]);if(l&&(h[2]==="q"||h[2]==="f")){oppnaQ(l,h[2]);return}if(l){if(cur!==l||!$("#vy").classList.contains("on")){stangAlla()}oppnaL(l,(+h[2]||1)-1);return}}
  if(h[0]==="k"){const k=KLIPP.find(x=>x.id===h[1])||Object.values(KLIPPL).find(x=>x.id===h[1])||LANKK[h[1]];if(k){oppnaK(k);return}}
  if(h[0]==="g"){const g=GREJER.find(x=>x.id===h[1]);if(g){oppnaG(g);return}}
  stangAlla();
}
function gaTill(d){if(!cur||qAktiv())return;const n=idx+d,tot=cur.rutor.length+(ledtLista(cur)?1:0);if(n<0||n>=tot)return;idx=n;visaBild()}
$("#vyN").onclick=()=>gaTill(1);$("#vyP").onclick=()=>gaTill(-1);
$("#vyX").onclick=()=>{location.hash=""};
$("#gvX").onclick=()=>{const t=gvTill;gvTill=null;location.hash=t||""};
$("#kvX").onclick=()=>{const t=kvTill;kvTill=null;location.hash=t||""};
$("#vyF").onclick=()=>{const e=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(e.requestFullscreen)e.requestFullscreen().catch(()=>{})};
if(!document.documentElement.requestFullscreen)$("#vyF").style.display="none";
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#kv").classList.contains("on")){$("#kvX").click();return}if($("#vy").classList.contains("on")||$("#gv").classList.contains("on")||$("#kv").classList.contains("on")){if(!document.fullscreenElement)location.hash=""}return}
  if(!$("#vy").classList.contains("on"))return;
  if(qAktiv()){const b=e.key>="1"&&e.key<="3"?document.querySelector("#vyS .qo[data-k=\""+(e.key-1)+"\"]"):null;if(b){b.click();return}if(e.key==="Enter"||e.key==="ArrowRight"){const x=$("#qN")||$("#qS");if(x){e.preventDefault();x.click()}}else if(e.key==="ArrowLeft"&&$("#qP"))$("#qP").click();return}
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();gaTill(1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();gaTill(-1)}
  else if(e.key==="f"||e.key==="F")$("#vyF").click();
});
let sx=null;
$("#vyS").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("#vyS").addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)gaTill(dx<0?1:-1)},{passive:true});
$("#kopB").onclick=async()=>{const t=JSON.stringify(ALLA.filter(a=>BET[a.id]).map(a=>({id:a.id,titel:a.titel,typ:a.typ,kat:a.kat,kanal:a.kanal||undefined,v:BET[a.id]})));
  try{await navigator.clipboard.writeText(t);$("#kopB").textContent="✓ Kopierat! Klistra in i chatten"}catch(e){prompt("Kopiera:",t)}};
window.addEventListener("hashchange",rut);
hem();rut();
})();
</script>
