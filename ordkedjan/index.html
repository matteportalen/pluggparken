<style>
:root{

  --good:#1E9E5E; --good-dark:#157548; --bad:#E5484D; --accent:#3D5AFE; --gold:#F2B707; --hero1:#3D5AFE; --hero2:#2A3FB8; --heroS:#1C2B8A;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --ord:"Andika","Baloo 2",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 var(--heroS);margin:6px 0 16px}
.hero svg{flex:none;width:130px;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.hero h1{margin:0;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05}
.hero p{margin:6px 0 0;font-weight:600;opacity:.95}
.niv{display:grid;gap:10px}
.niv button{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.niv button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.niv .nr{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:#fff}
.niv b{display:block;font-size:1.12rem;line-height:1.15}
.niv small{display:block;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.25}
.niv .st{margin-left:auto;flex:none;color:var(--gold);font-size:1.15rem;letter-spacing:1px}
.niv .st .off{color:var(--line)}
.info{color:var(--muted);font-size:.9rem;margin:14px 2px 0}
.topp{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.f{background:var(--bad)}.dots i.nu{background:var(--gold)}
.niva-t{font-weight:800;color:var(--muted);font-size:.9rem}
.pet{flex:none;width:48px;height:52px;pointer-events:none}.pet svg{width:100%;height:100%}
.pet.hopp{animation:hopp .55s ease}
@keyframes hopp{40%{transform:translateY(-18px)}}
.kort{background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:16px}
.fb{text-align:center;font-weight:700;margin:12px 0 0;min-height:2.6em;font-size:1.05rem}
.fb.ratt{color:var(--good-dark)}.fb.fel{color:#B4232A}
.knapp{display:inline-block;background:var(--good);color:#fff;border-radius:16px;padding:12px 26px;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 var(--good-dark);margin:6px}
.knapp.vit{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.knapp.bla{background:var(--accent);box-shadow:0 5px 0 #2A3FB8}
.knapp:disabled{opacity:.4;pointer-events:none}
.knapp:active{transform:translateY(3px)}
.lyssna{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem;box-shadow:0 2px 0 var(--line)}
.res{text-align:center}
.res .stj{font-size:3rem;letter-spacing:6px;color:var(--gold);margin:8px 0}
.res .stj .off{color:var(--line)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:420px){.hero svg{width:96px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.prompt{text-align:center;font-weight:800;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.prompt .bokst{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:16px;background:var(--accent);color:#fff;font-family:var(--ord);font-size:2rem;font-weight:700;box-shadow:0 4px 0 #2A3FB8;text-transform:uppercase}
.kedja{display:flex;flex-wrap:wrap;gap:8px;padding:6px 2px 12px;max-height:46vh;overflow:auto;align-content:flex-start}
.kedja .o{font-family:var(--ord);font-size:1.25rem;font-weight:700;border-radius:999px;padding:6px 16px;border:2px solid;animation:ink .3s ease-out}
.kedja .o.s{background:#E3EAFF;border-color:var(--accent)}
.kedja .o.d{background:#FFF1DC;border-color:#F2A455}
.kedja .o b{color:#E5484D}
@keyframes ink{from{transform:scale(.7);opacity:0}}
.inrad{display:flex;gap:8px}
.inrad input{flex:1;min-width:0;font-family:var(--ord);font-size:1.35rem;font-weight:700;border:3px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card);color:var(--ink);text-transform:lowercase}
.inrad input.skak{border-color:var(--bad);animation:skak .35s}
@keyframes skak{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.inrad .knapp{margin:0;padding:10px 20px}
.tips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.tips button{font-family:var(--ord);font-weight:700;background:#FFF8DC;border:2px solid var(--gold);border-radius:999px;padding:6px 16px;font-size:1.1rem}
.tipk{display:block;margin:10px auto 0;background:var(--soft);border-radius:999px;padding:6px 16px;font-weight:700;box-shadow:0 2px 0 var(--line)}

// böjda ord godtas: katten, hundar, äpplet, flickor
const SUFF=["erna","arna","orna","en","et","na","ar","er","or","n","r"];
function kant(w){if(SET.has(w))return w;
  for(const s of SUFF){if(w.length>s.length+2&&w.endsWith(s)){const st=w.slice(0,-s.length);
    if((s==="n"||s==="r")&&!VOK.includes(st.slice(-1)))continue;if(SET.has(st))return st;}}
  if(w.length>4&&w.endsWith("t")&&SET.has(w.slice(0,-1))&&w.slice(-2,-1)==="e")return w.slice(0,-1);   // äpplet
  if(w.length>4&&w.endsWith("or")&&SET.has(w.slice(0,-2)+"a"))return w.slice(0,-2)+"a";   // flickor
  if(w.length>4&&w.endsWith("ar")&&SET.has(w.slice(0,-2)+"e"))return w.slice(0,-2)+"e";   // gubbar
  return null;}
// ord som inte finns i listan godtas om de ser ut som ord (datorn tror på eleven): minst tre bokstäver, en vokal, inga tre likadana i rad, inte för många konsonanter i rad
function trolig(w){return w.length>=3&&/[aeiouyåäö]/.test(w)&&!/(.)\1\1/.test(w)&&!/[^aeiouyåäö]{7}/.test(w)&&!/^(.{1,3})\1{2,}$/.test(w)&&/[aeiouyåäö]/.test(w.slice(-3));}

function iStor(w,djup){if(!STOR)return false;if(STOR.has(w))return true;if((djup||0)>2)return false;
  for(let i=3;i<=w.length-3;i++){if(delOk(w.slice(0,i))&&iStor(w.slice(i),(djup||0)+1))return true;}return false;}

  const raknaFria=b=>(START[b]||[]).filter(w=>!G.anv.has(w)).length;

  if(G.lvl===3){const svar=kand.filter(w=>raknaFria(w.slice(-1))<=14);if(svar.length)kand=svar;}
  if(!kand.length)kand=fria;
  return kand.length?pick(kand):null;}

const sist=()=>G.kedja[G.kedja.length-1].w.slice(-1);

function fb(t,ok){const f=$("fb");f.textContent=t;f.className="fb "+(ok?"ratt":"fel");}
function skaka(){const i=$("inp");i.classList.remove("skak");void i.offsetWidth;i.classList.add("skak");}

function skicka(w){if(!w)return;const b=sist();

  if(G.anv.has(bas)||G.anv.has(w)){fb("Det ordet har redan använts. Hitta ett nytt!");skaka();return;}
  G.anv.add(bas);lagg(w,"s");G.n++;G.res.push(true);prickar(G.mal,G.n,G.res);window.Ljud&&Ljud.ok&&Ljud.ok();haj();$("fb").textContent="";$("tips").innerHTML="";
  if(okant)fb("Det ordet kunde jag inte kolla, men jag tror på dig! 😊",true);
